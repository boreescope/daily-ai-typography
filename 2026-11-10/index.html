<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CHARGING — 03:57</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@500;600;700&family=Inter:wght@400;500;600;700&family=Share+Tech+Mono&display=swap" rel="stylesheet">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 100%; height: 100%; overflow: hidden; background: #05030c; }
  body { font-family: 'Share Tech Mono', monospace; cursor: default; }
  body.grab { cursor: grabbing; }
  canvas { display: block; }

  .home-btn {
    position: fixed; left: 26px; top: 22px; z-index: 20;
    font: 700 11px/1 'Share Tech Mono', monospace; letter-spacing: .22em;
    color: #3ddcf5; text-decoration: none; padding: 9px 13px;
    border: 1px solid rgba(61,220,245,.3); background: rgba(5,3,12,.6);
    transition: color .3s, border-color .3s;
  }
  .home-btn:hover { color: #ff2d9b; border-color: rgba(255,45,155,.55); }

  .snd {
    position: fixed; right: 26px; top: 22px; z-index: 20;
    font: 700 11px/1 'Share Tech Mono', monospace; letter-spacing: .18em;
    color: #3ddcf5; padding: 9px 13px; cursor: pointer;
    border: 1px solid rgba(61,220,245,.3); background: rgba(5,3,12,.6);
    transition: color .3s, border-color .3s;
  }
  .snd:hover { color: #ff2d9b; border-color: rgba(255,45,155,.55); }

  .hint {
    position: fixed; left: 50%; bottom: 26px; transform: translateX(-50%); z-index: 20;
    font: 400 10px/1 'Share Tech Mono', monospace; letter-spacing: .2em;
    color: rgba(61,220,245,.58); white-space: nowrap; pointer-events: none;
    transition: opacity 1.4s ease;
  }
  .hint.off { opacity: 0; }

  body.preview .home-btn, body.preview .snd, body.preview .hint { display: none; }
</style>
</head>
<body>
<canvas id="cv"></canvas>
<a class="home-btn" href="../index.html">← INDEX</a>
<div class="snd" id="snd">SOUND: ON</div>
<div class="hint" id="hint">// DRAG THE CABLE INTO THE PORT</div>

<script>
const cv = document.getElementById('cv');
const ctx = cv.getContext('2d');
const PREVIEW = new URLSearchParams(location.search).has('preview');
if (PREVIEW) document.body.classList.add('preview');

const DPR = Math.min(window.devicePixelRatio || 1, 2);
const TAU = Math.PI * 2;
const clamp = (v, a, b) => v < a ? a : v > b ? b : v;
const lerp = (a, b, t) => a + (b - a) * t;

// integer hash, for the cloth grain and the weave of the sheet
const hsh = (a, b, k) => {
  let h = Math.imul(a + 0x9e37, 0x85eb) ^ Math.imul(b + 0x27d4, 0xc2b2) ^ Math.imul(k + 0x165e, 0x27d4);
  h = Math.imul(h ^ (h >>> 15), 0x2545);
  return ((h ^ (h >>> 13)) >>> 0) / 4294967296;
};

let W = 0, H = 0, S = 0;        // S = min side, the one unit everything scales by

// ── the phone ──────────────────────────────────────────────────────────────
// It lies a little crooked, the way a phone does when it is put down by
// someone already half asleep.
const ROT = -0.054;
const CS = Math.cos(ROT), SN = Math.sin(ROT);
const PH = { x: 0, y: 0, w: 0, h: 0, r: 0 };
const SCR = { w: 0, h: 0, r: 0 };
const toW = (px, py) => [PH.x + px * CS - py * SN, PH.y + px * SN + py * CS];

// ── state ──────────────────────────────────────────────────────────────────
let chg = 0.08;          // the phone
let me = 0.33;           // the other battery, the one with no port
let bri = 0.42;          // screen brightness
let plug = false, dragging = false;
let idle = 0, slept = false;
let done = 0;          // 0 until the phone has nothing left to fill
let t = 0;

const tip = { x: 0, y: 0, vx: 0, vy: 0 };
const rest = { x: 0, y: 0 };

// ── 하루 24시간 전국 전력수요 ──────────────────────────────────────────────
// 2025년 365일 시간대별 평균 MWh · 한국전력거래소
// 제일 낮은 때가 04시, 제일 높은 때가 19시. 새벽 3시 반은 그 바로 앞이다.
const DEM = [64550, 60760, 58367, 56921, 56180, 56321, 57537, 60105,
             63445, 66431, 66742, 65878, 64095, 61939, 64197, 65765,
             67562, 70052, 71554, 72524, 72210, 70411, 67978, 66554];
const DEM_LO = 56180, DEM_HI = 72524;

// 곡선에 보이는 구간 — 저녁 6시부터 아침 9시까지. 꼭대기와 바닥이 둘 다 들어온다.
const WIN_A = 18, WIN_H = 15;

// 시계. 꽂기 전엔 03:30에 멈춰 있다. 꽂으면 1초에 54초씩 간다.
const T0 = 3 * 60 + 30;
const RATE = 0.9;            // 분 / 초
let clk = T0, plugAt = T0;

const demandAt = m => {
  const h = (m / 60 + 24) % 24;
  const i = Math.floor(h);
  return lerp(DEM[i], DEM[(i + 1) % 24], h - i);
};

// ── 혼잣말 ─────────────────────────────────────────────────────────────────
// 폰 뒤를 가로질러 간다. 네 시가 지나면 뜸해지고 같은 말만 남는다.
const MURMURS = [
  [213, "i'll sleep after this"],
  [220, 'just one more'],
  [227, 'i should really sleep'],
  [234, 'nothing new to look at'],
  [241, 'why am i still awake'],
  [248, 'everyone else is asleep'],
  [257, 'i really have to sleep now'],
  [265, "it's four"],
  [278, 'i am not going to sleep'],
  [296, 'still awake'],
  [318, 'still awake'],
];
const murs = [];
let nextMur = 0;
let hint2 = false;

function spawnMur(i) {
  const txt = MURMURS[i][1];
  const rtl = i % 2 === 1;
  murs.push({
    t: txt,
    y: PH.y + (hsh(i, 41, 7) - 0.5) * PH.h * 0.84,
    x0: rtl ? W * 1.05 : -W * 0.38,
    x1: rtl ? -W * 0.38 : W * 1.05,
    p: 0,
    dur: 15 + hsh(i, 43, 11) * 5,
  });
}

// ── the sheet, baked once ──────────────────────────────────────────────────
let bed = null;

function grain(g, w, h, amt) {
  const q = 3, gw = Math.ceil(w / q), gh = Math.ceil(h / q);
  const c = document.createElement('canvas');
  c.width = gw; c.height = gh;
  const gg = c.getContext('2d');
  const im = gg.createImageData(gw, gh);
  const d = im.data;
  for (let y = 0; y < gh; y++) for (let x = 0; x < gw; x++) {
    const i = (y * gw + x) * 4;
    d[i] = 110; d[i + 1] = 180; d[i + 2] = 215;
    d[i + 3] = Math.random() * amt;
  }
  gg.putImageData(im, 0, 0);
  g.imageSmoothingEnabled = true;
  g.drawImage(c, 0, 0, w, h);
}

function bakeBed() {
  bed = document.createElement('canvas');
  bed.width = Math.round(W * DPR);
  bed.height = Math.round(H * DPR);
  const g = bed.getContext('2d');
  g.scale(DPR, DPR);

  g.fillStyle = '#05030c';
  g.fillRect(0, 0, W, H);

  // 방 끝에서 들어오는 간판 빛 — 왼쪽은 청록, 오른쪽은 자홍
  for (const [cx, cy, rr, col] of [
    [W * 0.08, H * 0.18, S * 1.0, '0,170,220'],
    [W * 0.96, H * 0.88, S * 0.9, '190,30,120'],
  ]) {
    const gd = g.createRadialGradient(cx, cy, 0, cx, cy, rr);
    gd.addColorStop(0, `rgba(${col},.2)`);
    gd.addColorStop(1, 'rgba(0,0,0,0)');
    g.fillStyle = gd;
    g.fillRect(cx - rr, cy - rr, rr * 2, rr * 2);
  }

  // soft folds. Cloth read as cloth only once the light had somewhere to pool,
  // so these are big and very low contrast rather than many and sharp.
  for (let i = 0; i < 26; i++) {
    const r = (0.16 + hsh(i, 1, 3) * 0.5) * S;
    const x = hsh(i, 2, 5) * W, y = hsh(i, 3, 9) * H;
    const up = hsh(i, 4, 11) > 0.45;
    const gd = g.createRadialGradient(x, y, 0, x, y, r);
    gd.addColorStop(0, up ? 'rgba(34,58,96,.3)' : 'rgba(3,1,8,.46)');
    gd.addColorStop(1, 'rgba(0,0,0,0)');
    g.fillStyle = gd;
    g.fillRect(x - r, y - r, r * 2, r * 2);
  }

  // creases, running the long way across the bed
  g.lineCap = 'round';
  for (let i = 0; i < 7; i++) {
    const y0 = (0.08 + i * 0.14 + hsh(i, 5, 13) * 0.05) * H;
    g.beginPath();
    g.moveTo(-40, y0);
    for (let x = -40; x <= W + 40; x += 70) {
      g.lineTo(x, y0 + Math.sin(x / (160 + i * 40) + i) * S * 0.035 + (hsh(i, x | 0, 17) - 0.5) * 8);
    }
    g.strokeStyle = `rgba(46,74,112,${0.08 + hsh(i, 6, 19) * 0.05})`;
    g.lineWidth = 2 + hsh(i, 7, 23) * 5;
    g.stroke();
    g.strokeStyle = 'rgba(0,0,0,.14)';
    g.lineWidth = 1.2;
    g.stroke();
  }

  grain(g, W, H, 26);

  // the room is darker at the corners than it is by the pillow
  const vg = g.createRadialGradient(W / 2, H * 0.52, S * 0.1, W / 2, H * 0.52, S * 0.95);
  vg.addColorStop(0, 'rgba(0,0,0,0)');
  vg.addColorStop(1, 'rgba(0,0,0,.76)');
  g.fillStyle = vg;
  g.fillRect(0, 0, W, H);
}

// ── sound ──────────────────────────────────────────────────────────────────
// A room at three in the morning: mains hum, and the thin coil whine a cheap
// charger makes, which gets quieter the fuller the battery gets.
const sound = (() => {
  let ac = null, on = true, master, humg, coilg, coilo, coilo2, noiseg;

  function build() {
    ac = new (window.AudioContext || window.webkitAudioContext)();
    master = ac.createGain();
    master.gain.value = 0.9;
    const comp = ac.createDynamicsCompressor();
    master.connect(comp).connect(ac.destination);

    humg = ac.createGain(); humg.gain.value = 0.045;
    const hlp = ac.createBiquadFilter();
    hlp.type = 'lowpass'; hlp.frequency.value = 210;
    humg.connect(hlp).connect(master);
    for (const f of [52, 78.4, 104]) {
      const o = ac.createOscillator();
      o.type = 'triangle'; o.frequency.value = f;
      const g = ac.createGain(); g.gain.value = f === 52 ? 1 : 0.4;
      o.connect(g).connect(humg); o.start();
    }

    // brown noise, the air in a closed room
    const len = ac.sampleRate * 2;
    const buf = ac.createBuffer(1, len, ac.sampleRate);
    const d = buf.getChannelData(0);
    let last = 0;
    for (let i = 0; i < len; i++) {
      last = (last + (Math.random() * 2 - 1) * 0.02) / 1.02;
      d[i] = last * 3.2;
    }
    const src = ac.createBufferSource();
    src.buffer = buf; src.loop = true;
    const nlp = ac.createBiquadFilter();
    nlp.type = 'lowpass'; nlp.frequency.value = 340;
    noiseg = ac.createGain(); noiseg.gain.value = 0.05;
    src.connect(nlp).connect(noiseg).connect(master);
    src.start();

    coilg = ac.createGain(); coilg.gain.value = 0;
    const cf = ac.createBiquadFilter();
    cf.type = 'bandpass'; cf.frequency.value = 2400; cf.Q.value = 6;
    coilg.connect(cf).connect(master);
    coilo = ac.createOscillator(); coilo.type = 'sine'; coilo.frequency.value = 2380;
    coilo2 = ac.createOscillator(); coilo2.type = 'sine'; coilo2.frequency.value = 2397;
    const cg2 = ac.createGain(); cg2.gain.value = 0.5;
    coilo.connect(coilg); coilo2.connect(cg2).connect(coilg);
    coilo.start(); coilo2.start();
  }

  function ping(up) {
    if (!ac || !on) return;
    const n = ac.currentTime;
    const parts = up ? [[784, .16], [1176, .09]] : [[196, .2], [128, .12]];
    for (const [f, v] of parts) {
      const o = ac.createOscillator();
      o.type = up ? 'sine' : 'triangle';
      o.frequency.setValueAtTime(f, n);
      if (!up) o.frequency.exponentialRampToValueAtTime(f * 0.6, n + 0.18);
      const g = ac.createGain();
      g.gain.setValueAtTime(0, n);
      g.gain.linearRampToValueAtTime(v, n + 0.008);
      g.gain.exponentialRampToValueAtTime(0.0001, n + (up ? 0.5 : 0.24));
      o.connect(g).connect(master);
      o.start(n); o.stop(n + 0.6);
    }
  }

  return {
    live: () => !!ac && on && ac.state === 'running',
    toggle() {
      if (!ac) { build(); on = true; return true; }
      on = !on;
      master.gain.setTargetAtTime(on ? 0.9 : 0, ac.currentTime, 0.1);
      if (on) ac.resume();
      return on;
    },
    kick() { if (!ac) build(); else if (ac.state === 'suspended') ac.resume(); },
    ping,
    set(charging, level, bright, load) {
      if (!ac || !on) return;
      const n = ac.currentTime;
      // the whine thins out as the cell fills — that is how you hear it finish
      coilg.gain.setTargetAtTime(charging ? 0.014 * (0.25 + 0.75 * (1 - level)) : 0, n, 0.25);
      coilo.frequency.setTargetAtTime(2290 + level * 260 + Math.sin(t * 2.3) * 14, n, 0.3);
      // 웅웅거림은 그 시각 전국이 쓰는 전기를 따라간다. 네 시에 제일 얇다.
      humg.gain.setTargetAtTime(0.018 + load * 0.04 + bright * 0.008, n, 0.6);
    },
  };
})();
// ── drawing ────────────────────────────────────────────────────────────────
function rrect(g, x, y, w, h, r) {
  g.beginPath();
  g.moveTo(x + r, y);
  g.arcTo(x + w, y, x + w, y + h, r);
  g.arcTo(x + w, y + h, x, y + h, r);
  g.arcTo(x, y + h, x, y, r);
  g.arcTo(x, y, x + w, y, r);
  g.closePath();
}

// 아이폰 모서리는 원호가 아니라 이어지는 곡선이다. 베지어로 흉내 낸다.
function squircle(g, x, y, w, h, r) {
  const k = Math.min(r * 1.42, w / 2, h / 2), c = k * 0.31;
  const x1 = x + w, y1 = y + h;
  g.beginPath();
  g.moveTo(x + k, y);
  g.lineTo(x1 - k, y);
  g.bezierCurveTo(x1 - c, y, x1, y + c, x1, y + k);
  g.lineTo(x1, y1 - k);
  g.bezierCurveTo(x1, y1 - c, x1 - c, y1, x1 - k, y1);
  g.lineTo(x + k, y1);
  g.bezierCurveTo(x + c, y1, x, y1 - c, x, y1 - k);
  g.lineTo(x, y + k);
  g.bezierCurveTo(x, y + c, x + c, y, x + k, y);
  g.closePath();
}

function drawGlow(g) {
  const r = S * (0.40 + bri * 0.32);
  const gd = g.createRadialGradient(PH.x, PH.y, 0, PH.x, PH.y, r);
  gd.addColorStop(0, `rgba(0,190,235,${bri * 0.26})`);
  gd.addColorStop(.42, `rgba(34,88,168,${bri * 0.1})`);
  gd.addColorStop(1, 'rgba(0,0,0,0)');
  g.globalCompositeOperation = 'lighter';
  g.fillStyle = gd;
  g.fillRect(PH.x - r, PH.y - r, r * 2, r * 2);
  const mr = r * 0.78;
  const md = g.createRadialGradient(PH.x, PH.y + r * 0.3, 0, PH.x, PH.y + r * 0.3, mr);
  md.addColorStop(0, `rgba(255,45,155,${bri * 0.09})`);
  md.addColorStop(1, 'rgba(0,0,0,0)');
  g.fillStyle = md;
  g.fillRect(PH.x - mr, PH.y + r * 0.3 - mr, mr * 2, mr * 2);
  g.globalCompositeOperation = 'source-over';
}

function portPos() { return toW(0, PH.h / 2 + S * 0.006); }

// ── USB-C ──────────────────────────────────────────────────────────────────
// 실물 치수대로 — 금속 쉘 8.3 x 2.4 mm, 하우징은 그보다 조금 넓고 두 배쯤 길다.
// 위에서 내려다보는 그림이라 금속은 폭이 넓고 길이는 짧은 토막으로 보인다.
function plugGeo() {
  const pw = PH.w * 0.12;              // 단자 구멍 너비
  return {
    mW: pw * 0.965, mL: pw * 0.76,     // 금속 쉘 8.3 x 6.5 mm
    hW: pw * 1.16,  hL: pw * 2.05,     // 몰딩 하우징 10 x 18 mm
    sL: pw * 0.74,                     // 선이 빠져나오는 목
  };
}

// 플러그가 보는 쪽. 포트에 가까워질수록 포트 축으로 돌아선다 —
// 아무 각도로나 비스듬히 꽂히는 단자는 없다.
function plugAngle(mx, my) {
  const free = Math.atan2(tip.y - my, tip.x - mx);
  const aim = ROT - Math.PI / 2;       // 아래 모서리에서 폰 안으로 들어가는 방향
  const [px, py] = portPos();
  const d = Math.hypot(tip.x - px, tip.y - py);
  const k = plug ? 1 : Math.pow(clamp(1 - d / (S * 0.3), 0, 1), 1.5);
  const df = Math.atan2(Math.sin(aim - free), Math.cos(aim - free));
  return free + df * k;
}

function drawCable(g) {
  const G = plugGeo();
  const ax = W + S * 0.08, ay = H + S * 0.1;
  const d = Math.hypot(tip.x - ax, tip.y - ay);
  // the shorter the run, the more cable there is to pool on the sheet
  const sag = clamp((S * 1.3 - d) * 0.42, 0, S * 0.3);
  const mx = (ax + tip.x) / 2, my = (ay + tip.y) / 2 + sag;
  const ang = plugAngle(mx, my);
  const ca = Math.cos(ang), sa = Math.sin(ang);

  // 꽂으면 금속은 폰 안으로 들어간다. 폰을 뒤에 그리니 저절로 가려진다.
  const ins = plug ? G.mL * 0.8 : 0;
  const tx = tip.x + ca * ins, ty = tip.y + sa * ins;

  // 선은 플러그 끝이 아니라 하우징 뒤에서 끝난다
  const tot = G.mL + G.hL + G.sL;
  const bx = tx - ca * tot, by = ty - sa * tot;
  const c2x = bx - ca * S * 0.07, c2y = by - sa * S * 0.07;

  g.lineCap = 'round'; g.lineJoin = 'round';
  g.beginPath();
  g.moveTo(ax, ay);
  g.bezierCurveTo(mx, my, c2x, c2y, bx, by);
  g.strokeStyle = '#040508'; g.lineWidth = S * 0.0205; g.stroke();
  g.strokeStyle = '#191e27'; g.lineWidth = S * 0.0145; g.stroke();
  g.strokeStyle = `rgba(146,178,210,${0.08 + bri * 0.07})`;
  g.lineWidth = S * 0.0035; g.stroke();

  g.save();
  g.translate(tx, ty);
  g.rotate(ang);

  // 목 — 뒤로 갈수록 가늘어진다
  const n0 = -(G.mL + G.hL), n1 = n0 - G.sL, nr = S * 0.0082;
  g.beginPath();
  g.moveTo(n0, -G.hW * 0.4); g.lineTo(n1, -nr);
  g.lineTo(n1, nr);          g.lineTo(n0, G.hW * 0.4);
  g.closePath();
  g.fillStyle = '#13171f'; g.fill();

  // 하우징
  rrect(g, n0, -G.hW / 2, G.hL, G.hW, G.hW * 0.2);
  const hg = g.createLinearGradient(0, -G.hW / 2, 0, G.hW / 2);
  hg.addColorStop(0, '#242b34'); hg.addColorStop(.42, '#161b22'); hg.addColorStop(1, '#0a0d13');
  g.fillStyle = hg; g.fill();
  g.strokeStyle = 'rgba(160,192,224,.13)'; g.lineWidth = 1; g.stroke();

  // 금속 쉘 — 위에서 보면 모서리만 살짝 둥근 네모다
  rrect(g, -G.mL, -G.mW / 2, G.mL, G.mW, G.mW * 0.1);
  // 둥글게 말린 쉘이라 가운데가 밝고 양 가장자리가 어둡다
  const mg = g.createLinearGradient(0, -G.mW / 2, 0, G.mW / 2);
  mg.addColorStop(0, '#2b333d'); mg.addColorStop(.18, '#6d7a89');
  mg.addColorStop(.42, '#9aa8b7'); mg.addColorStop(.72, '#5e6a78');
  mg.addColorStop(1, '#262d36');
  g.fillStyle = mg; g.fill();

  // 쉘 이음선 — 가운데를 길게 지나간다
  g.beginPath();
  g.moveTo(-G.mL * 0.88, 0); g.lineTo(-G.mL * 0.08, 0);
  g.strokeStyle = 'rgba(16,21,28,.3)';
  g.lineWidth = Math.max(1, S * 0.0009); g.stroke();

  // 끝 입술
  g.beginPath();
  g.moveTo(-G.mL * 0.04, -G.mW * 0.4); g.lineTo(-G.mL * 0.04, G.mW * 0.4);
  g.strokeStyle = 'rgba(206,224,244,.22)';
  g.lineWidth = Math.max(1, S * 0.0012); g.stroke();

  if (!plug) {
    // 아직 안 꽂힌 동안만 — 집어 들라고 금속에 빛이 한 번씩 돈다
    const a = 0.1 + 0.13 * (0.5 + 0.5 * Math.sin(t * 2.4));
    rrect(g, -G.mL, -G.mW / 2, G.mL, G.mW, G.mW * 0.1);
    g.strokeStyle = `rgba(190,224,255,${a.toFixed(3)})`;
    g.lineWidth = Math.max(1, S * 0.0022); g.stroke();
  }
  g.restore();
}

const two = n => String(n | 0).padStart(2, '0');

// drawn rather than typed: the emoji bolt comes back in colour on most systems
function bolt(g, x, y, h, a, rgb) {
  g.save();
  g.translate(x, y);
  g.beginPath();
  g.moveTo(h * 0.14, -h * 0.5);
  g.lineTo(-h * 0.22, h * 0.06);
  g.lineTo(-h * 0.02, h * 0.06);
  g.lineTo(-h * 0.14, h * 0.5);
  g.lineTo(h * 0.24, -h * 0.08);
  g.lineTo(h * 0.03, -h * 0.08);
  g.closePath();
  g.fillStyle = `rgba(${rgb || '0,226,255'},${a})`;
  g.fill();
  g.restore();
}

// 자간. 캔버스가 letterSpacing 을 모르면 그냥 넘어간다.
function track(g, px) {
  if ('letterSpacing' in g) g.letterSpacing = px ? px.toFixed(2) + 'px' : '0px';
}

// 화면에 가로줄이 깔리고, 밝은 띠 하나가 천천히 내려간다
function scanlines(g, sw, sh) {
  const step = Math.max(2, sh * 0.0075);
  g.fillStyle = `rgba(0,0,0,${0.1 + bri * 0.12})`;
  for (let y = -sh / 2; y < sh / 2; y += step) g.fillRect(-sw / 2, y, sw, step * 0.42);
  const by = -sh / 2 + ((t * 0.09) % 1) * sh;
  const bg = g.createLinearGradient(0, by - sh * 0.1, 0, by + sh * 0.1);
  bg.addColorStop(0, 'rgba(0,226,255,0)');
  bg.addColorStop(.5, `rgba(0,226,255,${bri * 0.045})`);
  bg.addColorStop(1, 'rgba(0,226,255,0)');
  g.fillStyle = bg;
  g.fillRect(-sw / 2, by - sh * 0.1, sw, sh * 0.2);
}

// ── iOS 화면 ───────────────────────────────────────────────────────────────
// 다이내믹 아일랜드 125 x 37 pt, 상태바 글자 왼쪽, 아이콘 오른쪽,
// 맨 아래 홈 인디케이터. 아이폰에서 재 본 비율 그대로 옮겼다.
function islandBox(sw, sh) {
  const w = sw * 0.318, h = sw * 0.094;
  return { x: -w / 2, y: -sh / 2 + sh * 0.0138, w, h };
}

function drawIsland(g, sw, sh) {
  const b = islandBox(sw, sh);
  rrect(g, b.x, b.y, b.w, b.h, b.h / 2);
  g.fillStyle = '#000'; g.fill();
  const r = b.h * 0.2, cx = b.x + b.w - b.h * 0.5, cy = b.y + b.h / 2;
  g.beginPath(); g.arc(cx, cy, r, 0, TAU);
  g.fillStyle = '#0a1018'; g.fill();
  g.beginPath(); g.arc(cx - r * 0.26, cy - r * 0.26, r * 0.42, 0, TAU);
  g.fillStyle = `rgba(58,96,142,${0.22 + bri * 0.2})`; g.fill();
}

function drawStatusBar(g, sw, sh) {
  const b = islandBox(sw, sh);
  const cy = b.y + b.h / 2, a = bri * 0.92;
  const fg = `rgba(240,247,255,${a})`;

  g.textAlign = 'center'; g.textBaseline = 'middle';
  g.font = `600 ${(sw * 0.053) | 0}px Inter, system-ui, sans-serif`;
  g.fillStyle = fg;
  g.fillText(`${two(clk / 60)}:${two(clk % 60)}`, (b.x - sw * 0.5) / 2, cy + sw * 0.002);

  let x = sw * 0.5 - sw * 0.062;        // 오른쪽 끝에서부터 왼쪽으로

  // 배터리 — 충전 중이면 초록으로 바뀌고 안에 번개가 뜬다
  const bw = sw * 0.083, bh = sw * 0.04, lw = Math.max(1, sw * 0.0042);
  rrect(g, x - bw, cy - bh / 2, bw, bh, bh * 0.36);
  g.strokeStyle = `rgba(236,245,255,${a * 0.4})`; g.lineWidth = lw; g.stroke();
  g.beginPath();
  g.moveTo(x + lw, cy - bh * 0.13);
  g.arcTo(x + bh * 0.16, cy - bh * 0.13, x + bh * 0.16, cy + bh * 0.13, bh * 0.1);
  g.arcTo(x + bh * 0.16, cy + bh * 0.13, x + lw, cy + bh * 0.13, bh * 0.1);
  g.lineTo(x + lw, cy + bh * 0.13);
  g.strokeStyle = `rgba(236,245,255,${a * 0.3})`; g.stroke();

  const ip = lw * 1.6, iw = (bw - ip * 2) * clamp(chg, 0.03, 1);
  rrect(g, x - bw + ip, cy - bh / 2 + ip, iw, bh - ip * 2, (bh - ip * 2) * 0.3);
  g.fillStyle = plug && !slept ? `rgba(48,209,88,${a})` : `rgba(240,247,255,${a})`;
  g.fill();
  if (plug && !slept) bolt(g, x - bw / 2, cy, bh * 0.92, a, '6,22,10');

  // 와이파이
  x -= bw + sw * 0.028;
  const wr = sw * 0.027;
  g.strokeStyle = fg; g.lineWidth = Math.max(1, sw * 0.0062);
  g.lineCap = 'round';
  for (let i = 2; i >= 1; i--) {
    g.beginPath();
    g.arc(x - wr, cy + wr * 0.52, wr * (i * 0.44 + 0.12), -Math.PI * 0.76, -Math.PI * 0.24);
    g.stroke();
  }
  g.beginPath();
  g.arc(x - wr, cy + wr * 0.46, wr * 0.09, 0, TAU);
  g.fillStyle = fg; g.fill();

  // 신호 막대 네 개
  x -= wr * 2 + sw * 0.026;
  const sg = sw * 0.0105, sbw = sw * 0.0124, sh4 = sw * 0.038;
  for (let i = 0; i < 4; i++) {
    const hgt = sh4 * (0.34 + i * 0.22);
    rrect(g, x - (4 - i) * (sbw + sg) + sg, cy + sh4 / 2 - hgt, sbw, hgt, sbw * 0.34);
    g.fillStyle = `rgba(240,247,255,${a * (i < 3 ? 1 : 0.32)})`;
    g.fill();
  }
}

function drawHomeBar(g, sw, sh) {
  const w = sw * 0.355, h = Math.max(2, sw * 0.0118);
  rrect(g, -w / 2, sh / 2 - h * 2.6, w, h, h / 2);
  g.fillStyle = `rgba(232,243,255,${0.18 + bri * 0.38})`;
  g.fill();
}

function drawScreen(g) {
  const sw = SCR.w, sh = SCR.h;
  g.save();
  squircle(g, -sw / 2, -sh / 2, sw, sh, SCR.r);
  g.clip();

  g.fillStyle = '#05080d';
  g.fillRect(-sw / 2, -sh / 2, sw, sh);
  const bg = g.createLinearGradient(0, -sh / 2, 0, sh / 2);
  bg.addColorStop(0, `rgba(10,46,66,${bri * 0.9})`);
  bg.addColorStop(.5, `rgba(10,14,34,${bri * 0.85})`);
  bg.addColorStop(1, `rgba(36,12,46,${bri * 0.9})`);
  g.fillStyle = bg;
  g.fillRect(-sw / 2, -sh / 2, sw, sh);

  g.textAlign = 'center'; g.textBaseline = 'middle';

  if (slept) {
    // it finished, and then it turned itself off, and the room went back to dark
    g.fillStyle = 'rgba(80,220,245,.3)';
    g.font = `400 ${(sw * 0.1) | 0}px 'Share Tech Mono', monospace`;
    g.fillText('100%', 0, sh * 0.02);
    bolt(g, 0, -sh * 0.08, sw * 0.14, 0.2);
    g.restore();
    return;
  }

  drawStatusBar(g, sw, sh);
  drawIsland(g, sw, sh);
  drawHomeBar(g, sw, sh);
  g.textAlign = 'center'; g.textBaseline = 'middle';

  // the word is the battery. It fills from the bottom up.
  const word = !plug && chg < 0.99 ? (chg < 0.05 ? 'DEPLETED' : 'NO POWER')
    : chg >= 0.999 ? 'CHARGED' : 'CHARGING';

  // 글자 수로 크기를 잡으면 영문은 안 맞는다. 재서 맞춘다.
  const trk = 0.055;
  track(g, 100 * trk);
  g.font = `700 100px "Chakra Petch", sans-serif`;
  const fs = Math.min(sh * 0.19, 100 * (sw * 0.8) / g.measureText(word).width) | 0;
  track(g, fs * trk);
  g.font = `700 ${fs}px "Chakra Petch", sans-serif`;

  const cy = -sh * 0.05;
  const top = cy - fs * 0.52, bot = cy + fs * 0.48;
  const fy = bot - (bot - top) * chg;
  const ox = fs * trk * 0.5;   // letterSpacing 은 뒤쪽에만 붙어서 가운데가 밀린다

  // 꺼진 쪽 — 청록과 자홍이 어긋나 있다
  g.fillStyle = `rgba(0,214,255,${0.05 + bri * 0.13})`;
  g.fillText(word, -ox - fs * 0.021, cy);
  g.fillStyle = `rgba(255,45,155,${0.04 + bri * 0.1})`;
  g.fillText(word, -ox + fs * 0.021, cy);

  g.save();
  g.beginPath();
  g.rect(-sw / 2, fy, sw, bot - fy + 2);
  g.clip();
  g.shadowColor = `rgba(255,45,155,${bri * 0.5})`;
  g.shadowBlur = fs * 0.18;
  g.fillStyle = `rgba(255,45,155,${bri * 0.55})`;
  g.fillText(word, -ox + fs * 0.018, cy);
  g.shadowColor = `rgba(0,226,255,${bri * 0.7})`;
  g.shadowBlur = fs * 0.22;
  g.fillStyle = `rgba(226,252,255,${bri * 0.97})`;
  g.fillText(word, -ox, cy);
  g.restore();
  track(g, 0);

  if (plug && chg < 0.999) {
    // the waterline, not a strike-through: it has to die out before the bezel
    const lg = g.createLinearGradient(-sw * 0.44, 0, sw * 0.44, 0);
    lg.addColorStop(0, 'rgba(0,226,255,0)');
    lg.addColorStop(.5, `rgba(120,244,255,${bri * 0.26})`);
    lg.addColorStop(1, 'rgba(255,45,155,0)');
    g.fillStyle = lg;
    g.fillRect(-sw * 0.44, fy - 0.5, sw * 0.88, 1);
  }

  const pf = (sw * 0.25) | 0;
  g.font = `400 ${pf}px 'Share Tech Mono', monospace`;
  g.fillStyle = `rgba(255,45,155,${bri * 0.34})`;
  g.fillText(Math.round(chg * 100) + '%', pf * 0.022, sh * 0.18);
  g.shadowColor = `rgba(0,226,255,${bri * 0.5})`;
  g.shadowBlur = pf * 0.3;
  g.fillStyle = `rgba(216,250,255,${bri * 0.92})`;
  g.fillText(Math.round(chg * 100) + '%', 0, sh * 0.18);
  g.shadowBlur = 0;

  const rem = Math.max(1, Math.round((1 - chg) * 22));
  const cap = chg >= 0.999 ? 'NOTHING LEFT TO FILL'
    : plug ? `FULL IN ${rem} MIN`
    : 'NO SOURCE CONNECTED';
  track(g, sw * 0.012);
  g.font = `400 ${(sw * 0.055) | 0}px 'Share Tech Mono', monospace`;
  g.fillStyle = `rgba(104,214,238,${bri * 0.6})`;
  g.fillText(cap, 0, sh * 0.31);
  track(g, 0);

  scanlines(g, sw, sh);
  g.restore();
}

function drawPhone(g) {
  g.save();
  g.translate(PH.x, PH.y);
  g.rotate(ROT);

  const hw = PH.w / 2, hh = PH.h / 2;

  // 옆 버튼 — 위에서 내려다보면 테두리 밖으로 조금 나온 턱이다
  const bd = Math.max(1.5, PH.w * 0.012);
  const side = (y0, len, left) => {
    const x = left ? -hw - bd * 0.68 : hw - bd * 0.32;
    rrect(g, x, y0, bd, len, bd * 0.4);
    const bg = g.createLinearGradient(x, 0, x + bd, 0);
    bg.addColorStop(0, left ? '#3a434e' : '#272e37');
    bg.addColorStop(1, left ? '#181d24' : '#454f5b');
    g.fillStyle = bg; g.fill();
  };
  side(-hh + PH.h * 0.152, PH.h * 0.040, true);    // 액션 버튼
  side(-hh + PH.h * 0.222, PH.h * 0.060, true);    // 볼륨 업
  side(-hh + PH.h * 0.298, PH.h * 0.060, true);    // 볼륨 다운
  side(-hh + PH.h * 0.226, PH.h * 0.104, false);   // 측면 버튼

  g.shadowColor = 'rgba(0,0,0,.8)';
  g.shadowBlur = S * 0.055;
  g.shadowOffsetY = S * 0.014;
  squircle(g, -hw, -hh, PH.w, PH.h, PH.r);
  g.fillStyle = '#0d1016';
  g.fill();
  g.shadowColor = 'transparent'; g.shadowBlur = 0; g.shadowOffsetY = 0;

  // 티타늄 테두리 — 한쪽이 밝고 반대쪽은 어둡다
  squircle(g, -hw, -hh, PH.w, PH.h, PH.r);
  const fg = g.createLinearGradient(-hw, -hh, hw, hh);
  fg.addColorStop(0, `rgba(198,218,240,${0.3 + bri * 0.24})`);
  fg.addColorStop(.34, `rgba(118,144,174,${0.14 + bri * 0.12})`);
  fg.addColorStop(.72, `rgba(82,102,126,${0.1 + bri * 0.1})`);
  fg.addColorStop(1, `rgba(172,198,224,${0.2 + bri * 0.2})`);
  g.strokeStyle = fg;
  g.lineWidth = Math.max(1.2, PH.w * 0.0095);
  g.stroke();

  // 테두리와 화면 사이 검은 띠
  const pad = (PH.w - SCR.w) / 2;
  squircle(g, -SCR.w / 2 - pad * 0.34, -SCR.h / 2 - pad * 0.34,
           SCR.w + pad * 0.68, SCR.h + pad * 0.68, SCR.r + pad * 0.34);
  g.fillStyle = '#04060a';
  g.fill();

  drawScreen(g);

  // 아래 모서리 — 단자 구멍과 양옆 스피커
  const pw = PH.w * 0.12, ph = Math.max(2, PH.w * 0.024);
  if (!plug) {
    rrect(g, -pw / 2, hh - ph * 1.05, pw, ph, ph * 0.5);
    g.fillStyle = '#04060a';
    g.fill();
  }
  const sr = Math.max(0.8, PH.w * 0.0075);
  g.fillStyle = 'rgba(4,6,10,.85)';
  for (let i = 0; i < 3; i++) {
    const ox = pw * 0.82 + i * sr * 3.1;
    for (const sx of [-ox, ox]) {
      g.beginPath();
      g.arc(sx, hh - sr * 0.9, sr, 0, TAU);
      g.fill();
    }
  }

  g.restore();
}

function drawMurmurs(g) {
  if (!murs.length) return;
  g.textAlign = 'left'; g.textBaseline = 'middle';
  const fs = Math.max(10, S * 0.0205);
  track(g, fs * 0.1);
  g.font = `400 ${fs | 0}px 'Share Tech Mono', monospace`;
  const dim = slept ? 0.18 : 1;
  for (const m of murs) {
    const a = Math.sin(clamp(m.p, 0, 1) * Math.PI) * dim;
    if (a < 0.012) continue;
    g.fillStyle = `rgba(84,206,232,${(a * 0.44).toFixed(3)})`;
    g.fillText(m.t, lerp(m.x0, m.x1, m.p), m.y);
  }
  track(g, 0);
}

// ── the room's own word ────────────────────────────────────────────────────
// Once the phone is full it has nothing left to say, so the sentence moves off
// the screen and onto the sheet. It empties from the bottom, the way the screen
// filled from the bottom. Vertical, because a battery is a column.
const DRAIN = [...'DRAINING'];

function drawDrain(g) {
  if (done < 0.004) return;
  const margin = W / 2 - PH.w / 2;
  const fs = Math.max(11, Math.min(S * 0.075, margin * 0.5));
  const lh = fs * 1.02;
  const cx = W - margin * 0.5, cy = PH.y;   // 곡선이 왼쪽에 있으니 이쪽은 오른쪽
  const top = cy - lh * DRAIN.length / 2, bot = top + lh * DRAIN.length;
  const fy = bot - (bot - top) * me;

  g.textAlign = 'center'; g.textBaseline = 'middle';
  g.font = `700 ${fs | 0}px "Chakra Petch", sans-serif`;

  g.fillStyle = `rgba(0,214,255,${done * 0.09})`;
  for (let i = 0; i < DRAIN.length; i++) g.fillText(DRAIN[i], cx, top + lh * (i + 0.5));

  g.save();
  g.beginPath();
  g.rect(cx - fs, fy, fs * 2, bot - fy + 2);
  g.clip();
  g.shadowColor = `rgba(255,45,155,${done * 0.5})`;
  g.shadowBlur = fs * 0.4;
  g.fillStyle = `rgba(255,150,205,${done * 0.42})`;
  for (let i = 0; i < DRAIN.length; i++) g.fillText(DRAIN[i], cx, top + lh * (i + 0.5));
  g.restore();

  if (me > 0.001) {
    const lg = g.createLinearGradient(cx - fs * 0.9, 0, cx + fs * 0.9, 0);
    lg.addColorStop(0, 'rgba(255,45,155,0)');
    lg.addColorStop(.5, `rgba(255,120,190,${done * 0.3})`);
    lg.addColorStop(1, 'rgba(255,45,155,0)');
    g.fillStyle = lg;
    g.fillRect(cx - fs * 0.9, fy - 0.5, fs * 1.8, 1);
  }
}

// the other battery. No port, no cable, and the number only goes one way.
function drawMe(g) {
  const x = W * 0.07, y = H * 0.925, bw = S * 0.16, bh = Math.max(2, S * 0.011);
  const lit = 0.34 + (1 - me) * 0.38;   // it gets harder to ignore as it empties
  g.textAlign = 'left'; g.textBaseline = 'middle';
  const lf = (S * 0.022) | 0;
  track(g, lf * 0.2);
  g.font = `400 ${lf}px 'Share Tech Mono', monospace`;
  g.fillStyle = `rgba(84,214,240,${lit})`;
  g.fillText('ME', x, y);
  const bx = x + S * 0.048;
  g.fillStyle = 'rgba(84,214,240,.12)';
  g.fillRect(bx, y - bh / 2, bw, bh);
  g.fillStyle = me < 0.12 ? `rgba(255,45,155,${0.55 + lit * 0.4})` : `rgba(84,214,240,${lit})`;
  g.fillRect(bx, y - bh / 2, bw * me, bh);
  g.font = `400 ${(S * 0.021) | 0}px 'Share Tech Mono', monospace`;
  g.fillStyle = `rgba(84,214,240,${lit})`;
  g.fillText(Math.round(me * 100) + '%', bx + bw + S * 0.016, y);
  track(g, 0);
}

// ── 하루 ───────────────────────────────────────────────────────────────────
// 저녁 여섯 시부터 아침 아홉 시까지의 전국 전력수요. 선이 내려와서 네 시에
// 제일 낮아진다. 점 하나가 지금 몇 시인지 짚고 있다.
function curveBox() {
  // 케이블이 오른쪽 아래를 지나가니 왼쪽에 둔다
  return { x: W * 0.07, y: H * 0.845, w: Math.min(W * 0.4, S * 0.44), h: S * 0.08 };
}

function curveXY(b, m) {
  const u = clamp(((m / 60 + 24) % 24 - WIN_A + 24) % 24 / WIN_H, 0, 1);
  const v = (demandAt(m) - DEM_LO) / (DEM_HI - DEM_LO);
  return [b.x + b.w * u, b.y - b.h * v];
}

const TICKS = [18, 21, 0, 3, 6, 9];

function drawCurve(g) {
  const b = curveBox();
  const a = slept ? 0.3 : 1;
  const m0 = WIN_A * 60, m1 = m0 + WIN_H * 60;

  // 지나온 쪽과 아직 안 온 쪽을 나눠 그린다
  const passed = Math.max(m0, Math.min(clk < 12 * 60 ? clk + 24 * 60 : clk, m1));
  for (let pass = 0; pass < 2; pass++) {
    g.beginPath();
    const sa = pass ? passed : m0, sb = pass ? m1 : passed;
    for (let m = sa; m <= sb + 0.1; m += 10) {
      const [x, y] = curveXY(b, m);
      if (m === sa) g.moveTo(x, y); else g.lineTo(x, y);
    }
    if (!pass) {
      g.shadowColor = `rgba(0,226,255,${(a * 0.5).toFixed(3)})`;
      g.shadowBlur = S * 0.012;
    }
    g.strokeStyle = pass
      ? `rgba(84,206,232,${(a * 0.12).toFixed(3)})`
      : `rgba(120,240,255,${(a * 0.68).toFixed(3)})`;
    g.lineWidth = Math.max(1, S * 0.0018);
    g.stroke();
    g.shadowBlur = 0;
  }

  // 밑줄과 눈금
  g.fillStyle = `rgba(84,206,232,${(a * 0.12).toFixed(3)})`;
  g.fillRect(b.x, b.y, b.w, Math.max(1, S * 0.0012));
  const tf = Math.max(8, S * 0.0155);
  track(g, tf * 0.14);
  g.font = `400 ${tf | 0}px 'Share Tech Mono', monospace`;
  g.textAlign = 'center'; g.textBaseline = 'top';
  g.fillStyle = `rgba(84,206,232,${(a * 0.34).toFixed(3)})`;
  for (const h of TICKS) {
    const u = ((h - WIN_A + 24) % 24) / WIN_H;
    g.fillText(two(h), b.x + b.w * u, b.y + tf * 0.6);
  }

  // 지금
  const [dx, dy] = curveXY(b, clk);
  const r = Math.max(2, S * 0.0042);
  g.beginPath(); g.arc(dx, dy, r * 3.4, 0, TAU);
  g.fillStyle = `rgba(0,226,255,${(a * 0.14).toFixed(3)})`; g.fill();
  g.beginPath(); g.arc(dx, dy, r, 0, TAU);
  g.shadowColor = `rgba(0,226,255,${a.toFixed(3)})`;
  g.shadowBlur = r * 4;
  g.fillStyle = `rgba(226,252,255,${(a * 0.92).toFixed(3)})`; g.fill();
  g.shadowBlur = 0;

  // 숫자
  const nf = Math.max(10, S * 0.021);
  const y = b.y - b.h - nf * 1.4;
  g.textAlign = 'left'; g.textBaseline = 'middle';
  const LBL = 'NATIONAL GRID LOAD';
  track(g, nf * 0.18);
  g.font = `500 ${(nf * 0.9) | 0}px "Chakra Petch", sans-serif`;
  g.fillStyle = `rgba(84,206,232,${(a * 0.5).toFixed(3)})`;
  g.fillText(LBL, b.x, y);
  const lw = g.measureText(LBL).width;
  track(g, nf * 0.08);
  g.font = `400 ${nf | 0}px 'Share Tech Mono', monospace`;
  g.fillStyle = `rgba(226,252,255,${(a * 0.72).toFixed(3)})`;
  g.fillText(Math.round(demandAt(clk)).toLocaleString() + ' MWh', b.x + lw + nf * 0.7, y);
  track(g, 0);
}

function draw() {
  ctx.setTransform(1, 0, 0, 1, 0, 0);
  ctx.clearRect(0, 0, cv.width, cv.height);
  if (bed) ctx.drawImage(bed, 0, 0);
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  drawGlow(ctx);
  drawDrain(ctx);
  drawMurmurs(ctx);
  drawCable(ctx);
  drawPhone(ctx);
  drawMe(ctx);
  drawCurve(ctx);
}

// ── step ───────────────────────────────────────────────────────────────────
function step(dt) {
  if (PREVIEW) return;
  t += dt;

  // 꽂으면 밤이 간다. 안 꽂으면 시계도 안 간다.
  if (plug && !slept) clk = Math.min(clk + dt * RATE, 9 * 60);

  if (plug) chg = clamp(0.08 + (clk - plugAt) / 22 * 0.92, 0, 1);
  else chg = clamp(chg - dt * 0.005, 0.02, 1);   // never a flat 0. 방전 has to stay readable

  // this one runs down either way. Being awake with the phone just costs more.
  const prev = me;
  me = clamp(me - dt * (plug ? 0.0042 : 0.0018), 0, 1);
  if (prev > 0 && me <= 0) sound.ping(false);

  done += ((chg >= 0.999 ? 1 : 0) - done) * (1 - Math.pow(0.78, dt));

  const want = slept ? 0.02 : plug ? 1 : 0.46;
  bri += (want - bri) * (1 - Math.pow(0.004, dt));

  while (nextMur < MURMURS.length && clk >= MURMURS[nextMur][0]) spawnMur(nextMur++);
  for (let i = murs.length - 1; i >= 0; i--) {
    murs[i].p += dt / murs[i].dur;
    if (murs[i].p >= 1) murs.splice(i, 1);
  }

  // 자야 하는 시각이 지나면, 끄는 법을 알려준다
  if (!hint2 && plug && !slept && clk >= 257) {
    hint2 = true;
    hintEl.textContent = '// TAP THE SCREEN TO TURN IT OFF';
    hintEl.classList.remove('off');
  }

  if (plug) {
    const [px, py] = portPos();
    tip.x = px; tip.y = py; tip.vx = tip.vy = 0;
  } else if (!dragging) {
    tip.vx += (rest.x - tip.x) * dt * 24;
    tip.vy += (rest.y - tip.y) * dt * 24;
    const k = Math.pow(0.0025, dt);
    tip.vx *= k; tip.vy *= k;
    tip.x += tip.vx * dt; tip.y += tip.vy * dt;
  }

  sound.set(plug && !slept, chg, bri, (demandAt(clk) - DEM_LO) / (DEM_HI - DEM_LO));
}

let last = performance.now();
function loop(now) {
  const dt = Math.min(0.05, (now - last) / 1000);
  last = now;
  step(dt);
  draw();
  requestAnimationFrame(loop);
}

// ── input ──────────────────────────────────────────────────────────────────
const hintEl = document.getElementById('hint');
function inPhone(x, y) {
  const dx = x - PH.x, dy = y - PH.y;
  const lx = dx * CS + dy * SN, ly = -dx * SN + dy * CS;
  return Math.abs(lx) < PH.w / 2 && Math.abs(ly) < PH.h / 2;
}

cv.addEventListener('pointerdown', e => {
  sound.kick();
  if (Math.hypot(e.clientX - tip.x, e.clientY - tip.y) < S * 0.08) {
    dragging = true;
    document.body.classList.add('grab');
    cv.setPointerCapture(e.pointerId);
  } else if (plug && inPhone(e.clientX, e.clientY)) {
    // 끌 수 있는데 안 끄는 것 — 그게 이 시간의 전부다
    slept = !slept;
    sound.ping(!slept);
    if (slept) hintEl.classList.add('off');
  }
});

cv.addEventListener('pointermove', e => {
  if (!dragging) return;
  tip.x = e.clientX; tip.y = e.clientY;
  const [px, py] = portPos();
  const d = Math.hypot(tip.x - px, tip.y - py);
  if (!plug && d < S * 0.055) {
    plug = true; idle = 0; plugAt = clk;
    sound.ping(true);
    hintEl.classList.add('off');
  } else if (plug && d > S * 0.095) {
    plug = false;
    sound.ping(false);
  }
});

const release = e => {
  if (!dragging) return;
  dragging = false;
  document.body.classList.remove('grab');
  tip.vx = tip.vy = 0;
};
cv.addEventListener('pointerup', release);
cv.addEventListener('pointercancel', release);

const sndEl = document.getElementById('snd');
sndEl.addEventListener('click', () => {
  sndEl.textContent = 'SOUND: ' + (sound.toggle() ? 'ON' : 'OFF');
});

// ── layout ─────────────────────────────────────────────────────────────────
function resize() {
  W = window.innerWidth; H = window.innerHeight; S = Math.min(W, H);
  cv.width = Math.round(W * DPR); cv.height = Math.round(H * DPR);
  cv.style.width = W + 'px'; cv.style.height = H + 'px';

  // 아이폰 실측 비율 — 71.6 x 147.6 mm, 모서리 반지름 13.5 mm, 베젤 2.6 mm
  PH.h = Math.min(H * (PREVIEW ? 0.94 : 0.72), S * 0.98);
  PH.w = PH.h * 0.485;
  PH.r = PH.w * 0.188;
  PH.x = W * 0.5;
  PH.y = H * (PREVIEW ? 0.5 : 0.455);
  const pad = PH.w * 0.036;
  SCR.w = PH.w - pad * 2;
  SCR.h = PH.h - pad * 2;
  SCR.r = PH.r - pad;

  rest.x = W - S * 0.11; rest.y = H - S * 0.09;
  if (!plug && !dragging) { tip.x = rest.x; tip.y = rest.y; }

  bakeBed();
}
window.addEventListener('resize', resize);

// ── boot ───────────────────────────────────────────────────────────────────
(async () => {
  try {
    await Promise.all([
      // 한글 서브셋은 실제 글자를 넘겨야 받아온다
      document.fonts.load('700 60px "Chakra Petch"'),
      document.fonts.load('400 30px "Share Tech Mono"'),
      document.fonts.load('600 30px Inter', '0123456789:'),
    ]);
    await document.fonts.ready;
  } catch (e) { /* fall back to whatever is there */ }

  resize();

  if (PREVIEW) {
    plug = true; plugAt = T0; clk = 227; me = 0.19; bri = 1;
    chg = clamp(0.08 + (clk - plugAt) / 22 * 0.92, 0, 1);
    nextMur = 3;
    for (let i = 0; i < 3; i++) { spawnMur(i); murs[i].p = 0.62 - i * 0.16; }
    const [px, py] = portPos();
    tip.x = px; tip.y = py;
    draw();
    return;
  }

  sound.kick();
  setTimeout(() => hintEl.classList.add('off'), 14000);
  last = performance.now();
  requestAnimationFrame(loop);
})();
</script>
</body>
</html>
