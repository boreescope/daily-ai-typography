<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>나 — 1,312,977</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Nanum+Myeongjo:wght@400;700&family=Noto+Sans+KR:wght@400;500&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 100%; height: 100%; overflow: hidden; background: #06070a; }
  body { font-family: 'Space Mono', monospace; cursor: pointer; }
  canvas { display: block; }

  .home-btn {
    position: fixed; left: 26px; top: 22px; z-index: 20;
    font: 700 11px/1 'Space Mono', monospace; letter-spacing: .22em;
    color: #7f9ab4; text-decoration: none; padding: 9px 13px;
    border: 1px solid rgba(127,154,180,.3); background: rgba(6,7,10,.55);
    transition: color .3s, border-color .3s;
  }
  .home-btn:hover { color: #cfe4f7; border-color: rgba(207,228,247,.5); }

  .snd {
    position: fixed; right: 26px; top: 22px; z-index: 20;
    font: 700 11px/1 'Space Mono', monospace; letter-spacing: .18em;
    color: #7f9ab4; padding: 9px 13px; cursor: pointer;
    border: 1px solid rgba(127,154,180,.3); background: rgba(6,7,10,.55);
    transition: color .3s, border-color .3s;
  }
  .snd:hover { color: #cfe4f7; border-color: rgba(207,228,247,.5); }

  .hint {
    position: fixed; left: 50%; bottom: 12px; transform: translateX(-50%); z-index: 20;
    font: 400 10px/1 'Space Mono', monospace; letter-spacing: .2em;
    color: rgba(127,154,180,.55); white-space: nowrap; pointer-events: none;
    transition: opacity 1.2s ease;
  }
  .hint.off { opacity: 0; }

  body.preview .home-btn, body.preview .snd, body.preview .hint { display: none; }
</style>
</head>
<body>
<canvas id="cv"></canvas>
<a class="home-btn" href="../index.html">← INDEX</a>
<div class="snd" id="snd">SOUND: ON</div>
<div class="hint" id="hint">WATCH · 지켜보세요</div>

<script>
const cv = document.getElementById('cv');
const ctx = cv.getContext('2d');
const PREVIEW = new URLSearchParams(location.search).has('preview');
if (PREVIEW) document.body.classList.add('preview');

const DPR = Math.min(window.devicePixelRatio || 1, 2);
const clamp = (v, a, b) => v < a ? a : v > b ? b : v;
const lerp = (a, b, t) => a + (b - a) * t;
const ease = t => t * t * (3 - 2 * t);

const hsh = (a, k) => {
  let h = Math.imul(a + 0x9e37, 0x85eb) ^ Math.imul(k + 0x165e, 0xc2b2);
  h = Math.imul(h ^ (h >>> 15), 0x2545);
  return ((h ^ (h >>> 13)) >>> 0) / 4294967296;
};

// ── 출처 ───────────────────────────────────────────────────────────────────
// 국민건강보험공단_수면장애 관련 주상병별 진료정보
//   data.go.kr 파일데이터 15124322 (2026-11-09 수정) → data/sleep-region.csv
//   주상병 G47(수면장애) · F51(비기질성 수면장애) · G47.3(수면무호흡)
//   수진시점 주소지 기준 · 진료인원 중복제외 · 건강보험 급여실적
//   아래 숫자는 그 CSV의 2025년 행을 시도별로 더한 값이다.
//   2025년 1,312,977명 · 진료비 3,832억 원
//   (2023년 1,204,348명 → 2년 사이 108,629명 늘었다)
const TOTAL = 1312977;

// 아래에서부터 쌓인다. 사람이 많은 칸이 바닥이다.
// 색은 따로 고르지 않고 아래(따뜻한 모래색)에서 위(찬 푸른색)로 이어서 깐다.
const SIDO = [
  ['경기도', 355254], ['서울특별시', 270344], ['부산광역시', 96050],
  ['경상남도', 78692], ['인천광역시', 74891], ['대구광역시', 61842],
  ['경상북도', 59463], ['충청남도', 51634], ['전북특별자치도', 39476],
  ['충청북도', 39135], ['전라남도', 38385], ['강원특별자치도', 36547],
  ['대전광역시', 36433], ['광주광역시', 27332], ['울산광역시', 23228],
  ['제주특별자치도', 15426], ['세종특별자치시', 8845],
];
const BANDS = SIDO.map(([label, cnt], i) => {
  const u = i / (SIDO.length - 1);
  return {
    label, cnt,
    pct: Math.round(cnt / TOTAL * 1000) / 10,
    col: [Math.round(lerp(228, 150, u)), Math.round(lerp(198, 196, u)), Math.round(lerp(158, 242, u))],
  };
});
let CUM = [];   // 각 칸이 끝나는 누적 인원

const DUR = 38;          // 1명에서 1,312,977명까지 걸리는 시간(초)
const GLYPH_MAX = 800;   // 여기까지는 글자로 보인다. 그 다음부터는 점이다.
const LOGT = Math.log(TOTAL);

let W = 0, H = 0, S = 0;
let t = 0, n = 1;        // n — 이 작품을 움직이는 하나의 변수
let shown = 0;           // 점으로 이미 찍어둔 인원
let shownCell = 0;       // 그중 실제로 찍은 점 개수
let mix = 0;             // 0 글자 → 1 점
let endT = -1;           // 다 찬 뒤로 흐른 시간
let gcell = 0;           // 글자 칸 크기 (부드럽게 따라간다)
let last = 0;

// 점이 찍히는 판. 한 번 찍은 점은 지우지 않고 그 위에 더한다.
const fieldCv = document.createElement('canvas');
const fctx = fieldCv.getContext('2d');
const bgCv = document.createElement('canvas');
const bgx = bgCv.getContext('2d');

let FX = 0, FYB = 0, FW = 0, FH = 0, CW = 1, CH = 1, COLS = 0, ROWS = 0;
let DRAWN = 0;           // 실제로 화면에 찍을 수 있는 최대 인원
let PER = 1;             // 점 하나가 맡는 인원 (화면이 좁으면 2명 이상)
let CELLS = 0;
let MEI = 0;             // 「나」가 들어간 자리

// 글자 영역 (CSS 픽셀)
let fx = 0, fy = 0, fw = 0, fh = 0;

const countAt = tt => {
  const p = clamp(tt / DUR, 0, 1);
  return Math.min(TOTAL, Math.max(1, Math.round(Math.exp(LOGT * p))));
};
// i번째 사람이 나타나는 시각 — 글자 하나하나가 따로 떠오르게 하려고 쓴다
const timeOf = i => DUR * Math.log(Math.max(1, i)) / LOGT;

// 점 하나가 차지하는 네모. 칸이 1픽셀 안팎이라 가장자리를 반올림해서 딱 맞춘다.
function dotRect(i) {
  const c = (i / PER) | 0;
  const row = (c / COLS) | 0, col = c - row * COLS;
  return [FX + Math.round(col * CW), FYB - Math.round((row + 1) * CH), 1, 1];
}
const rowOf = people => ((people / PER) | 0) / COLS | 0;
const rowY = row => FYB - Math.round(Math.min(row, ROWS) * CH);
function bandOf(i) {
  for (let b = 0; b < CUM.length; b++) if (i < CUM[b]) return b;
  return CUM.length - 1;
}

// ── 판 짜기 ────────────────────────────────────────────────────────────────
function resize() {
  W = window.innerWidth; H = window.innerHeight; S = Math.min(W, H);
  cv.width = Math.round(W * DPR); cv.height = Math.round(H * DPR);
  cv.style.width = W + 'px'; cv.style.height = H + 'px';
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);

  const m = Math.max(14, W * 0.04);
  const top = PREVIEW ? Math.max(72, H * 0.19) : Math.max(96, H * 0.165);
  const bot = Math.max(52, H * 0.082);
  fx = m; fy = top; fw = W - m * 2; fh = H - top - bot;

  FX = Math.round(fx * DPR); FW = Math.round(fw * DPR); FH = Math.round(fh * DPR);
  FYB = Math.round((fy + fh) * DPR);
  // 131만 명이 화면에 꼭 맞게 칸을 나눈다. 한 사람에 한 점이 원칙이고,
  // 화면 픽셀이 모자라는 작은 화면에서만 점 하나가 두 명 이상을 맡는다.
  PER = Math.max(1, Math.ceil(TOTAL / Math.max(1, FW * FH)));
  CELLS = Math.ceil(TOTAL / PER);
  COLS = Math.max(1, Math.min(FW, Math.round(Math.sqrt(CELLS * FW / FH))));
  ROWS = Math.ceil(CELLS / COLS);
  if (ROWS > FH) { COLS = FW; ROWS = FH; }
  CW = FW / COLS; CH = FH / ROWS;
  DRAWN = Math.min(TOTAL, COLS * ROWS * PER);

  CUM = []; let c = 0;
  for (const b of BANDS) { c += b.cnt; CUM.push(c); }
  CUM[CUM.length - 1] = TOTAL;

  // 「나」는 어느 칸의 누구도 아니다. 그냥 쌓인 것의 38%쯤 되는 자리.
  MEI = Math.min(Math.round(TOTAL * 0.38), DRAWN - 1);
  // 줄(=쌓인 높이)은 그대로 두고 가로 자리만 가운데쯤으로 옮긴다 — 가장자리에 붙지 않게
  MEI = Math.min(((MEI / (PER * COLS)) | 0) * PER * COLS + Math.round(COLS * 0.44) * PER, DRAWN - 1);
  if (MEI < 0) MEI = 0;

  fieldCv.width = cv.width; fieldCv.height = cv.height;
  bakeBg();
  shown = 0; shownCell = 0; stampTo(Math.min(n, DRAWN));
}

function bakeBg() {
  bgCv.width = cv.width; bgCv.height = cv.height;
  bgx.setTransform(DPR, 0, 0, DPR, 0, 0);
  const g = bgx.createRadialGradient(W * 0.5, H * 0.42, 0, W * 0.5, H * 0.42, S * 1.15);
  g.addColorStop(0, '#0b0e14'); g.addColorStop(1, '#05060a');
  bgx.fillStyle = g; bgx.fillRect(0, 0, W, H);

  // 어두운 방의 입자. 아주 옅게만.
  const step = 3;
  for (let y = 0; y < H; y += step) {
    for (let x = 0; x < W; x += step) {
      const v = hsh(x * 7919 + y, 11);
      if (v > 0.986) {
        bgx.fillStyle = 'rgba(150,176,206,' + ((v - 0.986) * 7).toFixed(3) + ')';
        bgx.fillRect(x, y, 1, 1);
      }
    }
  }
}

// ── 점 찍기 ────────────────────────────────────────────────────────────────
// 새로 생긴 사람만 더 찍는다. 이미 찍힌 점은 건드리지 않는다.
function stampTo(target) {
  target = Math.min(target, DRAWN);
  if (target <= shown) return;
  const ct = Math.min(CELLS, (target / PER) | 0);
  const bk = [0.70, 0.92, 1.0];
  let i = shownCell;
  while (i < ct) {
    const b = bandOf(i * PER);
    const end = Math.min(ct, Math.ceil(CUM[b] / PER));
    const [r, gg, bb] = BANDS[b].col;
    for (let k = 0; k < 3; k++) {
      fctx.fillStyle = 'rgba(' + r + ',' + gg + ',' + bb + ',' + bk[k] + ')';
      for (let j = i; j < end; j++) {
        if ((Math.imul(j + 0x9e37, 0x85eb) >>> 13) % 3 !== k) continue;
        const row = (j / COLS) | 0;
        fctx.fillRect(FX + Math.round((j - row * COLS) * CW),
          FYB - Math.round((row + 1) * CH), 1, 1);
      }
    }
    i = end;
  }
  shownCell = Math.max(shownCell, ct);
  shown = target;
}

// ── 글자로 보이는 동안 ──────────────────────────────────────────────────────
// 아직 셀 수 있을 만큼일 때는 사람이 글자다. 가운데에서 바깥으로 늘어난다.
function drawGlyphs(g, a) {
  if (a < 0.004) return;
  const want = clamp(Math.sqrt(fw * fh / n) * 0.88, 2, S * 0.3);
  gcell = gcell ? lerp(gcell, want, 0.12) : want;
  const cell = gcell;
  const cols = Math.max(1, Math.floor(fw / cell));
  const rows = Math.ceil(n / cols);
  const cx = fx + fw / 2, cy = fy + fh / 2;
  const topY = cy - rows * cell / 2;

  g.textAlign = 'center'; g.textBaseline = 'middle';
  g.font = '400 ' + Math.max(2, cell * 0.74) + 'px "Nanum Myeongjo", serif';

  for (let i = 0; i < n; i++) {
    const row = (i / cols) | 0, col = i - row * cols;
    const inRow = Math.min(n - row * cols, cols);
    const age = t - timeOf(i + 1);
    const f = clamp(age / 0.42, 0, 1);
    if (f <= 0) continue;
    const x = cx - inRow * cell / 2 + (col + 0.5) * cell + (hsh(i, 3) - 0.5) * cell * 0.1;
    const y = topY + (rows - 1 - row) * cell + cell * 0.5 + (hsh(i, 5) - 0.5) * cell * 0.1;
    const al = a * f * (0.42 + hsh(i, 7) * 0.4);
    if (i === 0) {
      g.shadowColor = 'rgba(120,176,236,' + (a * 0.6) + ')';
      g.shadowBlur = cell * 0.5;
      g.fillStyle = 'rgba(214,232,250,' + (a * f) + ')';
    } else {
      g.shadowBlur = 0;
      g.fillStyle = 'rgba(158,190,224,' + al + ')';
    }
    const s = lerp(0.6, 1, ease(f));
    if (s < 0.995) {
      g.save(); g.translate(x, y); g.scale(s, s); g.fillText('나', 0, 0); g.restore();
    } else g.fillText('나', x, y);
  }
  g.shadowBlur = 0;
}

// ── 칸 이름 ────────────────────────────────────────────────────────────────
// 점이 되고 나서야 어디 사람인지 보인다. 바닥이 가장 두껍다.
function drawBands(g, a) {
  if (a < 0.004) return;
  const fs = Math.max(10, S * 0.018);
  g.font = '500 ' + (fs | 0) + 'px "Noto Sans KR", sans-serif';
  g.textAlign = 'left'; g.textBaseline = 'alphabetic';

  let lastY = Infinity;
  for (let b = 0; b < BANDS.length; b++) {
    const st = b ? CUM[b - 1] : 0;
    if (n <= st) continue;
    const bd = BANDS[b];
    const ly = rowY(rowOf(st)) / DPR;
    // 칸이 얇아 라벨이 붙거나 필드 위로 넘치면 그 칸은 이름을 달지 않는다
    const room = lastY - ly >= fs * 3.2 && ly >= fy + fs * 2.2;
    if (room) lastY = ly;
    const al = a * clamp((n - st) / Math.max(1, (CUM[b] - st) * 0.07), 0, 1);
    const y = rowY(rowOf(st)) / DPR;
    const [r, gg, bb] = bd.col;

    if (b > 0) {
      // 이름이 붙는 칸의 경계선만 또렷하게 — 나머지는 색만 바뀐다
      g.fillStyle = 'rgba(' + r + ',' + gg + ',' + bb + ',' + (al * (room ? 0.6 : 0.22)).toFixed(3) + ')';
      g.fillRect(fx, y - 0.5, fw, room ? 1.2 : 1);
    }
    if (!room) continue;
    const label = bd.label + '  ' + bd.pct + '%';
    const wd = g.measureText(label).width;
    g.fillStyle = 'rgba(6,7,10,' + (al * 0.62).toFixed(3) + ')';
    g.fillRect(fx + 4, y - fs * 1.9, wd + fs * 0.9, fs * 1.6);
    g.fillStyle = 'rgba(' + r + ',' + gg + ',' + bb + ',' + (al * 0.9).toFixed(3) + ')';
    g.fillText(label, fx + fs * 0.45 + 4, y - fs * 0.66);
  }
}

// ── 숫자 ───────────────────────────────────────────────────────────────────
const comma = v => String(v).replace(/\B(?=(\d{3})+(?!\d))/g, ',');

function drawHud(g) {
  const top = fy;
  const fs = Math.min(W * 0.1, 64, top * 0.46);
  const cy = top * 0.56;

  const sec = Math.floor(t), mm = Math.floor(sec / 60) % 60, ss = sec % 60;
  const hh = 3 + Math.floor(sec / 3600);
  const pad = v => (v < 10 ? '0' : '') + v;
  g.textAlign = 'center'; g.textBaseline = 'middle';

  g.font = '400 ' + Math.max(9, S * 0.016).toFixed(0) + 'px "Space Mono", monospace';
  g.fillStyle = 'rgba(127,154,180,.52)';
  g.fillText(pad(hh) + ':' + pad(mm) + ':' + pad(ss), W / 2, cy - fs * 0.62);

  const lock = endT >= 0 ? clamp(endT / 0.6, 0, 1) : 0;
  g.font = '700 ' + (fs | 0) + 'px "Space Mono", monospace';
  g.shadowColor = 'rgba(96,150,210,' + (0.3 + lock * 0.35) + ')';
  g.shadowBlur = fs * (0.3 + lock * 0.35);
  g.fillStyle = 'rgba(' + (196 + lock * 24) + ',' + (222 + lock * 20) + ',246,' + (0.82 + lock * 0.18) + ')';
  g.fillText(comma(n), W / 2, cy);
  g.shadowBlur = 0;

  g.font = '400 ' + Math.max(10, S * 0.018).toFixed(0) + 'px "Noto Sans KR", sans-serif';
  g.fillStyle = 'rgba(127,154,180,.58)';
  g.fillText('2025년 · 수면장애로 병원에 간 사람', W / 2, cy + fs * 0.66);
}

// ── 다 차고 난 뒤 ──────────────────────────────────────────────────────────
function drawEnd(g) {
  if (endT < 0) return;
  const e = endT;

  // 아래 두 칸, 경기도와 서울이 절반 가까이였다
  const aA = clamp((e - 1.8) / 1.1, 0, 1) * (1 - clamp((e - 4.4) / 1.0, 0, 1));
  if (aA > 0.004) {
    const fs = Math.max(15, S * 0.036);
    g.textAlign = 'center'; g.textBaseline = 'middle';
    g.font = '400 ' + (fs | 0) + 'px "Nanum Myeongjo", serif';
    g.shadowColor = 'rgba(70,118,172,' + (aA * 0.55) + ')'; g.shadowBlur = fs * 0.5;
    g.fillStyle = 'rgba(214,232,250,' + (aA * 0.92) + ')';
    g.fillText('아래 두 칸, 경기도와 서울이 절반 가까이였다', W / 2, fy + fh * 0.5);
    g.shadowBlur = 0;
  }

  // 점 하나가 다시 「나」가 된다
  const gr = clamp((e - 4.0) / 1.7, 0, 1);
  if (gr > 0.004) {
    const [dx, dy, dw, dh] = dotRect(MEI);
    const x = (dx + dw / 2) / DPR, y = (dy + dh / 2) / DPR;
    const k = ease(gr);
    const fs = lerp(Math.max(2, CH / DPR * 1.4), Math.max(22, S * 0.082), k);

    // 점이 빽빽한 자리라 글자가 묻힌다. 먼저 어둡게 가라앉히고 그 위에 빛을 올린다
    const dg = g.createRadialGradient(x, y, 0, x, y, fs * 3.0);
    dg.addColorStop(0, 'rgba(6,9,14,' + (k * 0.88) + ')');
    dg.addColorStop(0.55, 'rgba(6,9,14,' + (k * 0.6) + ')');
    dg.addColorStop(1, 'rgba(6,9,14,0)');
    g.fillStyle = dg;
    g.fillRect(x - fs * 3.0, y - fs * 3.0, fs * 6.0, fs * 6.0);

    const rg = g.createRadialGradient(x, y, 0, x, y, fs * 2.2);
    rg.addColorStop(0, 'rgba(120,180,240,' + (k * 0.3) + ')');
    rg.addColorStop(1, 'rgba(120,180,240,0)');
    g.fillStyle = rg;
    g.fillRect(x - fs * 2.2, y - fs * 2.2, fs * 4.4, fs * 4.4);

    g.textAlign = 'center'; g.textBaseline = 'middle';
    g.font = '400 ' + (fs | 0) + 'px "Nanum Myeongjo", serif';
    g.shadowColor = 'rgba(130,186,244,' + (k * 0.8) + ')'; g.shadowBlur = fs * 0.55;
    g.fillStyle = 'rgba(226,240,255,' + (0.35 + k * 0.65) + ')';
    g.fillText('나', x, y);
    g.shadowBlur = 0;

    const aC = clamp((e - 6.0) / 1.2, 0, 1);
    if (aC > 0.004) {
      const f2 = Math.max(13, S * 0.028);
      g.font = '400 ' + (f2 | 0) + 'px "Nanum Myeongjo", serif';
      const tx = clamp(x, W * 0.3, W * 0.7), ty = y + fs * 1.35;
      const tw = g.measureText('혼자 깨어 있던 건 아니었다').width;
      g.fillStyle = 'rgba(6,9,14,' + (aC * 0.72) + ')';
      g.fillRect(tx - tw / 2 - f2 * 0.8, ty - f2 * 1.0, tw + f2 * 1.6, f2 * 2.0);
      g.fillStyle = 'rgba(206,226,248,' + (aC * 0.92) + ')';
      g.fillText('혼자 깨어 있던 건 아니었다', tx, ty);
    }
  }

  const aS = clamp((e - 7.4) / 1.4, 0, 1);
  if (aS > 0.004) {
    g.textAlign = 'center'; g.textBaseline = 'middle';
    g.font = '400 ' + Math.max(9, S * 0.0145).toFixed(0) + 'px "Noto Sans KR", sans-serif';
    g.fillStyle = 'rgba(127,154,180,' + (aS * 0.5) + ')';
    // 좁은 화면에서는 한 줄에 다 안 들어가서 두 줄로 나눈다
    const sf = Math.max(9, S * 0.0145);
    const src = ['국민건강보험공단 · 수면장애 관련 주상병별 진료정보',
      '2025년 1,312,977명 · data.go.kr' + (PER > 1 ? ' · 점 하나에 ' + PER + '명' : '')];
    const one = src[0] + ' (' + src[1] + ')';
    const by = H - Math.max(52, H * 0.082) * 0.60;
    if (g.measureText(one).width < W * 0.92) g.fillText(one, W / 2, by);
    else { g.fillText(src[0], W / 2, by - sf * 0.72); g.fillText(src[1], W / 2, by + sf * 0.72); }
  }
}

function draw() {
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  ctx.clearRect(0, 0, W, H);
  ctx.drawImage(bgCv, 0, 0, W, H);

  const dim = endT >= 0 ? clamp((endT - 0.9) / 1.3, 0, 1) * 0.52 : 0;
  if (mix > 0.004) {
    const fa = mix * (1 - dim);
    ctx.globalAlpha = fa;
    ctx.drawImage(fieldCv, 0, 0, W, H);
    ctx.globalCompositeOperation = 'lighter';
    ctx.globalAlpha = fa * 0.7;
    ctx.drawImage(fieldCv, 0, 0, W, H);
    ctx.globalCompositeOperation = 'source-over';
    ctx.globalAlpha = 1;
  }
  drawGlyphs(ctx, 1 - mix);
  drawBands(ctx, mix * (0.7 + dim * 0.6));
  drawHud(ctx);
  drawEnd(ctx);
}

// ── 소리 ───────────────────────────────────────────────────────────────────
// 처음에는 한 사람씩 똑, 똑. 셀 수 없이 많아지면 그냥 쏴— 하는 소리가 된다.
const sound = (() => {
  let ac = null, mg = null, bed = null, bedG = null, bedF = null, on = true;

  function kick() {
    if (ac || !on) return;
    try { ac = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) { return; }
    mg = ac.createGain(); mg.gain.value = 0.9; mg.connect(ac.destination);

    for (const f of [48, 72]) {
      const o = ac.createOscillator(), g = ac.createGain();
      o.type = 'sine'; o.frequency.value = f;
      g.gain.value = f === 48 ? 0.030 : 0.016;
      o.connect(g); g.connect(mg); o.start();
    }
    const len = ac.sampleRate * 3;
    const buf = ac.createBuffer(1, len, ac.sampleRate);
    const d = buf.getChannelData(0);
    let v = 0;
    for (let i = 0; i < len; i++) { v = (v + (Math.random() * 2 - 1) * 0.02) * 0.995; d[i] = v * 6; }
    bed = ac.createBufferSource(); bed.buffer = buf; bed.loop = true;
    bedF = ac.createBiquadFilter(); bedF.type = 'lowpass'; bedF.frequency.value = 300;
    bedG = ac.createGain(); bedG.gain.value = 0;
    bed.connect(bedF); bedF.connect(bedG); bedG.connect(mg); bed.start();
  }

  function tick(i) {
    if (!ac || !on) return;
    const o = ac.createOscillator(), g = ac.createGain();
    o.type = 'triangle';
    o.frequency.value = 880 + hsh(i, 2) * 520;
    g.gain.setValueAtTime(0, ac.currentTime);
    g.gain.linearRampToValueAtTime(0.055, ac.currentTime + 0.004);
    g.gain.exponentialRampToValueAtTime(0.0001, ac.currentTime + 0.16);
    o.connect(g); g.connect(mg); o.start(); o.stop(ac.currentTime + 0.18);
  }

  function ping(f, len, vol) {
    if (!ac || !on) return;
    const o = ac.createOscillator(), g = ac.createGain();
    o.type = 'sine'; o.frequency.value = f;
    g.gain.setValueAtTime(0, ac.currentTime);
    g.gain.linearRampToValueAtTime(vol, ac.currentTime + 0.02);
    g.gain.exponentialRampToValueAtTime(0.0001, ac.currentTime + len);
    o.connect(g); g.connect(mg); o.start(); o.stop(ac.currentTime + len + 0.05);
  }

  function flow(rate) {
    if (!ac || !bedG) return;
    const k = clamp(Math.log(rate + 1) / Math.log(400), 0, 1);
    bedG.gain.setTargetAtTime(k * 0.13, ac.currentTime, 0.25);
    bedF.frequency.setTargetAtTime(300 + k * k * 3400, ac.currentTime, 0.3);
  }

  function toggle() {
    on = !on;
    if (mg) mg.gain.setTargetAtTime(on ? 0.9 : 0, ac.currentTime, 0.08);
    if (on && !ac) kick();
    return on;
  }
  return { kick, tick, ping, flow, toggle, ready: () => !!ac };
})();

// ── 흐름 ───────────────────────────────────────────────────────────────────
const TSW = timeOf(GLYPH_MAX);
const hintEl = document.getElementById('hint');
let hintState = 0;

function step(dt) {
  t += dt;
  const prev = n;
  n = countAt(t);
  mix = clamp((t - TSW) / 0.75, 0, 1);
  stampTo(n);

  const rate = n * LOGT / DUR;
  sound.flow(n >= TOTAL ? 0 : rate);
  if (rate < 14) for (let i = prev + 1, k = 0; i <= n && k < 4; i++, k++) sound.tick(i);

  if (n >= TOTAL) {
    if (endT < 0) { endT = 0; sound.ping(174, 2.4, 0.09); }
    else {
      const was = endT; endT += dt;
      if (was < 4.0 && endT >= 4.0) sound.ping(1046, 1.8, 0.055);
    }
  }

  if (hintState === 0 && t > 6.5) { hintEl.classList.add('off'); hintState = 1; }
  if (hintState === 1 && endT > 8.4) {
    hintEl.textContent = 'CLICK TO REPLAY · 클릭하면 다시';
    hintEl.classList.remove('off');
    hintState = 2;
  }
}

function restart() {
  t = 0; n = 1; mix = 0; endT = -1; gcell = 0;
  fctx.clearRect(0, 0, fieldCv.width, fieldCv.height);
  shown = 0; shownCell = 0;
  hintEl.textContent = 'WATCH · 지켜보세요';
  hintEl.classList.remove('off');
  hintState = 0;
}

function loop(now) {
  const dt = Math.min(0.05, (now - last) / 1000);
  last = now;
  step(dt);
  draw();
  requestAnimationFrame(loop);
}

window.addEventListener('resize', resize);
document.getElementById('snd').addEventListener('click', e => {
  e.stopPropagation();
  document.getElementById('snd').textContent = 'SOUND: ' + (sound.toggle() ? 'ON' : 'OFF');
});
window.addEventListener('pointerdown', () => { sound.kick(); if (endT > 1) restart(); });

// ── 시작 ───────────────────────────────────────────────────────────────────
(async () => {
  try {
    await Promise.all([
      document.fonts.load('400 60px "Nanum Myeongjo"', '나아래두칸경기도와서울이절반가까이였다혼자깨어있던건아니었다'),
      document.fonts.load('500 20px "Noto Sans KR"', '년수면장애로병원에간사람국민건강보험공단관련주상병별진료정보명경기서울부산상남인천대구북충청전특자치강원제주세종광역시'),
      document.fonts.load('700 40px "Space Mono"', '0123456789:,'),
    ]);
    await document.fonts.ready;
  } catch (e) { /* 없으면 없는 대로 */ }

  resize();

  if (PREVIEW) {
    t = DUR; n = TOTAL; mix = 1; endT = 5.2;
    stampTo(TOTAL);
    draw();
    return;
  }

  sound.kick();
  last = performance.now();
  requestAnimationFrame(loop);
})();
</script>
