<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CHARGING — 03:57</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700;900&family=VT323&display=swap" rel="stylesheet">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 100%; height: 100%; overflow: hidden; background: #040a0d; }
  body { font-family: 'VT323', monospace; cursor: default; }
  body.grab { cursor: grabbing; }
  canvas { display: block; }

  .home-btn {
    position: fixed; left: 26px; top: 22px; z-index: 20;
    font: 700 11px/1 Orbitron, sans-serif; letter-spacing: .22em;
    color: #84ecf8; text-decoration: none; padding: 8px 13px;
    border: 1px solid rgba(132,236,248,.3); background: rgba(4,12,16,.66);
    transition: color .3s, border-color .3s;
  }
  .home-btn:hover { color: #ffb03a; border-color: rgba(255,176,58,.6); }

  .snd {
    position: fixed; right: 26px; top: 22px; z-index: 20;
    font: 700 11px/1 Orbitron, sans-serif; letter-spacing: .18em;
    color: #84ecf8; padding: 8px 13px; cursor: pointer;
    border: 1px solid rgba(132,236,248,.3); background: rgba(4,12,16,.66);
    transition: color .3s, border-color .3s;
  }
  .snd:hover { color: #ffb03a; border-color: rgba(255,176,58,.6); }

  .hint {
    position: fixed; left: 50%; bottom: 26px; transform: translateX(-50%); z-index: 20;
    font: 400 15px/1 VT323, monospace; letter-spacing: .24em;
    color: rgba(255,176,58,.72); white-space: nowrap; pointer-events: none;
    transition: opacity 1.4s ease;
  }
  .hint.off { opacity: 0; }

  body.preview .home-btn, body.preview .snd, body.preview .hint { display: none; }
</style>
</head>
<body>
<canvas id="cv"></canvas>
<a class="home-btn" href="../index.html">← INDEX</a>
<div class="snd" id="snd">SOUND: ON</div>
<div class="hint" id="hint">// DRAG THE CABLE INTO THE PORT</div>

<script>
const cv = document.getElementById('cv');
const ctx = cv.getContext('2d');
const PREVIEW = new URLSearchParams(location.search).has('preview');
if (PREVIEW) document.body.classList.add('preview');

const DPR = Math.min(window.devicePixelRatio || 1, 2);
const TAU = Math.PI * 2;
const clamp = (v, a, b) => v < a ? a : v > b ? b : v;
const lerp = (a, b, t) => a + (b - a) * t;

// integer hash, for the cloth grain and the weave of the sheet
const hsh = (a, b, k) => {
  let h = Math.imul(a + 0x9e37, 0x85eb) ^ Math.imul(b + 0x27d4, 0xc2b2) ^ Math.imul(k + 0x165e, 0x27d4);
  h = Math.imul(h ^ (h >>> 15), 0x2545);
  return ((h ^ (h >>> 13)) >>> 0) / 4294967296;
};

let W = 0, H = 0, S = 0;        // S = min side, the one unit everything scales by

// ── the phone ──────────────────────────────────────────────────────────────
// It lies a little crooked, the way a phone does when it is put down by
// someone already half asleep.
const ROT = -0.054;
const CS = Math.cos(ROT), SN = Math.sin(ROT);
const PH = { x: 0, y: 0, w: 0, h: 0, r: 0 };
const SCR = { w: 0, h: 0, r: 0 };
const toW = (px, py) => [PH.x + px * CS - py * SN, PH.y + px * SN + py * CS];

// ── state ──────────────────────────────────────────────────────────────────
let chg = 0.08;          // the phone
const ME0 = 0.33;        // 처음 남아 있던 만큼. 여기서부터 줄기만 한다.
let me = ME0;            // MY ENERGY — the other battery, the one with no port
let bri = 0.42;          // screen brightness
let plug = false, dragging = false;
let idle = 0, slept = false;
let done = 0;          // 0 until the phone has nothing left to fill
let t = 0;

const tip = { x: 0, y: 0, vx: 0, vy: 0 };
const rest = { x: 0, y: 0 };

// ── 하루 24시간 전국 전력수요 ──────────────────────────────────────────────
// 2025년 365일 시간대별 평균 MWh · 한국전력거래소
// 제일 낮은 때가 04시, 제일 높은 때가 19시. 새벽 3시 반은 그 바로 앞이다.
const DEM = [64550, 60760, 58367, 56921, 56180, 56321, 57537, 60105,
             63445, 66431, 66742, 65878, 64095, 61939, 64197, 65765,
             67562, 70052, 71554, 72524, 72210, 70411, 67978, 66554];
const DEM_LO = 56180, DEM_HI = 72524;

// 곡선에 보이는 구간 — 저녁 6시부터 아침 9시까지. 꼭대기와 바닥이 둘 다 들어온다.
const WIN_A = 18, WIN_H = 15;

// 시계. 꽂기 전엔 03:30에 멈춰 있다. 꽂으면 1초에 54초씩 간다.
const T0 = 3 * 60 + 30;
const RATE = 1.7;            // 분 / 초
let clk = T0, plugAt = T0;

const demandAt = m => {
  const h = (m / 60 + 24) % 24;
  const i = Math.floor(h);
  return lerp(DEM[i], DEM[(i + 1) % 24], h - i);
};

// ── 혼잣말 ─────────────────────────────────────────────────────────────────
// 폰 뒤를 가로질러 간다. 네 시가 지나면 뜸해지고 같은 말만 남는다.
const MURMURS = [
  [213, "i'll sleep after this"],
  [220, 'just one more'],
  [227, 'i should really sleep'],
  [234, 'nothing new to look at'],
  [241, 'why am i still awake'],
  [248, 'everyone else is asleep'],
  [257, 'i really have to sleep now'],
  [265, "it's four"],
  [278, 'i am not going to sleep'],
  [296, 'still awake'],
  [318, 'still awake'],
];
const murs = [];
let nextMur = 0;
let hint2 = false;

function spawnMur(i) {
  const txt = MURMURS[i][1];
  const rtl = i % 2 === 1;
  murs.push({
    t: txt,
    y: PH.y + (hsh(i, 41, 7) - 0.5) * PH.h * 0.95,
    x0: rtl ? W * 1.6 : -W * 0.9,
    x1: rtl ? -W * 0.9 : W * 1.6,
    p: 0,
    dur: 9 + hsh(i, 43, 11) * 4,
    c: [C2, C3, C2, C1][i % 4],
  });
}

// ── the sheet, baked once ──────────────────────────────────────────────────
let bed = null;

// 도시의 불 켜진 창. 밤이 가는 동안 하나씩 꺼진다.
let CITY = [], WINS = [], winCv = null, winIdx = 0;

function grain(g, w, h, amt) {
  const q = 3, gw = Math.ceil(w / q), gh = Math.ceil(h / q);
  const c = document.createElement('canvas');
  c.width = gw; c.height = gh;
  const gg = c.getContext('2d');
  const im = gg.createImageData(gw, gh);
  const d = im.data;
  for (let y = 0; y < gh; y++) for (let x = 0; x < gw; x++) {
    const i = (y * gw + x) * 4;
    d[i] = 120; d[i + 1] = 190; d[i + 2] = 212;
    d[i + 3] = Math.random() * amt;
  }
  gg.putImageData(im, 0, 0);
  g.imageSmoothingEnabled = true;
  g.drawImage(c, 0, 0, w, h);
}

// ── 바깥 ───────────────────────────────────────────────────────────────────
// 방이 아니라 격자다. 선으로만 선 도시가 지평선 위에 있고, 바닥은 소실점으로
// 모이는 그리드다. 전부 한 번 구워서 쓴다.
// 색은 둘이다. 청록이 구조를 전부 맡고, 호박은 데이터 위에만 올라간다.
// 흰색은 제일 중요한 숫자 하나, 빨강은 경고 하나.
const C1 = '132,236,248';    // 청록 — 제일 밝은 쪽
const C2 = '74,190,210';     // 청록 — 한 단계 아래
const C3 = '38,128,150';     // 청록 — 멀리 있는 것
const WHT = '226,250,255';
const AMB = '255,176,58';    // 호박
const RED = '255,78,48';

// 예전 이름들은 이 두 색으로 모인다
const LIME = C1, GRN = C2, MINT = WHT, PUR = C3, PNK = AMB, CYN = AMB;
// 건물은 색이 아니라 밝기만 다르다
const NEON = [C1, C2, C2, C2, C3, C3, C3, C1, C2];

// hsh 는 고르게 안 퍼져서 점이 대각선으로 줄을 선다. 여긴 따로 쓴다.
function seeded(seed) {
  let x = seed >>> 0;
  return () => {
    x ^= x << 13; x >>>= 0;
    x ^= x >>> 17;
    x ^= x << 5; x >>>= 0;
    return x / 4294967296;
  };
}

// 카메라 — 하늘에서 비스듬히 내려다본다. 지평선은 화면 위쪽에 걸친다.
const CAM = { h: 10, p: 0.6, f: 1 };

function setCam() {
  CAM.f = S * 0.55;
  CAM.p = Math.atan((H / 2 - H * 0.18) / CAM.f);
}

// (x 오른쪽, y 위, z 앞) → 화면. 뒤로 넘어가면 null.
function prj(x, y, z) {
  const sp = Math.sin(CAM.p), cp = Math.cos(CAM.p);
  const Y = y - CAM.h;
  const yr = Y * cp + z * sp;
  const zr = -Y * sp + z * cp;
  if (zr < 0.25) return null;
  return [W / 2 + CAM.f * x / zr, H / 2 - CAM.f * yr / zr, zr];
}

const hzY = () => H / 2 - CAM.f * Math.tan(CAM.p);

function poly(g, pts) {
  g.beginPath();
  g.moveTo(pts[0][0], pts[0][1]);
  for (let i = 1; i < pts.length; i++) g.lineTo(pts[i][0], pts[i][1]);
  g.closePath();
}

// 바닥 — 소실점으로 모이는 격자. 투영이 알아서 모아 준다.
function floorGrid(g) {
  const Z0 = 3, Z1 = 190, X = 108;
  g.lineCap = 'butt';

  for (let i = -X; i <= X; i += 3) {
    const a = prj(i, 0, Z0), b = prj(i, 0, Z1);
    if (!a || !b) continue;
    g.beginPath(); g.moveTo(a[0], a[1]); g.lineTo(b[0], b[1]);
    g.strokeStyle = i % 24 === 0 ? `rgba(${C2},.18)`
      : `rgba(${i % 12 === 0 ? GRN : LIME},${i % 12 === 0 ? .16 : .085})`;
    g.lineWidth = 1;
    g.stroke();
  }
  for (let z = Z0; z <= Z1; z += 3) {
    const a = prj(-X, 0, z), b = prj(X, 0, z);
    if (!a || !b) continue;
    const f = 1 - z / Z1;
    g.beginPath(); g.moveTo(a[0], a[1]); g.lineTo(b[0], b[1]);
    g.strokeStyle = z % 24 === 0 ? `rgba(${C2},${(0.06 + f * 0.16).toFixed(3)})`
      : `rgba(${z % 12 === 0 ? GRN : LIME},${(0.05 + f * 0.17).toFixed(3)})`;
    g.lineWidth = 1;
    g.stroke();
  }
}

// 상자 하나 — 윗면과 보이는 옆면 둘. 속은 메우고 모서리만 긋는다. 창에 불이 켜진다.
function box(g, b) {
  const x0 = b.x, z0 = b.z, x1 = b.x + b.bw, z1 = b.z + b.bd, h = b.h;
  const a = b.a, rgb = b.c;
  const P = prj;
  const t = [P(x0, h, z0), P(x1, h, z0), P(x1, h, z1), P(x0, h, z1)];
  if (t.some(v => !v)) return;

  const wins = [];
  const faces = [];
  faces.push([P(x0, 0, z0), P(x1, 0, z0), t[1], t[0]]);          // 앞
  if (x1 < 0) faces.push([P(x1, 0, z0), P(x1, 0, z1), t[2], t[1]]);
  else if (x0 > 0) faces.push([P(x0, 0, z0), P(x0, 0, z1), t[3], t[0]]);

  // 사각 면 안의 (u, v) — 아래 모서리에서 위 모서리로
  const at = (f, u, v) => [
    lerp(lerp(f[0][0], f[1][0], u), lerp(f[3][0], f[2][0], u), v),
    lerp(lerp(f[0][1], f[1][1], u), lerp(f[3][1], f[2][1], u), v),
  ];

  const rows = Math.max(2, Math.min(11, Math.round(h * 1.5)));
  const cols = 4;

  for (const f of faces) {
    if (f.some(v => !v)) continue;
    poly(g, f);
    g.fillStyle = 'rgba(5,9,12,.9)'; g.fill();
    g.strokeStyle = `rgba(${rgb},${(a * 0.7).toFixed(3)})`;
    g.lineWidth = 1; g.stroke();

    // 층
    g.strokeStyle = `rgba(${rgb},${(a * 0.2).toFixed(3)})`;
    for (let i = 1; i < rows; i++) {
      const v = i / rows, l = at(f, 0, v), r = at(f, 1, v);
      g.beginPath(); g.moveTo(l[0], l[1]); g.lineTo(r[0], r[1]); g.stroke();
    }

    // 불 켜진 창은 여기서 안 칠한다. 하나씩 꺼야 해서 따로 모아 둔다.
    for (let r = 0; r < rows; r++) {
      for (let c = 0; c < cols; c++) {
        if (b.rnd() > b.lit) continue;
        const u0 = (c + 0.22) / cols, u1 = (c + 0.78) / cols;
        const v0 = (r + 0.26) / rows, v1 = (r + 0.74) / rows;
        wins.push([at(f, u0, v0), at(f, u1, v0), at(f, u1, v1), at(f, u0, v1)]);
      }
    }
  }

  // 윗면 — 여기가 제일 밝다. 내려다보고 있다는 건 윗면이 말해 준다.
  poly(g, t);
  g.fillStyle = 'rgba(8,13,16,.9)'; g.fill();
  g.strokeStyle = `rgba(${rgb},${Math.min(1, a * 1.7).toFixed(3)})`;
  g.lineWidth = 1; g.stroke();

  g.strokeStyle = `rgba(${rgb},${(a * 0.26).toFixed(3)})`;
  for (let i = 1; i < 4; i++) {
    const u = i / 4;
    g.beginPath();
    g.moveTo(lerp(t[0][0], t[3][0], u), lerp(t[0][1], t[3][1], u));
    g.lineTo(lerp(t[1][0], t[2][0], u), lerp(t[1][1], t[2][1], u));
    g.stroke();
    g.beginPath();
    g.moveTo(lerp(t[0][0], t[1][0], u), lerp(t[0][1], t[1][1], u));
    g.lineTo(lerp(t[3][0], t[2][0], u), lerp(t[3][1], t[2][1], u));
    g.stroke();
  }

  // 창은 따로 간다. 실루엣도 같이 — 앞 건물이 뒤 건물 창을 가려야 한다.
  CITY.push({ sil: faces.filter(f => !f.some(v => !v)).concat([t]), wins, rgb, wa: Math.min(0.9, a * 1.6) });
}

// 도시 — 블록마다 한 채씩. 가운데 길은 비워 둔다. 폰이 거기 선다.
function wireCity(g) {
  CITY = [];
  const rnd = seeded(0x43484735);
  const bs = [];
  const G = 6, FAR = 170;
  for (let z = 4; z < FAR; z += G) {
    for (let x = -90; x < 90; x += G) {
      if (Math.abs(x) < 5) continue;                   // 가운데 길
      if (Math.abs(x) < 14 && z < 34) continue;        // 폰 자리
      if (Math.abs(x) < 26 && z < 12) continue;        // 아래쪽 숫자 자리
      if (rnd() > 0.88) continue;
      const bw = 2.8 + rnd() * 2.4, bd = 2.8 + rnd() * 2.4;
      const h = 0.8 + Math.pow(rnd(), 2.3) * 12;
      bs.push({
        x: x + rnd() * (G - bw), z: z + rnd() * (G - bd),
        bw, bd, h,
        c: NEON[(rnd() * NEON.length) | 0],
        a: 0.26 + rnd() * 0.4,
        lit: 0.1 + rnd() * 0.3,
        rnd: seeded(0x9e37 + ((x * 131 + z * 17) | 0)),
      });
    }
  }
  bs.sort((p, q) => q.z - p.z);                        // 먼 것부터
  for (const b of bs) { b.a *= Math.pow(1 - b.z / (FAR * 1.25), 1.4); box(g, b); }
}

// 지평선 위 — 별 몇 개만
function starField(g, hz) {
  const rnd = seeded(0x43484733);
  for (let i = 0; i < 90; i++) {
    const x = rnd() * W, y = rnd() * Math.max(hz, 4);
    const r = S * (0.0006 + rnd() * 0.0014);
    g.beginPath();
    g.arc(x, y, r, 0, TAU);
    g.fillStyle = `rgba(${rnd() > 0.6 ? GRN : LIME},${(0.1 + rnd() * 0.4).toFixed(3)})`;
    g.fill();
  }
}

function bakeBed() {
  bed = document.createElement('canvas');
  bed.width = Math.round(W * DPR);
  bed.height = Math.round(H * DPR);
  const g = bed.getContext('2d');
  g.scale(DPR, DPR);

  setCam();
  const hz = hzY();
  const sky = g.createLinearGradient(0, 0, 0, H);
  sky.addColorStop(0, '#0b2630');
  sky.addColorStop(.3, '#07161d');
  sky.addColorStop(1, '#040a0d');
  g.fillStyle = sky;
  g.fillRect(0, 0, W, H);

  // 지평선에 보라 기운 한 겹
  const hg = g.createLinearGradient(0, hz - H * 0.22, 0, hz + H * 0.16);
  hg.addColorStop(0, `rgba(${C3},0)`);
  hg.addColorStop(.62, `rgba(${C3},.2)`);
  hg.addColorStop(1, `rgba(${C3},0)`);
  g.fillStyle = hg;
  g.fillRect(0, hz - H * 0.22, W, H * 0.38);

  starField(g, hz);
  floorGrid(g);
  wireCity(g);
  streaks(g);
  edgeBleed(g);
  dust(g);

  grain(g, W, H, 16);

  const vg = g.createRadialGradient(W / 2, H * 0.5, S * 0.1, W / 2, H * 0.5, S * 1.05);
  vg.addColorStop(0, 'rgba(0,0,0,0)');
  vg.addColorStop(1, 'rgba(0,0,0,.6)');
  g.fillStyle = vg;
  g.fillRect(0, 0, W, H);
  blotch(g);

  bakeWindows();
}

// 창만 따로 한 장에 굽는다. 끄는 건 그 자리를 지우는 것이다.
// 먼 건물부터 그리되, 건물 실루엣으로 뒤쪽을 먼저 지워 가림을 만든다.
function bakeWindows() {
  winCv = document.createElement('canvas');
  winCv.width = bed.width;
  winCv.height = bed.height;
  const g = winCv.getContext('2d');
  g.scale(DPR, DPR);

  WINS = [];
  for (const c of CITY) {
    g.globalCompositeOperation = 'destination-out';
    g.fillStyle = '#000';
    for (const f of c.sil) { poly(g, f); g.fill(); }
    if (!c.wins.length) continue;
    g.globalCompositeOperation = 'source-over';
    g.fillStyle = `rgba(${c.rgb},${c.wa.toFixed(3)})`;
    g.beginPath();
    for (const q of c.wins) {
      g.moveTo(q[0][0], q[0][1]);
      for (let i = 1; i < 4; i++) g.lineTo(q[i][0], q[i][1]);
      g.closePath();
    }
    g.fill();
    WINS.push(c);
  }
  g.globalCompositeOperation = 'source-over';

  // 한 채가 통째로 꺼진다. 창 하나씩 빠지면 흩어지는 걸로 보이지, 누가 불을 끈 걸로 안 보인다.
  const r = seeded(0x77314d);
  for (const c of WINS) c.off = 212 + Math.pow(r(), 1.9) * 290;
  WINS.sort((a, b) => a.off - b.off);
  winIdx = 0;
  catchUpWindows();
}

// 이미 지난 시각 몫은 한 번에 꺼 둔다 (창 크기가 바뀌어 다시 구웠을 때)
function catchUpWindows() {
  if (!winCv) return;
  const g = winCv.getContext('2d');
  g.save();
  g.setTransform(DPR, 0, 0, DPR, 0, 0);
  g.globalCompositeOperation = 'destination-out';
  g.fillStyle = '#000';
  g.strokeStyle = '#000';
  g.lineWidth = 1.2;
  let n = 0;
  while (winIdx < WINS.length && clk >= WINS[winIdx].off) {
    const c = WINS[winIdx++];
    g.beginPath();
    for (const q of c.wins) {
      g.moveTo(q[0][0], q[0][1]);
      for (let i = 1; i < 4; i++) g.lineTo(q[i][0], q[i][1]);
      g.closePath();
    }
    g.fill(); g.stroke();
    n++;
  }
  g.restore();
  return n;
}

// 세로로 흐른 자국 — 오래 켜 둔 화면에 남는 것
function streaks(g) {
  const r = seeded(0x51ea9);
  for (let i = 0; i < 30; i++) {
    const x = r() * W;
    const w = S * (0.004 + Math.pow(r(), 2.2) * 0.055);
    const up = r() > 0.42;
    const al = 0.025 + Math.pow(r(), 1.9) * 0.1;
    const col = up ? C2 : '4,10,13';
    const lg = g.createLinearGradient(x - w, 0, x + w, 0);
    lg.addColorStop(0, `rgba(${col},0)`);
    lg.addColorStop(.5, `rgba(${col},${al.toFixed(3)})`);
    lg.addColorStop(1, `rgba(${col},0)`);
    g.fillStyle = lg;
    const y0 = r() * H * 0.3, y1 = H - r() * H * 0.2;
    g.fillRect(x - w, y0, w * 2, y1 - y0);
  }
}

// 가장자리로 새는 색 — 오른쪽은 호박, 위는 청록
function edgeBleed(g) {
  const rg = g.createLinearGradient(W, 0, W - S * 0.55, 0);
  rg.addColorStop(0, `rgba(${AMB},.085)`);
  rg.addColorStop(1, `rgba(${AMB},0)`);
  g.fillStyle = rg;
  g.fillRect(W - S * 0.55, 0, S * 0.55, H);
  const tg = g.createLinearGradient(0, 0, 0, S * 0.34);
  tg.addColorStop(0, `rgba(${C1},.075)`);
  tg.addColorStop(1, `rgba(${C1},0)`);
  g.fillStyle = tg;
  g.fillRect(0, 0, W, S * 0.34);
}

// 먼지와 긴 흠집
function dust(g) {
  const r = seeded(0xd0571);
  for (let i = 0; i < 260; i++) {
    const x = r() * W, y = r() * H;
    const d = Math.max(1, S * (0.0005 + Math.pow(r(), 3.4) * 0.0045));
    g.fillStyle = `rgba(${r() > 0.78 ? AMB : C1},${(0.04 + r() * 0.22).toFixed(3)})`;
    g.fillRect(x, y, d, d);
  }
  g.lineWidth = 1;
  g.strokeStyle = `rgba(${C1},.1)`;
  g.beginPath(); g.moveTo(W * 0.16, -H * 0.06); g.lineTo(W * 0.94, H * 0.8); g.stroke();
  g.strokeStyle = `rgba(${C1},.05)`;
  g.beginPath(); g.moveTo(W * 0.58, -H * 0.03); g.lineTo(W * 1.04, H * 0.5); g.stroke();
  g.strokeStyle = `rgba(${AMB},.05)`;
  g.beginPath(); g.moveTo(-W * 0.02, H * 0.42); g.lineTo(W * 0.46, H * 1.04); g.stroke();
}

// 고르지 않은 얼룩 — 깨끗한 둥근 그늘만 있으면 새것처럼 보인다
function blotch(g) {
  const r = seeded(0xb107c);
  for (let i = 0; i < 7; i++) {
    const x = r() * W, y = r() * H, rad = S * (0.18 + r() * 0.42);
    const bg = g.createRadialGradient(x, y, 0, x, y, rad);
    bg.addColorStop(0, `rgba(0,0,0,${(0.08 + r() * 0.16).toFixed(3)})`);
    bg.addColorStop(1, 'rgba(0,0,0,0)');
    g.fillStyle = bg;
    g.fillRect(x - rad, y - rad, rad * 2, rad * 2);
  }
}

// ── sound ──────────────────────────────────────────────────────────────────
// A room at three in the morning: mains hum, and the thin coil whine a cheap
// charger makes, which gets quieter the fuller the battery gets.
const sound = (() => {
  let ac = null, on = true, master, humg, coilg, coilo, coilo2, noiseg;

  function build() {
    ac = new (window.AudioContext || window.webkitAudioContext)();
    master = ac.createGain();
    master.gain.value = 0.9;
    const comp = ac.createDynamicsCompressor();
    master.connect(comp).connect(ac.destination);

    humg = ac.createGain(); humg.gain.value = 0.045;
    const hlp = ac.createBiquadFilter();
    hlp.type = 'lowpass'; hlp.frequency.value = 210;
    humg.connect(hlp).connect(master);
    for (const f of [52, 78.4, 104]) {
      const o = ac.createOscillator();
      o.type = 'triangle'; o.frequency.value = f;
      const g = ac.createGain(); g.gain.value = f === 52 ? 1 : 0.4;
      o.connect(g).connect(humg); o.start();
    }

    // brown noise, the air in a closed room
    const len = ac.sampleRate * 2;
    const buf = ac.createBuffer(1, len, ac.sampleRate);
    const d = buf.getChannelData(0);
    let last = 0;
    for (let i = 0; i < len; i++) {
      last = (last + (Math.random() * 2 - 1) * 0.02) / 1.02;
      d[i] = last * 3.2;
    }
    const src = ac.createBufferSource();
    src.buffer = buf; src.loop = true;
    const nlp = ac.createBiquadFilter();
    nlp.type = 'lowpass'; nlp.frequency.value = 340;
    noiseg = ac.createGain(); noiseg.gain.value = 0.05;
    src.connect(nlp).connect(noiseg).connect(master);
    src.start();

    coilg = ac.createGain(); coilg.gain.value = 0;
    const cf = ac.createBiquadFilter();
    cf.type = 'bandpass'; cf.frequency.value = 2400; cf.Q.value = 6;
    coilg.connect(cf).connect(master);
    coilo = ac.createOscillator(); coilo.type = 'sine'; coilo.frequency.value = 2380;
    coilo2 = ac.createOscillator(); coilo2.type = 'sine'; coilo2.frequency.value = 2397;
    const cg2 = ac.createGain(); cg2.gain.value = 0.5;
    coilo.connect(coilg); coilo2.connect(cg2).connect(coilg);
    coilo.start(); coilo2.start();
  }

  function ping(up) {
    if (!ac || !on) return;
    const n = ac.currentTime;
    const parts = up ? [[784, .16], [1176, .09]] : [[196, .2], [128, .12]];
    for (const [f, v] of parts) {
      const o = ac.createOscillator();
      o.type = up ? 'sine' : 'triangle';
      o.frequency.setValueAtTime(f, n);
      if (!up) o.frequency.exponentialRampToValueAtTime(f * 0.6, n + 0.18);
      const g = ac.createGain();
      g.gain.setValueAtTime(0, n);
      g.gain.linearRampToValueAtTime(v, n + 0.008);
      g.gain.exponentialRampToValueAtTime(0.0001, n + (up ? 0.5 : 0.24));
      o.connect(g).connect(master);
      o.start(n); o.stop(n + 0.6);
    }
  }

  return {
    live: () => !!ac && on && ac.state === 'running',
    toggle() {
      if (!ac) { build(); on = true; return true; }
      on = !on;
      master.gain.setTargetAtTime(on ? 0.9 : 0, ac.currentTime, 0.1);
      if (on) ac.resume();
      return on;
    },
    kick() { if (!ac) build(); else if (ac.state === 'suspended') ac.resume(); },
    ping,
    set(charging, level, bright, load) {
      if (!ac || !on) return;
      const n = ac.currentTime;
      // the whine thins out as the cell fills — that is how you hear it finish
      coilg.gain.setTargetAtTime(charging ? 0.014 * (0.25 + 0.75 * (1 - level)) : 0, n, 0.25);
      coilo.frequency.setTargetAtTime(2290 + level * 260 + Math.sin(t * 2.3) * 14, n, 0.3);
      // 웅웅거림은 그 시각 전국이 쓰는 전기를 따라간다. 네 시에 제일 얇다.
      humg.gain.setTargetAtTime(0.018 + load * 0.04 + bright * 0.008, n, 0.6);
    },
  };
})();
// ── drawing ────────────────────────────────────────────────────────────────
function rrect(g, x, y, w, h, r) {
  g.beginPath();
  g.moveTo(x + r, y);
  g.arcTo(x + w, y, x + w, y + h, r);
  g.arcTo(x + w, y + h, x, y + h, r);
  g.arcTo(x, y + h, x, y, r);
  g.arcTo(x, y, x + w, y, r);
  g.closePath();
}

// 아이폰 모서리는 원호가 아니라 이어지는 곡선이다. 베지어로 흉내 낸다.
function squircle(g, x, y, w, h, r) {
  const k = Math.min(r * 1.3, w / 2, h / 2), c = k * 0.28;
  const x1 = x + w, y1 = y + h;
  g.beginPath();
  g.moveTo(x + k, y);
  g.lineTo(x1 - k, y);
  g.bezierCurveTo(x1 - c, y, x1, y + c, x1, y + k);
  g.lineTo(x1, y1 - k);
  g.bezierCurveTo(x1, y1 - c, x1 - c, y1, x1 - k, y1);
  g.lineTo(x + k, y1);
  g.bezierCurveTo(x + c, y1, x, y1 - c, x, y1 - k);
  g.lineTo(x, y + k);
  g.bezierCurveTo(x, y + c, x + c, y, x + k, y);
  g.closePath();
}

function drawGlow(g) {
  const r = S * (0.40 + bri * 0.34);
  const gd = g.createRadialGradient(PH.x, PH.y, 0, PH.x, PH.y, r);
  gd.addColorStop(0, `rgba(${LIME},${bri * 0.17})`);
  gd.addColorStop(.34, `rgba(${GRN},${bri * 0.08})`);
  gd.addColorStop(.66, `rgba(${C3},${bri * 0.09})`);
  gd.addColorStop(1, 'rgba(0,0,0,0)');
  g.globalCompositeOperation = 'lighter';
  g.fillStyle = gd;
  g.fillRect(PH.x - r, PH.y - r, r * 2, r * 2);
  g.globalCompositeOperation = 'source-over';
}

function portPos() { return toW(0, PH.h / 2 + S * 0.006); }

// ── USB-C ──────────────────────────────────────────────────────────────────
// 실물 치수대로 — 금속 쉘 8.3 x 2.4 mm, 하우징은 그보다 조금 넓고 두 배쯤 길다.
// 위에서 내려다보는 그림이라 금속은 폭이 넓고 길이는 짧은 토막으로 보인다.
function plugGeo() {
  const pw = PH.w * 0.12;              // 단자 구멍 너비
  return {
    mW: pw * 0.965, mL: pw * 0.76,     // 금속 쉘 8.3 x 6.5 mm
    hW: pw * 1.16,  hL: pw * 2.05,     // 몰딩 하우징 10 x 18 mm
    sL: pw * 0.74,                     // 선이 빠져나오는 목
  };
}

// 플러그가 보는 쪽. 포트에 가까워질수록 포트 축으로 돌아선다 —
// 아무 각도로나 비스듬히 꽂히는 단자는 없다.
function plugAngle(mx, my) {
  const free = Math.atan2(tip.y - my, tip.x - mx);
  const aim = ROT - Math.PI / 2;       // 아래 모서리에서 폰 안으로 들어가는 방향
  const [px, py] = portPos();
  const d = Math.hypot(tip.x - px, tip.y - py);
  const k = plug ? 1 : Math.pow(clamp(1 - d / (S * 0.3), 0, 1), 1.5);
  const df = Math.atan2(Math.sin(aim - free), Math.cos(aim - free));
  return free + df * k;
}

function drawCable(g) {
  const G = plugGeo();
  const ax = W + S * 0.08, ay = H + S * 0.1;
  const d = Math.hypot(tip.x - ax, tip.y - ay);
  const sag = clamp((S * 1.3 - d) * 0.42, 0, S * 0.3);
  const mx = (ax + tip.x) / 2, my = (ay + tip.y) / 2 + sag;
  const ang = plugAngle(mx, my);
  const ca = Math.cos(ang), sa = Math.sin(ang);

  const ins = plug ? G.mL * 0.8 : 0;
  const tx = tip.x + ca * ins, ty = tip.y + sa * ins;
  const tot = G.mL + G.hL + G.sL;
  const bx = tx - ca * tot, by = ty - sa * tot;
  const c2x = bx - ca * S * 0.07, c2y = by - sa * S * 0.07;

  // 선 하나. 굵은 어두운 심 위에 라임 한 줄.
  g.lineCap = 'round'; g.lineJoin = 'round';
  g.beginPath();
  g.moveTo(ax, ay);
  g.bezierCurveTo(mx, my, c2x, c2y, bx, by);
  g.strokeStyle = 'rgba(8,6,12,.9)';
  g.lineWidth = S * 0.011;
  g.stroke();
  g.shadowColor = `rgba(${LIME},.4)`;
  g.shadowBlur = S * 0.01;
  g.strokeStyle = `rgba(${LIME},${(0.45 + bri * 0.35).toFixed(3)})`;
  g.lineWidth = Math.max(1, S * 0.002);
  g.stroke();
  g.shadowBlur = 0;

  g.save();
  g.translate(tx, ty);
  g.rotate(ang);

  const n0 = -(G.mL + G.hL), n1 = n0 - G.sL;
  const lit = plug ? 0.9 : 0.6 + 0.25 * (0.5 + 0.5 * Math.sin(t * 2.4));

  // 목
  g.beginPath();
  g.moveTo(n0, -G.hW * 0.4); g.lineTo(n1, -S * 0.004);
  g.lineTo(n1, S * 0.004);   g.lineTo(n0, G.hW * 0.4);
  g.closePath();
  g.fillStyle = 'rgba(8,6,12,.9)'; g.fill();
  g.strokeStyle = `rgba(${LIME},${(lit * 0.4).toFixed(3)})`;
  g.lineWidth = 1; g.stroke();

  // 하우징 — 테두리와 가로획 두 줄
  rrect(g, n0, -G.hW / 2, G.hL, G.hW, G.hW * 0.2);
  g.fillStyle = 'rgba(8,6,12,.9)'; g.fill();
  g.strokeStyle = `rgba(${LIME},${(lit * 0.6).toFixed(3)})`;
  g.lineWidth = Math.max(1, S * 0.0014); g.stroke();
  for (let i = 1; i <= 2; i++) {
    const x = n0 + (G.hL * i) / 3;
    g.beginPath(); g.moveTo(x, -G.hW / 2); g.lineTo(x, G.hW / 2);
    g.strokeStyle = `rgba(${LIME},${(lit * 0.25).toFixed(3)})`;
    g.lineWidth = 1; g.stroke();
  }

  // 금속 쉘 — 가운데 이음선 하나
  rrect(g, -G.mL, -G.mW / 2, G.mL, G.mW, G.mW * 0.1);
  g.fillStyle = 'rgba(8,6,12,.9)'; g.fill();
  g.shadowColor = `rgba(${GRN},${(lit * 0.6).toFixed(3)})`;
  g.shadowBlur = S * 0.008;
  g.strokeStyle = `rgba(${GRN},${lit.toFixed(3)})`;
  g.lineWidth = Math.max(1, S * 0.0016); g.stroke();
  g.shadowBlur = 0;
  g.beginPath();
  g.moveTo(-G.mL * 0.88, 0); g.lineTo(-G.mL * 0.08, 0);
  g.strokeStyle = `rgba(${GRN},${(lit * 0.45).toFixed(3)})`;
  g.lineWidth = 1; g.stroke();

  // 아직 안 꽂혔으면 끝에서 고리가 퍼진다. 집어서 끌라는 뜻이다.
  if (!plug) {
    for (let k = 0; k < 2; k++) {
      const v = ((t * 0.85) + k * 0.5) % 1;
      g.beginPath();
      g.arc(0, 0, G.mW * (0.5 + v * 2.8), 0, TAU);
      g.strokeStyle = `rgba(${PNK},${((1 - v) * 0.5).toFixed(3)})`;
      g.lineWidth = Math.max(1, S * 0.0016);
      g.stroke();
    }
  }

  g.restore();
}

const two = n => String(n | 0).padStart(2, '0');

// drawn rather than typed: the emoji bolt comes back in colour on most systems
function bolt(g, x, y, h, a, rgb) {
  g.save();
  g.translate(x, y);
  g.beginPath();
  g.moveTo(h * 0.14, -h * 0.5);
  g.lineTo(-h * 0.22, h * 0.06);
  g.lineTo(-h * 0.02, h * 0.06);
  g.lineTo(-h * 0.14, h * 0.5);
  g.lineTo(h * 0.24, -h * 0.08);
  g.lineTo(h * 0.03, -h * 0.08);
  g.closePath();
  g.fillStyle = `rgba(${rgb || LIME},${a})`;
  g.fill();
  g.restore();
}

// 자간. 캔버스가 letterSpacing 을 모르면 그냥 넘어간다.
function track(g, px) {
  if ('letterSpacing' in g) g.letterSpacing = px ? px.toFixed(2) + 'px' : '0px';
}

// 화면에 가로줄이 깔리고, 밝은 띠 하나가 천천히 내려간다
function scanlines(g, sw, sh) {
  const step = Math.max(2, sh * 0.0075);
  g.fillStyle = `rgba(0,0,0,${0.12 + bri * 0.14})`;
  for (let y = -sh / 2; y < sh / 2; y += step) g.fillRect(-sw / 2, y, sw, step * 0.42);
  const by = -sh / 2 + ((t * 0.09) % 1) * sh;
  const bg = g.createLinearGradient(0, by - sh * 0.1, 0, by + sh * 0.1);
  bg.addColorStop(0, `rgba(${LIME},0)`);
  bg.addColorStop(.5, `rgba(${LIME},${bri * 0.05})`);
  bg.addColorStop(1, `rgba(${LIME},0)`);
  g.fillStyle = bg;
  g.fillRect(-sw / 2, by - sh * 0.1, sw, sh * 0.2);
}

// ── 화면 ───────────────────────────────────────────────────────────────────
// 폰도 선으로만 서 있다. 화면 안도 격자 위에 글자가 얹힌 꼴이다.
function islandBox(sw, sh) {
  const w = sw * 0.318, h = sw * 0.094;
  return { x: -w / 2, y: -sh / 2 + sh * 0.0138, w, h };
}

function drawIsland(g, sw, sh) {
  const b = islandBox(sw, sh);
  rrect(g, b.x, b.y, b.w, b.h, b.h / 2);
  g.fillStyle = 'rgba(6,5,10,.92)'; g.fill();
  g.strokeStyle = `rgba(${LIME},${(0.2 + bri * 0.3).toFixed(3)})`;
  g.lineWidth = 1; g.stroke();
  const r = b.h * 0.22, cx = b.x + b.w - b.h * 0.5, cy = b.y + b.h / 2;
  g.beginPath(); g.arc(cx, cy, r, 0, TAU);
  g.strokeStyle = `rgba(${GRN},${(0.3 + bri * 0.4).toFixed(3)})`; g.stroke();
}

function drawStatusBar(g, sw, sh) {
  const b = islandBox(sw, sh);
  const cy = b.y + b.h / 2, a = 0.35 + bri * 0.55;
  const fg = `rgba(${LIME},${a.toFixed(3)})`;

  g.textAlign = 'center'; g.textBaseline = 'middle';
  g.font = `400 ${(sw * 0.082) | 0}px VT323, monospace`;
  g.fillStyle = fg;
  g.fillText(`${two(clk / 60)}:${two(clk % 60)}`, (b.x - sw * 0.5) / 2, cy + sw * 0.004);

  let x = sw * 0.5 - sw * 0.062;

  // 배터리 — 테두리와 채움
  const bw = sw * 0.083, bh = sw * 0.04, lw = Math.max(1, sw * 0.0038);
  rrect(g, x - bw, cy - bh / 2, bw, bh, bh * 0.3);
  g.strokeStyle = fg; g.lineWidth = lw; g.stroke();
  g.beginPath();
  g.moveTo(x + lw, cy - bh * 0.13);
  g.lineTo(x + bh * 0.16, cy - bh * 0.13);
  g.lineTo(x + bh * 0.16, cy + bh * 0.13);
  g.lineTo(x + lw, cy + bh * 0.13);
  g.strokeStyle = `rgba(${LIME},${(a * 0.7).toFixed(3)})`; g.stroke();

  const ip = lw * 1.6, iw = (bw - ip * 2) * clamp(chg, 0.03, 1);
  g.fillStyle = plug && !slept ? `rgba(${GRN},${a})` : `rgba(${LIME},${a * 0.7})`;
  g.fillRect(x - bw + ip, cy - bh / 2 + ip, iw, bh - ip * 2);
  if (plug && !slept) bolt(g, x - bw / 2, cy, bh * 0.92, a, '10,20,8');

  // 와이파이
  x -= bw + sw * 0.028;
  const wr = sw * 0.027;
  g.strokeStyle = fg; g.lineWidth = Math.max(1, sw * 0.005);
  g.lineCap = 'round';
  for (let i = 2; i >= 1; i--) {
    g.beginPath();
    g.arc(x - wr, cy + wr * 0.52, wr * (i * 0.44 + 0.12), -Math.PI * 0.76, -Math.PI * 0.24);
    g.stroke();
  }
  g.beginPath();
  g.arc(x - wr, cy + wr * 0.46, wr * 0.1, 0, TAU);
  g.fillStyle = fg; g.fill();

  // 신호 막대 — 테두리만
  x -= wr * 2 + sw * 0.026;
  const sg = sw * 0.0105, sbw = sw * 0.0124, sh4 = sw * 0.038;
  for (let i = 0; i < 4; i++) {
    const hgt = sh4 * (0.34 + i * 0.22);
    const bx = x - (4 - i) * (sbw + sg) + sg;
    if (i < 3) {
      g.fillStyle = fg;
      g.fillRect(bx, cy + sh4 / 2 - hgt, sbw, hgt);
    } else {
      g.strokeStyle = `rgba(${LIME},${(a * 0.4).toFixed(3)})`;
      g.lineWidth = 1;
      g.strokeRect(bx + 0.5, cy + sh4 / 2 - hgt + 0.5, sbw - 1, hgt - 1);
    }
  }
}

function drawHomeBar(g, sw, sh) {
  const w = sw * 0.355, h = Math.max(2, sw * 0.0105);
  g.fillStyle = `rgba(${LIME},${0.2 + bri * 0.4})`;
  g.fillRect(-w / 2, sh / 2 - h * 2.6, w, h);
}

function drawScreen(g) {
  const sw = SCR.w, sh = SCR.h;
  g.save();
  squircle(g, -sw / 2, -sh / 2, sw, sh, SCR.r);
  g.clip();

  g.fillStyle = 'rgba(8,6,13,.9)';
  g.fillRect(-sw / 2, -sh / 2, sw, sh);
  const bg = g.createLinearGradient(0, -sh / 2, 0, sh / 2);
  bg.addColorStop(0, `rgba(26,48,22,${bri * 0.6})`);
  bg.addColorStop(1, `rgba(10,30,26,${bri * 0.5})`);
  g.fillStyle = bg;
  g.fillRect(-sw / 2, -sh / 2, sw, sh);

  // 화면 안에도 격자가 깔린다
  const gs = sw * 0.082;
  g.strokeStyle = `rgba(${LIME},${(0.04 + bri * 0.05).toFixed(3)})`;
  g.lineWidth = 1;
  for (let x = -sw / 2; x <= sw / 2; x += gs) {
    g.beginPath(); g.moveTo(x, -sh / 2); g.lineTo(x, sh / 2); g.stroke();
  }
  for (let y = -sh / 2; y <= sh / 2; y += gs) {
    g.beginPath(); g.moveTo(-sw / 2, y); g.lineTo(sw / 2, y); g.stroke();
  }

  g.textAlign = 'center'; g.textBaseline = 'middle';

  if (slept) {
    g.fillStyle = `rgba(${LIME},.26)`;
    g.font = `400 ${(sw * 0.15) | 0}px VT323, monospace`;
    g.fillText('100%', 0, sh * 0.02);
    bolt(g, 0, -sh * 0.08, sw * 0.14, 0.2, LIME);
    g.restore();
    return;
  }

  drawStatusBar(g, sw, sh);
  drawIsland(g, sw, sh);
  drawHomeBar(g, sw, sh);
  g.textAlign = 'center'; g.textBaseline = 'middle';

  // the word is the battery. It fills from the bottom up.
  const word = !plug && chg < 0.99 ? (chg < 0.05 ? 'DEPLETED' : 'NO POWER')
    : chg >= 0.999 ? 'CHARGED' : 'CHARGING';

  // 글자 수로 크기를 잡으면 영문은 안 맞는다. 재서 맞춘다.
  const trk = 0.04;
  track(g, 100 * trk);
  g.font = `900 100px Orbitron, sans-serif`;
  const fs = Math.min(sh * 0.165, 100 * (sw * 0.82) / g.measureText(word).width) | 0;
  track(g, fs * trk);
  g.font = `900 ${fs}px Orbitron, sans-serif`;

  const cy = -sh * 0.05;
  const top = cy - fs * 0.52, bot = cy + fs * 0.48;
  const fy = bot - (bot - top) * chg;
  const ox = fs * trk * 0.5;   // letterSpacing 은 뒤쪽에만 붙어서 가운데가 밀린다

  // 아직 안 찬 쪽은 윤곽선만
  g.lineWidth = Math.max(1, fs * 0.022);
  g.strokeStyle = `rgba(${LIME},${0.14 + bri * 0.24})`;
  g.strokeText(word, -ox, cy);

  // 찬 쪽만 채운다
  g.save();
  g.beginPath();
  g.rect(-sw / 2, fy, sw, bot - fy + 2);
  g.clip();
  g.shadowColor = `rgba(${GRN},${bri * 0.7})`;
  g.shadowBlur = fs * 0.22;
  g.fillStyle = `rgba(${LIME},${bri * 0.95})`;
  g.fillText(word, -ox, cy);
  g.shadowBlur = 0;
  g.restore();
  track(g, 0);

  if (plug && chg < 0.999) {
    // 수면 — 베젤 앞에서 죽어야 글자에 그은 줄로 안 보인다
    const lg = g.createLinearGradient(-sw * 0.44, 0, sw * 0.44, 0);
    lg.addColorStop(0, `rgba(${GRN},0)`);
    lg.addColorStop(.5, `rgba(${MINT},${bri * 0.4})`);
    lg.addColorStop(1, `rgba(${GRN},0)`);
    g.fillStyle = lg;
    g.fillRect(-sw * 0.44, fy - 0.5, sw * 0.88, 1);
  }

  const pf = (sw * 0.36) | 0;
  const low = !plug && chg < 0.1;
  g.font = `400 ${pf}px VT323, monospace`;
  g.shadowColor = `rgba(${low ? RED : C1},${bri * 0.5})`;
  g.shadowBlur = pf * 0.16;
  g.fillStyle = `rgba(${low ? RED : WHT},${bri * 0.95})`;
  g.fillText(Math.round(chg * 100) + '%', 0, sh * 0.18);
  g.shadowBlur = 0;

  const rem = Math.max(1, Math.round((1 - chg) * 15));
  const cap = chg >= 0.999 ? 'NOTHING LEFT TO FILL'
    : plug ? `FULL IN ${rem} MIN`
    : 'NO SOURCE CONNECTED';
  track(g, sw * 0.014);
  g.font = `400 ${(sw * 0.075) | 0}px VT323, monospace`;
  g.fillStyle = `rgba(${MINT},${bri * 0.62})`;
  g.fillText(cap, 0, sh * 0.31);
  track(g, 0);

  scanlines(g, sw, sh);
  g.restore();
}

function drawPhone(g) {
  g.save();
  g.translate(PH.x, PH.y);
  g.rotate(ROT);

  const hw = PH.w / 2, hh = PH.h / 2;
  const lw = Math.max(1, S * 0.0022);

  // 옆 버튼 — 선으로만 그은 턱
  const bd = Math.max(1.5, PH.w * 0.014);
  const side = (y0, len, left) => {
    const x = left ? -hw - bd * 0.7 : hw - bd * 0.3;
    rrect(g, x, y0, bd, len, bd * 0.35);
    g.fillStyle = 'rgba(8,6,13,.9)'; g.fill();
    g.strokeStyle = `rgba(${LIME},${0.24 + bri * 0.26})`;
    g.lineWidth = 1; g.stroke();
  };
  side(-hh + PH.h * 0.152, PH.h * 0.040, true);
  side(-hh + PH.h * 0.222, PH.h * 0.060, true);
  side(-hh + PH.h * 0.298, PH.h * 0.060, true);
  side(-hh + PH.h * 0.226, PH.h * 0.104, false);

  // 몸체 — 채우지 않는다. 뒤의 격자가 비칠 만큼만 어둡게 깐다.
  squircle(g, -hw, -hh, PH.w, PH.h, PH.r);
  g.fillStyle = 'rgba(9,7,14,.74)';
  g.fill();

  squircle(g, -hw, -hh, PH.w, PH.h, PH.r);
  g.shadowColor = `rgba(${LIME},${0.08 + bri * 0.5})`;
  g.shadowBlur = S * 0.016;
  g.strokeStyle = `rgba(${LIME},${0.24 + bri * 0.62})`;
  g.lineWidth = Math.max(1.2, S * 0.0028);
  g.stroke();
  g.shadowBlur = 0;

  // 테두리 안쪽으로 한 줄 더 — 베젤이 선 두 개로 보이게
  const pad = (PH.w - SCR.w) / 2;
  squircle(g, -SCR.w / 2 - pad * 0.34, -SCR.h / 2 - pad * 0.34,
           SCR.w + pad * 0.68, SCR.h + pad * 0.68, SCR.r + pad * 0.34);
  g.strokeStyle = `rgba(${GRN},${0.22 + bri * 0.3})`;
  g.lineWidth = lw;
  g.stroke();

  // 모서리마다 꼭짓점을 찍는다
  g.fillStyle = `rgba(${MINT},${0.4 + bri * 0.4})`;
  for (const sx of [-1, 1]) for (const sy of [-1, 1]) {
    g.beginPath();
    g.arc(sx * (hw - PH.r * 0.3), sy * (hh - PH.r * 0.3), Math.max(1.2, S * 0.0022), 0, TAU);
    g.fill();
  }

  drawScreen(g);

  // 아래 단자 구멍 — 윤곽선만
  if (!plug) {
    const pw = PH.w * 0.12, ph = Math.max(2, PH.w * 0.026);
    const pu = 0.5 + 0.5 * Math.sin(t * 2.6);
    rrect(g, -pw / 2, hh - ph * 1.1, pw, ph, ph * 0.4);
    g.fillStyle = 'rgba(6,5,10,.9)'; g.fill();
    g.shadowColor = `rgba(${PNK},${(0.3 + pu * 0.5).toFixed(3)})`;
    g.shadowBlur = S * 0.012 * (0.4 + pu);
    g.strokeStyle = `rgba(${PNK},${(0.4 + pu * 0.5).toFixed(3)})`;
    g.lineWidth = Math.max(1, S * 0.0016); g.stroke();
    g.shadowBlur = 0;
  }

  g.restore();
}

function drawMurmurs(g) {
  if (!murs.length) return;
  g.textAlign = 'left'; g.textBaseline = 'middle';
  const fs = Math.max(22, S * 0.082);
  track(g, fs * 0.06);
  g.font = `400 ${fs | 0}px VT323, monospace`;
  const dim = slept ? 0.18 : 1;
  for (const m of murs) {
    const a = Math.sin(clamp(m.p, 0, 1) * Math.PI) * dim;
    if (a < 0.012) continue;
    g.fillStyle = `rgba(${m.c},${(a * 0.26).toFixed(3)})`;
    g.fillText(m.t, lerp(m.x0, m.x1, m.p), m.y);
  }
  track(g, 0);
}

// the other battery. No port, no cable, and the number only goes one way.
function drawMe(g) {
  const x = W * 0.07, y = H * 0.925, bw = S * 0.16, bh = Math.max(2, S * 0.012);
  const lit = 0.38 + (1 - me) * 0.4;   // it gets harder to ignore as it empties
  g.textAlign = 'left'; g.textBaseline = 'middle';
  // 위의 NATIONAL GRID LOAD 와 같은 짝 — 이름은 Orbitron, 숫자는 VT323
  const lf = (S * 0.024) | 0;
  const LBL = 'MY ENERGY';
  track(g, lf * 0.2);
  g.font = `500 ${(lf * 0.62) | 0}px Orbitron, sans-serif`;
  g.fillStyle = `rgba(${C2},${(lit * 0.78).toFixed(3)})`;
  g.fillText(LBL, x, y);
  const bx = x + g.measureText(LBL).width + S * 0.018;
  g.strokeStyle = `rgba(${C2},.25)`;
  g.lineWidth = 1;
  g.strokeRect(bx + 0.5, y - bh / 2 + 0.5, bw - 1, bh - 1);
  // 빠져나간 자리 — 처음 있던 데까지 흐리게 남긴다. 떨어지는 중인 게 보여야 한다.
  g.fillStyle = `rgba(${C3},${(lit * 0.45).toFixed(3)})`;
  g.fillRect(bx + bw * me, y - bh / 2, bw * (ME0 - me), bh);
  g.fillStyle = me < 0.12 ? `rgba(${RED},${0.6 + lit * 0.4})` : `rgba(${C1},${lit})`;
  g.fillRect(bx, y - bh / 2, bw * me, bh);
  const mx = (bx + bw * ME0) | 0;
  g.fillStyle = `rgba(${C2},${(lit * 0.5).toFixed(3)})`;
  g.fillRect(mx, y - bh * 1.1, 1, bh * 2.2);
  track(g, lf * 0.08);
  g.font = `400 ${(S * 0.023) | 0}px VT323, monospace`;
  g.fillStyle = `rgba(${me < 0.12 ? RED : WHT},${Math.min(1, lit + 0.18).toFixed(3)})`;
  g.fillText(Math.round(me * 100) + '%', bx + bw + S * 0.016, y);
  track(g, 0);
}

// ── 하루 ───────────────────────────────────────────────────────────────────
// 저녁 여섯 시부터 아침 아홉 시까지의 전국 전력수요. 선이 내려와서 네 시에
// 제일 낮아진다. 점 하나가 지금 몇 시인지 짚고 있다.
function curveBox() {
  // 케이블이 오른쪽 아래를 지나가니 왼쪽에 둔다
  return { x: W * 0.07, y: H * 0.845, w: Math.min(W * 0.4, S * 0.44), h: S * 0.08 };
}

function curveXY(b, m) {
  const u = clamp(((m / 60 + 24) % 24 - WIN_A + 24) % 24 / WIN_H, 0, 1);
  const k = Math.min(WIN_H - 1, (u * WIN_H) | 0);
  const v = (DEM[(WIN_A + k) % 24] - DEM_LO) / (DEM_HI - DEM_LO);
  return [b.x + b.w * u, b.y - b.h * v];
}

// 시간당 평균이다. 사이를 이어 붙이면 없는 값을 지어내는 거라 계단으로 둔다.
function stepPts(b) {
  const pts = [];
  for (let k = 0; k < WIN_H; k++) {
    const v = (DEM[(WIN_A + k) % 24] - DEM_LO) / (DEM_HI - DEM_LO);
    const y = b.y - b.h * v;
    pts.push([b.x + b.w * k / WIN_H, y], [b.x + b.w * (k + 1) / WIN_H, y]);
  }
  return pts;
}

const TICKS = [18, 21, 0, 3, 6, 9];
const CALL = [[19, 1], [4, -1]];   // 꼭대기는 선 아래, 바닥은 선 위

function drawCurve(g) {
  const b = curveBox();
  const a = slept ? 0.3 : 1;
  const px = curveXY(b, clk)[0];

  // 가로 점선 격자 — 값이 어디쯤인지 눈이 재게 한다
  g.save();
  g.setLineDash([1, Math.max(3, S * 0.0055)]);
  g.lineWidth = 1;
  g.strokeStyle = `rgba(${C3},${(a * 0.75).toFixed(3)})`;
  for (let i = 1; i <= 4; i++) {
    const y = (b.y - b.h * i / 4) | 0;
    g.beginPath(); g.moveTo(b.x, y + 0.5); g.lineTo(b.x + b.w, y + 0.5); g.stroke();
  }
  g.restore();

  // 계단선 — 지나온 쪽만 밝다
  const pts = stepPts(b);
  for (let pass = 0; pass < 2; pass++) {
    g.save();
    g.beginPath();
    if (pass) g.rect(px, 0, W, H); else g.rect(0, 0, px, H);
    g.clip();
    g.beginPath();
    for (let i = 0; i < pts.length; i++) {
      if (i) g.lineTo(pts[i][0], pts[i][1]);
      else g.moveTo(pts[i][0], pts[i][1]);
    }
    g.strokeStyle = `rgba(${AMB},${(a * (pass ? 0.18 : 0.92)).toFixed(3)})`;
    g.lineWidth = Math.max(1, S * 0.0022);
    g.stroke();
    g.restore();
  }

  // 밑줄과 시각 눈금
  g.fillStyle = `rgba(${C3},${(a * 0.7).toFixed(3)})`;
  g.fillRect(b.x, b.y, b.w, Math.max(1, S * 0.0012));
  const tf = Math.max(9, S * 0.017);
  track(g, tf * 0.16);
  g.font = `400 ${tf | 0}px VT323, monospace`;
  g.textAlign = 'center'; g.textBaseline = 'top';
  g.fillStyle = `rgba(${C2},${(a * 0.46).toFixed(3)})`;
  for (const h of TICKS) {
    const u = ((h - WIN_A + 24) % 24) / WIN_H;
    g.fillText(two(h), b.x + b.w * u, b.y + tf * 0.6);
  }

  // 꼬리표 — 짧은 세로 막대로 선에 매단다
  const cf = Math.max(9, S * 0.016);
  track(g, cf * 0.1);
  g.font = `400 ${cf | 0}px VT323, monospace`;
  for (const [h, dir] of CALL) {
    const k = (h - WIN_A + 24) % 24;
    const v = (DEM[h] - DEM_LO) / (DEM_HI - DEM_LO);
    const x = ((b.x + b.w * (k + 0.5) / WIN_H) | 0) + 0.5;
    const y = b.y - b.h * v;
    const ly = y + dir * cf * 1.3;
    g.beginPath(); g.moveTo(x, y); g.lineTo(x, ly);
    g.strokeStyle = `rgba(${AMB},${(a * 0.5).toFixed(3)})`;
    g.lineWidth = 1; g.stroke();
    g.textBaseline = dir > 0 ? 'top' : 'bottom';
    g.fillStyle = `rgba(${AMB},${(a * 0.8).toFixed(3)})`;
    g.fillText(DEM[h].toLocaleString(), x, ly + dir * cf * 0.2);
  }

  // 지금
  const [dx, dy] = curveXY(b, clk);
  const r = Math.max(2, S * 0.0042);
  g.beginPath(); g.arc(dx, dy, r * 3.4, 0, TAU);
  g.fillStyle = `rgba(${AMB},${(a * 0.16).toFixed(3)})`; g.fill();
  g.beginPath(); g.arc(dx, dy, r, 0, TAU);
  g.fillStyle = `rgba(${WHT},${(a * 0.95).toFixed(3)})`; g.fill();

  // 숫자
  const nf = Math.max(11, S * 0.023);
  const y = b.y - b.h - nf * 1.4;
  g.textAlign = 'left'; g.textBaseline = 'middle';
  const LBL = 'NATIONAL GRID LOAD';
  track(g, nf * 0.2);
  g.font = `500 ${(nf * 0.62) | 0}px Orbitron, sans-serif`;
  g.fillStyle = `rgba(${C2},${(a * 0.6).toFixed(3)})`;
  g.fillText(LBL, b.x, y);
  const lw = g.measureText(LBL).width;
  track(g, nf * 0.08);
  g.font = `400 ${nf | 0}px VT323, monospace`;
  g.fillStyle = `rgba(${AMB},${(a * 0.9).toFixed(3)})`;
  g.fillText(Math.round(demandAt(clk)).toLocaleString() + ' MWh', b.x + lw + nf * 0.7, y);
  track(g, 0);
}

// 양 옆 눈금 — 왼쪽은 전력, 오른쪽은 배터리. 장식이 아니라 계기다.
function drawRails(g) {
  const n = 28, y0 = H * 0.2, y1 = H * 0.8;
  const bh = Math.max(2, S * 0.003);
  const dim = slept ? 0.35 : 1;
  const demU = (demandAt(clk) - DEM_LO) / (DEM_HI - DEM_LO);
  for (let side = 0; side < 2; side++) {
    const u = side ? chg : demU;
    const rgb = side ? C1 : AMB;
    for (let i = 0; i < n; i++) {
      const f = i / (n - 1);
      const y = lerp(y1, y0, f);
      const len = S * 0.016 * (1 + (i % 5 === 0 ? 1.1 : ((i * 7) % 4) * 0.28));
      const on = f <= u;
      g.fillStyle = `rgba(${rgb},${((on ? 0.8 : 0.16) * dim).toFixed(3)})`;
      g.fillRect(side ? W - S * 0.016 - len : S * 0.016, y, len, bh);
    }
  }
}

// 가로선 무리 — 충전이 올라가는 만큼 아래에서 위로 쌓인다
let rays = [];
function makeRays() {
  const r = seeded(0x5ea17);
  rays = [];
  for (let i = 0; i < 190; i++) {
    const y = r();
    const w = 0.05 + Math.pow(r(), 2.2) * 0.55;
    rays.push({ y, x: r() * (1 - w), w, a: 0.06 + Math.pow(r(), 1.6) * 0.4 });
  }
}
function drawRays(g) {
  if (!rays.length) makeRays();
  const dim = slept ? 0.22 : 1;
  const h = Math.max(1, S * 0.0014);
  for (const q of rays) {
    const v = clamp((chg - (1 - q.y)) * 5, 0, 1);
    if (v < 0.02) continue;
    g.fillStyle = `rgba(${AMB},${(q.a * v * dim * 0.55).toFixed(3)})`;
    g.fillRect(q.x * W, q.y * H, q.w * W, h);
  }
}

function draw() {
  ctx.setTransform(1, 0, 0, 1, 0, 0);
  ctx.clearRect(0, 0, cv.width, cv.height);
  if (bed) ctx.drawImage(bed, 0, 0);
  if (winCv) ctx.drawImage(winCv, 0, 0);
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  drawRays(ctx);
  drawGlow(ctx);
  drawMurmurs(ctx);
  drawCable(ctx);
  drawPhone(ctx);
  drawMe(ctx);
  drawCurve(ctx);
  drawRails(ctx);
  bloom(ctx);
  screenLines(ctx);
}

// ── 번짐 ───────────────────────────────────────────────────────────────────
// 밝은 데서 빛이 새 나오는 건 렌즈가 하는 일이다. 그래서 다 그린 다음에 한다.
// 작게 줄여서 흐리고, 다시 키워서 더한다. 옆으로 민 복사본 둘이 색을 번지게 한다.
let fx = null;
function makeFx() {
  fx = document.createElement('canvas');
  fx.width = Math.max(2, Math.round(cv.width * 0.24));
  fx.height = Math.max(2, Math.round(cv.height * 0.24));
}
function bloom(g) {
  if (!fx || fx.width !== Math.max(2, Math.round(cv.width * 0.24))) makeFx();
  const a = fx.getContext('2d');
  a.setTransform(1, 0, 0, 1, 0, 0);
  a.globalCompositeOperation = 'source-over';
  a.filter = 'none';
  a.clearRect(0, 0, fx.width, fx.height);
  a.filter = 'blur(2.6px)';
  a.drawImage(cv, 0, 0, fx.width, fx.height);
  a.filter = 'none';

  const d = Math.max(1, cv.width * 0.0022);
  g.save();
  g.setTransform(1, 0, 0, 1, 0, 0);
  g.globalCompositeOperation = 'lighter';
  g.imageSmoothingEnabled = true;
  g.globalAlpha = 0.4;
  g.drawImage(fx, 0, 0, cv.width, cv.height);
  g.globalAlpha = 0.14;
  g.drawImage(fx, d, 0, cv.width, cv.height);
  g.drawImage(fx, -d, d * 0.6, cv.width, cv.height);

  // 번지면 검정이 들린다. 다시 눌러야 깊이가 남는다.
  g.globalCompositeOperation = 'source-over';
  g.globalAlpha = 1;
  const cx = cv.width / 2, cy = cv.height * 0.5, rr = Math.min(cv.width, cv.height);
  const vg = g.createRadialGradient(cx, cy, rr * 0.12, cx, cy, rr * 1.0);
  vg.addColorStop(0, 'rgba(2,6,8,0)');
  vg.addColorStop(.55, 'rgba(2,6,8,.2)');
  vg.addColorStop(1, 'rgba(2,6,8,.72)');
  g.fillStyle = vg;
  g.fillRect(0, 0, cv.width, cv.height);
  g.restore();
}

// 화면 전체에 가로줄 — 폰 안에만 있으면 폰만 화면인 게 된다
let slPat = null;
function makeScanPat() {
  const h = Math.max(2, Math.round(DPR * 3));
  const c = document.createElement('canvas');
  c.width = 1; c.height = h;
  const q = c.getContext('2d');
  q.fillStyle = 'rgba(0,0,0,.2)';
  q.fillRect(0, 0, 1, Math.max(1, Math.round(h * 0.42)));
  slPat = ctx.createPattern(c, 'repeat');
}
function screenLines(g) {
  if (!slPat) makeScanPat();
  g.save();
  g.setTransform(1, 0, 0, 1, 0, 0);
  g.fillStyle = slPat;
  g.fillRect(0, 0, cv.width, cv.height);

  // 천천히 내려오는 띠 하나
  const by = ((t * 0.045) % 1) * (cv.height * 1.3) - cv.height * 0.15;
  const bh = cv.height * 0.22;
  const bg = g.createLinearGradient(0, by - bh, 0, by + bh);
  bg.addColorStop(0, `rgba(${C1},0)`);
  bg.addColorStop(.5, `rgba(${C1},.028)`);
  bg.addColorStop(1, `rgba(${C1},0)`);
  g.globalCompositeOperation = 'lighter';
  g.fillStyle = bg;
  g.fillRect(0, by - bh, cv.width, bh * 2);
  g.restore();
}

// ── step ───────────────────────────────────────────────────────────────────
function step(dt) {
  if (PREVIEW) return;
  t += dt;

  // 꽂으면 밤이 간다. 안 꽂으면 시계도 안 간다.
  if (plug && !slept) {
    clk = Math.min(clk + dt * RATE, 9 * 60);
    catchUpWindows();
  }

  if (plug) chg = clamp(0.08 + (clk - plugAt) / 15 * 0.92, 0, 1);
  else chg = clamp(chg - dt * 0.005, 0.02, 1);   // never a flat 0. 방전 has to stay readable

  // this one runs down either way. Being awake with the phone just costs more.
  const prev = me;
  me = clamp(me - dt * (plug ? 0.0082 : 0.0026), 0, 1);
  if (prev > 0 && me <= 0) sound.ping(false);

  done += ((chg >= 0.999 ? 1 : 0) - done) * (1 - Math.pow(0.78, dt));

  const want = slept ? 0.02 : plug ? 1 : 0.46;
  bri += (want - bri) * (1 - Math.pow(0.004, dt));

  while (nextMur < MURMURS.length && clk >= MURMURS[nextMur][0]) spawnMur(nextMur++);
  for (let i = murs.length - 1; i >= 0; i--) {
    murs[i].p += dt / murs[i].dur;
    if (murs[i].p >= 1) murs.splice(i, 1);
  }

  // 자야 하는 시각이 지나면, 끄는 법을 알려준다
  if (plug && !hint2) hintEl.classList.add('off');
  if (!hint2 && plug && !slept && chg >= 0.999) {
    hint2 = true;
    hintEl.textContent = '// TAP THE SCREEN TO TURN IT OFF';
    hintEl.classList.remove('off');
  }

  if (plug) {
    const [px, py] = portPos();
    tip.x = px; tip.y = py; tip.vx = tip.vy = 0;
  } else if (!dragging) {
    tip.vx += (rest.x - tip.x) * dt * 24;
    tip.vy += (rest.y - tip.y) * dt * 24;
    const k = Math.pow(0.0025, dt);
    tip.vx *= k; tip.vy *= k;
    tip.x += tip.vx * dt; tip.y += tip.vy * dt;
  }

  sound.set(plug && !slept, chg, bri, (demandAt(clk) - DEM_LO) / (DEM_HI - DEM_LO));
}

let last = performance.now();
function loop(now) {
  const dt = Math.min(0.05, (now - last) / 1000);
  last = now;
  step(dt);
  draw();
  requestAnimationFrame(loop);
}

// ── input ──────────────────────────────────────────────────────────────────
const hintEl = document.getElementById('hint');
function inPhone(x, y) {
  const dx = x - PH.x, dy = y - PH.y;
  const lx = dx * CS + dy * SN, ly = -dx * SN + dy * CS;
  return Math.abs(lx) < PH.w / 2 && Math.abs(ly) < PH.h / 2;
}

cv.addEventListener('pointerdown', e => {
  sound.kick();
  if (Math.hypot(e.clientX - tip.x, e.clientY - tip.y) < S * 0.08) {
    dragging = true;
    document.body.classList.add('grab');
    cv.setPointerCapture(e.pointerId);
  } else if (plug && inPhone(e.clientX, e.clientY)) {
    // 끌 수 있는데 안 끄는 것 — 그게 이 시간의 전부다
    slept = !slept;
    sound.ping(!slept);
    if (slept) hintEl.classList.add('off');
  }
});

cv.addEventListener('pointermove', e => {
  if (!dragging) return;
  tip.x = e.clientX; tip.y = e.clientY;
  const [px, py] = portPos();
  const d = Math.hypot(tip.x - px, tip.y - py);
  if (!plug && d < S * 0.055) {
    plug = true; idle = 0; plugAt = clk;
    sound.ping(true);
    hintEl.classList.add('off');
  } else if (plug && d > S * 0.095) {
    plug = false;
    sound.ping(false);
  }
});

const release = e => {
  if (!dragging) return;
  dragging = false;
  document.body.classList.remove('grab');
  tip.vx = tip.vy = 0;
};
cv.addEventListener('pointerup', release);
cv.addEventListener('pointercancel', release);

const sndEl = document.getElementById('snd');
sndEl.addEventListener('click', () => {
  sndEl.textContent = 'SOUND: ' + (sound.toggle() ? 'ON' : 'OFF');
});

// ── layout ─────────────────────────────────────────────────────────────────
function resize() {
  W = window.innerWidth; H = window.innerHeight; S = Math.min(W, H);
  cv.width = Math.round(W * DPR); cv.height = Math.round(H * DPR);
  fx = null; slPat = null;
  cv.style.width = W + 'px'; cv.style.height = H + 'px';

  // 아이폰 실측 비율 — 71.6 x 147.6 mm, 모서리 반지름 13.5 mm, 베젤 2.6 mm
  PH.h = Math.min(H * (PREVIEW ? 0.94 : 0.72), S * 0.98);
  PH.w = PH.h * 0.485;
  PH.r = PH.w * 0.135;
  PH.x = W * 0.5;
  PH.y = H * (PREVIEW ? 0.5 : 0.455);
  const pad = PH.w * 0.036;
  SCR.w = PH.w - pad * 2;
  SCR.h = PH.h - pad * 2;
  SCR.r = PH.r - pad;

  rest.x = W - S * 0.11; rest.y = H - S * 0.09;
  if (!plug && !dragging) { tip.x = rest.x; tip.y = rest.y; }

  bakeBed();
}
window.addEventListener('resize', resize);

// ── boot ───────────────────────────────────────────────────────────────────
(async () => {
  try {
    await Promise.all([
      // 한글 서브셋은 실제 글자를 넘겨야 받아온다
      document.fonts.load('900 60px Orbitron'),
      document.fonts.load('700 30px Orbitron'),
      document.fonts.load('400 30px VT323', '0123456789:%'),
    ]);
    await document.fonts.ready;
  } catch (e) { /* fall back to whatever is there */ }

  resize();

  if (PREVIEW) {
    plug = true; plugAt = T0; clk = 227; me = 0.19; bri = 1;
    chg = clamp(0.08 + (clk - plugAt) / 15 * 0.92, 0, 1);
    nextMur = 3;
    for (let i = 0; i < 3; i++) { spawnMur(i); murs[i].p = 0.62 - i * 0.16; }
    const [px, py] = portPos();
    tip.x = px; tip.y = py;
    draw();
    return;
  }

  sound.kick();
  setTimeout(() => hintEl.classList.add('off'), 14000);
  last = performance.now();
  requestAnimationFrame(loop);
})();
</script>
</body>
</html>
