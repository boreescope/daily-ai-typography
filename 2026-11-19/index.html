<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>포장지 — Wrapping</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Gaegu:wght@400;700&family=Noto+Sans+KR:wght@400;500;700&family=Metal+Mania&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 100%; height: 100%; overflow: hidden; }
  body {
    background: #e8dccb;
    color: #3a2f25;
    font-family: 'Noto Sans KR', sans-serif;
    user-select: none;
  }
  .home-btn, .snd {
    position: fixed; top: 18px; z-index: 20;
    padding: 7px 13px;
    background: rgba(255,250,240,.7);
    border: 1px solid rgba(80,60,40,.2);
    color: #7a6a58;
    font: 700 10px/1 'Space Mono', monospace;
    letter-spacing: .14em; text-decoration: none;
    cursor: pointer;
  }
  .home-btn { left: 18px; }
  .snd { right: 18px; }
  .home-btn:hover, .snd:hover { color: #3a2f25; }

  .wrap {
    display: grid;
    grid-template-columns: 250px 1fr 360px;
    grid-template-rows: 1fr 190px;
    height: 100vh;
  }

  /* left: paper rolls */
  .papers {
    grid-row: 1 / 3;
    padding: 70px 18px 20px 22px;
    background: #d9cab4;
    border-right: 1px solid rgba(80,60,40,.15);
    overflow-y: auto;
  }
  .label {
    font: 700 10px/1 'Space Mono', monospace;
    letter-spacing: .16em; color: #8b7864;
    margin-bottom: 12px;
  }
  .label b { font-family: 'Noto Sans KR'; letter-spacing: 0; font-size: 12px; color: #5a4a3a; margin-left: 6px; }
  .paper-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  .sw {
    cursor: pointer;
    border-radius: 4px;
    padding: 4px;
    transition: transform .15s ease-out, background .15s;
  }
  .sw i { display: block; height: 62px; border-radius: 3px; background-size: 150px; background-position: center;
    box-shadow: 0 2px 4px rgba(60,40,20,.25), inset -12px 0 0 rgba(0,0,0,.1), inset 0 10px 18px rgba(255,255,255,.12); }
  .sw span { display: block; font-size: 11px; margin-top: 5px; text-align: center; color: #5a4a3a; }
  .sw:hover { transform: translateY(-2px); }
  .sw.on { background: rgba(255,255,255,.55); }
  .sw.off { opacity: .35; pointer-events: none; }

  /* center: table */
  .stage {
    position: relative;
    background:
      radial-gradient(ellipse at 50% 40%, rgba(255,245,225,.55), transparent 65%),
      repeating-linear-gradient(90deg, #c49a6c 0 3px, #c8a072 3px 9px, #c19767 9px 14px);
    overflow: hidden;
  }
  .stage::after {
    content: ''; position: absolute; inset: 0;
    background: linear-gradient(180deg, rgba(0,0,0,.08), transparent 30%, transparent 75%, rgba(0,0,0,.12));
    pointer-events: none;
  }
  .note {
    position: absolute; top: 64px; left: 40px; z-index: 3;
    width: 250px; padding: 16px 18px 18px;
    background: #fffdf6;
    box-shadow: 0 6px 14px rgba(60,40,20,.22);
    transform: rotate(-2.5deg);
    font-family: 'Gaegu', cursive;
    transition: transform .5s ease-out, opacity .4s;
  }
  .note::before {
    content: ''; position: absolute; top: -9px; left: 50%; width: 70px; height: 20px;
    margin-left: -35px; background: rgba(240,220,160,.75); transform: rotate(3deg);
  }
  .note .no { font: 700 9px/1 'Space Mono', monospace; letter-spacing: .14em; color: #a08a72; }
  .note .item { font-size: 24px; font-weight: 700; margin: 8px 0 6px; color: #2e241b; }
  .note .meta { font: 400 10px/1.4 'Space Mono', 'Noto Sans KR', monospace; color: #a08a72; margin: -2px 0 8px; }
  .note .msg { font-size: 18px; line-height: 1.25; color: #5a4a3a; }
  .note.out { transform: translate(-40px, -20px) rotate(-8deg); opacity: 0; }

  .table-pkg {
    position: absolute; left: 50%; top: 52%;
    transform: translate(-50%, -50%);
    z-index: 2;
    filter: drop-shadow(0 14px 12px rgba(50,30,10,.28));
    transition: transform .55s cubic-bezier(.2,.8,.2,1), opacity .3s;
  }
  .table-pkg.enter { transform: translate(-160%, -50%) rotate(-6deg); opacity: 0; }
  .table-pkg svg { display: block; overflow: visible; }
  .table-pkg.sticking { cursor: crosshair; }

  .say {
    position: absolute; left: 50%; bottom: 34px; z-index: 4;
    transform: translate(-50%, 10px);
    padding: 10px 18px;
    background: #fffdf6; border-radius: 18px;
    font-family: 'Gaegu', cursive; font-size: 22px; color: #3a2f25;
    box-shadow: 0 4px 10px rgba(60,40,20,.2);
    opacity: 0; white-space: nowrap;
    transition: opacity .3s, transform .3s ease-out;
    pointer-events: none;
  }
  .say.show { opacity: 1; transform: translate(-50%, 0); }
  .say small { font-family: 'Noto Sans KR'; font-size: 11px; color: #9a866f; margin-left: 8px; }

  .hint {
    position: absolute; right: 26px; top: 66px; z-index: 3;
    font-size: 12px; color: rgba(60,40,20,.6); text-align: right; line-height: 1.6;
  }

  /* bottom: strings + stickers */
  .tools {
    display: grid; grid-template-columns: 1fr 1fr auto; gap: 22px;
    padding: 18px 24px 20px;
    background: #f3ebdf;
    border-top: 1px solid rgba(80,60,40,.15);
  }
  .row { display: flex; flex-wrap: wrap; gap: 8px; }
  .chip {
    cursor: pointer;
    display: flex; flex-direction: column; align-items: center; gap: 3px;
    width: 64px; padding: 6px 2px 5px;
    border-radius: 6px;
    transition: background .15s, transform .15s ease-out;
  }
  .chip svg { width: 46px; height: 34px; display: block; }
  .chip img { width: 38px; height: 38px; object-fit: contain; display: block; filter: drop-shadow(0 1px 1px rgba(60,40,20,.3)); }
  .chip span { font-size: 10px; color: #6a5a48; text-align: center; line-height: 1.2; }
  .chip:hover { transform: translateY(-2px); }
  .chip.on { background: rgba(200,170,130,.35); }
  .chip.off { opacity: .3; pointer-events: none; }
  .stk { width: 44px; padding: 4px 0; }
  .stk svg { width: 34px; height: 34px; }

  .done-col { display: flex; flex-direction: column; justify-content: center; gap: 8px; }
  .btn {
    cursor: pointer; border: 0;
    padding: 14px 22px;
    background: #3a2f25; color: #f7efe2;
    font: 700 14px/1 'Noto Sans KR', sans-serif;
    border-radius: 6px;
    transition: opacity .2s, transform .15s ease-out;
  }
  .btn:hover { transform: translateY(-1px); }
  .btn:disabled { opacity: .25; pointer-events: none; }
  .btn.ghost { background: transparent; color: #7a6a58; border: 1px solid rgba(80,60,40,.25); padding: 9px 14px; font-size: 12px; }

  /* right: pile */
  .pile {
    grid-row: 1 / 3; grid-column: 3;
    position: relative;
    background: linear-gradient(180deg, #e1d3bf, #d6c5ad);
    border-left: 1px solid rgba(80,60,40,.15);
    overflow: hidden;
  }
  .pile .label { position: absolute; top: 70px; left: 24px; }
  .pile .count { position: absolute; top: 88px; left: 24px; font: 700 44px/1 'Space Mono', monospace; color: #5a4a3a; }
  .floor { position: absolute; left: 0; right: 0; bottom: 0; height: 60px; background: #c7b294; border-top: 1px solid rgba(60,40,20,.2); }
  .stacked { position: absolute; transform-origin: 50% 100%; filter: drop-shadow(0 4px 3px rgba(50,30,10,.25)); }
  .stacked svg { display: block; width: 100%; height: 100%; overflow: visible; }
  .stacked:hover { z-index: 999 !important; }
  .tip {
    position: absolute; z-index: 1000; pointer-events: none;
    padding: 6px 10px; background: #fffdf6; border-radius: 10px;
    font-family: 'Gaegu', cursive; font-size: 17px; white-space: nowrap;
    box-shadow: 0 3px 8px rgba(60,40,20,.2);
    opacity: 0; transition: opacity .15s;
  }

  @keyframes wrapIn { from { transform: scaleY(0); } to { transform: scaleY(1); } }
  @keyframes bandV { from { transform: scaleY(0); } to { transform: scaleY(1); } }
  @keyframes bandH { from { transform: scaleX(0); } to { transform: scaleX(1); } }
  @keyframes pop { 0% { transform: scale(0); } 70% { transform: scale(1.18); } 100% { transform: scale(1); } }
  @keyframes jiggle { 0%,100% { transform: rotate(0); } 30% { transform: rotate(-2deg); } 60% { transform: rotate(1.5deg); } }
  .paper-in { transform-box: fill-box; transform-origin: 50% 100%; animation: wrapIn .55s cubic-bezier(.3,.7,.2,1) both; }
  .band-v { transform-box: fill-box; transform-origin: 50% 0; animation: bandV .35s ease-out both; }
  .band-h { transform-box: fill-box; transform-origin: 0 50%; animation: bandH .35s .15s ease-out both; }
  .bow { transform-box: fill-box; transform-origin: 50% 50%; animation: pop .4s .4s cubic-bezier(.3,1.4,.5,1) both; }
  .stk-in { transform-box: fill-box; transform-origin: 50% 50%; animation: pop .3s cubic-bezier(.3,1.5,.5,1) both; }
  .jig { animation: jiggle .4s ease-in-out; }
</style>
</head>
<body>
<a class="home-btn" href="../index.html">← INDEX</a>
<button class="snd" id="snd">SOUND ON</button>

<svg width="0" height="0" style="position:absolute">
  <defs id="defs"></defs>
</svg>

<div class="wrap">
  <aside class="papers">
    <div class="label">PAPER<b>포장지</b></div>
    <div class="paper-grid" id="papers"></div>
  </aside>

  <main class="stage" id="stage">
    <div class="note" id="note">
      <div class="no" id="noteNo">ORDER No.01</div>
      <div class="item" id="noteItem"></div>
      <div class="meta" id="noteMeta"></div>
      <div class="msg" id="noteMsg"></div>
    </div>
    <div class="hint" id="hint">왼쪽에서 포장지를 골라요</div>
    <div class="table-pkg enter" id="pkg"></div>
    <div class="say" id="say"></div>
  </main>

  <section class="tools">
    <div>
      <div class="label">STRING<b>끈 · 리본</b></div>
      <div class="row" id="strings"></div>
    </div>
    <div>
      <div class="label">STICKER<b>스티커 — 고르고 선물을 눌러 붙여요</b></div>
      <div class="row" id="stickers"></div>
    </div>
    <div class="done-col">
      <button class="btn" id="done" disabled>다 쌌어요 →</button>
      <button class="btn ghost" id="peel" disabled>스티커 떼기</button>
    </div>
  </section>

  <aside class="pile" id="pile">
    <div class="label">STACK<b>포장한 선물</b></div>
    <div class="count" id="count">0</div>
    <div class="floor"></div>
    <div class="tip" id="tip"></div>
  </aside>
</div>

<script>
const NS = 'http://www.w3.org/2000/svg';

const ITEMS = [
  { id: 'lp', name: 'IRON MOTH 3집 LP', short: '메탈 LP', w: 200, h: 224, tags: ['dark', 'rough'],
    meta: '1998 · 초판 500장 중 한 장',
    msg: '고등학교 때 형이랑 테이프가 늘어나도록 들은 앨범이에요. 형 생일이라 초판 LP를 겨우 구했어요. 재킷 모서리 닳은 건 원래 그래요.' },
  { id: 'plush', name: '털복숭이 원숭이 인형', short: '털 인형', w: 156, h: 208, tags: ['cute', 'colorful'],
    meta: '중고 · 오른쪽 귀 실밥 풀림',
    msg: '조카가 놀이공원에서 잃어버리고 사흘을 울었대요. 똑같은 걸 중고로 겨우 찾았어요. 귀 실밥 풀린 것까지 닮았어요. 무조건 귀엽게요!' },
  { id: 'candle', name: '무화과 향초', short: '향초', w: 140, h: 166, tags: ['natural', 'elegant'],
    meta: '제주 작은 공방 · 무화과와 시더',
    msg: '공방 사장님이 직접 부은 향초예요. 친구가 원목 가구 가득한 집으로 이사했어요. 새 집 첫 밤에 켜 달라고 할 거예요.' },
  { id: 'wine', name: '레드 와인 한 병', short: '와인', w: 66, h: 285, tags: ['elegant', 'classic'],
    meta: 'Rosso · 1996 빈티지',
    msg: '부모님이 결혼하신 해에 담근 와인이에요. 결혼 30주년이라 반년 동안 찾았어요. 점잖게 부탁드려요.' },
  { id: 'book', name: '오래된 시집', short: '시집', w: 150, h: 226, tags: ['retro', 'natural', 'classic'],
    meta: '1987 · 초판 · 헌책방에서',
    msg: '속표지에 누가 연필로 "봄에, 너에게"라고 써 놨어요. 그 한 줄 때문에 샀어요. 헌책방 하는 선배한테 드려요.' },
  { id: 'cactus', name: '손바닥 선인장', short: '선인장', w: 100, h: 198, tags: ['fun', 'natural'],
    meta: '이름은 버티기 · 물은 한 달에 한 번',
    msg: '퇴사하는 동기한테 줘요. 화분마다 다 죽이던 친구라 제일 튼튼한 걸로 골랐어요. 웃으면서 보내고 싶어요.' },
  { id: 'shoes', name: '한정판 운동화', short: '운동화', w: 260, h: 129, tags: ['fun', 'rough', 'colorful'],
    meta: '270 · 500켤레 중 001번',
    msg: '새벽 4시부터 줄 서서 샀어요. 남자친구가 한 달 내내 이 얘기만 했어요. 영수증은 상자 안에 넣어 뒀어요.' },
  { id: 'mug', name: '고양이 머그컵', short: '머그컵', w: 160, h: 138, tags: ['cute', 'fun'],
    meta: '도예 수업 첫 작품 · 손잡이 삐뚤',
    msg: '고양이 두 마리랑 사는 친구한테 줘요. 첫째 두부 얼굴을 그렸는데 좀 덜 닮았어요.' },
];

const PAPERS = [
  { id: 'black', name: '블랙 무지', tags: ['dark', 'elegant'] },
  { id: 'skull', name: '해골 무늬', tags: ['dark', 'fun', 'rough'] },
  { id: 'kraft', name: '크라프트지', tags: ['natural', 'rough', 'retro'] },
  { id: 'news', name: '신문지', tags: ['retro', 'rough', 'fun'] },
  { id: 'dots', name: '파스텔 땡땡이', tags: ['cute', 'colorful'] },
  { id: 'rainbow', name: '무지개 줄무늬', tags: ['colorful', 'fun'] },
  { id: 'floral', name: '작은 꽃무늬', tags: ['cute', 'natural'] },
  { id: 'tartan', name: '빨간 체크', tags: ['classic', 'retro'] },
  { id: 'stars', name: '남색 별무늬', tags: ['elegant', 'classic'] },
  { id: 'holo', name: '홀로그램', tags: ['fun', 'colorful'] },
];

const STRINGS = [
  { id: 'rope', name: '거친 검정 끈', tags: ['dark', 'rough'] },
  { id: 'chain', name: '은색 체인', tags: ['dark', 'rough', 'fun'] },
  { id: 'jute', name: '마끈', tags: ['natural', 'rough', 'retro'] },
  { id: 'satin', name: '빨간 새틴', tags: ['classic', 'elegant'] },
  { id: 'gold', name: '금색 끈', tags: ['elegant', 'classic'] },
  { id: 'pink', name: '분홍 큰 리본', tags: ['cute'] },
  { id: 'curly', name: '알록달록 컬링', tags: ['colorful', 'fun', 'cute'] },
];

const STICKERS = [
  { id: 'skull', tags: ['dark', 'fun'] }, { id: 'bolt', tags: ['dark', 'rough'] },
  { id: 'heart', tags: ['cute', 'classic'] }, { id: 'star', tags: ['colorful', 'fun'] },
  { id: 'berry', tags: ['cute', 'colorful'] }, { id: 'smile', tags: ['fun', 'cute'] },
  { id: 'daisy', tags: ['cute', 'natural'] }, { id: 'fragile', tags: ['rough', 'retro'] },
  { id: 'cherry', tags: ['cute', 'retro'] }, { id: 'paw', tags: ['cute'] },
  { id: 'spark', tags: ['elegant', 'colorful'] }, { id: 'leaf', tags: ['natural'] },
];

const IMG = 'img/';
const BANDS = { jute: [7, 585], rope: [12, 406], chain: [10, 595], satin: [16, 446], gold: [6, 992], pink: [22, 281], curly: [12, 452] };
const BOWS = { jute: [74, 360, 323, .42], rope: [80, 360, 295, .38], chain: [46, 223, 360, .6], satin: [100, 360, 301, .38],
  gold: [70, 360, 336, .4], pink: [112, 329, 360, .42], curly: [100, 331, 360, .5] };

const DEFS = `
<filter id="bsh" x="-20%" y="-30%" width="140%" height="170%"><feDropShadow dx="0" dy="1.5" stdDeviation="1.2" flood-color="#2a1a0a" flood-opacity=".35"/></filter>
<linearGradient id="shade" x1="0" y1="0" x2="1" y2="0">
  <stop offset="0" stop-color="#fff" stop-opacity=".16"/><stop offset=".45" stop-color="#fff" stop-opacity="0"/>
  <stop offset="1" stop-color="#000" stop-opacity=".22"/>
</linearGradient>
${PAPERS.map(p => `<pattern id="p-${p.id}" width="210" height="210" patternUnits="userSpaceOnUse"><image href="${IMG}paper-${p.id}.jpg" width="210" height="210"/></pattern>`).join('')}
${Object.entries(BANDS).map(([id, [t, w]]) => `<pattern id="b-${id}" width="${w * t / 48}" height="${t}" patternUnits="userSpaceOnUse"><image href="${IMG}band-${id}.png" width="${w * t / 48}" height="${t}" preserveAspectRatio="none"/></pattern>`).join('')}
`;
document.getElementById('defs').innerHTML = DEFS;
[...ITEMS.map(i => `item-${i.id}.png`), ...PAPERS.map(p => `paper-${p.id}.jpg`),
 ...STRINGS.flatMap(s => [`band-${s.id}.png`, `bow-${s.id}.png`]), ...STICKERS.map(s => `st-${s.id}.png`)]
  .forEach(f => { new Image().src = IMG + f; });

function itemArt(it, x, y) {
  return `<image href="${IMG}item-${it.id}.png" x="${x}" y="${y}" width="${it.w}" height="${it.h}" preserveAspectRatio="xMidYMid meet"/>`;
}

function band(id, x0, y0, len, horiz, off) {
  const t = BANDS[id][0];
  const tr = horiz ? `translate(${x0} ${y0 + off - t / 2})` : `translate(${x0 + off + t / 2} ${y0}) rotate(90)`;
  return `<g transform="${tr}"><rect width="${len}" height="${t}" fill="url(#b-${id})"/></g>`;
}

function ribbon(id, x, y, W, H, anim) {
  const cx = x + W * .5, cy = y + H * .42;
  const a = anim ? ['band-v', 'band-h', 'bow'] : ['', '', ''];
  const offs = id === 'jute' ? [-4, 4] : [0];
  const v = offs.map(o => band(id, cx, y - 2, H + 4, false, o)).join('');
  const h = offs.map(o => band(id, x - 2, cy, W + 4, true, o)).join('');
  const [bw0, sw, sh, ky] = BOWS[id];
  const bw = Math.min(bw0, W * 1.15), bh = bw * sh / sw;
  return `<g filter="url(#bsh)"><g class="${a[0]}">${v}</g><g class="${a[1]}">${h}</g></g>
    <g class="${a[2]}" filter="url(#bsh)"><image href="${IMG}bow-${id}.png" x="${cx - bw / 2}" y="${cy - bh * ky}" width="${bw}" height="${bh}"/></g>`;
}

const P = 46;
function stickerUse(s, anim) {
  const z = s.id === 'fragile' ? 66 : 44;
  return `<g transform="translate(${s.x} ${s.y}) rotate(${s.r})" data-i="${s.i}" style="cursor:pointer">
    <g class="${anim ? 'stk-in' : ''}"><image href="${IMG}st-${s.id}.png" x="${-z / 2}" y="${-z / 2}" width="${z}" height="${z}"/></g></g>`;
}

function pkgSVG(st, anim = {}) {
  const it = st.item, W = it.w + P * 2, H = it.h + P * 2;
  const x = P, y = P;
  let paper = '';
  if (st.paper) {
    const fill = `url(#p-${st.paper})`;
    paper = `<g class="${anim.paper ? 'paper-in' : ''}">
      <rect x="${x - 5}" y="${y - 5}" width="${it.w + 10}" height="${it.h + 10}" rx="3" fill="${fill}"/>
      <rect x="${x - 5}" y="${y - 5}" width="${it.w + 10}" height="${it.h + 10}" rx="3" fill="url(#shade)"/>
      <path d="M${x - 5} ${y + 9} H${x + it.w + 5}" stroke="#fff" stroke-opacity=".22" stroke-width="1.5"/>
      <path d="M${x - 5} ${y + it.h + 5} l14 -12 M${x + it.w + 5} ${y + it.h + 5} l-14 -12" stroke="#000" stroke-opacity=".18" stroke-width="1.2"/>
      <rect x="${x + it.w * .62}" y="${y + it.h - 4}" width="22" height="9" fill="#fff" opacity=".35" transform="rotate(-4 ${x + it.w * .62} ${y + it.h})"/>
    </g>`;
  }
  const rib = st.paper && st.string ? ribbon(st.string, x - 5, y - 5, it.w + 10, it.h + 10, anim.ribbon) : '';
  const stk = st.stickers.map((s, i) => stickerUse(s, anim.sticker === i)).join('');
  return `<svg width="${W}" height="${H}" viewBox="0 0 ${W} ${H}">
    <g opacity="${st.paper ? 1 : 1}">${st.paper && !anim.paper ? '' : itemArt(it, x, y)}</g>
    ${paper}${rib}${stk}</svg>`;
}

const $ = (id) => document.getElementById(id);
const pick = (a) => a[Math.floor(Math.random() * a.length)];
const shuffle = (a) => { a = a.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };
const josa = (w, a, b) => { const c = w.charCodeAt(w.length - 1); return c >= 0xac00 && c <= 0xd7a3 && (c - 0xac00) % 28 ? a : b; };

/* sound */
const sound = (() => {
  let ctx, master, noise, on = true;
  function init() {
    if (ctx) return;
    ctx = new (window.AudioContext || window.webkitAudioContext)();
    master = ctx.createGain(); master.gain.value = .8; master.connect(ctx.destination);
    noise = ctx.createBuffer(1, ctx.sampleRate, ctx.sampleRate);
    const d = noise.getChannelData(0);
    for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1;
  }
  function burst(t, dur, freq, q, vol, type = 'bandpass') {
    const s = ctx.createBufferSource(); s.buffer = noise;
    const f = ctx.createBiquadFilter(); f.type = type; f.frequency.value = freq; f.Q.value = q;
    const g = ctx.createGain();
    g.gain.setValueAtTime(0, t); g.gain.linearRampToValueAtTime(vol, t + .004);
    g.gain.exponentialRampToValueAtTime(.0001, t + dur);
    s.connect(f); f.connect(g); g.connect(master);
    s.start(t, Math.random() * .5); s.stop(t + dur + .02);
    return f;
  }
  function tone(t, f0, f1, dur, vol, type = 'sine') {
    const o = ctx.createOscillator(); o.type = type;
    o.frequency.setValueAtTime(f0, t); o.frequency.exponentialRampToValueAtTime(f1, t + dur);
    const g = ctx.createGain();
    g.gain.setValueAtTime(vol, t); g.gain.exponentialRampToValueAtTime(.0001, t + dur);
    o.connect(g); g.connect(master); o.start(t); o.stop(t + dur + .02);
  }
  const ok = () => ctx && on;
  return {
    init, toggle() { on = !on; return on; },
    crinkle() {
      if (!ok()) return; const t = ctx.currentTime;
      for (let i = 0; i < 22; i++) burst(t + Math.random() * .5, .015 + Math.random() * .04, 1800 + Math.random() * 5000, 1.2, .18 + Math.random() * .2);
    },
    zip() {
      if (!ok()) return; const t = ctx.currentTime;
      const f = burst(t, .32, 700, 3, .22);
      f.frequency.exponentialRampToValueAtTime(3200, t + .3);
      tone(t + .32, 300, 180, .12, .08, 'triangle');
    },
    pop() { if (!ok()) return; const t = ctx.currentTime; tone(t, 900, 260, .09, .16); burst(t, .03, 4000, 1, .08); },
    peel() { if (!ok()) return; const t = ctx.currentTime; burst(t, .18, 2500, .7, .12, 'highpass'); },
    thud() { if (!ok()) return; const t = ctx.currentTime; tone(t, 130, 55, .22, .4); burst(t, .12, 380, .8, .3, 'lowpass'); },
    chime() { if (!ok()) return; const t = ctx.currentTime; tone(t, 1046, 1040, .5, .07); tone(t + .1, 1568, 1560, .6, .06); },
  };
})();
addEventListener('pointerdown', () => sound.init(), { once: true });
$('snd').onclick = () => { sound.init(); $('snd').textContent = sound.toggle() ? 'SOUND ON' : 'SOUND OFF'; };

/* state */
let deck = [], orderNo = 0, st = null, stickerSel = null, busy = false, stickN = 0;
const stacks = [{ cx: 262, top: 0 }, { cx: 98, top: 0 }];
const S = .5;

function nextItem() {
  if (!deck.length) deck = shuffle(ITEMS);
  orderNo++;
  st = { item: deck.pop(), paper: null, string: null, stickers: [] };
  $('noteNo').textContent = 'ORDER No.' + String(orderNo).padStart(2, '0');
  $('noteItem').textContent = st.item.name;
  $('noteMeta').textContent = st.item.meta;
  $('noteMsg').textContent = st.item.msg;
  $('note').classList.remove('out');
  const pkg = $('pkg');
  pkg.classList.add('enter');
  draw({});
  requestAnimationFrame(() => requestAnimationFrame(() => pkg.classList.remove('enter')));
  refresh();
}

function draw(anim) { $('pkg').innerHTML = pkgSVG(st, anim); }

function refresh() {
  document.querySelectorAll('.sw').forEach(el => el.classList.toggle('on', el.dataset.id === st.paper));
  document.querySelectorAll('#strings .chip').forEach(el => {
    el.classList.toggle('on', el.dataset.id === st.string);
    el.classList.toggle('off', !st.paper);
  });
  document.querySelectorAll('#stickers .chip').forEach(el => {
    el.classList.toggle('on', el.dataset.id === stickerSel);
    el.classList.toggle('off', !st.paper);
  });
  $('done').disabled = !st.paper || busy;
  $('peel').disabled = !st.stickers.length;
  $('pkg').classList.toggle('sticking', !!(stickerSel && st.paper));
  $('hint').innerHTML = !st.paper ? '왼쪽에서 포장지를 골라요'
    : !st.string ? '아래에서 끈이나 리본을 골라요<br>다른 포장지를 눌러 다시 싸도 돼요'
    : stickerSel ? '선물 위를 눌러 스티커를 붙여요<br>붙인 스티커를 누르면 떨어져요'
    : '스티커를 붙이거나<br>다 쌌으면 오른쪽 아래 버튼을 눌러요';
}

/* palettes */
$('papers').innerHTML = PAPERS.map(p => `
  <div class="sw" data-id="${p.id}"><i style="background-image:url(${IMG}paper-${p.id}.jpg)"></i><span>${p.name}</span></div>`).join('');
$('strings').innerHTML = STRINGS.map(s => `
  <div class="chip" data-id="${s.id}"><svg viewBox="-28 -24 176 144" style="overflow:visible">
    <rect x="0" y="0" width="120" height="96" rx="3" fill="#ece2d2"/>${ribbon(s.id, 0, 0, 120, 96, false)}</svg><span>${s.name}</span></div>`).join('');
$('stickers').innerHTML = STICKERS.map(s => `
  <div class="chip stk" data-id="${s.id}"><img src="${IMG}st-${s.id}.png" alt=""></div>`).join('');

$('papers').onclick = (e) => {
  const el = e.target.closest('.sw'); if (!el || busy) return;
  st.paper = el.dataset.id; sound.crinkle(); draw({ paper: true, ribbon: !!st.string }); refresh();
};
$('strings').onclick = (e) => {
  const el = e.target.closest('.chip'); if (!el || busy || !st.paper) return;
  st.string = el.dataset.id; sound.zip(); draw({ ribbon: true }); refresh();
};
$('stickers').onclick = (e) => {
  const el = e.target.closest('.chip'); if (!el || !st.paper) return;
  stickerSel = stickerSel === el.dataset.id ? null : el.dataset.id; refresh();
};
$('pkg').onclick = (e) => {
  if (busy || !st.paper) return;
  const hit = e.target.closest('[data-i]');
  if (hit) {
    st.stickers = st.stickers.filter(s => String(s.i) !== hit.dataset.i);
    sound.peel(); draw({}); refresh(); return;
  }
  if (!stickerSel) return;
  const svg = $('pkg').querySelector('svg');
  const pt = new DOMPoint(e.clientX, e.clientY).matrixTransform(svg.getScreenCTM().inverse());
  st.stickers.push({ id: stickerSel, x: pt.x, y: pt.y, r: Math.round(Math.random() * 40 - 20), i: stickN++ });
  sound.pop(); draw({ sticker: st.stickers.length - 1 }); refresh();
};
$('peel').onclick = () => { st.stickers = []; sound.peel(); draw({}); refresh(); };

/* score & reaction */
const byId = (arr, id) => arr.find(o => o.id === id);
function score() {
  const t = new Set(st.item.tags);
  const hit = (tags) => tags.filter(x => t.has(x)).length;
  let s = hit(byId(PAPERS, st.paper).tags) * 2;
  if (st.string) s += hit(byId(STRINGS, st.string).tags);
  s += Math.min(2, st.stickers.reduce((a, k) => a + hit(byId(STICKERS, k.id).tags) * .5, 0));
  return s;
}
function reaction(s) {
  const it = st.item, p = byId(PAPERS, st.paper), str = st.string && byId(STRINGS, st.string);
  if (s >= 5) return pick(['딱이에요. 받는 사람 표정이 벌써 보여요', '이건 포장부터 선물이네요', '완벽해요. 뜯기 아까워요']);
  if (s >= 3) return pick(['오, 잘 어울려요', '꽤 그럴듯해요', '받으면 기분 좋겠어요']);
  const odd = [
    `${it.short}에 ${p.name}${josa(p.name, '이라니', '라니')}. 그것도 나름 멋이에요`,
    `뜯어보면 깜짝 놀라겠네요`,
    str ? `${str.name}${josa(str.name, '이', '가')} 좀 의외지만 괜찮아요` : `끈 없이도 마음은 전해져요`,
    `이건 이것대로 재밌어요`,
  ];
  return pick(odd);
}
function say(text) {
  $('say').innerHTML = text;
  $('say').classList.add('show');
}

/* stack */
function placeOnPile(snap, line) {
  const pile = $('pile');
  const it = snap.item, W = (it.w + P * 2) * S, H = (it.h + P * 2) * S;
  const col = stacks[0].top <= stacks[1].top ? stacks[0] : stacks[1];
  const floorH = 60, rot = Math.random() * 8 - 4;
  const el = document.createElement('div');
  el.className = 'stacked';
  el.style.width = W + 'px'; el.style.height = H + 'px';
  el.style.left = (col.cx - W / 2 + (Math.random() * 10 - 5)) + 'px';
  el.style.bottom = (floorH - 2 + col.top - (P - 5) * S) + 'px';
  el.style.transform = `rotate(${rot}deg)`;
  el.style.zIndex = 10 + pile.querySelectorAll('.stacked').length;
  el.innerHTML = pkgSVG(snap, {});
  el.dataset.tip = `${it.short} · ${line}`;
  col.top += (it.h + 10) * S - 3;
  pile.appendChild(el);
  return { el, rot };
}

function fly(snap, line) {
  const from = $('pkg').querySelector('svg').getBoundingClientRect();
  const { el, rot } = placeOnPile(snap, line);
  const to = el.getBoundingClientRect();
  $('pkg').style.visibility = 'hidden';
  const dx = (from.left + from.width / 2) - (to.left + to.width / 2);
  const dy = (from.top + from.height / 2) - (to.top + to.height / 2);
  const k = from.width / to.width;
  el.style.zIndex = 900;
  const a = el.animate([
    { transform: `translate(${dx}px, ${dy}px) scale(${k}) rotate(0deg)` },
    { transform: `translate(${dx * .45}px, ${dy * .45 - 120}px) scale(${(k + 1) / 2}) rotate(${rot * 3}deg)`, offset: .5 },
    { transform: `rotate(${rot}deg)` },
  ], { duration: 720, easing: 'cubic-bezier(.4,0,.3,1)' });
  return a.finished.then(() => {
    el.style.zIndex = 10 + $('pile').querySelectorAll('.stacked').length;
    el.animate([{ transform: `rotate(${rot}deg) scaleY(.92)` }, { transform: `rotate(${rot}deg)` }], { duration: 180, easing: 'ease-out' });
    sound.thud();
  });
}

let wrapped = 0;
$('done').onclick = async () => {
  if (busy || !st.paper) return;
  busy = true; stickerSel = null; refresh();
  const s = score(), line = reaction(s);
  const pkg = $('pkg');
  pkg.classList.remove('jig'); void pkg.offsetWidth; pkg.classList.add('jig');
  if (s >= 5) sound.chime();
  say(`${line}<small>${st.item.short}</small>`);
  $('note').classList.add('out');
  await new Promise(r => setTimeout(r, 2000));
  $('say').classList.remove('show');
  const snap = { ...st, stickers: st.stickers.slice() };
  await fly(snap, line);
  $('count').textContent = ++wrapped;
  pkg.style.visibility = '';
  busy = false;
  nextItem();
};

/* tooltip */
$('pile').addEventListener('mousemove', (e) => {
  const tip = $('tip'), el = e.target.closest('.stacked');
  if (!el) { tip.style.opacity = 0; return; }
  const r = $('pile').getBoundingClientRect();
  tip.textContent = el.dataset.tip;
  tip.style.opacity = 1;
  const x = Math.min(e.clientX - r.left + 12, r.width - tip.offsetWidth - 8);
  tip.style.left = Math.max(8, x) + 'px';
  tip.style.top = (e.clientY - r.top - 40) + 'px';
});
$('pile').addEventListener('mouseleave', () => { $('tip').style.opacity = 0; });

nextItem();
</script>
</body>
</html>
