// ── sound ──────────────────────────────────────────────────────────────────
const sound = (() => {
  let ac = null, master = null, hum = null, on = true;
  const bufs = {};
  const boot = () => {
    if (ac) return;
    ac = new (window.AudioContext || window.webkitAudioContext)();
    master = ac.createGain(); master.gain.value = 0.8;
    master.connect(ac.destination);
    const f = ac.createBiquadFilter(), g = ac.createGain();
    f.type = 'lowpass'; f.frequency.value = 320; hum = f; g.gain.value = 0.32;
    f.connect(g); g.connect(master);
    for (const [k, url] of Object.entries(CLIPS)) {
      fetch(url).then(r => r.arrayBuffer()).then(x => ac.decodeAudioData(x)).then(buf => {
        bufs[k] = buf;
        if (k === 'idle') { const s = ac.createBufferSource(); s.buffer = buf; s.loop = true; s.connect(f); s.start(); }   // the engine of a bus waiting at the stop
      }).catch(() => {});
    }
  };
  const play = (k, gain, rate = 1) => {
    if (!ac || !on || !bufs[k]) return;
    const s = ac.createBufferSource(), g = ac.createGain();
    s.buffer = bufs[k]; s.playbackRate.value = rate; g.gain.value = gain;
    s.connect(g); g.connect(master); s.start();
  };
  const tone = (freq, dur, peak, type = 'sine', at = 0, bend = 0) => {
    if (!ac || !on) return;
    const t = ac.currentTime + at, o = ac.createOscillator(), g = ac.createGain();
    o.type = type; o.frequency.setValueAtTime(freq, t);
    if (bend) o.frequency.exponentialRampToValueAtTime(freq * bend, t + dur);
    g.gain.setValueAtTime(0.0001, t);
    g.gain.exponentialRampToValueAtTime(peak, t + 0.01);
    g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    o.connect(g); g.connect(master); o.start(t); o.stop(t + dur + 0.05);
  };
  return {
    kick() { boot(); if (ac.state === 'suspended') ac.resume(); },
    toggle() { on = !on; if (master) master.gain.value = on ? 0.8 : 0; return on; },
    bell() { tone(1318, 0.9, 0.06, 'triangle'); tone(1046, 1.2, 0.05, 'triangle', 0.28); },
    stretch() { tone(110, 0.6, 0.06, 'sine', 0, 0.72); },
    snap() { tone(180, 0.3, 0.05, 'sine', 0, 1.7); },
    ghost() { tone(1760, 0.18, 0.012, 'sine'); },
    arrive(r, ontime) { ontime ? play('door', 0.22) : play('bell', 0.3, r > 1 ? 0.94 : 1.1); },
    tick(r) { tone(clamp(2400 / r, 900, 3600), 0.05, 0.012, 'sine'); },
    zoom(z) { if (hum) hum.frequency.setTargetAtTime(320 + Math.log(z) * 420, ac.currentTime, 0.2); },
  };
})();

// ── layout ─────────────────────────────────────────────────────────────────
const L = {};
function layout() {
  S = Math.min(W / 1440, H / 900);
  const mid = PREVIEW ? H * 0.56 : H * 0.5;
  L.gap = PREVIEW ? 64 : 104 * S;
  L.yTop = mid - L.gap / 2; L.yBot = mid + L.gap / 2;
  L.x0 = PREVIEW ? 34 : 120 * S;
  L.avail = W - L.x0 - (PREVIEW ? 34 : 150 * S);
  L.u = L.avail * 0.8 / (TURN - 1);              // px per segment when real == announced
  L.lw = PREVIEW ? 5 : 7 * S;
}

// positions of every stop for the shown ratios
function place(scale) {
  const P = new Array(N), u = L.u * scale;
  P[0] = { x: L.x0, y: L.yTop };
  for (let k = 1; k < TURN; k++) P[k] = { x: P[k - 1].x + u * disp[k - 1], y: L.yTop };
  P[TURN] = { x: P[TURN - 1].x, y: L.yBot };      // the turn segment bulges instead of moving
  for (let k = TURN + 1; k < N; k++) P[k] = { x: P[k - 1].x - u * disp[k - 1], y: L.yBot };
  return P;
}

function fitScale() {
  const P = place(1);
  let maxX = 0, minX = Infinity;
  for (const p of P) { maxX = Math.max(maxX, p.x); minX = Math.min(minX, p.x); }
  const span = maxX - Math.min(L.x0, minX);
  return Math.min(1, L.avail / span);
}

const target = k => HOURS[hi].ratio[k];

// seconds → "3시간 18분" / "52분"
function hm(sec) {
  const m = Math.round(sec / 60), h = Math.floor(m / 60);
  return h ? `${h}시간 ${m % 60}분` : `${m}분`;
}
const ampm = h => (h < 12 ? '오전 ' : '오후 ') + ((h + 11) % 12 + 1) + '시';

// ── camera: world = the overview map, screen = world zoomed around cam.c ─────
const X = x => (x - cam.cx) * cam.z + W / 2;
const Y = y => (y - cam.cy) * cam.z + H / 2;
const fiberFade = () => clamp((cam.z - 3) / 7, 0, 1);
const secs = v => v >= 60 ? `${Math.floor(v / 60)}분 ${v % 60}초` : `${v}초`;
const clock = m => `${String(Math.floor(m / 60)).padStart(2, '0')}:${String(m % 60).padStart(2, '0')}`;

function segColor(d, alpha = 1) {
  const t = clamp((d - 1.005) / 0.015, 0, 1);   // on time or early = blue, late = red, no muddy middle
  const a = [0x34, 0x61, 0xb8], b = [0xe2, 0x41, 0x2e];
  const c = a.map((v, i) => Math.round(lerp(v, b[i], t)));
  return `rgba(${c.join(',')},${alpha})`;
}

function stackText(str, x, y, dir, fs) {
  const lh = fs * 1.06, chars = [...str];
  for (let i = 0; i < chars.length; i++) {
    const j = dir < 0 ? chars.length - 1 - i : i, yy = y + dir * i * lh;
    if (yy < -fs || yy > H + fs) continue;
    ctx.fillText(chars[j], x, yy);
  }
  return chars.length * lh;
}

function drawHeader() {
  const hr = HOURS[hi], y = 70 * S, a = clamp(1.6 - cam.z * 0.4, 0, 1);
  if (a <= 0) return;
  ctx.globalAlpha = a; ctx.textBaseline = 'middle';
  ctx.fillStyle = BLUE;
  ctx.beginPath(); ctx.roundRect(L.x0, y - 24 * S, 104 * S, 48 * S, 10 * S); ctx.fill();
  ctx.fillStyle = '#fff'; ctx.textAlign = 'center';
  ctx.font = `900 ${32 * S}px 'Noto Sans KR'`;
  ctx.fillText('273', L.x0 + 52 * S, y + 1 * S);
  ctx.textAlign = 'left';
  ctx.strokeStyle = BLUE; ctx.lineWidth = 1.5 * S;
  ctx.beginPath(); ctx.roundRect(L.x0 + 118 * S, y - 11 * S, 40 * S, 22 * S, 11 * S); ctx.stroke();
  ctx.fillStyle = BLUE; ctx.font = `700 ${12 * S}px 'Noto Sans KR'`;
  ctx.fillText('간선', L.x0 + 126 * S, y + 1 * S);
  ctx.fillStyle = INK; ctx.font = `700 ${19 * S}px 'Noto Sans KR'`;
  ctx.fillText('중랑공영차고지  ↔  홍익대학교', L.x0 + 172 * S, y + 1 * S);
  const P = hr.pred.reduce((a, b) => a + b, 0), R = hr.real.reduce((a, b) => a + b, 0);
  const xr = W - 150 * S;
  ctx.textAlign = 'right';
  ctx.font = `700 ${22 * S}px 'Noto Sans KR'`; ctx.fillStyle = INK;
  ctx.fillText(hr.label, xr, y - 8 * S);
  ctx.font = `400 ${13 * S}px 'Noto Sans KR'`;
  const b = `   ·   실제  ${hm(R)}`;
  ctx.fillStyle = 'rgba(35,38,46,.45)';
  ctx.fillText(`안내  ${hm(P)}`, xr - ctx.measureText(b).width, y + 18 * S);
  ctx.fillStyle = R > P ? RED : BLUE;
  ctx.fillText(b, xr, y + 18 * S);
  ctx.globalAlpha = 1;
}

function drawFooter() {
  ctx.textAlign = 'right'; ctx.fillStyle = 'rgba(35,38,46,.38)';
  ctx.font = `400 ${10.5 * S}px 'Noto Sans KR'`;
  ctx.fillText(`출처: 서울특별시 버스도착정보 · ${DATA.when} · 40초마다 기록`, W - 30 * S, H - 42 * S);
  ctx.fillText('소리: freesound.org CC0 녹음', W - 30 * S, H - 26 * S);
}

// a small whole-route map with the view box, so a close-up never loses its place
function drawMinimap(P) {
  const a = clamp((cam.z - 1.4) / 1.5, 0, 1);
  if (a <= 0) return;
  let minX = Infinity, maxX = -Infinity;
  for (const p of P) { minX = Math.min(minX, p.x); maxX = Math.max(maxX, p.x); }
  const bw = 210 * S, k = bw / (maxX - minX + L.gap), ox = 30 * S, oy = H - 150 * S;
  const mx = x => ox + (x - minX + L.gap / 2) * k, my = y => oy + (y - L.yTop) * k;
  ctx.globalAlpha = a;
  ctx.fillStyle = 'rgba(247,246,242,.96)';
  ctx.fillRect(ox - 8 * S, oy - 36 * S, bw + 16 * S, L.gap * k + 50 * S);
  ctx.strokeStyle = BLUE; ctx.lineWidth = 2 * S; ctx.lineCap = 'round';
  ctx.beginPath();
  P.forEach((p, i) => i ? ctx.lineTo(mx(p.x), my(p.y)) : ctx.moveTo(mx(p.x), my(p.y)));
  ctx.closePath(); ctx.stroke();
  const vx0 = cam.cx - W / 2 / cam.z, vx1 = cam.cx + W / 2 / cam.z;
  const vy0 = cam.cy - H / 2 / cam.z, vy1 = cam.cy + H / 2 / cam.z;
  ctx.save(); ctx.beginPath(); ctx.rect(ox - 8 * S, oy - 14 * S, bw + 16 * S, L.gap * k + 28 * S); ctx.clip();
  ctx.strokeStyle = RED; ctx.lineWidth = 1.2 * S;
  ctx.strokeRect(mx(vx0), my(vy0), Math.max(2, (vx1 - vx0) * k), Math.max(2, (vy1 - vy0) * k));
  ctx.restore();
  ctx.textAlign = 'left'; ctx.textBaseline = 'bottom'; ctx.fillStyle = 'rgba(35,38,46,.55)';
  ctx.font = `700 ${10 * S}px 'Space Mono'`;
  ctx.fillText(`×${cam.z.toFixed(1)}`, ox, oy - 18 * S);
  ctx.globalAlpha = 1;
}

function drawLine(P) {
  const z = cam.z, ff = fiberFade(), lw = L.lw * z;
  ctx.lineCap = 'round';
  // loop back to the garage: no data, drawn plain
  const a = P[N - 1], o = P[0], bx = Math.min(a.x, o.x) - L.gap * 0.55;
  ctx.strokeStyle = segColor(1, 0.5); ctx.lineWidth = lw;

// up close, the segment under the view replays every bus of the hour:
// a pale bus runs on the announced time, the real one runs on the real time
const race = { k: -1, t: 0, total: 0, page: 0, heard: new Set(), done: new Set() };
const raceable = k => k >= 0 && k < N - 1 && k !== TURN - 1 && !DATA.ghost[k] && DATA.names[k] !== DATA.names[k + 1] && HOURS[hi].obs[k].length > 0;
const RACE_SEC = 2.4, STAGGER = 0.35, ON_TIME = 20, PAGE = 6;
// the day's buses run six at a time, in the order they left
function raceLanes(k) {
  const all = HOURS[hi].obs[k], f = RACE_SEC / Math.max(20, HOURS[hi].pred[k]);
  return all.slice(race.page * PAGE, race.page * PAGE + PAGE)
    .map(([m, pr, re], i) => ({ m, pr, re, s: i * STAGGER, tp: pr * f, tr: re * f, idx: race.page * PAGE + i }));
}
const laneTotal = k => Math.max(...raceLanes(k).map(l => l.s + Math.max(l.tp, l.tr)));
function verdict(d) {
  const ad = Math.abs(d);
  if (ad < ON_TIME) return { word: '제시간', col: 'rgba(35,38,46,.7)', ontime: true };
  return { word: `${ad < 60 ? '조금 ' : ad >= 180 ? '많이 ' : ''}${d > 0 ? '늦음' : '일찍'}`, col: d > 0 ? RED : BLUE, ontime: false };
}
const signed = d => Math.abs(d) < 1 ? '±0초' : `${d > 0 ? '+' : '−'}${secs(Math.abs(d))}`;
function raceStep(dt) {
  const k = focus, on = fiberFade() > 0.5 && raceable(k);
  if (!on) { race.k = -1; return; }
  if (k !== race.k) { race.k = k; race.page = 0; race.t = -0.4; race.heard.clear(); race.done.clear(); race.total = laneTotal(k); }
  race.t += dt;
  raceLanes(k).forEach(l => {
    const te = race.t - l.s;
    if (te >= l.tp && !race.heard.has('g' + l.idx)) { race.heard.add('g' + l.idx); sound.ghost(); }
    if (te >= l.tr && !race.heard.has('r' + l.idx)) { race.heard.add('r' + l.idx); sound.arrive(l.re / l.pr, Math.abs(l.re - l.pr) < ON_TIME); }
    if (te >= Math.max(l.tp, l.tr)) race.done.add(l.idx);
  });
  if (race.t > race.total + 2.4) {   // next six, and round again once the day is over
    const pages = Math.ceil(HOURS[hi].obs[k].length / PAGE);
    race.page = (race.page + 1) % pages; race.t = race.page ? -0.4 : -2.5; race.heard.clear(); race.total = laneTotal(k);
  }
}

  const obs = HOURS[hi].obs[k], x0 = W * 0.705, x1 = W - 40 * S, rowH = 21 * S;
  const c = [x0, x0 + 62 * S, x0 + 140 * S, x0 + 218 * S];
  let y = 196 * S;
  ctx.save(); ctx.globalAlpha = a; ctx.textBaseline = 'middle'; ctx.textAlign = 'left';
  ctx.fillStyle = 'rgba(247,246,242,.94)'; ctx.fillRect(x0 - 20 * S, y - 26 * S, x1 - x0 + 40 * S, H - 96 * S - y);
  ctx.fillStyle = INK; ctx.font = `900 ${15 * S}px 'Noto Sans KR'`;
  ctx.fillText(`오늘 이 구간을 지난 버스 ${obs.length}대`, x0, y);
  const n = { on: 0, late: 0, early: 0 };
  obs.forEach(([, pr, re]) => { const v = verdict(re - pr); v.ontime ? n.on++ : re > pr ? n.late++ : n.early++; });
  y += 24 * S; ctx.font = `700 ${12 * S}px 'Noto Sans KR'`;
  let xx = x0;
  for (const [t, col] of [[`제시간 ${n.on}`, 'rgba(35,38,46,.7)'], [`늦음 ${n.late}`, RED], [`일찍 ${n.early}`, BLUE]]) {
    ctx.fillStyle = col; ctx.fillText(t, xx, y); xx += ctx.measureText(t).width + 14 * S;
  }
  y += 28 * S;
  ctx.fillStyle = 'rgba(35,38,46,.45)'; ctx.font = `400 ${10 * S}px 'Space Mono'`;
  ['출발', '안내', '실제', '판정'].forEach((t, i) => ctx.fillText(t, c[i], y));
  ctx.strokeStyle = 'rgba(35,38,46,.18)'; ctx.lineWidth = 1 * S;
  ctx.beginPath(); ctx.moveTo(x0, y + 11 * S); ctx.lineTo(x1, y + 11 * S); ctx.stroke();
  y += 24 * S;
  const fit = Math.max(4, Math.floor((H - 110 * S - y) / rowH));
  const from = clamp(race.page * PAGE - 1, 0, Math.max(0, obs.length - fit));
  obs.slice(from, from + fit).forEach(([m, pr, re], j) => {
    const i = from + j, yy = y + j * rowH, done = race.done.has(i), now = Math.floor(i / PAGE) === race.page;
    if (now) { ctx.fillStyle = 'rgba(52,97,184,.07)'; ctx.fillRect(x0 - 8 * S, yy - rowH / 2, x1 - x0 + 16 * S, rowH); }
    ctx.globalAlpha = a * (done ? 1 : now ? 0.55 : 0.25);
    ctx.fillStyle = INK; ctx.font = `400 ${11 * S}px 'Space Mono'`;
    ctx.fillText(clock(m), c[0], yy);
    ctx.fillStyle = 'rgba(35,38,46,.6)'; ctx.font = `500 ${11.5 * S}px 'Noto Sans KR'`;
    ctx.fillText(secs(pr), c[1], yy);
    ctx.fillText(done ? secs(re) : '—', c[2], yy);
    if (done) {
      const v = verdict(re - pr);
      ctx.fillStyle = v.col; ctx.font = `900 ${11.5 * S}px 'Noto Sans KR'`; ctx.fillText(v.word, c[3], yy);
      const w = ctx.measureText(v.word).width;
      ctx.font = `500 ${11 * S}px 'Noto Sans KR'`; ctx.fillText(signed(re - pr), c[3] + w + 6 * S, yy);
    }
  });
  ctx.globalAlpha = a;
  if (obs.length > fit) {
    ctx.fillStyle = 'rgba(35,38,46,.4)'; ctx.font = `400 ${10 * S}px 'Space Mono'`;
    ctx.fillText(`${from + 1}–${Math.min(obs.length, from + fit)} / ${obs.length}`, x0, y + fit * rowH + 4 * S);
  }
  ctx.restore();
}

function draw() {
  ctx.fillStyle = PAPER; ctx.fillRect(0, 0, W, H);
  const P = place(scaleNow); lastP = P;
  drawLine(P);
  drawStops(P);
  if (fiberFade() > 0) drawRace(P, fiberFade());   // on top of everything, poles included
  if (PREVIEW) {
    ctx.fillStyle = BLUE; ctx.beginPath(); ctx.roundRect(L.x0, 20, 64, 30, 7); ctx.fill();
    ctx.fillStyle = '#fff'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    ctx.font = `900 20px 'Noto Sans KR'`; ctx.fillText('273', L.x0 + 32, 36);
    return;
  }
  drawHeader();
  drawCaption(P, shown);
  drawLog(shown);
  drawMinimap(P);
  drawFooter();
}

// ── motion ─────────────────────────────────────────────────────────────────
let T = 0, changeT = 0, lastStop = -1;
const want = new Float32Array(N - 1).fill(1), tgt = new Float32Array(N - 1).fill(1);
function refresh() {
  for (let k = 0; k < N - 1; k++) want[k] = target(k);
  changeT = T;
}
let started = false;

function step(dt) {
  T += dt;
  for (let k = 0; k < N - 1; k++) {
    if (T - changeT >= k * 0.009) tgt[k] = want[k];   // change runs down the route like a pulled cord
    vel[k] += (tgt[k] - disp[k]) * 70 * dt;
    vel[k] *= Math.exp(-6 * dt);
    disp[k] += vel[k] * dt;
  }
  realVel += ((started ? 1 : 0) - realness) * 50 * dt;
  realVel *= Math.exp(-5.5 * dt);
  realness += realVel * dt;
  scaleNow = lerp(scaleNow, fitScale(), 1 - Math.exp(-3 * dt));
  const P = place(scaleNow);
  if (focus >= 0) {                // the clicked segment fills the left of the view, the log sits on the right
    const p = P[focus], q = P[focus + 1];
    cam.zt = clamp(0.36 * W / Math.max(1e-3, Math.abs(q.x - p.x)), 6, 40);
    cam.tx = (p.x + q.x) / 2 + 0.14 * W / cam.zt; cam.ty = p.y;
  } else { cam.zt = 1; cam.tx = W / 2; cam.ty = H / 2; }
  raceStep(dt);
  const zBefore = cam.z;
  cam.z = Math.exp(lerp(Math.log(cam.z), Math.log(cam.zt), 1 - Math.exp(-2.6 * dt)));
  const ease = 1 - Math.exp(-3.2 * dt);
  cam.cx = lerp(cam.cx, cam.tx, ease); cam.cy = lerp(cam.cy, cam.ty, ease);
  if (Math.abs(cam.z - zBefore) > 0.01) sound.zoom(cam.z);
  if (cam.z > 5) {                 // a soft tick each time the view slides past a stop
    let best = -1, bd = Infinity;
    for (let k = 0; k < N; k++) { const d = Math.hypot(P[k].x - cam.cx, P[k].y - cam.cy); if (d < bd) { bd = d; best = k; } }
    if (best !== lastStop && lastStop >= 0) sound.tick(disp[Math.min(best, N - 2)]);
    lastStop = best;
  }
}

function resize() {
  const dpr = Math.min(2, window.devicePixelRatio || 1);
  W = innerWidth; H = innerHeight;
  cv.width = W * dpr; cv.height = H * dpr;
  cv.style.width = W + 'px'; cv.style.height = H + 'px';
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  layout();
  if (cam.z < 1.01) { cam.cx = cam.tx = W / 2; cam.cy = cam.ty = H / 2; }
}

let last = 0;
function frame(t) {
  const dt = Math.min(0.05, (t - (last || t)) / 1000); last = t;
  if (!PREVIEW) step(dt);
  draw();
  requestAnimationFrame(frame);
}

// ── input ──────────────────────────────────────────────────────────────────
const sndEl = document.getElementById('snd');
sndEl.addEventListener('click', () => { sound.kick(); sndEl.textContent = 'SOUND: ' + (sound.toggle() ? 'ON' : 'OFF'); });
// a stop under the pointer: its circle, or the column of its name
function stopAt(px, py) {
  if (!lastP || cam.z > 1.5) return -1;
  let best = -1, bd = Infinity;
  for (let k = 0; k < N - 1; k++) {
    if (DATA.ghost[k]) continue;
    const x = X(lastP[k].x), y = Y(lastP[k].y), dir = lastP[k].y === L.yTop ? -1 : 1;
    const dx = Math.abs(px - x), along = (py - y) * dir;
    if (dx < 9 * S && along > -12 * S && along < 150 * S && dx < bd) { bd = dx; best = k; }
  }
  return best;
}
// a stop opens the stretch to the next stop; the last stop before the turn and the end look back one
const segFrom = k => raceable(k) ? k : raceable(k - 1) ? k - 1 : -1;
function open(k) {
  const s = segFrom(k);
  if (s < 0) return;
  focus = shown = s; sound.bell();
  document.getElementById('hint').classList.add('off');
}
function close() {
  if (focus < 0) return;
  focus = -1; sound.stretch();
  document.getElementById('hint').classList.remove('off');
}
addEventListener('keydown', e => { if (e.key === 'Escape') close(); });
addEventListener('pointermove', e => {
  hover = focus < 0 ? segFrom(stopAt(e.clientX, e.clientY)) >= 0 ? stopAt(e.clientX, e.clientY) : -1 : -1;
  cv.style.cursor = hover >= 0 || focus >= 0 ? 'pointer' : 'default';
});
addEventListener('pointerdown', e => {
  if (e.target.closest('.snd') || e.target.closest('.home-btn')) return;
  sound.kick();
  if (focus >= 0) { close(); return; }
  const k = stopAt(e.clientX, e.clientY);
  if (k >= 0) open(k);
});
addEventListener('resize', resize);

(async () => {
  try {
    await Promise.all([500, 700, 900].map(w => document.fonts.load(`${w} 20px 'Noto Sans KR'`))
      .concat([400, 700].map(w => document.fonts.load(`${w} 12px 'Space Mono'`))));
  } catch (e) { /* fall back */ }
  hi = HOURS.length - 1;
  resize();
  if (PREVIEW) { for (let k = 0; k < N - 1; k++) disp[k] = target(k); scaleNow = fitScale(); }
  else {
    sound.kick(); setTimeout(() => sound.kick(), 400);
    setTimeout(() => { started = true; refresh(); sound.stretch(); }, 900);   // opens on the announced map, then lets go
  }
  requestAnimationFrame(frame);
})();
</script>
</body>
</html>
