<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>오차 — HALF A STEP</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Black+Han+Sans&family=Noto+Sans+KR:wght@400;700&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 100%; height: 100%; overflow: hidden; background: #f4f1ea; }
  body { font-family: 'Space Mono', monospace; user-select: none; }
  canvas { display: block; }

  .home-btn {
    position: fixed; left: 26px; top: 22px; z-index: 20;
    font: 700 11px/1 'Space Mono', monospace; letter-spacing: .22em;
    color: #3a3c44; text-decoration: none; padding: 9px 13px;
    border: 1px solid rgba(34,37,47,.25); background: rgba(255,255,255,.6);
    transition: color .3s, border-color .3s;
  }
  .home-btn:hover { color: #e2493a; border-color: rgba(226,73,58,.5); }

  .snd {
    position: fixed; right: 26px; top: 22px; z-index: 20;
    font: 700 11px/1 'Space Mono', monospace; letter-spacing: .18em;
    color: #3a3c44; padding: 9px 13px; cursor: pointer;
    border: 1px solid rgba(34,37,47,.25); background: rgba(255,255,255,.6);
    transition: color .3s, border-color .3s;
  }
  .snd:hover { color: #e2493a; border-color: rgba(226,73,58,.5); }

  .hint {
    position: fixed; left: 50%; bottom: 24px; transform: translateX(-50%); z-index: 20;
    font: 400 12px/1 'Noto Sans KR', sans-serif; letter-spacing: .08em;
    color: rgba(34,37,47,.75); white-space: nowrap; pointer-events: none;
    background: rgba(255,255,255,.7); padding: 9px 14px;
    transition: opacity 1s ease;
  }
  .hint.off { opacity: 0; }

  body.preview .home-btn, body.preview .snd, body.preview .hint { display: none; }
</style>
</head>
<body>
<canvas id="cv"></canvas>
<a class="home-btn" href="../index.html">← INDEX</a>
<div class="snd" id="snd">SOUND: ON</div>
<div class="hint" id="hint">삐져나온 글자를 눌러서 밀어 넣어 보세요</div>

<script>
const cv = document.getElementById('cv');
const ctx = cv.getContext('2d');
const PREVIEW = new URLSearchParams(location.search).has('preview');
if (PREVIEW) document.body.classList.add('preview');

const DPR = Math.min(window.devicePixelRatio || 1, 2);
const clamp = (v, a, b) => v < a ? a : v > b ? b : v;
const lerp = (a, b, k) => a + (b - a) * k;
const rnd = (a, b) => a + Math.random() * (b - a);

const TEXT = '다같이앞으로나란히';
const N = TEXT.length;
const MAX_SHIFT = 3;
const INK = '#22252f', RED = '#e2493a', CHALK = '#ffffff';

// fuss: how restless the line has become. everything leans on it.
let fuss = 0, shift = 0, culprit = -1, pushes = 0, idleT = 0, T = 0;
let W = 0, H = 0, cell = 0, x0 = 0, baseY = 0;
let px = -1, py = -1, wide = 0;
const timers = [];
const after = (s, fn) => timers.push({ t: s, fn });

const bits = [...TEXT].map((ch, i) => ({
  ch, i, x: i, xt: i, y: 0, yt: 0, vy: 0,
  squash: 0, flinch: 0, blink: rnd(1, 5), shut: 0, walk: 0,
  glance: 0, glanceT: rnd(2, 6), seed: Math.random() * 10,
}));

// ── sound ──────────────────────────────────────────────────────────────────
const sound = (() => {
  let ac = null, master = null, on = true;
  const boot = () => {
    if (ac) return;
    ac = new (window.AudioContext || window.webkitAudioContext)();
    master = ac.createGain(); master.gain.value = 0.9;
    const comp = ac.createDynamicsCompressor();
    comp.threshold.value = -14; comp.ratio.value = 6;
    master.connect(comp); comp.connect(ac.destination);

    // a wide open yard: faint air
    const src = ac.createBufferSource(), f = ac.createBiquadFilter(), g = ac.createGain();
    src.buffer = noise(3); src.loop = true;
    f.type = 'lowpass'; f.frequency.value = 520;
    g.gain.value = 0.02;
    src.connect(f); f.connect(g); g.connect(master); src.start();
  };
  const noise = sec => {
    const n = Math.floor(ac.sampleRate * sec), b = ac.createBuffer(1, n, ac.sampleRate), d = b.getChannelData(0);
    for (let i = 0; i < n; i++) d[i] = Math.random() * 2 - 1;
    return b;
  };
  const tone = (type, f0, f1, t0, dur, peak) => {
    const o = ac.createOscillator(), g = ac.createGain();
    o.type = type;
    o.frequency.setValueAtTime(f0, t0);
    o.frequency.exponentialRampToValueAtTime(f1, t0 + dur);
    g.gain.setValueAtTime(0.0001, t0);
    g.gain.exponentialRampToValueAtTime(peak, t0 + 0.008);
    g.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
    o.connect(g); g.connect(master); o.start(t0); o.stop(t0 + dur + 0.05);
  };
  const scuff = (t0, dur, peak, freq) => {
    const s = ac.createBufferSource(), f = ac.createBiquadFilter(), g = ac.createGain();
    s.buffer = noise(dur + 0.05);
    f.type = 'bandpass'; f.frequency.value = freq; f.Q.value = 0.8;
    g.gain.setValueAtTime(0.0001, t0);
    g.gain.exponentialRampToValueAtTime(peak, t0 + 0.01);
    g.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
    s.connect(f); f.connect(g); g.connect(master); s.start(t0);
  };
  const ok = () => ac && on;
  return {
    kick() { boot(); if (ac.state === 'suspended') ac.resume(); },
    live() { return !!ac && ac.state === 'running' && on; },
    toggle() { on = !on; if (master) master.gain.value = on ? 0.9 : 0; return on; },
    push(k) {
      if (!ok()) return;
      const t = ac.currentTime;
      tone('sine', 190 + k * 60, 70, t, 0.18, 0.5);
      scuff(t, 0.12, 0.18, 1400);
    },
    pop(k) {
      if (!ok()) return;
      const t = ac.currentTime;
      tone('sine', 320 + k * 120, 820 + k * 300, t, 0.13, 0.32);
      tone('triangle', 640, 1400, t + 0.02, 0.08, 0.08);
    },
    poke() {
      if (!ok()) return;
      const t = ac.currentTime;
      tone('square', 520, 380, t, 0.07, 0.05);
    },
    step(i) {
      if (!ok()) return;
      scuff(ac.currentTime + i * 0.05, 0.07, 0.09, 700 + Math.random() * 500);
    },
    whistle(long) {
      if (!ok()) return;
      const t = ac.currentTime, dur = long ? 0.9 : 0.4;
      const o = ac.createOscillator(), lfo = ac.createOscillator(), lg = ac.createGain(), g = ac.createGain();
      o.type = 'sine'; o.frequency.value = 2650;
      lfo.frequency.value = 34; lg.gain.value = 140;
      lfo.connect(lg); lg.connect(o.frequency);
      g.gain.setValueAtTime(0.0001, t);
      g.gain.exponentialRampToValueAtTime(0.16, t + 0.03);
      g.gain.setValueAtTime(0.16, t + dur - 0.1);
      g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
      o.connect(g); g.connect(master);
      o.start(t); lfo.start(t); o.stop(t + dur + 0.05); lfo.stop(t + dur + 0.05);
      scuff(t, dur, 0.05, 3000);
    },
  };
})();

// ── line logic ─────────────────────────────────────────────────────────────
function popOut(i) {
  culprit = i;
  bits.forEach(o => { if (o.i !== i) o.yt = 0; });
  const b = bits[i];
  b.yt = 0.5; b.vy = 3.2; b.squash = -0.5;
  idleT = 0;
  sound.pop(fuss);
}

function pickNext(prev) {
  if (Math.random() < 0.15) return prev;            // stubborn: the same one steps out again
  let j;
  do { j = Math.floor(Math.random() * N); } while (j === prev);
  return j;
}

function push(i) {
  const b = bits[i];
  b.yt = 0; b.vy = -2.4; b.squash = 0.6; b.shut = 0.35;
  culprit = -1;
  pushes++;
  fuss += 0.19;
  sound.push(fuss);
  document.getElementById('hint').classList.add('off');

  if (fuss >= 1) { after(0.7, shuffle); return; }
  const next = pickNext(i);
  after(next === i ? 0.55 : rnd(0.3, 0.5), () => popOut(next));
}

// everyone slides one place over, so nobody stands on a mark
function shuffle() {
  fuss = 0;
  wide = 1;
  if (shift + 1 >= MAX_SHIFT) {
    sound.whistle(true);
    shift = 0;
    after(0.4, () => bits.forEach((b, k) => after(k * 0.04, () => { b.xt = b.i; b.walk = 1; sound.step(0); })));
    after(2.2, () => popOut(Math.floor(Math.random() * N)));
    return;
  }
  sound.whistle(false);
  shift++;
  for (let k = N - 1; k >= 0; k--) {
    const b = bits[k], d = (N - 1 - k) * 0.09;
    after(0.3 + d, () => { b.xt = b.i + shift; b.walk = 1; sound.step(0); });
  }
  after(2.4, () => popOut(Math.floor(Math.random() * N)));
}

function error() {
  return shift + (culprit >= 0 ? bits[culprit].y : 0);
}

// ── layout ─────────────────────────────────────────────────────────────────
function resize() {
  W = innerWidth; H = innerHeight;
  cv.width = Math.ceil(W * DPR); cv.height = Math.ceil(H * DPR);
  cv.style.width = W + 'px'; cv.style.height = H + 'px';
  if (PREVIEW) {
    cell = Math.min(W * 0.94 / (N + 0.6), H * 0.34);
    x0 = (W - N * cell) / 2 + cell / 2;
    baseY = H * 0.66;
  } else {
    cell = Math.min(W * 0.9 / (N + 4), H * 0.19);
    x0 = (W - N * cell) / 2 + cell / 2;
    baseY = H * 0.6;
  }
}

function geo(b) {
  const s = 1 + b.y * 0.16;
  const gx = x0 + b.x * cell;
  const gy = baseY + b.y * cell * 0.62;
  const fs = cell * 0.8 * s;
  const leg = cell * 0.2 * s;
  return { s, gx, gy, fs, leg, cy: gy - leg - fs * 0.42 };
}

function hit(x, y) {
  let best = -1, bd = 1e9;
  bits.forEach((b, k) => {
    const g = geo(b);
    const dx = Math.abs(x - g.gx), dy = Math.abs(y - g.cy);
    if (dx < cell * 0.55 && dy < g.fs * 0.75 && dx + dy < bd) { bd = dx + dy; best = k; }
  });
  return best;
}

// ── step ───────────────────────────────────────────────────────────────────
function step(dt) {
  T += dt;
  for (let k = timers.length - 1; k >= 0; k--) {
    timers[k].t -= dt;
    if (timers[k].t <= 0) { const f = timers[k].fn; timers.splice(k, 1); f(); }
  }
  fuss = Math.max(0, fuss - dt * 0.012);
  wide = Math.max(0, wide - dt * 0.6);

  if (culprit >= 0) {
    idleT += dt;
    bits[culprit].yt = 0.5 + Math.min(0.32, idleT * 0.018);   // left alone, it creeps further out
  }

  bits.forEach(b => {
    const ax = (b.xt - b.x);
    b.x += ax * Math.min(1, dt * 5.5);
    if (Math.abs(ax) < 0.02) b.walk = Math.max(0, b.walk - dt * 3);

    b.vy += ((b.yt - b.y) * 90 - b.vy * 11) * dt;
    b.y += b.vy * dt;
    b.squash *= Math.exp(-dt * 9);
    b.flinch = Math.max(0, b.flinch - dt * 2.5);
    b.shut = Math.max(0, b.shut - dt);

    b.blink -= dt;
    if (b.blink < 0) { b.shut = Math.max(b.shut, 0.13); b.blink = rnd(2.5, 6); }
    b.glanceT -= dt;
    if (b.glanceT < 0) { b.glance = b.glance ? 0 : 1; b.glanceT = b.glance ? rnd(0.6, 1.4) : rnd(3, 7); }
  });
}

// ── draw ───────────────────────────────────────────────────────────────────
function drawGround() {
  const top = baseY - cell * 0.18, bot = baseY + cell * 0.85;
  const g = ctx.createLinearGradient(0, top, 0, bot);
  g.addColorStop(0, 'rgba(226,214,190,0)');
  g.addColorStop(0.25, 'rgba(226,214,190,.55)');
  g.addColorStop(1, 'rgba(226,214,190,0)');
  ctx.fillStyle = g;
  ctx.fillRect(0, top, W, bot - top);

  ctx.strokeStyle = CHALK; ctx.lineCap = 'round';
  ctx.globalAlpha = 0.9;
  ctx.lineWidth = Math.max(1.5, cell * 0.035);
  for (let i = 0; i < N; i++) {
    const x = x0 + i * cell, w = cell * 0.2;
    ctx.beginPath();
    ctx.moveTo(x - w, baseY + cell * 0.04); ctx.lineTo(x + w, baseY + cell * 0.04);
    ctx.moveTo(x, baseY - cell * 0.02); ctx.lineTo(x, baseY + cell * 0.1);
    ctx.stroke();
  }
  ctx.globalAlpha = 1;
}

function lookAt(b, g) {
  if (wide > 0.3) return [0, 0.25];
  if (b.i === culprit) {
    if (px >= 0) {
      const dx = px - g.gx, dy = py - g.cy, d = Math.hypot(dx, dy) || 1;
      return [dx / d, dy / d];
    }
    return [Math.sin(T * 7) * 0.5, 0.6];
  }
  if (culprit >= 0 && !b.glance) {
    const c = geo(bits[culprit]);
    return [Math.sign(c.gx - g.gx) * 0.95, 0.25];
  }
  return [0, 0.35];
}

function drawBit(b) {
  const g = geo(b);
  const { gx, gy, fs, leg } = g;
  const sway = Math.sin(T * (1.3 + fuss * 4) + b.seed) * (0.012 + fuss * 0.07)
             + b.flinch * 0.22 * Math.sin(b.seed * 3);

  ctx.fillStyle = 'rgba(34,37,47,.12)';
  ctx.beginPath();
  ctx.ellipse(gx, gy + fs * 0.02, fs * 0.36, fs * 0.06, 0, 0, Math.PI * 2);
  ctx.fill();

  ctx.save();
  ctx.translate(gx, gy);
  ctx.rotate(sway);
  ctx.scale(1 + b.squash * 0.22, 1 - b.squash * 0.22);

  // legs
  ctx.strokeStyle = INK; ctx.lineCap = 'round';
  ctx.lineWidth = fs * 0.065;
  for (const side of [-1, 1]) {
    const lift = Math.max(0, Math.sin(T * 15 + b.seed + (side > 0 ? Math.PI : 0))) * b.walk * leg * 0.55;
    const lx = side * fs * 0.13;
    ctx.beginPath();
    ctx.moveTo(lx, -leg - fs * 0.02);
    ctx.lineTo(lx, -lift);
    ctx.stroke();
    ctx.beginPath();
    ctx.ellipse(lx + side * fs * 0.03, -lift, fs * 0.06, fs * 0.03, 0, 0, Math.PI * 2);
    ctx.fillStyle = INK; ctx.fill();
  }

  // body
  const cy = -leg - fs * 0.42;
  ctx.fillStyle = INK;
  ctx.font = `${fs}px 'Black Han Sans'`;
  ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  ctx.fillText(b.ch, 0, cy + fs * 0.04);

  // cheeks
  const blush = clamp(b.y * 1.7, 0, 0.85);
  if (blush > 0.02) {
    ctx.fillStyle = `rgba(241,120,120,${blush})`;
    for (const side of [-1, 1]) {
      ctx.beginPath();
      ctx.ellipse(side * fs * 0.3, cy + fs * 0.06, fs * 0.075, fs * 0.04, 0, 0, Math.PI * 2);
      ctx.fill();
    }
  }

  // eyes
  const [lx, ly] = lookAt(b, g);
  const jit = b.i === culprit ? fuss * 0.15 : fuss * 0.08;
  const rx = fs * 0.085 * (1 + wide * 0.25);
  const ry = rx * (b.shut > 0 ? 0.14 : 1.12);
  for (const side of [-1, 1]) {
    const ex = side * fs * 0.15, ey = cy - fs * 0.1;
    ctx.beginPath();
    ctx.ellipse(ex, ey, rx, ry, 0, 0, Math.PI * 2);
    ctx.fillStyle = '#fff'; ctx.fill();
    ctx.lineWidth = fs * 0.02; ctx.strokeStyle = INK; ctx.stroke();
    if (b.shut <= 0) {
      const pr = rx * 0.5;
      const ox = clamp(lx + rnd(-jit, jit), -1, 1) * (rx - pr) * 0.95;
      const oy = clamp(ly + rnd(-jit, jit), -1, 1) * (ry - pr) * 0.8;
      ctx.beginPath();
      ctx.arc(ex + ox, ey + oy, pr, 0, Math.PI * 2);
      ctx.fillStyle = INK; ctx.fill();
    }
  }
  ctx.restore();
}

function drawHud() {
  const e = error();
  const cx = W / 2;
  if (PREVIEW) {
    ctx.fillStyle = RED;
    ctx.font = `700 ${Math.round(H * 0.1)}px 'Space Mono'`;
    ctx.textAlign = 'center'; ctx.textBaseline = 'alphabetic';
    ctx.fillText(`+${e.toFixed(2)}`, cx, H * 0.2);
    return;
  }
  const y = H * 0.17;
  ctx.textAlign = 'center';
  ctx.fillStyle = 'rgba(34,37,47,.55)';
  ctx.font = `700 ${Math.round(cell * 0.13)}px 'Noto Sans KR'`;
  ctx.fillText('오차', cx, y - cell * 0.42);
  ctx.fillStyle = e > 0.01 ? RED : INK;
  ctx.font = `700 ${Math.round(cell * 0.42)}px 'Space Mono'`;
  ctx.fillText(`+${e.toFixed(2)}`, cx, y + cell * 0.04);
  ctx.fillStyle = 'rgba(34,37,47,.55)';
  ctx.font = `400 ${Math.round(cell * 0.11)}px 'Space Mono'`;
  ctx.fillText(`PUSHED ${String(pushes).padStart(2, '0')}   ·   SHIFT ${shift}/${MAX_SHIFT - 1}`, cx, y + cell * 0.3);
}

function draw() {
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  ctx.fillStyle = '#f4f1ea';
  ctx.fillRect(0, 0, W, H);
  drawGround();
  [...bits].sort((a, b) => a.y - b.y).forEach(drawBit);
  drawHud();
}

let last = 0;
function frame(t) {
  const dt = Math.min(0.05, (t - (last || t)) / 1000);
  last = t;
  if (!PREVIEW) step(dt);
  draw();
  requestAnimationFrame(frame);
}

// ── input ──────────────────────────────────────────────────────────────────
const sndEl = document.getElementById('snd');
sndEl.addEventListener('click', () => {
  sound.kick();
  sndEl.textContent = 'SOUND: ' + (sound.toggle() ? 'ON' : 'OFF');
});

addEventListener('resize', resize);
addEventListener('pointermove', e => { px = e.clientX; py = e.clientY; });
addEventListener('pointerleave', () => { px = py = -1; });
addEventListener('pointerdown', e => {
  if (e.target.closest('.snd') || e.target.closest('.home-btn')) return;
  sound.kick();
  px = e.clientX; py = e.clientY;
  const k = hit(px, py);
  if (k < 0) return;
  if (k === culprit) push(k);
  else { bits[k].flinch = 1; bits[k].shut = 0.2; sound.poke(); }
});

(async () => {
  try {
    await Promise.all([
      document.fonts.load("400 80px 'Black Han Sans'"),
      document.fonts.load("700 20px 'Noto Sans KR'"),
      document.fonts.load("700 20px 'Space Mono'"),
      document.fonts.load("400 20px 'Space Mono'"),
    ]);
  } catch (e) { /* fall back to system glyphs */ }
  resize();
  if (PREVIEW) {
    culprit = 4;
    bits[4].y = bits[4].yt = 0.58;
    pushes = 6;
  } else {
    sound.kick();
    setTimeout(() => sound.kick(), 400);
    after(1.2, () => popOut(4));
  }
  requestAnimationFrame(frame);
})();
</script>
</body>
</html>
