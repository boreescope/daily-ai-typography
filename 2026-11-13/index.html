0.823,1.018,0.871,1.886,1.035,0.865,1.157,0.689,1.216,0.988,0.873,1.017,0.813,1.163,1.082,1.017,0.935,1.278,1.135,0.772,1.073,1.047,0.681,1.051,0.924,0.745,1.072,1.003,1.004,0.847,0.894,0.92,1.053,1.022,0.881,0.824,0.904,1.058,0.875,1.221,0.909,0.931,1.056,0.871,1.023,1.177,1.122,1.11,0.927,0.863,0.983,0.975,1.057,0.997,1.209,1.179,0.823,0.892,0.973,1.337],"pred":[0,129,103,95,53,33,69,56,47,98,90,105,52,115,80,136,89,79,59,112,107,58,90,202,120,139,91,87,74,69,128,140,288,178,90,72,152,91,178,141,144,92,170,105,184,119,106,84,156,130,0,83,61,191,74,60,152,113,129,112,111,81,270,104,159,96,160,117,116,112,116,114,82,100,83,94,222,88,61,109,139,74,69,119,150,194,142,52,91,123,80,55,76,161,147,148,231,63,50,86,67,150,41,62,55,40,46,54,122,166,186,26],"real":[0,100,120,107,40,40,67,40,53,120,160,67,67,93,80,160,107,80,53,160,107,67,80,220,140,160,93,60,80,80,107,140,280,80,80,60,120,80,220,140,140,100,160,90,187,120,160,100,160,160,0,120,40,200,60,140,160,93,160,60,160,80,220,107,120,120,180,120,107,160,140,80,90,107,50,100,200,60,67,110,140,60,60,107,160,200,120,40,80,133,67,70,67,147,160,120,240,80,60,100,60,120,40,60,60,40,60,67,93,140,180,40]}]}/*END*/;

const PREVIEW = new URLSearchParams(location.search).has('preview');
if (PREVIEW) document.body.classList.add('preview');

const cv = document.getElementById('cv');
const ctx = cv.getContext('2d');
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const lerp = (a, b, t) => a + (b - a) * t;

const BLUE = '#3461b8', RED = '#e2412e', INK = '#23262e', PAPER = '#f7f6f2';
const SUB = { 1: '#0052A4', 2: '#00A84D', 3: '#EF7C1C', 4: '#00A5DE', 5: '#996CAC', 6: '#CD7C2F', 7: '#747F00' };
const N = DATA.names.length, TURN = 56;          // stops 1..56 run on top, 57..113 come back below
const HOURS = DATA.hours;

let W = 0, H = 0, S = 1, hi = 0, holding = false, touched = false;
let autoT = 0, scaleNow = 1;
const disp = new Float32Array(N - 1).fill(1);    // shown ratio per segment, springs toward target
const vel = new Float32Array(N - 1);

// ── sound ──────────────────────────────────────────────────────────────────
const sound = (() => {
  let ac = null, master = null, on = true;
  const boot = () => {
    if (ac) return;
    ac = new (window.AudioContext || window.webkitAudioContext)();
    master = ac.createGain(); master.gain.value = 0.8;
    master.connect(ac.destination);
    // engine idle under the floor
    const n = ac.sampleRate * 2, b = ac.createBuffer(1, n, ac.sampleRate), d = b.getChannelData(0);
    let last = 0;
    for (let i = 0; i < n; i++) { last = (last + 0.02 * (Math.random() * 2 - 1)) / 1.02; d[i] = last * 5; }
    const s = ac.createBufferSource(), f = ac.createBiquadFilter(), g = ac.createGain();
    s.buffer = b; s.loop = true; f.type = 'lowpass'; f.frequency.value = 160; g.gain.value = 0.07;
    s.connect(f); f.connect(g); g.connect(master); s.start();
    const o = ac.createOscillator(), og = ac.createGain();
    o.type = 'sine'; o.frequency.value = 42; og.gain.value = 0.02;
    o.connect(og); og.connect(master); o.start();
  };
  const tone = (freq, dur, peak, type = 'sine', at = 0, bend = 0) => {
    if (!ac || !on) return;
    const t = ac.currentTime + at, o = ac.createOscillator(), g = ac.createGain();
    o.type = type; o.frequency.setValueAtTime(freq, t);
    if (bend) o.frequency.exponentialRampToValueAtTime(freq * bend, t + dur);
    g.gain.setValueAtTime(0.0001, t);
    g.gain.exponentialRampToValueAtTime(peak, t + 0.01);
    g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    o.connect(g); g.connect(master); o.start(t); o.stop(t + dur + 0.05);
  };
  return {
    kick() { boot(); if (ac.state === 'suspended') ac.resume(); },
    toggle() { on = !on; if (master) master.gain.value = on ? 0.8 : 0; return on; },
    bell() { tone(1318, 0.9, 0.06, 'triangle'); tone(1046, 1.2, 0.05, 'triangle', 0.28); },
    stretch() { tone(110, 0.6, 0.06, 'sine', 0, 0.72); },
    snap() { tone(180, 0.3, 0.05, 'sine', 0, 1.7); },
  };
})();

// ── layout ─────────────────────────────────────────────────────────────────
const L = {};
function layout() {
  S = Math.min(W / 1440, H / 900);
  const mid = PREVIEW ? H * 0.56 : H * 0.5;
  L.gap = PREVIEW ? 64 : 104 * S;
  L.yTop = mid - L.gap / 2; L.yBot = mid + L.gap / 2;
  L.x0 = PREVIEW ? 34 : 120 * S;
  L.avail = W - L.x0 - (PREVIEW ? 34 : 150 * S);
  L.u = L.avail * 0.8 / (TURN - 1);              // px per segment when real == announced
  L.lw = PREVIEW ? 5 : 7 * S;
}

// positions of every stop for the shown ratios
function place(scale) {
  const P = new Array(N), u = L.u * scale;
  P[0] = { x: L.x0, y: L.yTop };
  for (let k = 1; k < TURN; k++) P[k] = { x: P[k - 1].x + u * disp[k - 1], y: L.yTop };
  P[TURN] = { x: P[TURN - 1].x, y: L.yBot };      // the turn segment bulges instead of moving
  for (let k = TURN + 1; k < N; k++) P[k] = { x: P[k - 1].x - u * disp[k - 1], y: L.yBot };
  return P;
}

function fitScale() {
  const P = place(1);
  let maxX = 0, minX = Infinity;
  for (const p of P) { maxX = Math.max(maxX, p.x); minX = Math.min(minX, p.x); }
  const span = maxX - Math.min(L.x0, minX);
  return Math.min(1, L.avail / span);
}

const target = k => holding ? 1 : HOURS[hi].ratio[k];

function setHour(i) {
  i = clamp(i, 0, HOURS.length - 1);
  if (i === hi) return;
  hi = i; sound.bell();
}

// seconds → "3시간 18분" / "52분"
function hm(sec) {
  const m = Math.round(sec / 60), h = Math.floor(m / 60);
  return h ? `${h}시간 ${m % 60}분` : `${m}분`;
}
const ampm = h => (h < 12 ? '오전 ' : '오후 ') + ((h + 11) % 12 + 1) + '시';

// ── draw ───────────────────────────────────────────────────────────────────
function segColor(d) {
  const t = clamp((d - 1.08) / 0.5, 0, 1);
  if (t <= 0) return BLUE;
  const a = [0x34, 0x61, 0xb8], b = [0xe2, 0x41, 0x2e];
  return `rgb(${a.map((v, i) => Math.round(lerp(v, b[i], t))).join(',')})`;
}

function stackText(str, x, y, dir, fs) {
  const lh = fs * 1.06, chars = [...str];
  for (let i = 0; i < chars.length; i++) {
    const j = dir < 0 ? chars.length - 1 - i : i;
    ctx.fillText(chars[j], x, y + dir * i * lh);
  }
  return chars.length * lh;
}

function drawHeader() {
  const hr = HOURS[hi], y = 70 * S;
  ctx.textBaseline = 'middle';
  ctx.fillStyle = BLUE;
  ctx.beginPath(); ctx.roundRect(L.x0, y - 24 * S, 104 * S, 48 * S, 10 * S); ctx.fill();
  ctx.fillStyle = '#fff'; ctx.textAlign = 'center';
  ctx.font = `900 ${32 * S}px 'Noto Sans KR'`;
  ctx.fillText('273', L.x0 + 52 * S, y + 1 * S);
  ctx.textAlign = 'left';
  ctx.strokeStyle = BLUE; ctx.lineWidth = 1.5 * S;
  ctx.beginPath(); ctx.roundRect(L.x0 + 118 * S, y - 11 * S, 40 * S, 22 * S, 11 * S); ctx.stroke();
  ctx.fillStyle = BLUE; ctx.font = `700 ${12 * S}px 'Noto Sans KR'`;
  ctx.fillText('간선', L.x0 + 126 * S, y + 1 * S);
  ctx.fillStyle = INK; ctx.font = `700 ${19 * S}px 'Noto Sans KR'`;
  ctx.fillText('중랑공영차고지  ↔  홍익대학교', L.x0 + 172 * S, y + 1 * S);

  const P = hr.pred.reduce((a, b) => a + b, 0), R = hr.real.reduce((a, b) => a + b, 0);
  const xr = W - 150 * S;
  ctx.textAlign = 'right';
  ctx.font = `700 ${22 * S}px 'Noto Sans KR'`; ctx.fillStyle = INK;
  ctx.fillText(ampm(hr.h) + '대', xr, y - 8 * S);
  ctx.font = `400 ${13 * S}px 'Noto Sans KR'`;
  ctx.fillStyle = holding ? INK : 'rgba(35,38,46,.45)';
  const a = `안내  ${hm(P)}`, b = `실제  ${hm(R)}`;
  ctx.fillText(a, xr - ctx.measureText(`   ·   ${b}`).width, y + 18 * S);
  ctx.fillStyle = holding ? 'rgba(35,38,46,.45)' : (R > P ? RED : BLUE);
  ctx.fillText(`   ·   ${b}`, xr, y + 18 * S);
}

function drawFooter() {
  const y = H - 84 * S, gap = 46 * S, x0 = W / 2 - (HOURS.length - 1) * gap / 2;
  ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  HOURS.forEach((hr, i) => {
    const x = x0 + i * gap, cur = i === hi;
    if (cur) { ctx.fillStyle = BLUE; ctx.beginPath(); ctx.roundRect(x - 19 * S, y - 12 * S, 38 * S, 24 * S, 12 * S); ctx.fill(); }
    ctx.fillStyle = cur ? '#fff' : 'rgba(35,38,46,.4)';
    ctx.font = `${cur ? 700 : 500} ${12 * S}px 'Noto Sans KR'`;
    ctx.fillText(hr.h + '시', x, y + 1 * S);
  });
  ctx.textAlign = 'right'; ctx.fillStyle = 'rgba(35,38,46,.38)';
  ctx.font = `400 ${10.5 * S}px 'Noto Sans KR'`;
  ctx.fillText(`출처: 서울특별시 버스도착정보 · ${DATA.when} · 40초마다 기록`, W - 30 * S, H - 26 * S);
}

function drawLine(P) {
  const hr = HOURS[hi];
  ctx.lineCap = 'round';
  // left loop back to the garage: no data, drawn plain
  const a = P[N - 1], z = P[0], bx = Math.min(a.x, z.x) - L.gap * 0.55;
  ctx.strokeStyle = BLUE; ctx.globalAlpha = 0.55; ctx.lineWidth = L.lw;
  ctx.beginPath(); ctx.moveTo(a.x, a.y); ctx.bezierCurveTo(bx, a.y, bx, z.y, z.x, z.y); ctx.stroke();
  ctx.globalAlpha = 1;
  for (let k = 0; k < N - 1; k++) {
    const p = P[k], q = P[k + 1], d = disp[k];
    ctx.strokeStyle = segColor(d);
    ctx.lineWidth = clamp(L.lw / Math.sqrt(Math.max(0.2, d)), L.lw * 0.35, L.lw * 1.7);
    ctx.beginPath(); ctx.moveTo(p.x, p.y);
    if (k === TURN - 1) {
      const bx2 = p.x + L.gap * 0.55 * Math.max(0.4, d);
      ctx.bezierCurveTo(bx2, p.y, bx2, q.y, q.x, q.y);
    } else ctx.lineTo(q.x, q.y);
    ctx.stroke();
  }
  // direction chevrons
  ctx.strokeStyle = '#fff'; ctx.lineWidth = 1.4 * S;
  for (let k = 3; k < N - 1; k += 7) {
    if (k === TURN - 1 || DATA.ghost[k] || DATA.ghost[k + 1]) continue;
    const p = P[k], q = P[k + 1], mx = (p.x + q.x) / 2, dir = Math.sign(q.x - p.x) || 1, c = 2.2 * S;
    if (Math.abs(q.x - p.x) < 12 * S) continue;
    ctx.beginPath(); ctx.moveTo(mx - dir * c, p.y - c); ctx.lineTo(mx + dir * c, p.y); ctx.lineTo(mx - dir * c, p.y + c); ctx.stroke();
  }
  // delay tags on the most stretched segments
  if (!PREVIEW) {
    const top = hr.ratio.map((r, k) => ({ k, r, diff: hr.real[k] - hr.pred[k] }))
      .filter(o => o.r > 1.2 && o.diff >= 20 && o.k !== TURN - 1).sort((a, b) => b.diff - a.diff).slice(0, 5);
    ctx.textAlign = 'center'; ctx.font = `700 ${11 * S}px 'Noto Sans KR'`;
    for (const o of top) {
      const p = P[o.k], q = P[o.k + 1], show = clamp((disp[o.k] - 1) / (o.r - 1), 0, 1);
      if (show < 0.05) continue;
      ctx.globalAlpha = show; ctx.fillStyle = RED;
      const inward = p.y === L.yTop ? 1 : -1;
      ctx.textBaseline = inward > 0 ? 'top' : 'bottom';
      ctx.fillText(`+${o.diff}초`, (p.x + q.x) / 2, p.y + inward * 11 * S);
    }
    ctx.globalAlpha = 1;
  }
}

function drawStops(P) {
  const fs = Math.max(8, 11 * S), r = PREVIEW ? 2.2 : 4.2 * S;
  ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  for (let k = 0; k < N; k++) {
    if (DATA.ghost[k]) continue;
    const p = P[k], top = p.y === L.yTop, end = k === 0 || k === 53;
    ctx.fillStyle = '#fff'; ctx.strokeStyle = BLUE; ctx.lineWidth = (end ? 3 : 2) * (PREVIEW ? 0.6 : S);
    ctx.beginPath(); ctx.arc(p.x, p.y, end ? r * 1.8 : r, 0, Math.PI * 2); ctx.fill(); ctx.stroke();
    if (PREVIEW || k === N - 1) continue;
    const near = Math.max(disp[k - 1] || 1, disp[k] || 1);
    ctx.fillStyle = near > 1.25 ? RED : INK;
    ctx.font = `${end ? 900 : 500} ${fs}px 'Noto Sans KR'`;
    const name = [...DATA.names[k]].slice(0, 9).join('');
    const dir = top ? -1 : 1, y0 = p.y + dir * (r + 10 * S);
    const len = stackText(name, p.x, y0, dir, fs);
    let y = y0 + dir * (len + 4 * S);
    for (const ln of DATA.lines[k]) {
      ctx.fillStyle = SUB[ln];
      ctx.beginPath(); ctx.arc(p.x, y, 6 * S, 0, Math.PI * 2); ctx.fill();
      ctx.fillStyle = '#fff'; ctx.font = `700 ${8.5 * S}px 'Noto Sans KR'`;
      ctx.fillText(ln, p.x, y + 0.5 * S);
      ctx.font = `500 ${fs}px 'Noto Sans KR'`;
      y += dir * 14 * S;
    }
  }
}

function draw() {
  ctx.fillStyle = PAPER; ctx.fillRect(0, 0, W, H);
  ctx.save();
  // the whole map shrinks to fit when the stretched route runs out of paper
  const P = place(scaleNow);
  if (!PREVIEW) drawHeader();
  else {
    ctx.fillStyle = BLUE; ctx.beginPath(); ctx.roundRect(L.x0, 20, 64, 30, 7); ctx.fill();
    ctx.fillStyle = '#fff'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    ctx.font = `900 20px 'Noto Sans KR'`; ctx.fillText('273', L.x0 + 32, 36);
  }
  drawLine(P);
  drawStops(P);
  if (!PREVIEW) drawFooter();
  ctx.restore();
}

// ── motion ─────────────────────────────────────────────────────────────────
let T = 0, changeT = 0;
const want = new Float32Array(N - 1).fill(1), tgt = new Float32Array(N - 1).fill(1);
function refresh() {
  for (let k = 0; k < N - 1; k++) want[k] = target(k);
  changeT = T;
}
function hold(v) {
  if (v === holding) return;
  holding = v; refresh();
  v ? sound.snap() : sound.stretch();
}

function step(dt) {
  T += dt;
  for (let k = 0; k < N - 1; k++) {
    if (T - changeT >= k * 0.009) tgt[k] = want[k];   // change runs down the route like a pulled cord
    vel[k] += (tgt[k] - disp[k]) * 70 * dt;
    vel[k] *= Math.exp(-6 * dt);
    disp[k] += vel[k] * dt;
  }
  scaleNow = lerp(scaleNow, fitScale(), 1 - Math.exp(-3 * dt));
  if (!touched) {
    autoT += dt;
    if (!holding && autoT > 7) { autoT = 0; hold(true); }
    if (holding && autoT > 2.4) {
      autoT = 0;
      if (HOURS.length > 1) { hi = (hi + 1) % HOURS.length; sound.bell(); }
      hold(false);
    }
  }
}

function resize() {
  const dpr = Math.min(2, window.devicePixelRatio || 1);
  W = innerWidth; H = innerHeight;
  cv.width = W * dpr; cv.height = H * dpr;
  cv.style.width = W + 'px'; cv.style.height = H + 'px';
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  layout();
}

let last = 0;
function frame(t) {
  const dt = Math.min(0.05, (t - (last || t)) / 1000); last = t;
  if (!PREVIEW) step(dt);
  draw();
  requestAnimationFrame(frame);
}

// ── input ──────────────────────────────────────────────────────────────────
const sndEl = document.getElementById('snd');
sndEl.addEventListener('click', () => { sound.kick(); sndEl.textContent = 'SOUND: ' + (sound.toggle() ? 'ON' : 'OFF'); });
const userTouch = () => {
  sound.kick();
  if (!touched) { touched = true; document.getElementById('hint').classList.add('off'); }
};
const stepHour = dir => {
  userTouch();
  const before = hi; setHour(hi + dir);
  if (hi !== before) refresh();
};
addEventListener('keydown', e => {
  if (e.key === 'ArrowRight' || e.key === 'ArrowUp') stepHour(1);
  if (e.key === 'ArrowLeft' || e.key === 'ArrowDown') stepHour(-1);
  if (e.key === ' ' && !e.repeat) { userTouch(); hold(true); }
});
addEventListener('keyup', e => { if (e.key === ' ') hold(false); });
let wheelAcc = 0;
addEventListener('wheel', e => { wheelAcc += e.deltaY; if (Math.abs(wheelAcc) > 80) { stepHour(Math.sign(wheelAcc)); wheelAcc = 0; } }, { passive: true });
addEventListener('pointerdown', e => {
  if (e.target.closest('.snd') || e.target.closest('.home-btn')) return;
  userTouch(); hold(true);
});
addEventListener('pointerup', () => hold(false));
addEventListener('pointercancel', () => hold(false));
addEventListener('resize', resize);

(async () => {
  try {
    await Promise.all([500, 700, 900].map(w => document.fonts.load(`${w} 20px 'Noto Sans KR'`)));
  } catch (e) { /* fall back */ }
  hi = HOURS.length - 1;
  resize();
  if (PREVIEW) { for (let k = 0; k < N - 1; k++) disp[k] = target(k); scaleNow = fitScale(); }
  else {
    sound.kick(); setTimeout(() => sound.kick(), 400);
    setTimeout(() => { refresh(); sound.stretch(); }, 900);   // opens on the announced map, then lets go
  }
  requestAnimationFrame(frame);
})();
</script>
</body>
</html>
