    const n = ac.sampleRate * 2, b = ac.createBuffer(1, n, ac.sampleRate), d = b.getChannelData(0);
    let last = 0;
    for (let i = 0; i < n; i++) { last = (last + 0.02 * (Math.random() * 2 - 1)) / 1.02; d[i] = last * 5; }
    const s = ac.createBufferSource(), f = ac.createBiquadFilter(), g = ac.createGain();
    s.buffer = b; s.loop = true; f.type = 'lowpass'; f.frequency.value = 160; hum = f; g.gain.value = 0.07;
    s.connect(f); f.connect(g); g.connect(master); s.start();
    const o = ac.createOscillator(), og = ac.createGain();
    o.type = 'sine'; o.frequency.value = 42; og.gain.value = 0.02;
    o.connect(og); og.connect(master); o.start();
  };
  const tone = (freq, dur, peak, type = 'sine', at = 0, bend = 0) => {
    if (!ac || !on) return;
    const t = ac.currentTime + at, o = ac.createOscillator(), g = ac.createGain();
    o.type = type; o.frequency.setValueAtTime(freq, t);
    if (bend) o.frequency.exponentialRampToValueAtTime(freq * bend, t + dur);
    g.gain.setValueAtTime(0.0001, t);
    g.gain.exponentialRampToValueAtTime(peak, t + 0.01);
    g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    o.connect(g); g.connect(master); o.start(t); o.stop(t + dur + 0.05);
  };
  return {
    kick() { boot(); if (ac.state === 'suspended') ac.resume(); },
    toggle() { on = !on; if (master) master.gain.value = on ? 0.8 : 0; return on; },
    bell() { tone(1318, 0.9, 0.06, 'triangle'); tone(1046, 1.2, 0.05, 'triangle', 0.28); },
    stretch() { tone(110, 0.6, 0.06, 'sine', 0, 0.72); },
    snap() { tone(180, 0.3, 0.05, 'sine', 0, 1.7); },
    tick(r) { tone(clamp(2400 / r, 900, 3600), 0.05, 0.012, 'sine'); },
    zoom(z) { if (hum) hum.frequency.setTargetAtTime(160 + Math.log(z) * 260, ac.currentTime, 0.2); },
  };
})();

// ── layout ─────────────────────────────────────────────────────────────────
const L = {};
function layout() {
  S = Math.min(W / 1440, H / 900);
  const mid = PREVIEW ? H * 0.56 : H * 0.5;
  L.gap = PREVIEW ? 64 : 104 * S;
  L.yTop = mid - L.gap / 2; L.yBot = mid + L.gap / 2;
  L.x0 = PREVIEW ? 34 : 120 * S;
  L.avail = W - L.x0 - (PREVIEW ? 34 : 150 * S);
  L.u = L.avail * 0.8 / (TURN - 1);              // px per segment when real == announced
  L.lw = PREVIEW ? 5 : 7 * S;
}

// positions of every stop for the shown ratios
function place(scale) {
  const P = new Array(N), u = L.u * scale;
  P[0] = { x: L.x0, y: L.yTop };
  for (let k = 1; k < TURN; k++) P[k] = { x: P[k - 1].x + u * disp[k - 1], y: L.yTop };
  P[TURN] = { x: P[TURN - 1].x, y: L.yBot };      // the turn segment bulges instead of moving
  for (let k = TURN + 1; k < N; k++) P[k] = { x: P[k - 1].x - u * disp[k - 1], y: L.yBot };
  return P;
}

function fitScale() {
  const P = place(1);
  let maxX = 0, minX = Infinity;
  for (const p of P) { maxX = Math.max(maxX, p.x); minX = Math.min(minX, p.x); }
  const span = maxX - Math.min(L.x0, minX);
  return Math.min(1, L.avail / span);
}

const target = k => holding ? 1 : HOURS[hi].ratio[k];

function setHour(i) {
  i = clamp(i, 0, HOURS.length - 1);
  if (i === hi) return;
  hi = i; sound.bell();
}

// seconds → "3시간 18분" / "52분"
function hm(sec) {
  const m = Math.round(sec / 60), h = Math.floor(m / 60);
  return h ? `${h}시간 ${m % 60}분` : `${m}분`;
}
const ampm = h => (h < 12 ? '오전 ' : '오후 ') + ((h + 11) % 12 + 1) + '시';

// ── camera: world = the overview map, screen = world zoomed around cam.c ─────
const X = x => (x - cam.cx) * cam.z + W / 2;
const Y = y => (y - cam.cy) * cam.z + H / 2;
const fiberFade = () => clamp((cam.z - 3) / 7, 0, 1);
const secs = v => v >= 60 ? `${Math.floor(v / 60)}분 ${v % 60}초` : `${v}초`;
const clock = m => `${String(Math.floor(m / 60)).padStart(2, '0')}:${String(m % 60).padStart(2, '0')}`;

function segColor(d, alpha = 1) {
  const t = clamp((d - 1.005) / 0.015, 0, 1);   // on time or early = blue, late = red, no muddy middle
  const a = [0x34, 0x61, 0xb8], b = [0xe2, 0x41, 0x2e];
  const c = a.map((v, i) => Math.round(lerp(v, b[i], t)));
  return `rgba(${c.join(',')},${alpha})`;
}

function stackText(str, x, y, dir, fs) {
  const lh = fs * 1.06, chars = [...str];
  for (let i = 0; i < chars.length; i++) {
    const j = dir < 0 ? chars.length - 1 - i : i, yy = y + dir * i * lh;
    if (yy < -fs || yy > H + fs) continue;
    ctx.fillText(chars[j], x, yy);
  }
  return chars.length * lh;
}

function drawHeader() {
  const hr = HOURS[hi], y = 70 * S, a = clamp(1.6 - cam.z * 0.4, 0, 1);
  if (a <= 0) return;
  ctx.globalAlpha = a; ctx.textBaseline = 'middle';
  ctx.fillStyle = BLUE;
  ctx.beginPath(); ctx.roundRect(L.x0, y - 24 * S, 104 * S, 48 * S, 10 * S); ctx.fill();
  ctx.fillStyle = '#fff'; ctx.textAlign = 'center';
  ctx.font = `900 ${32 * S}px 'Noto Sans KR'`;
  ctx.fillText('273', L.x0 + 52 * S, y + 1 * S);
  ctx.textAlign = 'left';
  ctx.strokeStyle = BLUE; ctx.lineWidth = 1.5 * S;
  ctx.beginPath(); ctx.roundRect(L.x0 + 118 * S, y - 11 * S, 40 * S, 22 * S, 11 * S); ctx.stroke();
  ctx.fillStyle = BLUE; ctx.font = `700 ${12 * S}px 'Noto Sans KR'`;
  ctx.fillText('간선', L.x0 + 126 * S, y + 1 * S);
  ctx.fillStyle = INK; ctx.font = `700 ${19 * S}px 'Noto Sans KR'`;
  ctx.fillText('중랑공영차고지  ↔  홍익대학교', L.x0 + 172 * S, y + 1 * S);
  const P = hr.pred.reduce((a, b) => a + b, 0), R = hr.real.reduce((a, b) => a + b, 0);
  const xr = W - 150 * S;
  ctx.textAlign = 'right';
  ctx.font = `700 ${22 * S}px 'Noto Sans KR'`; ctx.fillStyle = INK;
  ctx.fillText(ampm(hr.h) + '대', xr, y - 8 * S);
  ctx.font = `400 ${13 * S}px 'Noto Sans KR'`;
  const b = `   ·   실제  ${hm(R)}`;
  ctx.fillStyle = holding ? INK : 'rgba(35,38,46,.45)';
  ctx.fillText(`안내  ${hm(P)}`, xr - ctx.measureText(b).width, y + 18 * S);
  ctx.fillStyle = holding ? 'rgba(35,38,46,.45)' : (R > P ? RED : BLUE);
  ctx.fillText(b, xr, y + 18 * S);
  ctx.globalAlpha = 1;
}

const chips = [];
function drawFooter() {
  const y = H - 84 * S, gap = 46 * S, x0 = W / 2 - (HOURS.length - 1) * gap / 2;
  chips.length = 0;
  ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  HOURS.forEach((hr, i) => {
    const x = x0 + i * gap, cur = i === hi;
    chips.push({ x: x - 20 * S, y: y - 14 * S, w: 40 * S, h: 28 * S, i });
    ctx.fillStyle = cur ? BLUE : 'rgba(247,246,242,.85)';
    ctx.beginPath(); ctx.roundRect(x - 19 * S, y - 12 * S, 38 * S, 24 * S, 12 * S); ctx.fill();
    ctx.fillStyle = cur ? '#fff' : 'rgba(35,38,46,.45)';
    ctx.font = `${cur ? 700 : 500} ${12 * S}px 'Noto Sans KR'`;
    ctx.fillText(hr.h + '시', x, y + 1 * S);
  });
  ctx.textAlign = 'right'; ctx.fillStyle = 'rgba(35,38,46,.38)';
  ctx.font = `400 ${10.5 * S}px 'Noto Sans KR'`;
  ctx.fillText(`출처: 서울특별시 버스도착정보 · ${DATA.when} · 40초마다 기록`, W - 30 * S, H - 26 * S);
}

// a small whole-route map with the view box, so a close-up never loses its place
function drawMinimap(P) {
  const a = clamp((cam.z - 1.4) / 1.5, 0, 1);
  if (a <= 0) return;
  let minX = Infinity, maxX = -Infinity;
  for (const p of P) { minX = Math.min(minX, p.x); maxX = Math.max(maxX, p.x); }
  const bw = 210 * S, k = bw / (maxX - minX + L.gap), ox = 30 * S, oy = H - 150 * S;
  const mx = x => ox + (x - minX + L.gap / 2) * k, my = y => oy + (y - L.yTop) * k;
  ctx.globalAlpha = a;
  ctx.fillStyle = 'rgba(247,246,242,.96)';
  ctx.fillRect(ox - 8 * S, oy - 36 * S, bw + 16 * S, L.gap * k + 50 * S);
  ctx.strokeStyle = BLUE; ctx.lineWidth = 2 * S; ctx.lineCap = 'round';
  ctx.beginPath();
  P.forEach((p, i) => i ? ctx.lineTo(mx(p.x), my(p.y)) : ctx.moveTo(mx(p.x), my(p.y)));
  ctx.closePath(); ctx.stroke();
  const vx0 = cam.cx - W / 2 / cam.z, vx1 = cam.cx + W / 2 / cam.z;
  const vy0 = cam.cy - H / 2 / cam.z, vy1 = cam.cy + H / 2 / cam.z;
  ctx.save(); ctx.beginPath(); ctx.rect(ox - 8 * S, oy - 14 * S, bw + 16 * S, L.gap * k + 28 * S); ctx.clip();
  ctx.strokeStyle = RED; ctx.lineWidth = 1.2 * S;
  ctx.strokeRect(mx(vx0), my(vy0), Math.max(2, (vx1 - vx0) * k), Math.max(2, (vy1 - vy0) * k));
  ctx.restore();
  ctx.textAlign = 'left'; ctx.textBaseline = 'bottom'; ctx.fillStyle = 'rgba(35,38,46,.55)';
  ctx.font = `700 ${10 * S}px 'Space Mono'`;
  ctx.fillText(`×${cam.z.toFixed(1)}`, ox, oy - 18 * S);
  ctx.globalAlpha = 1;
}

function drawLine(P) {
  const z = cam.z, ff = fiberFade(), lw = L.lw * z;
  ctx.lineCap = 'round';
  // loop back to the garage: no data, drawn plain
  const a = P[N - 1], o = P[0], bx = Math.min(a.x, o.x) - L.gap * 0.55;
  ctx.strokeStyle = segColor(1, 0.5); ctx.lineWidth = lw;
  ctx.beginPath(); ctx.moveTo(X(a.x), Y(a.y)); ctx.bezierCurveTo(X(bx), Y(a.y), X(bx), Y(o.y), X(o.x), Y(o.y)); ctx.stroke();
  for (let k = 0; k < N - 1; k++) {
    const p = P[k], q = P[k + 1], d = disp[k];
    const x1 = X(p.x), x2 = X(q.x);
    if (k !== TURN - 1 && Math.max(x1, x2) < -50 || Math.min(x1, x2) > W + 50) continue;
    const thin = k === TURN - 1 ? 1 : 1 - ff * 0.82;   // the averaged band gives way to the buses inside it
    ctx.strokeStyle = segColor(d, k === TURN - 1 ? 1 : lerp(1, 0.22, ff));
    ctx.lineWidth = clamp(lw / Math.sqrt(Math.max(0.2, d)), lw * 0.35, lw * 1.7) * thin;
    ctx.beginPath(); ctx.moveTo(x1, Y(p.y));
    if (k === TURN - 1) {
      const b2 = p.x + L.gap * 0.55 * Math.max(0.4, d);
      ctx.bezierCurveTo(X(b2), Y(p.y), X(b2), Y(q.y), x2, Y(q.y));
    } else ctx.lineTo(x2, Y(q.y));
    ctx.stroke();
  }
  if (ff > 0) drawFibers(P, ff);
}

// every bus that ran a segment, as its own strand: it starts at the stop and
// runs the length its real time would give, so it overshoots or falls short
function drawFibers(P, ff) {
  const hr = HOURS[hi], z = cam.z, u = L.u * scaleNow;
  const label = clamp((z - 9) / 5, 0, 1);
  for (let k = 0; k < N - 1; k++) {
    if (k === TURN - 1) continue;
    const obs = hr.obs[k], n = obs.length;
    if (!n) continue;
    const p = P[k], dir = k < TURN ? 1 : -1, xs = X(p.x);
    if (dir > 0 ? (xs > W + 40 || X(p.x + u * 2.6) < -40) : (xs < -40 || X(p.x - u * 2.6) > W + 40)) continue;
    const band = L.lw * (1 + 2.6 * ff), step = band / Math.max(1, n);
    for (let i = 0; i < n; i++) {
      const [m, pr, re] = obs[i], r = re / pr;
      const shown = 1 + (r - 1) * realness;
      const wy = p.y + (i - (n - 1) / 2) * step * ff;
      const sy = Y(wy), sx2 = X(p.x + dir * u * shown);
      if (sy < -20 || sy > H + 20) continue;
      ctx.strokeStyle = segColor(shown, 0.25 + 0.75 * ff);
      ctx.lineWidth = clamp(step * z * 0.12, 1, 5);
      ctx.beginPath(); ctx.moveTo(xs, sy); ctx.lineTo(sx2, sy); ctx.stroke();
      ctx.fillStyle = segColor(shown, ff);
      ctx.beginPath(); ctx.arc(sx2, sy, clamp(step * z * 0.12, 1.5, 6), 0, Math.PI * 2); ctx.fill();
      if (label <= 0) continue;
      const fs = clamp(step * z * 0.2, 9, 13);
      ctx.globalAlpha = label; ctx.font = `400 ${fs}px 'Space Mono'`; ctx.textBaseline = 'bottom';
      ctx.fillStyle = 'rgba(35,38,46,.6)'; ctx.textAlign = dir > 0 ? 'left' : 'right';
      ctx.fillText(`${clock(m)}  안내 ${secs(pr)} → 실제 ${secs(re)}`, xs + dir * 30, sy - 7);
      const diff = Math.round((re - pr) * realness);
      ctx.font = `700 ${fs}px 'Space Mono'`; ctx.fillStyle = diff > 0 ? RED : BLUE;
      ctx.textBaseline = 'middle';
      ctx.fillText(diff === 0 ? '±0' : (diff > 0 ? '+' : '−') + Math.abs(diff) + 's', sx2 + dir * 12, sy);
      ctx.globalAlpha = 1;
    }
  }
}

function drawStops(P) {
  const z = cam.z, ff = fiberFade();
  const fs = Math.max(8, 11 * S) * z, r = Math.min(22, (PREVIEW ? 2.2 : 4.2 * S) * z);
  ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  for (let k = 0; k < N; k++) {
    if (DATA.ghost[k]) continue;
    const p = P[k], x = X(p.x), y = Y(p.y), top = p.y === L.yTop, end = k === 0 || k === 53;
    if (x < -fs * 2 || x > W + fs * 2) continue;
    ctx.fillStyle = '#fff'; ctx.strokeStyle = BLUE;
    ctx.lineWidth = Math.min(5, (end ? 3 : 2) * (PREVIEW ? 0.6 : S) * z);
    ctx.globalAlpha = lerp(1, 0.55, ff);
    ctx.beginPath(); ctx.arc(x, y, end ? r * 1.8 : r, 0, Math.PI * 2); ctx.fill(); ctx.stroke();
    ctx.globalAlpha = 1;
    if (PREVIEW || k === N - 1) continue;
    const near = Math.max(disp[k - 1] || 1, disp[k] || 1);
    ctx.fillStyle = near > 1.25 ? RED : INK;
    ctx.globalAlpha = lerp(1, 0.16, ff);   // up close the names turn into a pale backdrop
    ctx.font = `${end ? 900 : 500} ${fs}px 'Noto Sans KR'`;
    const name = [...DATA.names[k]].slice(0, 9).join('');
    const dir = top ? -1 : 1;
    const y0 = y + dir * (r + fs * 0.6 + L.lw * 1.4 * ff * z);
    const len = stackText(name, x, y0, dir, fs);
    let yy = y0 + dir * (len + 4 * S * z);
    for (const ln of DATA.lines[k]) {
      ctx.fillStyle = SUB[ln];
      ctx.beginPath(); ctx.arc(x, yy, 6 * S * z, 0, Math.PI * 2); ctx.fill();
      ctx.fillStyle = '#fff'; ctx.font = `700 ${8.5 * S * z}px 'Noto Sans KR'`;
      ctx.fillText(ln, x, yy + 0.5 * S * z);
      yy += dir * 14 * S * z;
    }
    ctx.globalAlpha = 1;
  }
}

// which segment sits under the middle of the view
function focusSeg(P) {
  const top = Math.abs(cam.cy - L.yTop) < Math.abs(cam.cy - L.yBot);
  let best = -1, bd = Infinity;
  const k0 = top ? 0 : TURN, k1 = top ? TURN - 1 : N - 1;
  for (let k = k0; k < k1; k++) {
    const d = Math.abs((P[k].x + P[k + 1].x) / 2 - cam.cx);
    if (d < bd) { bd = d; best = k; }
  }
  return best;
}

function drawCaption(P, k) {
  const a = clamp((cam.z - 2.5) / 2, 0, 1);
  if (a <= 0 || k < 0) return;
  const hr = HOURS[hi], o = hr.obs[k];
  const name = i => DATA.ghost[i] ? DATA.names[i + 1] : DATA.names[i];
  ctx.globalAlpha = a; ctx.textAlign = 'left'; ctx.textBaseline = 'alphabetic';
  const x = 30 * S, y = 112 * S;
  ctx.fillStyle = INK; ctx.font = `900 ${28 * S}px 'Noto Sans KR'`;
  ctx.fillText(`${name(k)}  →  ${name(k + 1)}`, x, y);
  ctx.font = `400 ${12 * S}px 'Space Mono'`; ctx.fillStyle = 'rgba(35,38,46,.6)';
  const line = o.length
    ? `${ampm(hr.h)}대 · 버스 ${o.length}대 · 안내 평균 ${secs(hr.pred[k])} · 실제 평균 ${secs(hr.real[k])}`
    : `${ampm(hr.h)}대 · 기록 없음`;
  ctx.fillText(line, x, y + 26 * S);
  ctx.globalAlpha = 1;
}

function draw() {
  ctx.fillStyle = PAPER; ctx.fillRect(0, 0, W, H);
  const P = place(scaleNow);
  drawLine(P);
  drawStops(P);
  if (PREVIEW) {
    ctx.fillStyle = BLUE; ctx.beginPath(); ctx.roundRect(L.x0, 20, 64, 30, 7); ctx.fill();
    ctx.fillStyle = '#fff'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    ctx.font = `900 20px 'Noto Sans KR'`; ctx.fillText('273', L.x0 + 32, 36);
    return;
  }
  drawHeader();
  drawCaption(P, focusSeg(P));
  drawMinimap(P);
  drawFooter();
}

// ── motion ─────────────────────────────────────────────────────────────────
let T = 0, changeT = 0, lastStop = -1;
const want = new Float32Array(N - 1).fill(1), tgt = new Float32Array(N - 1).fill(1);
function refresh() {
  for (let k = 0; k < N - 1; k++) want[k] = target(k);
  changeT = T;
}
let started = false;
function hold(v) {
  if (v === holding) return;
  holding = v; refresh();
  v ? sound.snap() : sound.stretch();
}

// idle: the camera goes and looks at the worst segments by itself
const tour = { i: 0, t: 0 };
function tourStep(dt, P) {
  const segs = HOURS[hi].ratio.map((r, k) => ({ r, k })).filter(o => o.k !== TURN - 1 && DATA.names[o.k] !== DATA.names[o.k + 1] && HOURS[hi].obs[o.k].length >= 2)
    .sort((a, b) => b.r - a.r).slice(0, 6);
  if (!segs.length) return;
  tour.t += dt;
  const s = segs[tour.i % segs.length].k, p = P[s], q = P[s + 1], t = tour.t;
  cam.tx = (p.x + q.x) / 2 + (q.x - p.x) * 0.25 * Math.sin(t * 0.3); cam.ty = p.y;
  if (t < 0.5) cam.zt = 1;
  else if (t < 10) cam.zt = 20;
  else cam.zt = 1;
  if (t > 5.5 && t < 7.6) hold(true); else hold(false);
  if (t > 12.5) {
    tour.t = 0; tour.i++;
    if (HOURS.length > 1 && tour.i % 3 === 0) { hi = (hi + 1) % HOURS.length; sound.bell(); refresh(); }
  }
}

function step(dt) {
  T += dt;
  for (let k = 0; k < N - 1; k++) {
    if (T - changeT >= k * 0.009) tgt[k] = want[k];   // change runs down the route like a pulled cord
    vel[k] += (tgt[k] - disp[k]) * 70 * dt;
    vel[k] *= Math.exp(-6 * dt);
    disp[k] += vel[k] * dt;
  }
  realVel += ((holding || !started ? 0 : 1) - realness) * 50 * dt;
  realVel *= Math.exp(-5.5 * dt);
  realness += realVel * dt;
  scaleNow = lerp(scaleNow, fitScale(), 1 - Math.exp(-3 * dt));
  const P = place(scaleNow);
  if (touched && T - lastInput > 8 && !holding) { touched = false; tour.t = 0; }   // left alone: the camera goes back to touring
  if (!touched) tourStep(dt, P);
  else if (cam.px >= 0) {          // the pointer is a magnifier over the overview
    cam.tx = cam.px - (cam.px - W / 2) / cam.z;
    cam.ty = cam.py - (cam.py - H / 2) / cam.z;
  }
  const zBefore = cam.z;
  cam.z = Math.exp(lerp(Math.log(cam.z), Math.log(cam.zt), 1 - Math.exp(-(touched ? 7 : 1.6) * dt)));
  const ease = 1 - Math.exp(-(touched ? 9 : 2) * dt);
  cam.cx = lerp(cam.cx, cam.tx, ease); cam.cy = lerp(cam.cy, cam.ty, ease);
  if (Math.abs(cam.z - zBefore) > 0.01) sound.zoom(cam.z);
  if (cam.z > 5) {                 // a soft tick each time the view slides past a stop
    let best = -1, bd = Infinity;
    for (let k = 0; k < N; k++) { const d = Math.hypot(P[k].x - cam.cx, P[k].y - cam.cy); if (d < bd) { bd = d; best = k; } }
    if (best !== lastStop && lastStop >= 0) sound.tick(disp[Math.min(best, N - 2)]);
    lastStop = best;
  }
}

function resize() {
  const dpr = Math.min(2, window.devicePixelRatio || 1);
  W = innerWidth; H = innerHeight;
  cv.width = W * dpr; cv.height = H * dpr;
  cv.style.width = W + 'px'; cv.style.height = H + 'px';
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  layout();
  if (cam.z < 1.01) { cam.cx = cam.tx = W / 2; cam.cy = cam.ty = H / 2; }
}

let last = 0;
function frame(t) {
  const dt = Math.min(0.05, (t - (last || t)) / 1000); last = t;
  if (!PREVIEW) step(dt);
  draw();
  requestAnimationFrame(frame);
}

// ── input ──────────────────────────────────────────────────────────────────
const sndEl = document.getElementById('snd');
sndEl.addEventListener('click', () => { sound.kick(); sndEl.textContent = 'SOUND: ' + (sound.toggle() ? 'ON' : 'OFF'); });
let lastInput = -1e9;
const userTouch = () => {
  sound.kick(); lastInput = T;
  if (!touched) { touched = true; hold(false); document.getElementById('hint').classList.add('off'); return true; }
};
const stepHour = dir => {
  userTouch();
  const before = hi; setHour(hi + dir);
  if (hi !== before) refresh();
};
addEventListener('keydown', e => {
  if (e.key === 'ArrowRight') stepHour(1);
  if (e.key === 'ArrowLeft') stepHour(-1);
  if (e.key === 'ArrowUp' || e.key === '+' || e.key === '=') { userTouch(); cam.zt = clamp(cam.zt * 1.6, 1, 28); }
  if (e.key === 'ArrowDown' || e.key === '-') { userTouch(); cam.zt = clamp(cam.zt / 1.6, 1, 28); }
  if (e.key === ' ' && !e.repeat) { userTouch(); hold(true); }
});
addEventListener('keyup', e => { if (e.key === ' ') hold(false); });
addEventListener('wheel', e => {
  userTouch();
  cam.px = e.clientX; cam.py = e.clientY;
  cam.zt = clamp(cam.zt * Math.exp(-e.deltaY * (e.ctrlKey ? 0.01 : 0.0022)), 1, 28);
}, { passive: true });
addEventListener('pointermove', e => {
  cam.px = e.clientX; cam.py = e.clientY;
  if (touched) lastInput = T;   // moving the mouse only steers once the person has zoomed or clicked
});
addEventListener('pointerdown', e => {
  if (e.target.closest('.snd') || e.target.closest('.home-btn')) return;
  userTouch();
  cam.px = e.clientX; cam.py = e.clientY;
  const c = chips.find(c => e.clientX >= c.x && e.clientX <= c.x + c.w && e.clientY >= c.y && e.clientY <= c.y + c.h);
  if (c) { stepHour(c.i - hi); return; }
  hold(true);
});
addEventListener('pointerup', () => hold(false));
addEventListener('pointercancel', () => hold(false));
addEventListener('resize', resize);

(async () => {
  try {
    await Promise.all([500, 700, 900].map(w => document.fonts.load(`${w} 20px 'Noto Sans KR'`))
      .concat([400, 700].map(w => document.fonts.load(`${w} 12px 'Space Mono'`))));
  } catch (e) { /* fall back */ }
  hi = HOURS.length - 1;
  resize();
  if (PREVIEW) { for (let k = 0; k < N - 1; k++) disp[k] = target(k); scaleNow = fitScale(); }
  else {
    sound.kick(); setTimeout(() => sound.kick(), 400);
    setTimeout(() => { started = true; refresh(); sound.stretch(); }, 900);   // opens on the announced map, then lets go
  }
  requestAnimationFrame(frame);
})();
</script>
</body>
