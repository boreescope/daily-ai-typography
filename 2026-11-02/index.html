<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Vanish — Down the Rabbit-Hole</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=EB+Garamond:ital,wght@0,400;0,500;1,400&family=Space+Mono:wght@400&display=swap" rel="stylesheet">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    html, body {
      width: 100%;
      height: 100%;
      background: #ccccca;
      overflow: hidden;
      cursor: crosshair;
    }

    canvas {
      position: fixed;
      inset: 0;
      display: block;
    }

    .home-btn {
      position: fixed;
      top: 22px;
      left: 24px;
      z-index: 10;
      font-family: 'Space Mono', monospace;
      font-size: 11px;
      letter-spacing: 0.16em;
      color: rgba(22, 22, 22, 0.35);
      text-decoration: none;
      cursor: pointer;
      mix-blend-mode: multiply;
      transition: color 0.3s ease;
    }
    .home-btn:hover { color: rgba(22, 22, 22, 0.95); }

    .hint {
      position: fixed;
      bottom: 22px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 10;
      font-family: 'Space Mono', monospace;
      font-size: 10px;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      color: rgba(22, 22, 22, 0.5);
      background: rgba(214, 214, 212, 0.85);
      padding: 4px 10px;
      white-space: nowrap;
      pointer-events: none;
      transition: opacity 1.2s ease;
    }
    .hint.off { opacity: 0; }
  </style>
</head>
<body>

  <a class="home-btn" href="../index.html">HOME</a>
  <canvas id="c"></canvas>
  <div class="hint" id="hint">click the page to cut a hole · click inside a hole to go one stage deeper</div>

  <script>
    const TEXT = [
      "Alice was beginning to get very tired of sitting by her sister on the bank, and of having nothing to do: once or twice she had peeped into the book her sister was reading, but it had no pictures or conversations in it, “and what is the use of a book,” thought Alice “without pictures or conversations?”",
      "So she was considering in her own mind (as well as she could, for the hot day made her feel very sleepy and stupid), whether the pleasure of making a daisy-chain would be worth the trouble of getting up and picking the daisies, when suddenly a White Rabbit with pink eyes ran close by her.",
      "There was nothing so very remarkable in that; nor did Alice think it so very much out of the way to hear the Rabbit say to itself, “Oh dear! Oh dear! I shall be late!” (when she thought it over afterwards, it occurred to her that she ought to have wondered at this, but at the time it all seemed quite natural); but when the Rabbit actually took a watch out of its waistcoat-pocket, and looked at it, and then hurried on, Alice started to her feet, for it flashed across her mind that she had never before seen a rabbit with either a waistcoat-pocket, or a watch to take out of it, and burning with curiosity, she ran across the field after it, and fortunately was just in time to see it pop down a large rabbit-hole under the hedge.",
      "In another moment down went Alice after it, never once considering how in the world she was to get out again.",
      "The rabbit-hole went straight on like a tunnel for some way, and then dipped suddenly down, so suddenly that Alice had not a moment to think about stopping herself before she found herself falling down a very deep well.",
      "Either the well was very deep, or she fell very slowly, for she had plenty of time as she went down to look about her and to wonder what was going to happen next. First, she tried to look down and make out what she was coming to, but it was too dark to see anything; then she looked at the sides of the well, and noticed that they were filled with cupboards and book-shelves; here and there she saw maps and pictures hung upon pegs. She took down a jar from one of the shelves as she passed; it was labelled “ORANGE MARMALADE”, but to her great disappointment it was empty: she did not like to drop the jar for fear of killing somebody underneath, so managed to put it into one of the cupboards as she fell past it.",
      "“Well!” thought Alice to herself, “after such a fall as this, I shall think nothing of tumbling down stairs! How brave they’ll all think me at home! Why, I wouldn’t say anything about it, even if I fell off the top of the house!” (Which was very likely true.)",
      "Down, down, down. Would the fall never come to an end? “I wonder how many miles I’ve fallen by this time?” she said aloud. “I must be getting somewhere near the centre of the earth. Let me see: that would be four thousand miles down, I think—” (for, you see, Alice had learnt several things of this sort in her lessons in the schoolroom, and though this was not a very good opportunity for showing off her knowledge, as there was no one to listen to her, still it was good practice to say it over) “—yes, that’s about the right distance—but then I wonder what Latitude or Longitude I’ve got to?” (Alice had no idea what Latitude was, or Longitude either, but thought they were nice grand words to say.)",
      "Presently she began again. “I wonder if I shall fall right through the earth! How funny it’ll seem to come out among the people that walk with their heads downward! The Antipathies, I think—” (she was rather glad there was no one listening, this time, as it didn’t sound at all the right word) “—but I shall have to ask them what the name of the country is, you know. Please, Ma’am, is this New Zealand or Australia?” (and she tried to curtsey as she spoke—fancy curtseying as you’re falling through the air! Do you think you could manage it?) “And what an ignorant little girl she’ll think me for asking! No, it’ll never do to ask: perhaps I shall see it written up somewhere.”",
      "Down, down, down. There was nothing else to do, so Alice soon began talking again. “Dinah’ll miss me very much to-night, I should think!” (Dinah was the cat.) “I hope they’ll remember her saucer of milk at tea-time. Dinah my dear! I wish you were down here with me! There are no mice in the air, I’m afraid, but you might catch a bat, and that’s very like a mouse, you know. But do cats eat bats, I wonder?” And here Alice began to get rather sleepy, and went on saying to herself, in a dreamy sort of way, “Do cats eat bats? Do cats eat bats?” and sometimes, “Do bats eat cats?” for, you see, as she couldn’t answer either question, it didn’t much matter which way she put it. She felt that she was dozing off, and had just begun to dream that she was walking hand in hand with Dinah, and saying to her very earnestly, “Now, Dinah, tell me the truth: did you ever eat a bat?” when suddenly, thump! thump! down she came upon a heap of sticks and dry leaves, and the fall was over.",
      "Alice was not a bit hurt, and she jumped up on to her feet in a moment: she looked up, but it was all dark overhead; before her was another long passage, and the White Rabbit was still in sight, hurrying down it. There was not a moment to be lost: away went Alice like the wind, and was just in time to hear it say, as it turned a corner, “Oh my ears and whiskers, how late it’s getting!” She was close behind it when she turned the corner, but the Rabbit was no longer to be seen: she found herself in a long, low hall, which was lit up by a row of lamps hanging from the roof.",
      "There were doors all round the hall, but they were all locked; and when Alice had been all the way down one side and up the other, trying every door, she walked sadly down the middle, wondering how she was ever to get out again.",
      "Suddenly she came upon a little three-legged table, all made of solid glass; there was nothing on it except a tiny golden key, and Alice’s first thought was that it might belong to one of the doors of the hall; but, alas! either the locks were too large, or the key was too small, but at any rate it would not open any of them. However, on the second time round, she came upon a low curtain she had not noticed before, and behind it was a little door about fifteen inches high: she tried the little golden key in the lock, and to her great delight it fitted!",
      "Alice opened the door and found that it led into a small passage, not much larger than a rat-hole: she knelt down and looked along the passage into the loveliest garden you ever saw. How she longed to get out of that dark hall, and wander about among those beds of bright flowers and those cool fountains, but she could not even get her head through the doorway; “and even if my head would go through,” thought poor Alice, “it would be of very little use without my shoulders. Oh, how I wish I could shut up like a telescope! I think I could, if I only knew how to begin.” For, you see, so many out-of-the-way things had happened lately, that Alice had begun to think that very few things indeed were really impossible.",
      "There seemed to be no use in waiting by the little door, so she went back to the table, half hoping she might find another key on it, or at any rate a book of rules for shutting people up like telescopes: this time she found a little bottle on it, (“which certainly was not here before,” said Alice,) and round the neck of the bottle was a paper label, with the words “DRINK ME,” beautifully printed on it in large letters.",
      "It was all very well to say “Drink me,” but the wise little Alice was not going to do that in a hurry. “No, I’ll look first,” she said, “and see whether it’s marked ‘poison’ or not”; for she had read several nice little histories about children who had got burnt, and eaten up by wild beasts and other unpleasant things, all because they would not remember the simple rules their friends had taught them: such as, that a red-hot poker will burn you if you hold it too long; and that if you cut your finger very deeply with a knife, it usually bleeds; and she had never forgotten that, if you drink much from a bottle marked “poison,” it is almost certain to disagree with you, sooner or later.",
      "However, this bottle was not marked “poison,” so Alice ventured to taste it, and finding it very nice, (it had, in fact, a sort of mixed flavour of cherry-tart, custard, pine-apple, roast turkey, toffee, and hot buttered toast,) she very soon finished it off.",
      "“What a curious feeling!” said Alice; “I must be shutting up like a telescope.”",
      "And so it was indeed: she was now only ten inches high, and her face brightened up at the thought that she was now the right size for going through the little door into that lovely garden. First, however, she waited for a few minutes to see if she was going to shrink any further: she felt a little nervous about this; “for it might end, you know,” said Alice to herself, “in my going out altogether, like a candle. I wonder what I should be like then?” And she tried to fancy what the flame of a candle is like after the candle is blown out, for she could not remember ever having seen such a thing.",
      "After a while, finding that nothing more happened, she decided on going into the garden at once; but, alas for poor Alice! when she got to the door, she found she had forgotten the little golden key, and when she went back to the table for it, she found she could not possibly reach it: she could see it quite plainly through the glass, and she tried her best to climb up one of the legs of the table, but it was too slippery; and when she had tired herself out with trying, the poor little thing sat down and cried.",
      "“Come, there’s no use in crying like that!” said Alice to herself, rather sharply; “I advise you to leave off this minute!” She generally gave herself very good advice, (though she very seldom followed it), and sometimes she scolded herself so severely as to bring tears into her eyes; and once she remembered trying to box her own ears for having cheated herself in a game of croquet she was playing against herself, for this curious child was very fond of pretending to be two people. “But it’s no use now,” thought poor Alice, “to pretend to be two people! Why, there’s hardly enough of me left to make one respectable person!”",
      "Soon her eye fell on a little glass box that was lying under the table: she opened it, and found in it a very small cake, on which the words “EAT ME” were beautifully marked in currants. “Well, I’ll eat it,” said Alice, “and if it makes me grow larger, I can reach the key; and if it makes me grow smaller, I can creep under the door; so either way I’ll get into the garden, and I don’t care which happens!”",
      "She ate a little bit, and said anxiously to herself, “Which way? Which way?”, holding her hand on the top of her head to feel which way it was growing, and she was quite surprised to find that she remained the same size: to be sure, this generally happens when one eats cake, but Alice had got so much into the way of expecting nothing but out-of-the-way things to happen, that it seemed quite dull and stupid for life to go on in the common way.",
      "So she set to work, and very soon finished off the cake.",
    ];

    const PAPER = '#d6d6d4';
    const INK = '#161616';
    let paperImg = null;      // gray paper grain, mirror-tiled under the type
    const PREVIEW = new URLSearchParams(location.search).get('preview') === '1';

    // The page is a sheet with holes cut along column gutters and row
    // boundaries. Each hole is a short corridor whose four flaps fold inward
    // toward its own vanishing point; at its end sits another sheet of the
    // same newspaper with another, smaller hole, tilted differently — and so
    // on, several levels down. Everything is one page texture rendered as
    // perspective-correct quads (WebGL), so lines run straight to each
    // vanishing point and meet the flat sheet exactly at every fold. The
    // strips of sheet facing a hole slide toward it at the rate the walls
    // recede, so the paper is slowly fed into the holes.
    const CAM = 2.4;          // camera distance to a fold (opening is 2 units tall)
    const SPEED = 26;         // page pixels per second fed into the holes
    const REACH = 1;          // how many rows/columns next to a hole slide into it

    const canvas = document.getElementById('c');
    const hint = document.getElementById('hint');
    const gl = canvas.getContext('webgl2', { antialias: true, alpha: false });

    let W = 0, H = 0, DPR = 1;
    let scroll = 0;
    let grid = null;          // { pitch, lh, gutter, colW, cols, perCol, TW, TH, ox, oy }
    const imgs = [];          // Tenniel illustrations (public domain, 1865)
    let holes = [];           // level-0 holes in the page

    // shorter paragraphs: split the chapter at sentence ends
    const PARAS = TEXT.flatMap((p) => {
      const sents = p.split(/(?<=[.!?”’)])\s+(?=[A-Z“(])/);
      const out = []; let cur = '';
      for (const s of sents) {
        if (cur && (cur.length + s.length > 150)) { out.push(cur); cur = s; }
        else cur = cur ? cur + ' ' + s : s;
      }
      if (cur) out.push(cur);
      return out;
    });
    const HEADS = ['Down the Rabbit-Hole', 'Oh dear! Oh dear!', 'Orange Marmalade', 'Four thousand miles down',
      'The Antipathies', 'Do cats eat bats?', 'A long, low hall', 'The little golden key', 'Drink Me',
      'Like a telescope', 'Eat Me', 'Which way? Which way?'];

    // ── page tile: periodic newspaper layout (columns × rows) ──
    function buildPage() {
      const fs = Math.max(9, Math.min(11, Math.min(W, H) * 0.0118));
      const lh = Math.round(fs * 1.32 * DPR) / DPR;
      // full-bleed sheet: the tile is exactly one screen wide, so columns
      // run edge to edge with half a gutter at each side
      const gutter = fs * 1.6;
      const cols = Math.max(4, Math.round(W / (fs * 12.5 + gutter)));
      const pitch = W / cols;
      const colW = pitch - gutter;
      const perCol = Math.max(12, Math.ceil(H / lh));
      const TW = cols * pitch, TH = perCol * lh;
      const colX = (c) => c * pitch;
      grid = { pitch, lh, gutter, colW, cols, perCol, TW, TH, ox: gutter / 2, oy: lh * 0.4 };

      // the main hole, used to place blocks across its folds
      const mc0 = 1, mc1 = mc0 + Math.max(2, Math.round(cols * 0.42));
      const mr0 = Math.round(perCol * 0.18), mr1 = mr0 + Math.round(perCol * 0.5);
      grid.mainCut = [mc0, mc1, mr0, mr1];

      const tile = document.createElement('canvas');
      tile.width = Math.round(TW * DPR); tile.height = Math.round(TH * DPR);
      const g = tile.getContext('2d');
      g.scale(DPR, DPR);
      g.fillStyle = PAPER; g.fillRect(0, 0, TW, TH);
      if (paperImg) {
        // mirror-tile the grain so no seams show; 1 image px ≈ 1 device px
        const pw = paperImg.naturalWidth / DPR, ph = paperImg.naturalHeight / DPR;
        for (let i = 0; i * pw < TW; i++) for (let j = 0; j * ph < TH; j++) {
          g.save();
          g.translate(i * pw + (i % 2 ? pw : 0), j * ph + (j % 2 ? ph : 0));
          g.scale(i % 2 ? -1 : 1, j % 2 ? -1 : 1);
          g.drawImage(paperImg, 0, 0, pw, ph);
          g.restore();
        }
        g.fillStyle = 'rgba(255,255,255,0.13)'; g.fillRect(0, 0, TW, TH);
      }
      g.textBaseline = 'alphabetic';

      // blocks that interrupt the body columns
      const blocks = [];
      const headRows = 8;
      const hr0 = Math.round((mr0 + mr1) / 2) - 4;
      blocks.push({ type: 'head', c0: 0, c1: Math.min(mc0, cols - 1), r0: hr0, r1: hr0 + headRows - 1 });
      if (imgs[0]) {
        const rows = Math.min(18, Math.floor(perCol * 0.3));
        const r0 = Math.min(perCol - rows, mr1 - Math.round(rows * 0.4));
        blocks.push({ type: 'img', img: imgs[0], c0: mc0 + 1, c1: mc0 + 1, r0, r1: r0 + rows - 1,
          caption: 'The White Rabbit looks at his watch. John Tenniel, 1865.' });
      }
      if (imgs[1]) {
        const rows = Math.min(14, Math.floor(perCol * 0.24));
        const r0 = Math.max(0, mr0 - Math.round(rows * 0.5));
        blocks.push({ type: 'img', img: imgs[1], c0: mc1 - 2, c1: mc1 - 2, r0, r1: r0 + rows - 1,
          caption: 'Alice finds the little door behind the curtain.' });
      }
      const blockedAt = (c, r) => blocks.some(b => c >= b.c0 && c <= b.c1 && r >= b.r0 && r <= b.r1);

      // body text flow
      const bodyFont = `400 ${fs}px 'EB Garamond', serif`;
      g.font = bodyFont;
      g.fillStyle = INK;
      const space = g.measureText(' ').width;
      const cache = new Map();
      const mw = (s) => { let w = cache.get(s); if (w === undefined) { w = g.measureText(s).width; cache.set(s, w); } return w; };
      let p = 2, wq = [], newPara = true, headDue = false, nHead = 0;
      const refill = () => { wq = PARAS[p % PARAS.length].split(' '); p++; newPara = true; headDue = p % 5 === 0; };
      refill();
      const line = (x, y, avail) => {
        if (headDue) {
          headDue = false;
          g.font = `500 ${fs * 1.08}px 'EB Garamond', serif`;
          g.fillText(HEADS[nHead++ % HEADS.length], x, y);
          g.font = bodyFont;
          return;
        }
        const indent = newPara ? fs : 0; newPara = false;
        const words = []; let lw = 0;
        while (wq.length) {
          const t = wq[0], w = mw(t);
          const need = words.length ? lw + space + w : w;
          if (need > avail - indent && words.length) break;
          words.push({ t, w }); lw = need; wq.shift();
        }
        const last = !wq.length;
        if (last) refill();
        const extraSp = (!last && words.length > 1) ? (avail - indent - lw) / (words.length - 1) : 0;
        let cx = x + indent;
        for (const wd of words) { g.fillText(wd.t, cx, y); cx += wd.w + space + extraSp; }
      };
      for (let c = 0; c < cols; c++) {
        for (let r = 0; r < perCol; r++) {
          if (blockedAt(c, r)) continue;
          line(colX(c), r * lh + fs, colW);
        }
      }

      // blocks
      for (const b of blocks) {
        const bx = colX(b.c0), bw = colX(b.c1) + colW - bx;
        const by = b.r0 * lh, bh = (b.r1 - b.r0 + 1) * lh;
        if (b.type === 'head') {
          g.fillStyle = INK;
          g.fillRect(bx, by + 1, bw, 1.5);
          const l1 = 'Down the', l2 = 'Rabbit-Hole';
          g.font = `500 100px 'EB Garamond', serif`;
          const hs = Math.min(lh * 3.0, bw / g.measureText(l2).width * 100 * 0.98);
          g.font = `500 ${hs}px 'EB Garamond', serif`;
          g.fillText(l1, bx, by + hs * 1.05);
          g.fillText(l2, bx, by + hs * 2.05);
          g.font = `italic 400 ${fs}px 'EB Garamond', serif`;
          g.fillText('Alice’s Adventures in Wonderland · Chapter I · Lewis Carroll, 1865', bx, by + hs * 2.05 + lh * 1.3);
        } else {
          const capH = lh * 1.2;
          const iw = b.img.naturalWidth, ih = b.img.naturalHeight;
          const s = Math.min(bw / iw, (bh - capH) / ih);
          const dw = iw * s, dh = ih * s;
          // printed on the paper: multiply so the scan's white disappears
          g.globalCompositeOperation = 'multiply'; g.globalAlpha = 0.82;
          g.drawImage(b.img, bx + (bw - dw) / 2, by, dw, dh);
          g.globalCompositeOperation = 'source-over'; g.globalAlpha = 1;
          g.font = `italic 400 ${fs * 0.9}px 'EB Garamond', serif`;
          g.fillStyle = INK;
          g.fillText(b.caption, bx, by + dh + fs * 1.1);
        }
      }

      // (column rules are drawn as geometry so they stay put while text slides)
      uploadTexture(tile);
    }

    // ── holes ──
    // A hole lives in the texture space of its sheet: columns [c0,c1) and rows
    // [r0,r1). Its end sheet shows the page again, offset by whole cells
    // (offC, offR), and may contain further holes (nexts).
    let seed = 7;
    const rnd = () => { seed = (seed * 1664525 + 1013904223) >>> 0; return seed / 4294967296; };
    function makeHole(c0, c1, r0, r1, levels, user) {
      const h = { c0, c1, r0, r1, fx: 0.28 + 0.44 * rnd(), fy: 0.28 + 0.44 * rnd(), D: 2.0 + 1.0 * rnd(),
        offC: Math.floor(rnd() * 7) - 3, offR: Math.floor(rnd() * 21) - 10, black: rnd() < 0.6,
        open: 0, user: !!user, nexts: [] };
      const nc = c1 - c0, nr = r1 - r0;
      if (levels > 1 && nc >= 3 && nr >= 5) {
        const w = Math.max(1, Math.min(nc - 2, Math.round(nc * (0.45 + 0.3 * rnd()))));
        const hh = Math.max(2, Math.min(nr - 2, Math.round(nr * (0.45 + 0.3 * rnd()))));
        const ic0 = c0 + h.offC + 1 + Math.floor((nc - 2 - w) * rnd());
        const ir0 = r0 + h.offR + 1 + Math.floor((nr - 2 - hh) * rnd());
        h.nexts.push(makeHole(ic0, ic0 + w, ir0, ir0 + hh, levels - 1));
      }
      return h;
    }
    const texRect = (h) => {
      const { pitch, lh, gutter } = grid;
      return [h.c0 * pitch - gutter / 2, h.r0 * lh, h.c1 * pitch - gutter / 2, h.r1 * lh];
    };
    const intersects = (a, b) => a.c0 < b.c1 && b.c0 < a.c1 && a.r0 < b.r1 && b.r0 < a.r1;

    // ── WebGL ──
    const VS = `#version 300 es
      in vec4 aPos; in vec2 aUV; in vec2 aShade;
      out vec2 vUV; out vec2 vShade;
      void main() { vUV = aUV; vShade = aShade; gl_Position = aPos; }`;
    const FS = `#version 300 es
      precision highp float;
      uniform sampler2D uTex;
      in vec2 vUV; in vec2 vShade;
      out vec4 o;
      void main() {
        vec3 ink = vec3(22.0 / 255.0);
        vec3 c = texture(uTex, vUV).rgb;
        float dark = vShade.y + 1.0 - pow(clamp(vShade.x, 0.0, 1.0), 0.8);
        o = vec4(mix(c, ink, clamp(dark, 0.0, 1.0)), 1.0);
      }`;
    let prog, vbo, tex;
    function initGL() {
      const sh = (type, src) => {
        const s = gl.createShader(type); gl.shaderSource(s, src); gl.compileShader(s);
        if (!gl.getShaderParameter(s, gl.COMPILE_STATUS)) throw new Error(gl.getShaderInfoLog(s));
        return s;
      };
      prog = gl.createProgram();
      gl.attachShader(prog, sh(gl.VERTEX_SHADER, VS));
      gl.attachShader(prog, sh(gl.FRAGMENT_SHADER, FS));
      gl.linkProgram(prog);
      gl.useProgram(prog);
      vbo = gl.createBuffer();
      gl.bindBuffer(gl.ARRAY_BUFFER, vbo);
      const stride = 8 * 4;
      const attr = (name, size, off) => {
        const loc = gl.getAttribLocation(prog, name);
        gl.enableVertexAttribArray(loc);
        gl.vertexAttribPointer(loc, size, gl.FLOAT, false, stride, off);
      };
      attr('aPos', 4, 0); attr('aUV', 2, 16); attr('aShade', 2, 24);
      tex = gl.createTexture();
      gl.bindTexture(gl.TEXTURE_2D, tex);
      gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_S, gl.REPEAT);
      gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_T, gl.REPEAT);
      gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MIN_FILTER, gl.LINEAR_MIPMAP_LINEAR);
      gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MAG_FILTER, gl.LINEAR);
      const aniso = gl.getExtension('EXT_texture_filter_anisotropic');
      if (aniso) gl.texParameterf(gl.TEXTURE_2D, aniso.TEXTURE_MAX_ANISOTROPY_EXT,
        Math.min(16, gl.getParameter(aniso.MAX_TEXTURE_MAX_ANISOTROPY_EXT)));
      gl.uniform1i(gl.getUniformLocation(prog, 'uTex'), 0);
      gl.disable(gl.DEPTH_TEST); gl.disable(gl.BLEND);
      gl.clearColor(0xcc / 255, 0xcc / 255, 0xca / 255, 1);
    }
    function uploadTexture(tile) {
      gl.bindTexture(gl.TEXTURE_2D, tex);
      gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGBA, gl.RGBA, gl.UNSIGNED_BYTE, tile);
      gl.generateMipmap(gl.TEXTURE_2D);
    }

    // ── geometry ──
    const RULE = 0.3;         // ink amount of a column rule
    let verts = [];
    // p: 4 corners [sx, sy, z]; uv: 4 [u, v]; sh: 4 [apparent scale, tint]
    function quad(p, uv, sh) {
      const v = (i) => {
        const [sx, sy, z] = p[i];
        verts.push((sx / W * 2 - 1) * z, (1 - sy / H * 2) * z, 0, z, uv[i][0], uv[i][1], sh[i][0], sh[i][1]);
      };
      v(0); v(1); v(2); v(0); v(2); v(3);
    }
    // a sheet maps screen px to page texture px: tex = t0 + (P - s0) * S
    const texX = (sh, px) => sh.tx0 + (px - sh.sx0) * sh.S;
    const texY = (sh, py) => sh.ty0 + (py - sh.sy0) * sh.S;
    const scrX = (sh, tx) => sh.sx0 + (tx - sh.tx0) / sh.S;
    const scrY = (sh, ty) => sh.sy0 + (ty - sh.ty0) / sh.S;
    function flatRect(sh, x0, y0, x1, y1, dx, dy, g, tint = 0) {
      const { TW, TH } = grid;
      const u0 = (texX(sh, x0) + dx) / TW, u1 = (texX(sh, x1) + dx) / TW;
      const v0 = (texY(sh, y0) + dy) / TH, v1 = (texY(sh, y1) + dy) / TH;
      quad([[x0, y0, 1], [x1, y0, 1], [x1, y1, 1], [x0, y1, 1]],
        [[u0, v0], [u1, v0], [u1, v1], [u0, v1]],
        [[g, tint], [g, tint], [g, tint], [g, tint]]);
    }
    // gutter indices whose centre lies inside the sheet
    function gutterRange(sh) {
      const { pitch, gutter } = grid;
      return [Math.ceil((sh.tx0 + gutter / 2) / pitch - 1e-6), Math.floor((texX(sh, sh.sx1) + gutter / 2) / pitch + 1e-6)];
    }

    function drawSheet(sh, hs) {
      flatRect(sh, sh.sx0, sh.sy0, sh.sx1, sh.sy1, 0, 0, sh.g);
      if (sh.g > 0.2) drawBands(sh, hs);
      drawRules(sh);
      for (const h of hs) drawHole(sh, h);
    }

    // column rules as static geometry (1px), so they never slide with the text
    function drawRules(sh) {
      const { pitch, gutter } = grid;
      const [cA, cB] = gutterRange(sh);
      const w = Math.max(0.5, 1 / Math.max(1, sh.S * 0.5));
      for (let c = cA; c <= cB; c++) {
        const x = scrX(sh, c * pitch - gutter / 2);
        if (x <= sh.sx0 || x >= sh.sx1) continue;
        flatRect(sh, x - w / 2, sh.sy0, x + w / 2, sh.sy1, 0, 0, sh.g, RULE);
      }
    }

    // only the cells touching a hole slide into it; the rest of the sheet stays.
    // Sliding text is taken from KX columns / KY rows away so it never
    // duplicates the static neighbour, and side bands exclude the outer half
    // gutter so the rule there stays put.
    function drawBands(sh, hs) {
      const { pitch, lh, gutter, colW, kx, ky } = grid;
      const rects = hs.map(texRect);
      const cA = Math.floor((sh.tx0 + gutter / 2) / pitch), cB = Math.ceil((texX(sh, sh.sx1) + gutter / 2) / pitch);
      const rA = Math.floor(sh.ty0 / lh), rB = Math.ceil(texY(sh, sh.sy1) / lh);
      for (let c = cA; c < cB; c++) for (let r = rA; r < rB; r++) {
        const cx = c * pitch + colW / 2, cy = (r + 0.5) * lh;
        let best = null, inside = false;
        for (const t of rects) {
          const inX = cx > t[0] && cx < t[2], inY = cy > t[1] && cy < t[3];
          if (inX && inY) { inside = true; break; }
          let d, dx = 0, dy = 0;
          if (inX) { if (cy < t[1]) { d = t[1] - cy; dy = -1; } else { d = cy - t[3]; dy = 1; } if (d > lh * REACH) continue; }
          else if (inY) { if (cx < t[0]) { d = t[0] - cx; dx = -1; } else { d = cx - t[2]; dx = 1; } if (d > pitch * REACH) continue; }
          else continue;
          if (!best || d < best.d) best = { d, dx, dy };
        }
        if (inside || !best) continue;
        let tx0 = c * pitch - gutter / 2, tx1 = tx0 + pitch;
        if (best.dx < 0) tx0 += gutter / 2;        // keep the outer half gutter static
        if (best.dx > 0) tx1 -= gutter / 2;
        const ty0 = r * lh;
        const x0 = Math.max(sh.sx0, scrX(sh, tx0)), x1 = Math.min(sh.sx1, scrX(sh, tx1));
        const y0 = Math.max(sh.sy0, scrY(sh, ty0)), y1 = Math.min(sh.sy1, scrY(sh, ty0 + lh));
        if (x1 <= x0 || y1 <= y0) continue;
        flatRect(sh, x0, y0, x1, y1, best.dx * (scroll + kx), best.dy * (scroll + ky), sh.g);
      }
    }

    // screen rect of a hole in its sheet (after the opening animation), plus VP
    function holeRect(sh, h) {
      const t = texRect(h);
      let x0 = Math.max(sh.sx0, scrX(sh, t[0])), x1 = Math.min(sh.sx1, scrX(sh, t[2]));
      let y0 = Math.max(sh.sy0, scrY(sh, t[1])), y1 = Math.min(sh.sy1, scrY(sh, t[3]));
      if (x1 - x0 < 2 || y1 - y0 < 2) return null;
      const vx = x0 + (x1 - x0) * h.fx, vy = y0 + (y1 - y0) * h.fy;
      const k = h.open < 1 ? 1 - Math.pow(1 - h.open, 3) : 1;
      x0 = vx + (x0 - vx) * k; x1 = vx + (x1 - vx) * k;
      y0 = vy + (y0 - vy) * k; y1 = vy + (y1 - vy) * k;
      if (x1 - x0 < 2 || y1 - y0 < 2) return null;
      return { x0, y0, x1, y1, vx, vy };
    }
    function endSheet(sh, h, R) {
      const { x0, y0, x1, y1, vx, vy } = R, D = h.D;
      return {
        sx0: vx + (x0 - vx) / D, sy0: vy + (y0 - vy) / D, sx1: vx + (x1 - vx) / D, sy1: vy + (y1 - vy) / D,
        S: sh.S * D, tx0: texX(sh, x0) + h.offC * grid.pitch, ty0: texY(sh, y0) + h.offR * grid.lh, g: sh.g / D,
      };
    }

    function drawHole(sh, h) {
      const { TW, TH, pitch, gutter, kx, ky } = grid;
      const R = holeRect(sh, h);
      if (!R) return;
      const { x0, y0, x1, y1, vx, vy } = R;
      const F = (y1 - y0) / 2, S = sh.S, D = h.D;
      const XL = (vx - x0) / F, XR = (x1 - vx) / F;
      const YT = (vy - y0) / F, YB = (y1 - vy) / F;
      const ZF = CAM * D;
      const proj = (x, y, z) => [vx + F * CAM * x / z, vy + F * CAM * y / z, z];
      const depth = (z) => (z - CAM) * F * S;      // page px along the wall
      const hx0 = texX(sh, x0), hx1 = texX(sh, x1), hy0 = texY(sh, y0), hy1 = texY(sh, y1);
      const walls = [
        { tint: 0.035, s0: -YT, s1: YB, pt: (s, z) => proj(-XL, s, z), rung: (u) => u - hx0 + scroll + kx,
          uv: (s, z) => [(hx0 - scroll - kx + depth(z)) / TW, texY(sh, vy + F * s) / TH] },
        { tint: 0.035, s0: -YT, s1: YB, pt: (s, z) => proj(XR, s, z), rung: (u) => hx1 + scroll + kx - u,
          uv: (s, z) => [(hx1 + scroll + kx - depth(z)) / TW, texY(sh, vy + F * s) / TH] },
        { tint: 0.06, s0: -XL, s1: XR, pt: (s, z) => proj(s, YB, z),
          uv: (s, z) => [texX(sh, vx + F * s) / TW, (hy1 + scroll + ky - depth(z)) / TH] },
        { tint: 0.02, s0: -XL, s1: XR, pt: (s, z) => proj(s, -YT, z),
          uv: (s, z) => [texX(sh, vx + F * s) / TW, (hy0 - scroll - ky + depth(z)) / TH] },
      ];
      const g0 = sh.g, g1 = sh.g / D;
      const gAt = (z) => g0 * CAM / z;
      for (const w of walls) {
        quad([w.pt(w.s0, CAM), w.pt(w.s1, CAM), w.pt(w.s1, ZF), w.pt(w.s0, ZF)],
          [w.uv(w.s0, CAM), w.uv(w.s1, CAM), w.uv(w.s1, ZF), w.uv(w.s0, ZF)],
          [[g0, w.tint], [g0, w.tint], [g1, w.tint], [g1, w.tint]]);
      }
      // column rules on the walls: floor/ceiling carry the gutters that run
      // into depth; side walls carry them as rungs that slide with the text
      const hw = 0.5 / F;
      for (let c = Math.ceil((hx0 + gutter / 2) / pitch); c * pitch - gutter / 2 < hx1 - 1e-6; c++) {
        const gx = c * pitch - gutter / 2;
        if (gx <= hx0 + 1e-6) continue;
        const s = (scrX(sh, gx) - vx) / F;
        for (const w of [walls[2], walls[3]]) {
          quad([w.pt(s - hw, CAM), w.pt(s + hw, CAM), w.pt(s + hw, ZF), w.pt(s - hw, ZF)],
            [w.uv(s, CAM), w.uv(s, CAM), w.uv(s, ZF), w.uv(s, ZF)],
            [[g0, RULE], [g0, RULE], [g1, RULE], [g1, RULE]]);
        }
      }
      const dMax = depth(ZF), dz = 1 / (F * S);
      for (const w of [walls[0], walls[1]]) {
        const uRef = w === walls[0] ? hx0 - scroll - kx : hx1 + scroll + kx;
        const cStart = Math.floor((Math.min(uRef, uRef + (w === walls[0] ? dMax : -dMax)) + gutter / 2) / pitch);
        for (let c = cStart; c <= cStart + Math.ceil(dMax / pitch) + 1; c++) {
          const d = w.rung(c * pitch - gutter / 2);
          if (d <= 0 || d >= dMax) continue;
          const z = CAM + d / (F * S), g = gAt(z);
          quad([w.pt(w.s0, z - dz), w.pt(w.s1, z - dz), w.pt(w.s1, z + dz), w.pt(w.s0, z + dz)],
            [w.uv(w.s0, z), w.uv(w.s1, z), w.uv(w.s1, z), w.uv(w.s0, z)],
            [[g, RULE], [g, RULE], [g, RULE], [g, RULE]]);
        }
      }
      // the sheet at the end of this corridor
      const end = endSheet(sh, h, R);
      if (h.nexts.length) drawSheet(end, h.nexts);
      // last sheet: either solid black, or a dim printed wall
      else flatRect(end, end.sx0, end.sy0, end.sx1, end.sy1, 0, 0, h.black ? 0 : end.g);
    }

    const pageSheet = () => ({ sx0: 0, sy0: 0, sx1: W, sy1: H, S: 1, tx0: -grid.ox, ty0: -grid.oy, g: 1 });

    function draw() {
      verts = [];
      drawSheet(pageSheet(), holes);
      gl.viewport(0, 0, canvas.width, canvas.height);
      gl.clear(gl.COLOR_BUFFER_BIT);
      gl.bindBuffer(gl.ARRAY_BUFFER, vbo);
      gl.bufferData(gl.ARRAY_BUFFER, new Float32Array(verts), gl.DYNAMIC_DRAW);
      gl.drawArrays(gl.TRIANGLES, 0, verts.length / 8);
    }

    // ── update ──
    function tick(hs, dt) {
      for (const h of hs) { h.open = Math.min(1, h.open + dt * 1.8); tick(h.nexts, dt); }
    }
    function update(dt) {
      scroll += SPEED * dt;
      tick(holes, dt);
    }

    let last = performance.now();
    function frame(now) {
      const dt = Math.min(0.05, (now - last) / 1000);
      last = now;
      update(dt);
      draw();
      requestAnimationFrame(frame);
    }

    // ── input / size ──
    function resize() {
      DPR = Math.min(window.devicePixelRatio || 1, 2);
      W = window.innerWidth; H = window.innerHeight;
      canvas.width = Math.round(W * DPR); canvas.height = Math.round(H * DPR);
      canvas.style.width = W + 'px'; canvas.style.height = H + 'px';
      buildPage();
      grid.kx = 2 * grid.pitch; grid.ky = 7 * grid.lh;
      seed = 7;
      const [c0, c1, r0, r1] = grid.mainCut;
      const main = makeHole(c0, c1, r0, r1, 1);
      main.open = 1;
      const kept = holes.filter(h => h.user && h.c1 <= grid.cols && h.r1 <= grid.perCol && !intersects(h, main));
      holes = [main, ...kept];
    }

    // descend into the hole under the pointer (a wall click counts as the end
    // sheet of that corridor, clamped into it)
    function descend(sh, h, px, py) {
      const R = holeRect(sh, h);
      if (!R) return false;
      const end = endSheet(sh, h, R);
      const qx = Math.min(end.sx1, Math.max(end.sx0, px)), qy = Math.min(end.sy1, Math.max(end.sy0, py));
      return cutIn(end, h.nexts, qx, qy, true);
    }

    // click: inside an existing hole → go down into it; on a free part of the
    // sheet → cut a hole there (a sibling, inside a room); if there is no room
    // beside the existing hole, go one stage deeper instead
    function cutIn(sh, hs, px, py, nested) {
      const inRect = (R) => R && px >= R.x0 && px <= R.x1 && py >= R.y0 && py <= R.y1;
      const h = hs.find(h => inRect(holeRect(sh, h)));
      if (h) return descend(sh, h, px, py);
      if (tryCut(sh, hs, px, py)) return true;
      if (nested && hs.length) return descend(sh, hs[0], px, py);
      return false;
    }

    function tryCut(sh, hs, px, py) {
      const { pitch, lh, gutter, perCol } = grid;
      // the sheet must be large enough to cut into
      if (pitch / sh.S < 7) return false;
      let [cA, cB] = gutterRange(sh);
      let rA = Math.ceil(sh.ty0 / lh - 1e-6), rB = Math.floor(texY(sh, sh.sy1) / lh + 1e-6);
      let wc = 3, wr = 2 * Math.max(2, Math.round(perCol * 0.16));
      if (sh.S > 1) {
        // inside a hole: the next stage scales with the room, leaving a
        // margin of wall around it
        if (cB - cA >= 3) { cA++; cB--; }
        if (rB - rA >= 5) { rA++; rB--; }
        wc = Math.max(1, Math.round((cB - cA) * 0.6));
        wr = Math.max(2, Math.round((rB - rA) * 0.55));
      }
      if (cB <= cA || rB - rA < 2) return false;
      const c = Math.min(cB - 1, Math.max(cA, Math.floor((texX(sh, px) + gutter / 2) / pitch)));
      const r = Math.min(rB - 1, Math.max(rA, Math.floor(texY(sh, py) / lh)));
      // the clicked cell itself must be free
      if (hs.some(h => c >= h.c0 && c < h.c1 && r >= h.r0 && r < h.r1)) return false;
      wc = Math.min(wc, cB - cA); wr = Math.min(wr, rB - rA);
      const c0 = Math.min(cB - wc, Math.max(cA, c - Math.floor(wc / 2)));
      const r0 = Math.min(rB - wr, Math.max(rA, r - Math.floor(wr / 2)));
      const want = { c0, c1: c0 + wc, r0, r1: r0 + wr };
      // shrink toward the clicked cell until it fits between the existing holes
      let turn = 0;
      while (hs.some(h => intersects(want, h))) {
        if (turn % 2 === 0 && want.c1 - want.c0 > 1) { if (want.c0 < c) want.c0++; else want.c1--; }
        else if (want.r1 - want.r0 > 2) { if (r - want.r0 > want.r1 - 1 - r) want.r0++; else want.r1--; }
        else if (want.c1 - want.c0 > 1) { if (want.c0 < c) want.c0++; else want.c1--; }
        else return false;
        turn++;
      }
      if (want.c1 <= want.c0 || want.r1 - want.r0 < 2) return false;
      seed = (seed + c * 131 + r * 17 + hs.length * 7) >>> 0;
      hs.push(makeHole(want.c0, want.c1, want.r0, want.r1, 1, true));
      return true;
    }
    const cutAt = (px, py) => cutIn(pageSheet(), holes, px, py, false);
    window.addEventListener('pointerdown', (e) => { hint.classList.add('off'); cutAt(e.clientX, e.clientY); });
    window.addEventListener('resize', resize);

    const loadImg = (src) => new Promise((res) => {
      const im = new Image();
      im.onload = () => res(im); im.onerror = () => res(null);

      paperImg = r[5];
      initGL();
      try { resize(); }
