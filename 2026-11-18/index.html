<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>알림음 — Now Serving</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Nanum+Myeongjo:wght@400;700;800&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 100%; height: 100%; overflow: hidden; background: #1b1d22; }
  canvas { display: block; }

  .home-btn, .snd {
    position: fixed; top: 20px; z-index: 10;
    padding: 7px 13px;
    background: rgba(20,23,28,.6);
    border: 1px solid rgba(150,160,175,.26);
    color: #8a909b;
    font: 700 10px/1 'Space Mono', monospace;
    letter-spacing: .14em; text-decoration: none;
    transition: color .2s, border-color .2s;
    user-select: none;
  }
  .home-btn { left: 20px; }
  .snd { right: 20px; cursor: pointer; }
  .home-btn:hover, .snd:hover { color: #dfe4ea; border-color: rgba(223,228,234,.5); }

  .hint {
    position: fixed; left: 50%; bottom: 22px; transform: translateX(-50%);
    color: #7d838d;
    font: 400 10px/1 'Space Mono', monospace;
    letter-spacing: .14em; white-space: nowrap;
    transition: opacity .6s;
  }
  .hint.alert { color: #ff5a3c; font-size: 12px; }

  .cap {
    position: fixed; left: 50%; bottom: 13%; transform: translate(-50%, 8px);
    color: #f1ece2;
    font: 700 clamp(17px, 2vw, 28px)/1.3 'Nanum Myeongjo', serif;
    text-shadow: 0 2px 18px rgba(0,0,0,.7);
    white-space: nowrap;
    opacity: 0;
    transition: opacity .5s, transform .5s;
    pointer-events: none;
  }
  .cap.on { opacity: 1; transform: translate(-50%, 0); }
  body:has(.ask.on) .cap { bottom: calc(56px + 200px); }
  .cap { transition: opacity .5s, transform .5s, bottom .4s; }
  .cap .dd {
    margin-right: .7em;
    color: #ff5a3c;
    font: 700 .72em 'Space Mono', monospace;
    letter-spacing: .12em;
  }

  .ticket {
    position: fixed; right: 36px; bottom: 44px; z-index: 5;
    width: 152px; padding: 14px 16px 13px;
    background: linear-gradient(#f5f1e8, #ebe6da);
    color: #2a2a2a;
    font-family: 'Space Mono', monospace;
    box-shadow: 0 14px 30px rgba(0,0,0,.45);
    transform: rotate(-4deg);
    transition: transform .4s ease-out, opacity .4s;
  }
  .ticket::before {
    content: ''; position: absolute; left: 0; right: 0; top: -5px; height: 6px;
    background: radial-gradient(circle at 5px 0, transparent 4px, #f5f1e8 4.5px) 0 0 / 10px 6px repeat-x;
  }
  .ticket .t1 { font: 700 9px/1 'Space Mono', monospace; letter-spacing: .2em; color: #8a857a; }
  .ticket .t2 { margin-top: 3px; font: 700 11px/1 'Nanum Myeongjo', serif; color: #555; }
  .ticket .no { margin: 8px 0 6px; font: 700 50px/1 'Space Mono', monospace; letter-spacing: -.02em; }
  .ticket .ah { font: 700 12px/1.2 'Nanum Myeongjo', serif; color: #333; }
  .ticket .dt { margin-top: 8px; padding-top: 7px; border-top: 1px dashed #bbb3a3; font-size: 9px; color: #999; letter-spacing: .08em; }
  .ticket .stamp {
    position: absolute; right: 10px; top: 40px;
    padding: 3px 7px;
    border: 2px solid #c9402a; color: #c9402a;
    font: 800 14px/1 'Nanum Myeongjo', serif;
    transform: rotate(-16deg) scale(1.4);
    opacity: 0;
    transition: opacity .25s, transform .25s;
  }
  .ticket.missed .stamp { opacity: .9; transform: rotate(-16deg) scale(1); }
  .ticket.missed .no { color: #9a958c; }
  .ticket.call { animation: shake .5s ease-in-out infinite; }
  .ticket.fresh { animation: print .7s ease-out; }
  @keyframes shake {
    0%, 100% { transform: rotate(-4deg) translateY(0); }
    50% { transform: rotate(-1deg) translateY(-6px); }
  }
  @keyframes print {
    from { transform: rotate(-4deg) translateY(60px); opacity: 0; }
    to { transform: rotate(-4deg) translateY(0); opacity: 1; }
  }

  .end {
    position: fixed; inset: 0; z-index: 8;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    background: rgba(10,10,12,.5);
    opacity: 0; pointer-events: none;
    transition: opacity 1.2s;
  }
  .end.on { opacity: 1; }
  .start {
    position: fixed; inset: 0; z-index: 9;
    display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 14px;
    background: rgba(10,10,12,.62); color: #eee8dc; cursor: pointer;
    transition: opacity .8s;
  }
  .start.off { opacity: 0; pointer-events: none; }
  .start .s1 { font: 700 clamp(15px, 1.5vw, 20px)/1.6 'Nanum Myeongjo', serif; text-align: center; color: #cfc8ba; }
  .start .s2 { font: 700 clamp(12px, 1vw, 14px)/1 'Space Mono', monospace; letter-spacing: .2em; color: #ffd84a; border: 1px solid rgba(255,216,74,.5); padding: 10px 18px; }
  body.preview .start { display: none; }
  .end .big {
    color: #ff4a2e;
    font: 700 clamp(80px, 13vw, 190px)/1 'Space Mono', monospace;
    text-shadow: 0 0 30px rgba(255,60,30,.55);
  }
  .end .line { margin-top: 18px; color: #eee8dc; font: 700 clamp(16px, 1.8vw, 24px)/1.4 'Nanum Myeongjo', serif; }
  .end .sub { margin-top: 10px; color: #a9a397; font: 400 12px/1.4 'Space Mono', monospace; letter-spacing: .1em; }
  .end .again {
    margin-top: 34px; padding: 10px 18px;
    border: 1px solid rgba(255,216,74,.5); color: #ffd84a;
    font: 700 12px/1 'Space Mono', monospace; letter-spacing: .2em;
    cursor: pointer;
  }
  .end.on { pointer-events: auto; }
  .end.closed .big { color: #cfc8ba; text-shadow: none; }

  .clock {
    position: fixed; left: 50%; top: 18px; transform: translateX(-50%); z-index: 6;
    display: flex; align-items: baseline; gap: 10px;
    color: #e9e4d8; user-select: none;
    font: 700 22px/1 'Space Mono', monospace; letter-spacing: .04em;
    opacity: 0; transition: opacity .6s, color .3s;
  }
  .clock.on { opacity: 1; }
  .clock small { color: #7d838d; font-size: 10px; letter-spacing: .14em; }
  .clock.late { color: #ff5a3c; animation: tick 1s steps(2) infinite; }
  @keyframes tick { 50% { opacity: .45; } }

  .msg {
    position: fixed; left: 50%; bottom: -10px; z-index: 7;
    width: 300px; height: 440px; padding: 18px 16px;
    background: #14161b; border: 6px solid #2a2c32; border-radius: 30px;
    box-shadow: 0 30px 60px rgba(0,0,0,.6);
    transform: translate(-50%, 110%);
    transition: transform .45s cubic-bezier(.2,.8,.3,1);
    font-family: 'Nanum Myeongjo', serif;
  }
  .msg.on { transform: translate(-50%, 0) rotate(-2deg); }
  .msg .mh { padding-bottom: 12px; border-bottom: 1px solid #2a2c32; color: #cfc8ba; font: 700 14px/1 'Nanum Myeongjo', serif; text-align: center; }
  .msg .mb { display: flex; flex-direction: column; gap: 8px; padding-top: 14px; }
  .msg .b {
    align-self: flex-start; max-width: 80%; padding: 9px 12px;
    background: #2b2e36; color: #eee8dc; border-radius: 14px 14px 14px 4px;
    font: 700 14px/1.35 'Nanum Myeongjo', serif;
    animation: pop .25s ease-out;
  }
  .msg .b.v { width: 86%; padding: 0; overflow: hidden; font: 400 10px/1 'Space Mono', monospace; color: #a9a397; }
  .msg .b.v svg { display: block; width: 100%; }
  .msg .b.v span { display: block; padding: 7px 10px; }
  .cat .paw { transform-origin: 96px 66px; animation: paw 1.6s ease-in-out infinite; }
  .cat .kb { animation: kb 1.6s steps(1) infinite; }
  .cat .tk { animation: tk 1.6s ease-out infinite; }
  .cat .tail { transform-origin: 44px 70px; animation: tail 1.1s ease-in-out infinite alternate; }
  .cat .hd { transform-origin: 82px 56px; animation: hd 1.6s ease-in-out infinite; }
  .cat .pg { animation: pg 42s linear forwards; }
  @keyframes paw { 0%, 100% { transform: rotate(0); } 35%, 50% { transform: rotate(-38deg); } }
  @keyframes kb { 0%, 38% { fill: #8a2a20; } 40%, 60% { fill: #ff5a3c; } 62% { fill: #8a2a20; } }
  @keyframes tk { 0%, 45% { transform: translateY(0); opacity: 0; } 50% { opacity: 1; } 85%, 100% { transform: translateY(12px); opacity: 1; } }
  @keyframes tail { to { transform: rotate(-24deg); } }
  @keyframes hd { 0%, 100% { transform: rotate(0); } 50%, 70% { transform: rotate(-10deg); } }
  @keyframes pg { from { width: 0; } to { width: 160px; } }

  .ask {
    position: fixed; left: 50%; bottom: 56px; z-index: 7;
    width: min(440px, calc(100vw - 32px)); padding: 16px 18px 14px;
    background: #f5f1e8; color: #2a2a2a;
    box-shadow: 0 18px 40px rgba(0,0,0,.5);
    transform: translate(-50%, 20px); opacity: 0; pointer-events: none;
    transition: opacity .3s, transform .3s;
  }
  .ask.on { transform: translate(-50%, 0); opacity: 1; pointer-events: auto; }
  .ask .who { color: #8a857a; font: 700 10px/1 'Space Mono', monospace; letter-spacing: .14em; }
  .ask .line { margin-top: 8px; font: 700 16px/1.5 'Nanum Myeongjo', serif; }
  .ask .btns { display: flex; gap: 8px; margin-top: 12px; }
  .ask .btns span {
    flex: 1; padding: 9px 0; text-align: center; cursor: pointer;
    border: 1px solid #2a2a2a; font: 700 13px/1 'Nanum Myeongjo', serif;
  }
  .ask .btns span:first-child { background: #2a2a2a; color: #f5f1e8; }
  .ask .bar { height: 2px; margin-top: 12px; background: #ddd6c8; }
  .ask .bar i { display: block; height: 100%; width: 100%; background: #c9402a; }
  .ask.busy .btns { display: none; }
  .end.win .line { color: #ffd84a; font-size: clamp(22px, 2.6vw, 34px); }
  @keyframes pop { from { transform: scale(.8); opacity: 0; } }

  .acts {
    position: fixed; left: 36px; bottom: 44px; z-index: 8;
    display: flex; flex-direction: column; gap: 6px;
    opacity: 0; transform: translateX(-12px); pointer-events: none;
    transition: opacity .35s, transform .35s;
  }
  .acts.on { opacity: 1; transform: none; pointer-events: auto; }
  .acts .t { margin-bottom: 2px; color: #7d838d; font: 700 9px/1 'Space Mono', monospace; letter-spacing: .2em; }
  .acts span {
    padding: 9px 14px 8px; cursor: pointer; user-select: none;
    background: rgba(20,23,28,.62); border: 1px solid rgba(150,160,175,.26);
    color: #b9bec6; font: 700 13px/1 'Nanum Myeongjo', serif;
    transition: background .2s, color .2s, border-color .2s;
  }
  .acts span:hover { color: #f1ece2; border-color: rgba(223,228,234,.5); }
  .acts span.on { background: #f5f1e8; color: #2a2a2a; border-color: #f5f1e8; }
  .acts small { margin-left: 8px; color: #7d838d; font: 400 10px/1 'Nanum Myeongjo', serif; }
  .acts span.on small { color: #8a857a; }

  .mag {
    position: fixed; left: 50%; bottom: -14px; z-index: 6;
    display: flex; width: min(600px, calc(100vw - 32px)); height: 310px;
    background: #f3eee3; color: #2a2a2a; cursor: pointer;
    box-shadow: 0 30px 60px rgba(0,0,0,.6);
    transform: translate(-50%, 115%) rotate(0);
    transition: transform .5s cubic-bezier(.2,.8,.3,1);
  }
  .mag.on { transform: translate(-50%, 0) rotate(1.2deg); }
  body:has(.msg.on) .mag.on, body:has(.ask.on) .mag.on { transform: translate(-50%, 70%) rotate(1.2deg); }
  .mag::after {
    content: ''; position: absolute; left: 50%; top: 0; bottom: 0; width: 40px; transform: translateX(-50%);
    background: linear-gradient(90deg, transparent, rgba(0,0,0,.14) 48%, rgba(0,0,0,.2) 50%, rgba(0,0,0,.14) 52%, transparent);
    pointer-events: none;
  }
  .mag .pg { flex: 1; padding: 22px 24px; overflow: hidden; }
  .mag.flip .pg { animation: flip .35s ease-out; }
  .mag .k { color: #c9402a; font: 700 9px/1 'Space Mono', monospace; letter-spacing: .2em; }
  .mag h3 { margin: 10px 0 10px; font: 800 21px/1.3 'Nanum Myeongjo', serif; }
  .mag p { font: 400 12px/1.75 'Nanum Myeongjo', serif; color: #4a4740; }
  .mag .art { height: 74px; margin-bottom: 12px; }
  .mag .no { position: absolute; bottom: 24px; font: 400 9px/1 'Space Mono', monospace; color: #9a958a; }
  .mag .no.l { left: 24px; } .mag .no.r { right: 24px; }
  body.reading .cap { opacity: 0 !important; }
  @keyframes flip { from { opacity: 0; transform: translateX(-14px); } }

  .lid { position: fixed; left: 0; right: 0; z-index: 6; height: 0; background: #050506; pointer-events: none; }
  .lid.t { top: 0; border-radius: 0 0 50% 50% / 0 0 40px 40px; }
  .lid.b { bottom: 0; border-radius: 50% 50% 0 0 / 40px 40px 0 0; }

  body.preview .home-btn, body.preview .snd, body.preview .hint,
  body.preview .cap, body.preview .ticket { display: none; }
</style>
</head>
<body>
<a class="home-btn" href="../index.html">← INDEX</a>
<div class="snd" id="snd">SOUND ON</div>
<div class="cap" id="cap"></div>
<div class="ticket" id="ticket">
  <div class="t1">NUMBER TICKET</div>
  <div class="t2">번호표</div>
  <div class="no" id="tNo">052</div>
  <div class="ah" id="tAh">앞에 14명</div>
  <div class="dt" id="tDt">2026.11.18</div>
  <div class="stamp">지나간 번호</div>
</div>
<div class="end" id="end"><div class="big" id="endNo">052</div><div class="line" id="endLine"></div><div class="sub" id="endSub"></div><div class="again" id="again">↻ 다시 기다리기</div></div>
<div class="clock" id="clock"><span id="clk">3:50</span><small>마감 4:00</small></div>
<div class="lid t" id="lidT"></div><div class="lid b" id="lidB"></div>
<div class="ask" id="ask"><div class="who" id="askWho"></div><div class="line" id="askLine"></div><div class="btns"><span id="askYes"></span><span id="askNo"></span></div><div class="bar"><i id="askBar"></i></div></div>
<div class="acts" id="acts"><div class="t">기다리는 동안</div><span data-a="music">음악 듣기<small>방송이 작게 들려요</small></span><span data-a="mag">잡지 보기<small>자막이 안 보여요</small></span><span data-a="water">물 마시기<small>잠이 깨요</small></span></div>
<div class="mag" id="mag"><div class="pg" id="magL"></div><div class="pg" id="magR"></div><span class="no l" id="magNoL"></span><span class="no r" id="magNoR"></span></div>
<div class="msg" id="msg"><div class="mh">친구</div><div class="mb" id="mb"></div></div>
<div class="start" id="start"><div class="s1">오후 3시 50분, 은행 문 닫기 10분 전이에요.<br>번호표를 뽑고, 4시 전에 창구에 가야 해요.</div><div class="s2">▶ 번호표 뽑기</div></div>
<div class="hint" id="hint">내 번호가 불리면 화면을 누르세요</div>
<script>
const PREVIEW = new URLSearchParams(location.search).has('preview');
if (PREVIEW) document.body.classList.add('preview');
const DPR = Math.min(window.devicePixelRatio || 1, 2);
const clamp = (v, a, b) => v < a ? a : v > b ? b : v;
const rnd = (a, b) => a + Math.random() * (b - a);
const lerp = (a, b, t) => a + (b - a) * t;
const pick = a => a[Math.floor(Math.random() * a.length)];
const pad = (n, k = 3) => String(n).padStart(k, '0');

const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(DPR);
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.outputEncoding = THREE.sRGBEncoding;
document.body.prepend(renderer.domElement);

const scene = new THREE.Scene();
scene.background = new THREE.Color('#1b1d22');
scene.fog = new THREE.Fog('#1b1d22', 10, 24);
const camera = new THREE.PerspectiveCamera(50, 1, .05, 60);

const M = (c, o = {}) => new THREE.MeshStandardMaterial(Object.assign({ color: c, flatShading: true, roughness: .85, metalness: 0 }, o));
function box(w, h, d, mat, x, y, z, parent = scene) {
  const m = new THREE.Mesh(new THREE.BoxGeometry(w, h, d), mat);
  m.position.set(x, y, z);
  m.castShadow = m.receiveShadow = true;
  parent.add(m);
  return m;
}

// ── 방 ─────────────────────────────────────────────────────────────────────
const hemi = new THREE.HemisphereLight('#f4f1ea', '#3a3530', .55);
scene.add(hemi);
const sun = new THREE.DirectionalLight('#fff4e2', .75);
sun.position.set(3, 9, 5);
sun.castShadow = true;
sun.shadow.mapSize.set(1024, 1024);
Object.assign(sun.shadow.camera, { left: -9, right: 9, top: 9, bottom: -9, near: 1, far: 25 });
scene.add(sun);
const redGlow = new THREE.PointLight('#ff3a1e', 0, 6);
redGlow.position.set(0, 2.9, -5.2);
scene.add(redGlow);

function tileTex() {
  const c = document.createElement('canvas'); c.width = c.height = 256;
  const g = c.getContext('2d');
  g.fillStyle = '#8b857a'; g.fillRect(0, 0, 256, 256);
  for (let i = 0; i < 4; i++) for (let j = 0; j < 4; j++) {
    g.fillStyle = (i + j) % 2 ? '#8f897e' : '#878175';
    g.fillRect(i * 64 + 1, j * 64 + 1, 62, 62);
  }
  const t = new THREE.CanvasTexture(c);
  t.wrapS = t.wrapT = THREE.RepeatWrapping; t.repeat.set(7, 7);
  t.encoding = THREE.sRGBEncoding;
  return t;
}
const floor = new THREE.Mesh(new THREE.PlaneGeometry(14, 14), new THREE.MeshStandardMaterial({ map: tileTex(), roughness: .9 }));
floor.rotation.x = -Math.PI / 2; floor.position.z = -.5; floor.receiveShadow = true;
scene.add(floor);

const wallM = M('#cfc9bc'), sideM = M('#bdb7aa');
box(14, 3.8, .1, wallM, 0, 1.9, -6.5);
box(.1, 3.8, 14, sideM, -6.8, 1.9, -.5);
box(.1, 3.8, 14, sideM, 6.8, 1.9, -.5);
const KIOSK = { x: 6.3, z: 2.5, stand: [5.55, 2.5] };
const kiosk = new THREE.Group(); kiosk.position.set(KIOSK.x, 0, KIOSK.z); scene.add(kiosk);
box(.5, 1.25, .6, M('#d8d2c4'), 0, .625, 0, kiosk);
box(.54, .1, .64, M('#3a5f8a'), 0, 1.3, 0, kiosk);
const kioskScr = box(.02, .26, .4, M('#1c2a38', { emissive: '#4fb4ff', emissiveIntensity: .25 }), -.26, 1.0, 0, kiosk);
const kioskBtn = box(.06, .1, .1, M('#e04434', { emissive: '#ff3a24', emissiveIntensity: .2 }), -.27, .78, 0, kiosk);
box(.03, .03, .26, M('#202020'), -.26, .62, 0, kiosk);
const kioskPaper = box(.005, .16, .2, M('#f3efe6'), -.25, .55, 0, kiosk); kioskPaper.visible = false;
{
  const c = document.createElement('canvas'); c.width = 256; c.height = 64;
  const g = c.getContext('2d');
  g.fillStyle = '#3a5f8a'; g.fillRect(0, 0, 256, 64);
  g.fillStyle = '#fff'; g.font = "700 34px 'Nanum Myeongjo'"; g.textAlign = 'center'; g.fillText('번호표', 128, 45);
  const t = new THREE.CanvasTexture(c); t.encoding = THREE.sRGBEncoding;
  const sign = new THREE.Mesh(new THREE.PlaneGeometry(.6, .15), new THREE.MeshBasicMaterial({ map: t, toneMapped: false }));
  sign.position.set(-.33, 1.52, 0); sign.rotation.y = -Math.PI / 2; kiosk.add(sign);
  box(.04, .2, .64, M('#3a5f8a'), -.02, 1.52, 0, kiosk);
}
box(14, 3.8, .1, sideM, 0, 1.9, 6.3);
box(14, .1, 14, M('#77746d'), 0, 3.8, -.5);
box(14, .5, .12, M('#9c968a'), 0, .25, -6.42);
box(1.0, 2.1, .06, M('#8a7058'), 5.3, 1.05, -6.43);
box(.06, .06, .08, M('#d8c48a'), 4.95, 1.0, -6.38);
box(.42, .14, .02, M('#3a5a4a'), 5.3, 2.3, -6.42);
const panelM = M('#fffbea', { emissive: '#fff6dc', emissiveIntensity: .9 });
[-4, 0, 4].forEach(x => [-4, -.5, 3].forEach(z => box(1.4, .04, .6, panelM, x, 3.74, z)));

// 문
box(1.3, 2.3, .06, M('#5d5348'), 6.75, 1.15, 3.6).rotation.y = Math.PI / 2;
box(.04, .5, .5, M('#3fae6a', { emissive: '#2e9a58', emissiveIntensity: .8 }), 6.72, 2.55, 3.6);

// 화분·정수기
box(.42, .5, .42, M('#7a5a40'), -6.2, .25, -5.6);
const leaf = new THREE.Mesh(new THREE.ConeGeometry(.45, 1.3, 5), M('#4c7a4a'));
leaf.position.set(-6.2, 1.15, -5.6); leaf.castShadow = true; scene.add(leaf);
box(.4, 1.1, .4, M('#e4e2dc'), 6.2, .55, -5.6);
box(.32, .45, .32, M('#9cc4d8', { transparent: true, opacity: .75 }), 6.2, 1.33, -5.6);

const SEG = { 0: 'abcdef', 1: 'bc', 2: 'abged', 3: 'abgcd', 4: 'fgbc', 5: 'afgcd', 6: 'afgedc', 7: 'abc', 8: 'abcdefg', 9: 'abcdfg' };
function seg7(g, ch, x, y, w, h, on, off) {
  const t = w * .17, hh = h / 2;
  const R = {
    a: [x + t, y, w - 2 * t, t], d: [x + t, y + h - t, w - 2 * t, t], g: [x + t, y + hh - t / 2, w - 2 * t, t],
    f: [x, y + t, t, hh - 1.5 * t], b: [x + w - t, y + t, t, hh - 1.5 * t],
    e: [x, y + hh + t / 2, t, hh - 1.5 * t], c: [x + w - t, y + hh + t / 2, t, hh - 1.5 * t],
  };
  const lit = SEG[ch] || '';
  g.save();
  g.transform(1, 0, -.08, 1, h * .08, 0);
  for (const k in R) {
    const isOn = on && lit.includes(k);
    g.fillStyle = isOn ? on : off;
    g.shadowColor = isOn ? on : 'transparent';
    g.shadowBlur = isOn ? w * .25 : 0;
    g.fillRect(R[k][0] + 1.5, R[k][1] + 1.5, R[k][2] - 3, R[k][3] - 3);
  }
  g.restore();
}
function digits(g, str, x, y, w, h, gap, on, off) {
  [...str].forEach((ch, i) => seg7(g, ch, x + i * (w + gap), y, w, h, on, off));
}

const CLOTH = ['#c8a04a', '#3f7a7a', '#a5523f', '#34466b', '#6e7a45', '#c98f9a', '#7d7d86', '#5a4a6e', '#d17b3c', '#2f5d4a'];

function makeGuy(opt = {}) {
  const g = new THREE.Group();
  const cl = M(opt.cloth || pick(CLOTH)), sk = M(pick(SKIN)), pa = M(pick(PANTS)), ha = M(pick(HAIR));
  const mesh = (geo, mat, x, y, z, p) => {
    const m = new THREE.Mesh(geo, mat); m.position.set(x, y, z); m.castShadow = true; p.add(m); return m;
  };
  const torso = mesh(new THREE.CylinderGeometry(.19, .25, .56, 6), cl, 0, .3, 0, g);
  const head = new THREE.Group(); head.position.y = .76; g.add(head);
  mesh(new THREE.IcosahedronGeometry(.165, 0), sk, 0, 0, 0, head);
  const hair = mesh(new THREE.BoxGeometry(.3, .15, .3), ha, 0, .07, -.03, head);
  hair.rotation.y = rnd(-.3, .3);
  mesh(new THREE.BoxGeometry(.05, .05, .06), sk, 0, -.01, .16, head);
  const budM = M('#f4f4f0');
  const buds = [-1, 1].map(sd => { const b = mesh(new THREE.BoxGeometry(.04, .06, .05), budM, sd * .168, -.03, .02, head); b.visible = false; return b; });
  const arm = side => {
    const p = new THREE.Group(); p.position.set(side * .26, .52, 0); g.add(p);
    mesh(new THREE.BoxGeometry(.09, .46, .09), cl, 0, -.21, 0, p);
    mesh(new THREE.BoxGeometry(.08, .08, .08), sk, 0, -.46, 0, p);
    return p;
  };
  const leg = side => {
    const hip = new THREE.Group(); hip.position.set(side * .1, 0, 0); g.add(hip);
    mesh(new THREE.BoxGeometry(.12, .38, .13), pa, 0, -.19, 0, hip);
    const knee = new THREE.Group(); knee.position.y = -.38; hip.add(knee);
    mesh(new THREE.BoxGeometry(.11, .36, .12), pa, 0, -.18, 0, knee);
    mesh(new THREE.BoxGeometry(.12, .07, .2), shoeM, 0, -.37, .04, knee);
    return { hip, knee };
  };
  const phone = mesh(new THREE.BoxGeometry(.08, .13, .015), M('#15161a', { emissive: '#9fc6ff', emissiveIntensity: .35 }), 0, .4, .3, g);
  phone.rotation.x = -.9;
  const s = opt.scale || rnd(.92, 1.08);

  return {
    g, torso, head, buds, absorbed: false, shakeUntil: 0, armL: arm(-1), armR: arm(1), legL: leg(-1), legR: leg(1), phone, s,
    state: 'sit', sit: 1, sitT: 1, walk: 0, phase: rnd(0, 6), heading: Math.PI, headingT: Math.PI,
    path: [], onArrive: null, t: 0, uses: opt.phone ?? Math.random() < .5,
    lookY: 0, lookX: 0, lookUntil: 0, jig: rnd(0, 6), ticket: 0, seat: null, tag: null,
  };
}

function poseGuy(u, dt, time) {
  u.sit += (u.sitT - u.sit) * Math.min(1, dt * 5);
  const moving = u.path.length > 0 || u.keyMove;
  u.walk += ((moving ? 1 : 0) - u.walk) * Math.min(1, dt * 6);
  let dh = u.headingT - u.heading;
  dh = Math.atan2(Math.sin(dh), Math.cos(dh));
  u.heading += dh * Math.min(1, dt * 7);
  u.g.rotation.y = u.heading;
  const sw = Math.sin(u.phase), w = u.walk, st = u.sit;
  u.g.position.y = lerp(.78, .47, st) * u.s + Math.abs(Math.cos(u.phase)) * .03 * w;
  u.legL.hip.rotation.x = lerp(0, -1.5, st) + sw * .55 * w;
  u.legR.hip.rotation.x = lerp(0, -1.5, st) - sw * .55 * w;
  u.legL.knee.rotation.x = lerp(0, 1.45, st) + Math.max(0, -sw) * .8 * w;
  u.legR.knee.rotation.x = lerp(0, 1.45, st) + Math.max(0, sw) * .8 * w;
  if (st > .5 && u.state === 'sit') u.legR.knee.rotation.x += Math.sin(time * 9 + u.jig) * .04 * (u.jig > 3 ? 1 : 0);
  const onPhone = u.uses && st > .8 && time > u.lookUntil;
  u.phone.visible = onPhone;
  const armSit = onPhone ? -1.15 : -.55;
  u.armL.rotation.x = lerp(-sw * .45 * w, armSit, st);
  u.armR.rotation.x = lerp(sw * .45 * w, armSit, st);
  u.armL.rotation.z = -.08; u.armR.rotation.z = .08;
  u.armL.rotation.y = onPhone ? -.35 : 0; u.armR.rotation.y = onPhone ? .35 : 0;
  u.torso.rotation.x = st * .08 + (onPhone ? .1 : 0);
  const lx = onPhone ? .5 : u.lookX, ly = time < u.shakeUntil ? Math.sin(time * 15) * .5 : time < u.lookUntil ? u.lookY : Math.sin(time * .3 + u.jig) * .15;
  u.head.rotation.x += (lx - u.head.rotation.x) * Math.min(1, dt * 4);
  u.head.rotation.y += (ly - u.head.rotation.y) * Math.min(1, dt * 4);
}

function walkGuy(u, dt) {
  if (!u.path.length) return;
  const p = u.path[0], gp = u.g.position;
  const dx = p[0] - gp.x, dz = p[1] - gp.z, d = Math.hypot(dx, dz);
  const sp = 1.4 * u.s * (u.speed || 1);
  if (d < .05) {
    u.path.shift();
    if (!u.path.length && u.onArrive) { const f = u.onArrive; u.onArrive = null; f(u); }
    return;
  }
  u.headingT = Math.atan2(dx, dz);
  const k = Math.min(d, sp * dt);
  gp.x += dx / d * k; gp.z += dz / d * k;
  u.phase += dt * 7.5;
}

// ── 소리 ───────────────────────────────────────────────────────────────────
const sound = (() => {
  let ac = null, master = null, room = null, roomF = null, music = null, musF = null, hum = null, noise = null;
  let on = true, phones = true, nextT = 0, stepN = 0, t0 = 0;
  const BPM = 128, S16 = 60 / BPM / 4;

    room = ac.createGain(); roomF.connect(room).connect(master);
    musF = ac.createBiquadFilter(); musF.type = 'lowpass';
    music = ac.createGain(); musF.connect(music).connect(master);
    const o = ac.createOscillator(); o.type = 'sawtooth'; o.frequency.value = 120;
    const f = ac.createBiquadFilter(); f.type = 'lowpass'; f.frequency.value = 260;
    hum = ac.createGain(); hum.gain.value = .01;
    o.connect(f).connect(hum).connect(roomF); o.start();

    const d = noise.getChannelData(0);
    for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1;
    const n = ac.createBufferSource(); n.buffer = noise; n.loop = true;
    const nf = ac.createBiquadFilter(); nf.type = 'bandpass'; nf.frequency.value = 700; nf.Q.value = .4;
    const ng = ac.createGain(); ng.gain.value = .012;
    n.connect(nf).connect(ng).connect(roomF); n.start();

    setInterval(schedule, 25);
  }
  let drowse = 0, ended = false;
  function apply(tc) {

    roomF.frequency.setTargetAtTime((phones ? 650 : 16000) * (1 - .7 * drowse), t, tc);
    room.gain.setTargetAtTime((phones ? .42 : 1) * z, t, tc);
    musF.frequency.setTargetAtTime(phones ? 16000 : 900, t, tc);
    music.gain.setTargetAtTime(ended ? 0 : phones ? .95 : .03, t, tc);
  }
  function env(g, t, vol, dur) {
    g.gain.setValueAtTime(0, t);
    g.gain.linearRampToValueAtTime(vol, t + .004);
    g.gain.exponentialRampToValueAtTime(.0001, t + dur);
  }
  function kickAt(t) {

    o.frequency.setValueAtTime(150, t); o.frequency.exponentialRampToValueAtTime(45, t + .12);

  }
  function hissAt(t, type, freq, dur, vol) {

    s.buffer = noise; f.type = type; f.frequency.value = freq; f.Q.value = .8;
    env(g, t, vol, dur); s.connect(f).connect(g).connect(musF); s.start(t, Math.random()); s.stop(t + dur + .05);
  }
  function toneAt(t, type, freq, dur, vol, cut) {

    o.type = type; o.frequency.value = freq; f.type = 'lowpass'; f.frequency.value = cut;
    env(g, t, vol, dur); o.connect(f).connect(g).connect(musF); o.start(t); o.stop(t + dur + .05);
  }

      g.gain.linearRampToValueAtTime(vol * a, t0 + .006);
      g.gain.exponentialRampToValueAtTime(.0001, t0 + dur / r ** .3);

    });

    kick() { ensure(); if (ac.state === 'suspended') ac.resume(); },
    print() {
      if (!ac) return; const t = ac.currentTime + .02;
      bell(1318.5, t, .25, .08);
      for (let i = 0; i < 14; i++) {
        const s = ac.createBufferSource(), f = ac.createBiquadFilter(), g = ac.createGain();
        s.buffer = noise; f.type = 'bandpass'; f.frequency.value = 2400; f.Q.value = 2;
        const at = t + .25 + i * .06;
        g.gain.setValueAtTime(0, at); g.gain.linearRampToValueAtTime(.12, at + .004); g.gain.exponentialRampToValueAtTime(.0001, at + .04);
        s.connect(f).connect(g).connect(roomF); s.start(at, Math.random()); s.stop(at + .06);
      }
    },
    dingdong() { if (!ac) return; const t = ac.currentTime + .02; bell(659.25, t, 1.5, .2); bell(523.25, t + .5, 2.2, .2); },
    setHum(v) { if (hum) hum.gain.setTargetAtTime(v, ac.currentTime, .6); },
    toggle() { on = !on; if (master) master.gain.setTargetAtTime(on ? .8 : 0, ac.currentTime, .05); if (!on) speechSynthesis.cancel(); return on; },
    setPhones(v) { phones = v; if (ac) apply(.08); },
    setDrowse(v) { if (Math.abs(v - drowse) < .02) return; drowse = v; if (ac) apply(.3); },
    buzz() {
      if (!ac) return; const t = ac.currentTime + .02;
      [0, .16].forEach(d => {
        const o = ac.createOscillator(), g = ac.createGain();
        o.type = 'square'; o.frequency.value = 155;
        env(g, t + d, .05, .12); o.connect(g).connect(master); o.start(t + d); o.stop(t + d + .15);
      });
    },
    flip() {
      if (!ac) return; const t = ac.currentTime + .01;
      const s = ac.createBufferSource(), f = ac.createBiquadFilter(), g = ac.createGain();
      s.buffer = noise; f.type = 'bandpass'; f.Q.value = .7;
      f.frequency.setValueAtTime(1800, t); f.frequency.exponentialRampToValueAtTime(5200, t + .22);
      g.gain.setValueAtTime(0, t); g.gain.linearRampToValueAtTime(.16, t + .05); g.gain.exponentialRampToValueAtTime(.0001, t + .3);
      s.connect(f).connect(g).connect(roomF); s.start(t, Math.random()); s.stop(t + .35);
    },
    pour() {
      if (!ac) return; const t = ac.currentTime + .02;

        const o = ac.createOscillator(), g = ac.createGain(), at = t + i * .07 + Math.random() * .03;
        o.type = 'sine'; o.frequency.setValueAtTime(500 + i * 22 + Math.random() * 180, at);
        o.frequency.exponentialRampToValueAtTime(1400 + i * 30, at + .04);
        env(g, at, .035, .05); o.connect(g).connect(roomF); o.start(at); o.stop(at + .07);
      }
      bell(220, t + 2.1, .5, .05);
    },
    closingSong() {
      if (!ac) return; ended = true; apply(1.2);
      const B = .62, t0 = ac.currentTime + .8;
      const F = { C4: 261.63, D4: 293.66, F4: 349.23, G4: 392, A4: 440, C5: 523.25, D5: 587.33, F3: 174.61, C3: 130.81, B2: 116.54 };
      const mel = [['C4', 1], ['F4', 1.5], ['F4', .5], ['F4', 1], ['A4', 1], ['G4', 1.5], ['F4', .5], ['G4', 1], ['A4', .5], ['G4', .5],
        ['F4', 1.5], ['F4', .5], ['A4', 1], ['C5', 1], ['D5', 3], ['D5', 1], ['C5', 1.5], ['A4', .5], ['A4', 1], ['F4', 1],
        ['G4', 1.5], ['F4', .5], ['G4', 1], ['A4', .5], ['G4', .5], ['F4', 1.5], ['D4', .5], ['D4', 1], ['C4', 1], ['F4', 3]];

  sound.setHum(.008 + near * .03);
  if (mineState === 'called') me.tag.visible = Math.floor(time * 3) % 2 === 0;
}
let dance = 0;
const DISCO = ['#ff3fa4', '#38e8ff', '#ffe23a', '#7dff5a'].map(c => new THREE.Color(c));
const WARM = new THREE.Color('#ffe2a8');
const sweeps = ['#ff3fa4', '#38e8ff'].map((c, i) => {
  const l = new THREE.SpotLight(c, 0, 9, .22, .5, 1);
  l.position.set(ME_SEAT.x + (i ? 2.2 : -2.2), 3.8, ME_SEAT.z - 1);
  scene.add(l, l.target); return l;
});
const noteTex = ['♪', '♫', '♬'].map(ch => {
  const c = document.createElement('canvas'); c.width = c.height = 64;
  const x = c.getContext('2d'); x.font = 'bold 52px serif'; x.textAlign = 'center'; x.textBaseline = 'middle';
  x.fillStyle = '#fff'; x.fillText(ch, 32, 34); return new THREE.CanvasTexture(c);
});
const notes = Array.from({ length: 14 }, (_, i) => {
  const sp = new THREE.Sprite(new THREE.SpriteMaterial({ map: noteTex[i % 3], transparent: true, depthWrite: false }));
  sp.scale.setScalar(.22); sp.visible = false; scene.add(sp);
  return { sp, t: 1, vx: 0, vz: 0, tex: noteTex[i % 3] };
});
const zTex = (() => {
  const c = document.createElement('canvas'); c.width = c.height = 64;
  const x = c.getContext('2d'); x.font = "700 46px 'Space Mono'"; x.textAlign = 'center'; x.textBaseline = 'middle';
  x.fillStyle = '#fff'; x.fillText('z', 32, 34); return new THREE.CanvasTexture(c);
})();
const ZCOL = new THREE.Color('#cfd6e0');
let noteBeat = -1;
const beam = new THREE.Mesh(new THREE.CylinderGeometry(.06, 1, 3.6, 24, 1, true),
  new THREE.MeshBasicMaterial({ color: '#fff', transparent: true, opacity: 0, blending: THREE.AdditiveBlending, depthWrite: false, side: THREE.DoubleSide }));
beam.position.set(ME_SEAT.x, 1.9, ME_SEAT.z);
scene.add(beam);
function grooveMe(dt) {
  const bt = Math.max(0, sound.live() ? sound.beat() : time * 128 / 60), b = bt * Math.PI;
  const want = sound.phones && !me.roam && me.sit > .8 && (mineState === 'wait' || mineState === 'called' || mineState === 'missed') && time > me.shakeUntil && drowsy < .3 && !msgOpen ? 1 : 0;
  const mp = me.g.position;
  spot.position.set(mp.x, 3.7, mp.z + .1); spot.target.position.set(mp.x, .5, mp.z);
  beam.position.set(mp.x, 1.9, mp.z);
  dance += (want - dance) * Math.min(1, dt * 5);
  const d = dance, k = Math.min(1, dt * 10), hit = Math.abs(Math.sin(b));
  me.phone.visible = me.phone.visible && d < .3;
  me.head.position.y = .76 + hit * .05 * d;
  me.head.rotation.x += ((-.25 + hit * .6) - me.head.rotation.x) * k * d;
  me.head.rotation.z = Math.sin(b) * .22 * d;
  me.torso.rotation.z = Math.sin(b) * .14 * d;
  me.g.position.y += hit * .05 * d;
  me.armL.rotation.x = lerp(me.armL.rotation.x, -2.85 + hit * .75, d);
  me.armL.rotation.z = lerp(me.armL.rotation.z, -.35, d);
  me.armR.rotation.x = lerp(me.armR.rotation.x, -1.1 + Math.sin(b * 2) * .45, d);
  me.armR.rotation.z = lerp(me.armR.rotation.z, .55, d);
  if (me.sit > .8) me.legR.knee.rotation.x += hit * .25 * d;
  if (me.mag.visible && d < .3) {
    me.armL.rotation.x = me.armR.rotation.x = -1.15;
    me.armL.rotation.y = -.35; me.armR.rotation.y = .35;
    me.torso.rotation.x = .14;
  }
  if (me.cup.visible) { me.armR.rotation.x = -2.35; me.armR.rotation.z = -.5; }

  const hot = mineState === 'called', party = d * (hot ? 0 : 1), lk = Math.min(1, dt * (hot ? 3 : 4));
  const pulse = Math.pow(1 - (bt % 1), 3), col = DISCO[Math.floor(bt / 4) % 4];
  spot.color.lerp(hot ? WARM : col, Math.min(1, dt * 6));
  spot.angle = hot ? .3 : .38;
  spot.intensity += ((hot ? 2.6 : party * (1.6 + pulse * 2.4)) - spot.intensity) * lk;
  hemi.intensity += ((hot ? .22 : lerp(.55, .14, party)) - hemi.intensity) * lk;
  sun.intensity += ((hot ? .25 : lerp(.75, .1, party)) - sun.intensity) * lk;
  beam.material.color.copy(spot.color);
  beam.material.opacity += ((hot ? .1 : party * (.07 + pulse * .08)) - beam.material.opacity) * lk;
  beam.visible = beam.material.opacity > .005;
  sweeps.forEach((l, i) => {
    const a = time * (i ? -1.7 : 1.3) + i * 2;
    l.target.position.set(mp.x + Math.cos(a) * 1.6, 0, mp.z - .8 + Math.sin(a) * 1.4);
    l.intensity += (party * (1.4 + pulse * 1.2) - l.intensity) * lk;
  });

  const beatN = Math.floor(bt * 2), zz = drowsy >= 1;
  if ((party > .6 || zz) && beatN !== noteBeat && (!zz || beatN % 3 === 0)) {
    noteBeat = beatN;
    const n = notes.find(o => o.t >= 1);
    if (n) {
      n.sp.material.map = zz ? zTex : n.tex;
      const hp = me.head.getWorldPosition(new THREE.Vector3());
      n.t = 0; n.sp.position.set(hp.x + rnd(-.25, .25), hp.y + .2, hp.z + rnd(-.15, .15));
      n.vx = rnd(-.15, .15); n.vz = rnd(-.1, .1);
      n.sp.material.color.copy(zz ? ZCOL : DISCO[Math.floor(Math.random() * 4)]);
    }
  }
  notes.forEach(n => {
    if (n.t >= 1) { n.sp.visible = false; return; }
    n.t = Math.min(1, n.t + dt * .7);
    n.sp.visible = true;
    n.sp.position.x += n.vx * dt; n.sp.position.z += n.vz * dt; n.sp.position.y += dt * .5;
    n.sp.material.opacity = Math.sin(n.t * Math.PI);
    n.sp.material.rotation = Math.sin(n.t * 9) * .4;
    n.sp.scale.setScalar(.1 + n.t * .08);
  });
  if (closedAt) {
    const k = clamp(Math.floor((time - lightsAt) / 1.2) + 1, 0, 3) / 3;
    hemi.intensity = lerp(.55, .05, k); sun.intensity = lerp(.75, 0, k);
    panelM.emissiveIntensity = .9 * (1 - k);
  }
}

function updateBoard() {
  const flashing = time < flashUntil;
  const lit = flashing ? Math.floor((flashUntil - time) * 4) % 2 === 0 : true;
  const key = `${cur}|${win}|${lit}`;
  if (key !== boardLit) { drawBoard(cur, win, lit); boardLit = key; }
  redGlow.intensity = flashing ? (lit ? 1.4 : .3) : 0;
}

// ── 입력 ───────────────────────────────────────────────────────────────────
$('snd').addEventListener('pointerdown', e => {
  e.stopPropagation(); sound.kick();
  $('snd').textContent = sound.toggle() ? 'SOUND ON' : 'SOUND OFF';
});
let drag = null;
$('again').addEventListener('pointerdown', e => e.stopPropagation());
$('again').addEventListener('click', () => location.reload());
['askYes', 'askNo'].forEach((id, i) => {
  $(id).addEventListener('pointerdown', e => e.stopPropagation());
  $(id).addEventListener('click', () => answer(i === 0));
});
document.addEventListener('pointerdown', e => {
  sound.kick();
  if (e.target.closest('.home-btn')) return;
  drag = { x: e.clientX, moved: 0 };
});
addEventListener('pointermove', e => {
  if (!drag) return;
  const dx = e.clientX - drag.x; drag.x = e.clientX; drag.moved += Math.abs(dx);
  yawT -= dx * .006;
});
addEventListener('pointerup', () => {
  if (!drag) return;
  const click = drag.moved < 6; drag = null;
  if (!click) return;
  if (!started) return begin();
  if (mineState === 'served' || mineState === 'closed' || mineState === 'enter') return;
  if (asking) return;
  if (msgOpen) return closeMsg();
  if (dozeOn) return wake();
  if (mineState === 'called') goToCounter();
  else if (mineState === 'missed') goLate();
  else if (mineState === 'redraw') goKiosk();
  else if (!tapNeighbor() && mineState === 'wait' && !me.errand) setAct(act ? act : me.roam ? 'music' : lastAct);
});
addEventListener('keydown', e => {
  if (!started) { if (e.code === 'Space' || e.code.startsWith('Arrow')) e.preventDefault(); begin(); return; }
  if (msgOpen) closeMsg();
  if (dozeOn) wake();
  if (mineState === 'enter' || mineState === 'closed') return;
  if (e.code === 'Space') { e.preventDefault(); sitDown(); return; }
  if (e.code.startsWith('Arrow')) e.preventDefault();
  keys[e.code] = true; sound.kick();
});
addEventListener('keyup', e => { keys[e.code] = false; });
addEventListener('blur', () => { for (const k in keys) keys[k] = false; });
function resize() {
  renderer.setSize(innerWidth, innerHeight);
  camera.aspect = innerWidth / innerHeight; camera.updateProjectionMatrix();
}
addEventListener('resize', resize);

// ── 루프 ───────────────────────────────────────────────────────────────────
let last = performance.now(), tickT = 0;
function loop(now) {
  const dt = Math.min(.05, (now - last) / 1000); last = now;
  if (!PREVIEW) {
    time += dt;
    step(dt);
    moveCamera(dt);
    if ((tickT += dt) > .5) { tickT = 0; updateTicket(); }
  }
  npcs.forEach(u => {
    poseGuy(u, PREVIEW ? 1 : dt, time);
    if (u.staff && !u.offWork) {
      u.armL.rotation.x = -1.05 + Math.sin(time * 13 + u.jig) * .07;
      u.armR.rotation.x = -1.05 + Math.sin(time * 11 + u.jig * 2) * .07;
      u.head.rotation.x = .25;
    }
  });
  poseGuy(me, PREVIEW ? 1 : dt, time);
  grooveMe(PREVIEW ? 1 : dt);
  updateBoard();
  renderer.render(scene, camera);
  requestAnimationFrame(loop);
}

function setupPreview() {
  cur = 47; win = 2; time = 0;
  camera.fov = 46; camera.updateProjectionMatrix();
  camera.position.set(2.5, 1.85, 4.3); camera.lookAt(-.3, 1.8, -6);
  const u = makeGuy({ phone: false });
  u.ticket = 47; u.sitT = 0; u.g.position.set(0, 0, -1.7);
  u.path = [[0, -3.6]]; u.heading = u.headingT = Math.PI; u.phase = 1.1;
  npcs.push(u);
  npcs.forEach(g => { if (g.state === 'sit' && Math.random() < .5) { g.lookUntil = 99; g.lookY = 0; g.lookX = -.25; } });
}

async function boot() {
  resize();
  try {
    await Promise.race([
      Promise.all([document.fonts.load("800 30px 'Nanum Myeongjo'"), document.fonts.load("700 20px 'Space Mono'")]),
      new Promise(r => setTimeout(r, 2500)),
    ]);
  } catch (e) {}
  COUNTERS.forEach(drawPlaque); meTag();
  if (PREVIEW) setupPreview();
  else {
    idle(); me.tag.visible = false; ticketEl.style.opacity = 0;
    updateTicket();
    sound.kick(); setTimeout(() => sound.kick(), 400);
  }
  requestAnimationFrame(loop);
}
boot();
</script>
