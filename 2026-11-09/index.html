<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>경로를 벗어났습니다 — REROUTING</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700;900&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 100%; height: 100%; overflow: hidden; background: #eceae4; }
  body { font-family: 'Noto Sans KR', sans-serif; cursor: grab; }
  body.drag { cursor: grabbing; }
  canvas { display: block; position: absolute; left: 0; top: 0; width: 100%; height: 100%; }

  /* every chip is the same card. It only changes which side of the sky it is on */
  .chip {
    position: fixed; z-index: 20;
    font: 700 11px/1 'Space Mono', monospace; letter-spacing: .14em;
    color: #3a3f46; text-decoration: none; white-space: nowrap;
    padding: 11px 14px; border-radius: 9px; border: 1px solid rgba(20,24,30,.1);
    background: rgba(255,255,255,.88);
    box-shadow: 0 2px 10px rgba(20,24,30,.1);
    cursor: pointer; user-select: none;
    transition: background .8s ease, color .8s ease, border-color .8s ease,
                box-shadow .8s ease, opacity .5s ease, transform .35s ease;
  }
  .chip:hover { transform: translateY(-1px); }
  .chip:active { transform: translateY(1px); }

  .home-btn { left: 24px; top: 22px; }
  .snd { right: 24px; top: 22px; }
  .reroute {
    left: 50%; bottom: 28px; transform: translateX(-50%);
    font: 700 12px/1 'Noto Sans KR', sans-serif; letter-spacing: .06em;
    padding: 13px 22px; color: #1668e3; border-color: rgba(22,104,227,.3);
  }
  .reroute:hover { transform: translateX(-50%) translateY(-1px); }
  .reroute:active { transform: translateX(-50%) translateY(1px); }

  /* out there the paper is black, so the cards turn over */
  body.space .chip {
    color: #9fb4cf; border-color: rgba(159,180,207,.22);
    background: rgba(8,11,18,.6); box-shadow: none;
  }
  body.space .reroute { color: #8fd0ff; border-color: rgba(143,208,255,.28); }

  .hint {
    position: fixed; left: 50%; bottom: 84px; transform: translateX(-50%); z-index: 19;
    font: 400 11px/1 'Space Mono', monospace; letter-spacing: .18em;
    color: rgba(58,63,70,.5); white-space: nowrap; pointer-events: none;
    transition: opacity 1.2s ease;
  }
  .hint.off { opacity: 0; }
  body.space .hint { color: rgba(159,180,207,.4); }

  body.preview .chip, body.preview .hint { display: none; }
</style>
</head>
<body>
  <canvas id="c"></canvas>
  <a class="chip home-btn" href="../index.html">HOME</a>
  <button class="chip snd" id="snd">SOUND: OFF</button>
  <button class="chip reroute" id="rr">경로 재탐색</button>
  <div class="hint" id="hint">드래그 · 방향키 — 경로를 벗어나 보세요</div>

<script>
(() => {
  'use strict';
  const TAU = Math.PI * 2;
  const cv = document.getElementById('c'), ctx = cv.getContext('2d', { alpha: false });
  const PREVIEW = new URLSearchParams(location.search).get('preview') === '1';
  if (PREVIEW) document.body.classList.add('preview');

  const clamp = (v, a, b) => v < a ? a : v > b ? b : v;
  const lerp = (a, b, t) => a + (b - a) * t;
  const mix = (a, b, t) => [lerp(a[0], b[0], t), lerp(a[1], b[1], t), lerp(a[2], b[2], t)];
  const rgb = c => `rgb(${c[0] | 0},${c[1] | 0},${c[2] | 0})`;
  const rgba = (c, a) => `rgba(${c[0] | 0},${c[1] | 0},${c[2] | 0},${a})`;
  // one deterministic hash so the same street is the same street every reload
  const hsh = (a, b, c) => {
    let s = Math.sin(a * 127.1 + b * 311.7 + c * 74.7) * 43758.5453;
    return s - Math.floor(s);
  };
  const ease = t => t * t * (3 - 2 * t);

  let W = 0, H = 0, DPR = 1;

  // ── the world ──────────────────────────────────────────────────────────
  // One world unit is one metre. The map data stops at MAPR; past that the
  // app has nothing to draw and says so. Everything in the piece is driven by
  // `d`, the distance from the start divided by 1200 — one variable, five lives.
  const MAPR = 2600;
  const PR = 30000;          // how big the planet is, once it becomes one
  const GRID = 110;          // ordinary streets
  const BIG = 440;           // the ones with names
  const DEST = [426, -301]; // 성신여대입구역, where we were actually going

  // traced off the basemap itself: 삼선교로 to 보문로36길 to the station
  const ROUTE = (() => {
    const p = [[0, 0], [38, -21], [78, -34], [112, -64], [132, -102], [172, -117],
      [210, -138], [250, -153], [291, -167], [325, -195], [344, -233], [382, -254],
      [397, -293], DEST];
    const out = [];
    for (let i = 0; i < p.length - 1; i++) {
      const [x0, y0] = p[i], [x1, y1] = p[i + 1];
      for (let t = 0; t < 1; t += 0.06) out.push([lerp(x0, x1, t), lerp(y0, y1, t)]);
    }
    out.push(DEST);
    return out;
  })();

  const PARKS = [[-620, -240, 380, 260], [520, 180, 300, 340], [-340, 700, 460, 220],
                 [880, -620, 250, 250], [-1100, -860, 320, 300]];
  // the piece sits on 삼선동, 성북구. One world unit is one metre from there.
  const PLACES = [
    [-450, 45, '한성대입구역'], [-1059, -723, '성북동'], [895, -954, '미아리고개'],
    [1400, -790, '개운산'], [688, 423, '보문역'], [1588, 312, '안암역'],
    [1562, -89, '고려대'], [-864, 757, '혜화역'], [-370, 1002, '낙산공원'],
  ];

  // ── the voice ──────────────────────────────────────────────────────────
  // Five lives, and the type falls apart at the seam between the third and
  // the fourth. `wob` is how badly the letters are shaking when it speaks.
  const ACTS = [
    { at: 0,   wob: 0,    lines: ['300m 앞에서 우회전입니다', '잠시 후 좌회전입니다', '계속 직진하세요', '전방에 과속 단속 구간입니다'] },
    { at: 1,   wob: 0.12, lines: ['경로를 벗어났습니다', '경로를 재탐색합니다', '가능한 곳에서 유턴하세요', '유턴할 수 있는 곳이 없습니다'] },
    { at: 2,   wob: 0.45, lines: ['이 길은 등록되어 있지 않습니다', '어… 잠시만요', '지금 어디 계신가요', '도로를 찾을 수 없습니다'] },
    { at: 3.5, wob: 0.85, lines: ['고도가 올라가고 있습니다', '아래가 아니라 위로 가고 계세요', '도로가 보이지 않습니다', '괜찮아요. 저도 처음입니다'] },
    { at: 5.5, wob: 0.1,  lines: ['목적지를 다시 설정합니다', '가장 가까운 항성까지 4.2광년', '도착 예정 시각 : 계산할 수 없음', '창밖을 보세요', '여기서부터는 안내할 수 있는 게 없습니다', '그래도 같이 가 드릴게요'] },
  ];
  // what the button says back, per act, in the order you press it
  const RR = [
    ['이미 경로 위에 있습니다', '정말 괜찮습니다', '목적지까지 2분 남았습니다'],
    ['재탐색 중…', '경로를 찾았습니다', '원래 길로 돌아갑니다'],
    ['지도를 다시 불러옵니다', '도로를 찾았습니다', '돌아가는 중입니다'],
    ['고도를 낮춥니다', '지면이 보입니다', '곧 도로에 닿습니다'],
    ['…좌표를 다시 잡았습니다', '삼선동으로 돌아갑니다', '처음부터 다시 안내합니다'],
  ];

  const actOf = d => { let k = 0; for (let i = 0; i < ACTS.length; i++) if (d >= ACTS[i].at) k = i; return k; };

  // ── state ──────────────────────────────────────────────────────────────
  let wx = 0, wy = 0;              // where we are, in metres from the start
  let vx = 0, vy = 0, speed = 0;   // how hard the hand is pushing
  let head = -Math.PI / 2;         // which way the arrow points
  let d = 0, alt = 0, night = 0;   // the one variable, and what it grows into
  let T = 0;
  let line = ACTS[0].lines[0], lineT = 0, lineAct = 0, lineIdx = 0;
  let forced = 0;                  // a line from the button outranks the clock
  let rrCount = [0, 0, 0, 0, 0];
  let backing = 0;                 // the ride home
  let stars = [], clouds = [];

  function world() {
    stars = [];
    for (let i = 0; i < 420; i++) {
      stars.push({ x: hsh(i, 1, 3), y: hsh(i, 2, 5), r: 0.3 + hsh(i, 3, 7) * 1.5,
                   a: 0.25 + hsh(i, 4, 9) * 0.75, tw: hsh(i, 5, 11) * TAU });
    }
    clouds = [];
    for (let i = 0; i < 26; i++) {
      clouds.push({ x: (hsh(i, 7, 2) - 0.5) * 16000, y: (hsh(i, 8, 4) - 0.5) * 16000,
                    r: 700 + hsh(i, 9, 6) * 1500, a: 0.3 + hsh(i, 10, 8) * 0.5 });
    }
  }

  // ── sound ──────────────────────────────────────────────────────────────
  // Tyres on asphalt while there is asphalt, then wind, then the long note
  // that is left when there is nothing to make a sound against.
  const sound = (() => {
    let ac = null, on = false, mas, rd, rdf, rdg, drg, osc = [], sub;

    function build() {
      ac = new (window.AudioContext || window.webkitAudioContext)();
      mas = ac.createDynamicsCompressor();
      mas.threshold.value = -15; mas.ratio.value = 7;
      mas.connect(ac.destination);

      const len = ac.sampleRate * 2, buf = ac.createBuffer(1, len, ac.sampleRate);
      const a = buf.getChannelData(0);
      let v = 0;
      for (let i = 0; i < len; i++) { v = (v + (Math.random() * 2 - 1) * 0.07) * 0.982; a[i] = v * 5; }
      rd = ac.createBufferSource(); rd.buffer = buf; rd.loop = true;
      rdf = ac.createBiquadFilter(); rdf.type = 'bandpass';
      rdf.frequency.value = 520; rdf.Q.value = 0.7;
      rdg = ac.createGain(); rdg.gain.value = 0;
      rd.connect(rdf); rdf.connect(rdg); rdg.connect(mas); rd.start();

      drg = ac.createGain(); drg.gain.value = 0;
      const lp = ac.createBiquadFilter();
      lp.type = 'lowpass'; lp.frequency.value = 520; lp.Q.value = 1.1;
      drg.connect(lp); lp.connect(mas);
      for (const f of [49, 73.4, 98, 146.8]) {
        const o = ac.createOscillator(), g = ac.createGain();
        o.type = 'triangle'; o.frequency.value = f;
        g.gain.value = f > 90 ? 0.08 : 0.19;
        o.connect(g); g.connect(drg); o.start();
        osc.push(o);
      }
      sub = ac.createOscillator();
      const sg = ac.createGain(); sg.gain.value = 0.26;
      sub.type = 'sine'; sub.frequency.value = 24.5;
      sub.connect(sg); sg.connect(drg); sub.start();
    }

    return {
      live: () => !!ac && ac.state === 'running' && on,
      kick() {
        if (!ac) build();
        if (ac.state === 'suspended') ac.resume();
        on = true;
        return ac.state === 'running';
      },
      toggle() {
        if (!ac) build();
        on = !on;
        if (on && ac.state === 'suspended') ac.resume();
        if (!on) { rdg.gain.setTargetAtTime(0, ac.currentTime, 0.08); drg.gain.setTargetAtTime(0, ac.currentTime, 0.1); }
        return on;
      },
      set(sp, altv, nightv) {
        if (!this.live()) return;
        const t = ac.currentTime;
        rdg.gain.setTargetAtTime(clamp(sp / 1500, 0, 1) * 0.42 * (1 - nightv), t, 0.06);
        rdf.frequency.setTargetAtTime(380 + clamp(sp, 0, 2400) * 0.5 + altv * 1500, t, 0.1);
        rdf.Q.setTargetAtTime(0.7 + altv * 3.2, t, 0.2);
        drg.gain.setTargetAtTime(Math.pow(nightv, 1.3) * 0.52, t, 0.5);
        for (let i = 0; i < osc.length; i++) osc[i].detune.setTargetAtTime(Math.sin(t * 0.22 + i) * 11 - nightv * 40, t, 0.7);
      },
      // the two notes a navigation app makes before it says anything
      ding(kind) {
        if (!this.live()) return;
        const t = ac.currentTime;
        const pairs = [[880, 1174.7], [587.3, 440], [392, 329.6], [1046.5, 1568]][kind] || [880, 1174.7];
        pairs.forEach((f, i) => {
          const o = ac.createOscillator(), g = ac.createGain();
          o.type = kind === 3 ? 'sine' : 'triangle';
          o.frequency.value = f;
          const t0 = t + i * (kind === 3 ? 0.26 : 0.13);
          g.gain.setValueAtTime(0, t0);
          g.gain.linearRampToValueAtTime(kind === 3 ? 0.1 : 0.14, t0 + 0.012);
          g.gain.exponentialRampToValueAtTime(0.0001, t0 + (kind === 3 ? 2.8 : 0.42));
          o.connect(g); g.connect(mas); o.start(t0); o.stop(t0 + 3.2);
        });
      },
    };
  })();

  // ── painting the ground ────────────────────────────────────────────────
  const C_MAP = [236, 234, 228], C_SKY = [150, 186, 222], C_SPACE = [4, 5, 9];
  const C_LAND = [222, 219, 210], C_PARK = [205, 222, 198], C_WATER = [186, 209, 226];
  const C_NODATA = [222, 222, 220], C_SEA = [40, 78, 124], C_CONT = [104, 124, 86];

  // the one thing the app did not draw itself. If it never loads we keep
  // drawing our own planet and nobody finds out
  const tex = {};
  for (const [k, src] of [['map', 'map.webp'], ['earth', 'earth.jpg'], ['clouds', 'clouds.jpg']]) {
    const im = new Image();
    im.onload = () => { tex[k] = im; };
    im.src = src;
  }

  let Z0 = 0.6, gs = 0.6, gcx = 0, gcy = 0, clipR = 9e4;
  // the camera sits on us at ground level and slides back toward the start
  // as we climb, so the planet stays in frame while we leave it
  let camx = 0, camy = 0, ox = 0, oy = 0;

  const sx = x => (x - camx) * gs + gcx;
  const sy = y => (y - camy) * gs + gcy;

  // the river is the same sine every time, which is why it looks like a river
  const riverY = x => 540 + Math.sin(x * 0.0012) * 190 + Math.sin(x * 0.0037 + 1.2) * 70;

  function ground(g) {
    const diag = Math.hypot(W, H);
    g.save();
    if (clipR < diag) { g.beginPath(); g.arc(ox, oy, clipR, 0, TAU); g.clip(); }

    // everything the app does not have: grey at ground level, a planet from above
    const outside = mix(C_NODATA, C_SEA, ease(clamp(alt / 0.55, 0, 1)));
    g.fillStyle = rgb(outside);
    g.fillRect(0, 0, W, H);

    // continents, which were always there, just not in the dataset
    if (alt > 0.1) {
      g.globalAlpha = clamp((alt - 0.1) / 0.32, 0, 1);
      for (let i = 0; i < 18; i++) {
        const a2 = hsh(i, 21, 3) * TAU, rr2 = Math.sqrt(hsh(i, 24, 9)) * PR * 0.92;
        const cx2 = Math.cos(a2) * rr2, cy2 = Math.sin(a2) * rr2;
        g.fillStyle = rgb(mix(C_CONT, [138, 152, 104], hsh(i, 25, 11)));
        blob(g, cx2, cy2, 3400 + hsh(i, 23, 7) * 7200, i);
        g.fill();
        g.strokeStyle = 'rgba(62,78,52,.45)'; g.lineWidth = 1.6; g.stroke();
      }
      g.globalAlpha = 1;
    }

    // high enough, and the drawing gives way to the photograph
    const photo = tex.earth ? ease(clamp((alt - 0.68) / 0.26, 0, 1)) : 0;
    if (photo > 0.001) {
      const pd = PR * gs;
      g.globalAlpha = photo;
      g.drawImage(tex.earth, ox - pd, oy - pd, pd * 2, pd * 2);
      if (tex.clouds) {
        g.save();
        g.globalCompositeOperation = 'screen';
        g.globalAlpha = photo * 0.46;
        g.translate(ox, oy); g.rotate(T * 0.015);
        g.drawImage(tex.clouds, -pd, -pd, pd * 2, pd * 2);
        g.restore();
      }
      g.globalAlpha = 1;
    }

    // what a map app shows when it has nothing to show: the seams of tiles
    // that never arrived, each one still politely telling you its address
    voidTiles(g, detailOf() * clamp((Math.hypot(wx, wy) - 1300) / 900, 0, 1) * clamp(gs / (Z0 * 0.4), 0, 1));

    // the sheet the app does have, a disc of actual data
    const mr = MAPR * gs;
    if (mr < 1) return g.restore();
    g.save();
    g.beginPath(); g.arc(ox, oy, mr, 0, TAU); g.clip();
    g.globalAlpha = 1 - photo;
    g.fillStyle = rgb(mix(C_LAND, [138, 152, 104], ease(clamp(alt / 0.45, 0, 1)) * 0.82));
    g.fillRect(0, 0, W, H);
    g.globalAlpha = 1;

    const detail = 1 - ease(clamp(alt / 0.34, 0, 1));
    if (detail > 0.01) {
      g.globalAlpha = detail;
      if (tex.map) {
        const md = MAPR * gs;
        g.drawImage(tex.map, ox - md, oy - md, md * 2, md * 2);
      } else {
        parksRiver(g);
        streets(g);
      }
      g.globalAlpha = 1;
    }
    g.restore();

    // weather, which no map app has ever had to admit to
    const cl = Math.sin(clamp((alt - 0.14) / 0.72, 0, 1) * Math.PI) * (1 - photo);
    if (cl > 0.02) {
      g.globalAlpha = cl * 0.55;
      g.fillStyle = '#ffffff';
      for (let i = 0; i < clouds.length; i++) {
        const c = clouds[i];
        blob(g, c.x, c.y, c.r, i + 40);
        g.globalAlpha = cl * 0.32 * c.a;
        g.fill();
      }
      g.globalAlpha = 1;
    }

    // the edge of the data. It never moves; we do
    if (mr < diag * 2 && mr > 3) {
      g.save();
      g.globalAlpha = detail * 0.5 + (1 - detail) * 0.75;
      g.strokeStyle = detail > 0.5 ? '#9aa0a8' : 'rgba(255,255,255,.8)';
      g.lineWidth = 1.4; g.setLineDash([9, 7]);
      g.beginPath(); g.arc(ox, oy, mr, 0, TAU); g.stroke();
      if (detail < 0.5 && mr > 14 && mr < 420) {
        g.setLineDash([]);
        g.font = "400 10px 'Space Mono', monospace";
        g.textAlign = 'center'; g.textBaseline = 'bottom';
        g.fillStyle = 'rgba(255,255,255,.75)';
        g.fillText('지도 범위', ox, oy - mr - 7);
      }
      g.restore();
    }
    g.restore();

    // a planet is a disc with one side turned away
    if (clipR < diag) {
      const gr = ctx.createRadialGradient(ox - clipR * 0.3, oy - clipR * 0.3, clipR * 0.2, ox, oy, clipR * 1.05);
      gr.addColorStop(0, 'rgba(255,255,255,.1)');
      gr.addColorStop(0.55, 'rgba(0,0,0,0)');
      gr.addColorStop(1, 'rgba(2,6,16,.72)');
      g.save();
      g.beginPath(); g.arc(ox, oy, clipR, 0, TAU); g.clip();
      g.fillStyle = gr; g.fillRect(0, 0, W, H);
      g.restore();
      g.strokeStyle = `rgba(138,190,255,${0.3 * night})`;
      g.lineWidth = 2.5;
      g.beginPath(); g.arc(ox, oy, clipR + 1.5, 0, TAU); g.stroke();
    }
  }

  // one soft closed shape, the same one every time
  function blob(g, cx2, cy2, rr, seed) {
    const N = 11, pts = [];
    for (let a = 0; a < N; a++) {
      const th = a / N * TAU, k = 0.6 + hsh(seed, a, 13) * 0.6;
      pts.push([cx2 + Math.cos(th) * rr * k, cy2 + Math.sin(th) * rr * k]);
    }
    const mid = (p, q) => [(p[0] + q[0]) / 2, (p[1] + q[1]) / 2];
    let m = mid(pts[N - 1], pts[0]);
    g.beginPath();
    g.moveTo(sx(m[0]), sy(m[1]));
    for (let a = 0; a < N; a++) {
      const q = mid(pts[a], pts[(a + 1) % N]);
      g.quadraticCurveTo(sx(pts[a][0]), sy(pts[a][1]), sx(q[0]), sy(q[1]));
    }
    g.closePath();
  }

  const detailOf = () => 1 - ease(clamp(alt / 0.34, 0, 1));

  function voidTiles(g, a) {
    if (a <= 0.01) return;
    const TS = 330;
    const x0 = Math.floor((camx - gcx / gs) / TS) * TS;
    const y0 = Math.floor((camy - gcy / gs) / TS) * TS;
    const nx = Math.ceil((W / gs) / TS) + 1, ny = Math.ceil((H / gs) / TS) + 1;
    if (nx > 40 || ny > 40) return;
    g.save();
    g.globalAlpha = a;
    g.strokeStyle = 'rgba(146,151,158,.45)'; g.lineWidth = 1;
    g.setLineDash([5, 6]);
    for (let i = 0; i <= nx; i++) {
      const px = sx(x0 + i * TS);
      g.beginPath(); g.moveTo(px, 0); g.lineTo(px, H); g.stroke();
    }
    for (let j = 0; j <= ny; j++) {
      const py = sy(y0 + j * TS);
      g.beginPath(); g.moveTo(0, py); g.lineTo(W, py); g.stroke();
    }
    g.setLineDash([]);
    g.font = "400 10px 'Space Mono', monospace";
    g.textAlign = 'left'; g.textBaseline = 'top';
    for (let i = 0; i < nx; i++) for (let j = 0; j < ny; j++) {
      const tx = x0 + i * TS, ty = y0 + j * TS;
      const px = sx(tx) + 12, py = sy(ty) + 11;
      if (px < -60 || px > W || py < -20 || py > H) continue;
      g.fillStyle = 'rgba(138,143,150,.72)';
      g.fillText(`${Math.round(tx / TS)} / ${Math.round(ty / TS)}`, px, py);
      const k = hsh(tx, ty, 31);
      if (k > 0.72) {
        g.fillStyle = 'rgba(138,143,150,.5)';
        g.fillText('타일 없음', px, py + 15);
      } else if (k < 0.1) {
        // the one tile that is still trying
        const cx2 = sx(tx + TS / 2), cy2 = sy(ty + TS / 2), r = Math.min(13, 44 * gs);
        g.strokeStyle = 'rgba(138,143,150,.6)'; g.lineWidth = 2;
        g.beginPath(); g.arc(cx2, cy2, r, T * 2.6, T * 2.6 + 1.9); g.stroke();
      }
    }
    g.restore();
  }

  function parksRiver(g) {
    g.fillStyle = rgb(C_PARK);
    for (const [x, y, w2, h2] of PARKS) {
      g.beginPath(); g.roundRect(sx(x), sy(y), w2 * gs, h2 * gs, 14 * gs); g.fill();
    }
    g.strokeStyle = rgb(C_WATER);
    g.lineWidth = Math.max(2, 118 * gs); g.lineCap = 'round';
    g.beginPath();
    for (let x = -MAPR; x <= MAPR; x += 120) {
      const px = sx(x), py = sy(riverY(x));
      x === -MAPR ? g.moveTo(px, py) : g.lineTo(px, py);
    }
    g.stroke();
  }

  // Streets are a grid that forgets itself here and there, which is what makes
  // it look like a city instead of graph paper.
  function streets(g) {
    const pad = 200;
    const x0 = Math.floor((camx - (gcx + pad) / gs) / GRID) * GRID;
    const x1 = Math.ceil((camx + (W - gcx + pad) / gs) / GRID) * GRID;
    const y0 = Math.floor((camy - (gcy + pad) / gs) / GRID) * GRID;
    const y1 = Math.ceil((camy + (H - gcy + pad) / gs) / GRID) * GRID;
    if ((x1 - x0) / GRID > 400 || (y1 - y0) / GRID > 400) return;

    g.lineCap = 'butt';
    for (let pass = 0; pass < 2; pass++) {
      g.strokeStyle = pass ? '#ffffff' : '#e3e1db';
      for (let x = x0; x <= x1; x += GRID) {
        const big = Math.abs(x % BIG) < 1;
        if (!big && hsh(x, 0, 17) < 0.26) continue;
        g.lineWidth = Math.max(pass ? 1.2 : 2.2, (big ? 26 : 12) * gs * (pass ? 0.72 : 1));
        g.beginPath(); g.moveTo(sx(x), sy(y0)); g.lineTo(sx(x), sy(y1)); g.stroke();
      }
      for (let y = y0; y <= y1; y += GRID) {
        const big = Math.abs(y % BIG) < 1;
        if (!big && hsh(0, y, 19) < 0.26) continue;
        g.lineWidth = Math.max(pass ? 1.2 : 2.2, (big ? 26 : 12) * gs * (pass ? 0.72 : 1));
        g.beginPath(); g.moveTo(sx(x0), sy(y)); g.lineTo(sx(x1), sy(y)); g.stroke();
      }
    }
  }

  function route(g, a) {
    g.save();
    g.globalAlpha = a;
    g.strokeStyle = '#1668e3'; g.lineWidth = Math.max(3, 34 * gs);
    g.lineJoin = 'round'; g.lineCap = 'round';
    g.beginPath();
    for (let i = 0; i < ROUTE.length; i++) {
      const p = ROUTE[i];
      i ? g.lineTo(sx(p[0]), sy(p[1])) : g.moveTo(sx(p[0]), sy(p[1]));
    }
    g.stroke();
    g.strokeStyle = 'rgba(255,255,255,.55)'; g.lineWidth = Math.max(1, 10 * gs);
    g.stroke();

    const px = sx(DEST[0]), py = sy(DEST[1]);
    g.fillStyle = '#e4453c';
    g.beginPath(); g.arc(px, py, Math.max(5, 46 * gs), 0, TAU); g.fill();
    g.fillStyle = '#fff';
    g.beginPath(); g.arc(px, py, Math.max(2, 18 * gs), 0, TAU); g.fill();
    g.restore();
  }

  function places(g, a, wob) {
    g.save();
    g.globalAlpha = a;
    g.textAlign = 'center'; g.textBaseline = 'middle';
    const fs = clamp(14 * gs / Z0, 9, 15);
    g.font = `500 ${fs}px 'Noto Sans KR', sans-serif`;
    for (let i = 0; i < PLACES.length; i++) {
      const [x, y, name] = PLACES[i];
      const px = sx(x) + Math.sin(T * 2.2 + i) * wob * 9;
      const py = sy(y) + Math.cos(T * 1.8 + i * 2) * wob * 7;
      if (px < -80 || px > W + 80 || py < -40 || py > H + 40) continue;
      g.fillStyle = '#70767e';
      g.beginPath(); g.arc(px, py - fs * 1.25, 2.6, 0, TAU); g.fill();
      g.lineWidth = 3; g.strokeStyle = 'rgba(255,255,255,.85)';
      g.strokeText(name, px, py);
      g.fillStyle = '#4b5159';
      g.fillText(name, px, py);
    }
    g.restore();
  }

  // the arrow. It never stops being sure of itself, which is the joke.
  function me(g) {
    const s = clamp(1 - ease(alt) * 0.72, 0.3, 1);
    const esc = ease(clamp((alt - 0.7) / 0.3, 0, 1));
    g.save();
    g.translate(lerp(sx(wx), ox, esc), lerp(sy(wy), oy - clipR - 40, esc));
    const pulse = 1 + Math.sin(T * 2.4) * 0.07;
    g.fillStyle = `rgba(22,104,227,${0.14 * (1 - night * 0.6)})`;
    g.beginPath(); g.arc(0, 0, 34 * s * pulse, 0, TAU); g.fill();
    g.rotate(head + Math.PI / 2);
    g.scale(s, s);
    g.fillStyle = '#1668e3';
    g.beginPath();
    g.moveTo(0, -17); g.lineTo(12.5, 15); g.lineTo(0, 9); g.lineTo(-12.5, 15);
    g.closePath(); g.fill();
    g.strokeStyle = '#fff'; g.lineWidth = 2.4; g.stroke();
    g.restore();
  }

  function starfield(g) {
    if (night < 0.01) return;
    g.save();
    const sscale = clamp(W / 1100, 0.45, 1);
    for (let i = 0; i < stars.length; i++) {
      const s = stars[i];
      const a = s.a * night * (0.6 + 0.4 * Math.sin(T * 1.1 + s.tw));
      g.fillStyle = `rgba(255,255,255,${a})`;
      g.beginPath(); g.arc(s.x * W, s.y * H, s.r * sscale, 0, TAU); g.fill();
    }
    g.restore();
  }

  // ── the card at the top, which is the only thing still talking ─────────
  function shaky(g, txt, cx, y, size, wob, col) {
    g.font = `700 ${size}px 'Noto Sans KR', sans-serif`;
    g.textAlign = 'left'; g.textBaseline = 'middle';
    let x = cx - g.measureText(txt).width / 2;
    for (let i = 0; i < txt.length; i++) {
      const ch = txt[i], w = g.measureText(ch).width;
      const nx = Math.sin(T * (3.1 + i * 0.73) + i * 2.3) * wob * 6;
      const ny = Math.cos(T * (2.4 + i * 0.51) + i * 1.1) * wob * 5;
      if (wob > 0.28) {
        g.globalAlpha = 0.45 * wob;
        g.fillStyle = '#ff3b6b'; g.fillText(ch, x + nx * 1.8, y + ny);
        g.fillStyle = '#2fd2ff'; g.fillText(ch, x - nx * 1.8, y + ny);
        g.globalAlpha = 1;
      }
      g.fillStyle = col; g.fillText(ch, x + nx, y + ny);
      x += w;
    }
  }

  function navCard(g) {
    const act = actOf(d);
    const wob = lerp(ACTS[act].wob, ACTS[Math.min(act + 1, 4)].wob,
                     act < 4 ? clamp((d - ACTS[act].at) / Math.max(0.6, ACTS[act + 1].at - ACTS[act].at), 0, 1) : 0);
    const w = Math.min(W - 48, 560), h = 84;
    const x = (W - w) / 2, y = 20;
    g.save();
    g.fillStyle = night > 0.4 ? `rgba(8,11,18,${0.62 + night * 0.2})` : 'rgba(255,255,255,.92)';
    g.strokeStyle = night > 0.4 ? 'rgba(159,180,207,.22)' : 'rgba(20,24,30,.08)';
    g.lineWidth = 1;
    g.beginPath(); g.roundRect(x, y, w, h, 12); g.fill(); g.stroke();

    // the turn arrow, which stops meaning anything around act 3
    const ax = x + 44, ay = y + h / 2;
    g.save();
    g.translate(ax, ay);
    g.rotate(act < 2 ? -0.5 : Math.sin(T * (1.4 + act)) * wob * 2.6);
    g.strokeStyle = night > 0.4 ? '#8fd0ff' : '#1668e3';
    g.lineWidth = 4.5; g.lineCap = 'round'; g.lineJoin = 'round';
    g.beginPath(); g.moveTo(-3, 14); g.lineTo(-3, -4); g.lineTo(11, -4); g.stroke();
    g.beginPath(); g.moveTo(5, -11); g.lineTo(12, -4); g.lineTo(5, 3); g.stroke();
    g.restore();

    shaky(g, line, x + 44 + (w - 44) / 2, y + 34, 17, wob,
          night > 0.4 ? '#dce7f5' : '#1b1f25');

    g.font = `400 11px 'Space Mono', monospace`;
    g.textAlign = 'center'; g.textBaseline = 'middle';
    g.fillStyle = night > 0.4 ? 'rgba(159,180,207,.6)' : 'rgba(58,63,70,.55)';
    g.fillText(readout(), x + 44 + (w - 44) / 2, y + 60);
    g.restore();
  }

  function readout() {
    const km = d * 1.2, act = actOf(d);
    if (act === 0) { const rem = 0.52 + km; return `성신여대입구역  ·  ${rem.toFixed(1)} km  ·  ${Math.max(1, Math.round(rem * 3.4))}분`; }
    if (act === 1) return `${km.toFixed(1)} km  ·  재계산 중  ·  경로 이탈`;
    if (act === 2) return `${Math.round(km * 840).toLocaleString('en-US')} km  ·  ―  ·  도로 없음`;
    if (act === 3) return `고도 ${Math.round(alt * 412).toLocaleString('en-US')} km  ·  ―  ·  신호 없음`;
    return `4.24 광년  ·  계산할 수 없음  ·  안내 종료`;
  }

  function hud(g) {
    if (PREVIEW) return;
    g.save();
    g.font = `400 10px 'Space Mono', monospace`;
    g.textAlign = 'left'; g.textBaseline = 'middle';
    g.fillStyle = night > 0.4 ? 'rgba(159,180,207,.42)' : 'rgba(58,63,70,.4)';
    const bars = Math.max(0, 4 - Math.round(clamp(d / 1.4, 0, 4)));
    g.fillText(`GPS ${'▮'.repeat(bars)}${'▯'.repeat(4 - bars)}   ACT ${actOf(d) + 1}/5`, 24, H - 34);
    g.globalAlpha = 0.62;
    g.fillText('MAP \u00a9 OpenStreetMap contributors', 24, H - 20);
    g.restore();
  }

  // ── the clock ──────────────────────────────────────────────────────────
  const LINEGAP = 1.9;
  function say(txt, kind) {
    line = txt; lineT = 0;
    sound.ding(kind);
  }

  function step(dt) {
    T += dt;

    // keys push, drag pushes, the ride home pushes hardest
    if (backing > 0) {
      const dist = Math.hypot(wx, wy);
      if (dist < 40) { wx = 0; wy = 0; vx = 0; vy = 0; backing = 0; }
      else {
        const k = Math.min(1, dt * 0.9);
        wx -= wx * k; wy -= wy * k;
        vx = -wx * 0.9; vy = -wy * 0.9;
      }
    } else {
      const acc = 820 * (1 + alt * 2.5);   // there is less to slow you down up there
      let ax = 0, ay = 0;
      if (keys.has('ArrowLeft') || keys.has('a')) ax -= 1;
      if (keys.has('ArrowRight') || keys.has('d')) ax += 1;
      if (keys.has('ArrowUp') || keys.has('w')) ay -= 1;
      if (keys.has('ArrowDown') || keys.has('s')) ay += 1;
      const m = Math.hypot(ax, ay) || 1;
      vx += ax / m * acc * dt; vy += ay / m * acc * dt;
      vx *= Math.pow(0.12, dt); vy *= Math.pow(0.12, dt);
      wx += vx * dt; wy += vy * dt;
    }

    speed = Math.hypot(vx, vy);
    if (speed > 30) {
      const want = Math.atan2(vy, vx);
      let diff = ((want - head + Math.PI * 3) % TAU) - Math.PI;
      head += diff * Math.min(1, dt * 6);
    }

    const prevAct = actOf(d);
    d = Math.hypot(wx, wy) / 1200;
    alt = clamp((d - 3.0) / 3.2, 0, 1);
    night = clamp((d - 3.2) / 2.6, 0, 1);
    const act = actOf(d);

    // the view pulls back as the ground stops being a map
    Z0 = Math.max(W, H) / 2000 * 0.9;
    const far = 1 + Math.max(0, d - 6.2) * 0.35;   // and it keeps getting smaller
    gs = Z0 * Math.pow(0.0085, Math.pow(alt, 0.72)) / far;
    const ck = ease(alt) * 0.9;
    camx = wx * (1 - ck); camy = wy * (1 - ck);
    gcx = W / 2;
    gcy = H / 2 + ease(alt) * H * 0.08;
    ox = sx(0); oy = sy(0);
    clipR = Math.min(Math.hypot(W, H), PR * gs);

    document.body.classList.toggle('space', night > 0.45);
    if (d > 0.15) hint.classList.add('off');

    if (act !== prevAct) { lineAct = act; lineIdx = 0; forced = 0; say(ACTS[act].lines[0], act >= 4 ? 3 : act >= 1 ? 1 : 0); }

    forced = Math.max(0, forced - dt);
    lineT += dt;
    if (forced === 0 && lineT > LINEGAP) {
      lineIdx = (lineIdx + 1) % ACTS[act].lines.length;
      say(ACTS[act].lines[lineIdx], act >= 4 ? 3 : act >= 2 ? 2 : act >= 1 ? 1 : 0);
    }

    sound.set(speed, alt, night);
  }

  function draw() {
    const t1 = ease(clamp(alt / 0.45, 0, 1));
    ctx.fillStyle = rgb(mix(mix(C_MAP, C_SKY, t1), C_SPACE, ease(night)));
    ctx.fillRect(0, 0, W, H);

    starfield(ctx);
    ground(ctx);

    const detail = 1 - ease(clamp(alt / 0.34, 0, 1));
    const act = actOf(d);
    if (detail > 0.01) {
      ctx.save();
      ctx.beginPath(); ctx.arc(ox, oy, clipR, 0, TAU); ctx.clip();
      route(ctx, detail * (act >= 2 ? 0.35 : 1));
      places(ctx, detail, ACTS[act].wob);
      ctx.restore();
    }

    me(ctx);
    if (!PREVIEW) { navCard(ctx); hud(ctx); }
    else previewCard(ctx);
  }

  // the thumbnail is the last act, held still
  function previewCard(g) {
    g.save();
    g.textAlign = 'center'; g.textBaseline = 'middle';
    g.font = `700 ${Math.round(W * 0.085)}px 'Noto Sans KR', sans-serif`;
    g.fillStyle = '#e7eefa';
    g.fillText('창밖을 보세요', W / 2, H * 0.30);
    g.font = `400 ${Math.round(W * 0.034)}px 'Space Mono', monospace`;
    g.fillStyle = 'rgba(159,180,207,.7)';
    g.fillText('4.24 LY  ·  ETA UNKNOWN', W / 2, H * 0.43);
    g.restore();
  }

  let last = 0, frames = 0;
  function loop(ts) {
    const dt = last ? Math.min(0.05, (ts - last) / 1000) : 0.016;
    last = ts; frames++;
    step(dt);
    draw();
    requestAnimationFrame(loop);
  }

  // ── hands ──────────────────────────────────────────────────────────────
  const keys = new Set();
  const snd = document.getElementById('snd');
  const rr = document.getElementById('rr');
  const hint = document.getElementById('hint');

  let dragging = false, px0 = 0, py0 = 0;

  addEventListener('pointerdown', e => {
    if (e.target.closest('.chip')) return;
    dragging = true; px0 = e.clientX; py0 = e.clientY;
    document.body.classList.add('drag');
    sound.kick(); syncSnd();
  });
  addEventListener('pointermove', e => {
    if (!dragging) return;
    const k = Math.max(gs, Z0 * 0.22);
    const dx = (e.clientX - px0) / k, dy = (e.clientY - py0) / k;
    px0 = e.clientX; py0 = e.clientY;
    backing = 0;
    wx -= dx; wy -= dy;
    vx = -dx * 14; vy = -dy * 14;
  });
  addEventListener('pointerup', () => { dragging = false; document.body.classList.remove('drag'); });
  addEventListener('pointercancel', () => { dragging = false; document.body.classList.remove('drag'); });

  addEventListener('keydown', e => {
    if (['ArrowLeft', 'ArrowRight', 'ArrowUp', 'ArrowDown'].includes(e.key)) e.preventDefault();
    keys.add(e.key); backing = 0;
    sound.kick(); syncSnd();
  });
  addEventListener('keyup', e => keys.delete(e.key));

  function syncSnd() { snd.textContent = 'SOUND: ' + (sound.live() ? 'ON' : 'OFF'); }
  snd.addEventListener('click', () => { sound.toggle(); syncSnd(); });

  // the one control. However far out you are, it walks you back to the map.
  rr.addEventListener('click', () => {
    sound.kick(); syncSnd();
    const act = actOf(d);
    const pool = RR[act];
    line = pool[rrCount[act] % pool.length]; lineT = 0; forced = 3.2;
    rrCount[act]++;
    sound.ding(act >= 3 ? 3 : act >= 2 ? 2 : 1);
    if (act >= 1) backing = 1;
  });

  function resize() {
    DPR = Math.min(devicePixelRatio || 1, 2);
    W = innerWidth; H = innerHeight;
    cv.width = Math.round(W * DPR); cv.height = Math.round(H * DPR);
    ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  }
  addEventListener('resize', resize);

  resize();
  world();
  if (PREVIEW) {
    wx = 0; wy = -9200; d = 7.66; alt = 1; night = 1;
    line = ACTS[4].lines[3]; lineAct = 4; lineIdx = 3;
    document.body.classList.add('space');
  }
  sound.kick();
  syncSnd();
  requestAnimationFrame(loop);

  window.__st = () => ({
    d, alt, night, act: actOf(d), speed, line, frames,
    space: document.body.classList.contains('space'),
    back: backing > 0,
    live: sound.live(),
  });
})();
</script>
</body>
</html>
