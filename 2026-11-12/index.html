<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>대기실 — THE WAITING ROOM</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Nanum+Myeongjo:wght@400;700&family=Noto+Sans+KR:wght@700;900&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 100%; height: 100%; overflow: hidden; background: #0b0c0d; }
  body { font-family: 'Space Mono', monospace; cursor: default; }
  body.pick { cursor: pointer; }
  canvas { display: block; }

  .home-btn {
    position: fixed; left: 26px; top: 22px; z-index: 20;
    font: 700 11px/1 'Space Mono', monospace; letter-spacing: .22em;
    color: #8c7f68; text-decoration: none; padding: 9px 13px;
    border: 1px solid rgba(140,127,104,.3); background: rgba(11,12,13,.6);
    transition: color .3s, border-color .3s;
  }
  .home-btn:hover { color: #e8c88a; border-color: rgba(232,200,138,.5); }

  .snd {
    position: fixed; right: 26px; top: 22px; z-index: 20;
    font: 700 11px/1 'Space Mono', monospace; letter-spacing: .18em;
    color: #8c7f68; padding: 9px 13px; cursor: pointer;
    border: 1px solid rgba(140,127,104,.3); background: rgba(11,12,13,.6);
    transition: color .3s, border-color .3s;
  }
  .snd:hover { color: #e8c88a; border-color: rgba(232,200,138,.5); }

  .hint {
    position: fixed; left: 50%; bottom: 24px; transform: translateX(-50%); z-index: 20;
    font: 400 10px/1 'Space Mono', monospace; letter-spacing: .2em;
    color: rgba(140,127,104,.72); white-space: nowrap; pointer-events: none;
    background: rgba(11,12,13,.7); padding: 8px 13px;
    transition: opacity 1s ease;
  }
  .hint.off { opacity: 0; }

  body.preview .home-btn, body.preview .snd, body.preview .hint { display: none; }
</style>
</head>
<body>
<canvas id="cv"></canvas>
<a class="home-btn" href="../index.html">← INDEX</a>
<div class="snd" id="snd">SOUND: ON</div>
<div class="hint" id="hint">번호표를 뽑으세요</div>

<script>
const cv = document.getElementById('cv');
const ctx = cv.getContext('2d');
const PREVIEW = new URLSearchParams(location.search).has('preview');
if (PREVIEW) document.body.classList.add('preview');

const DPR = Math.min(window.devicePixelRatio || 1, 2);
const TAU = Math.PI * 2;
const clamp = (v, a, b) => v < a ? a : v > b ? b : v;
const rnd = (a, b) => a + Math.random() * (b - a);
const pad3 = n => String(n).padStart(3, '0');

// ── the board ──────────────────────────────────────────────────────────────
// One continuous dot field, the way a real 전광판 is built: the number and the
// message share the same lamps, so when a lamp dies it takes a piece of both.
const COLS = 110, ROWS = 32;
const NUMROW = 2, NUMH = 15;      // the number lives in rows 2..16
const MSGROW = 21, MSGH = 9;      // the strip, rows 21..30
const grid = new Uint8Array(COLS * ROWS);
const dead = new Set();

let W = 0, H = 0, S = 1;
let BX = 0, BY = 0, P = 12;        // board origin and dot pitch
let offDots = null;                // the unlit field, baked

// ── state ──────────────────────────────────────────────────────────────────
let served = 76;        // what the board is calling
let mine = 0;           // my ticket, 0 before I pull one
let pulls = 0;
let stall = 0;          // seconds since the last call
let phase = 0;          // 0 before the first ticket · 1 queue · 2 closed · 3 dark
let closeT = 0;
let scroll = 0;
let msg = '잠시만 기다려 주십시오';
let flashT = -1;        // the three flashes of my number at the end
let callQ = [];         // seconds from the first pull at which a number is called
let qT = 0;
let t = 0, overBtn = false, btnT = 0;
const tickets = [];     // {n, x, y, rot, v, vy, vr, held}
const people = [];
const GAPS = [0, 17, 42, 96];

const MSGS = [
  [0,  '잠시만 기다려 주십시오'],
  [7,  '앞에 네 분 계십니다'],
  [16, '잠시만 기다려 주십시오   ·   잠시만 기다려 주십시오'],
  [27, '담당자 확인 중입니다'],
  [40, '조금만 더 기다려 주십시오'],
];

// ── dot rasteriser ─────────────────────────────────────────────────────────
// Text goes through a canvas the size of the dot grid, so it loses exactly what
// a 전광판 loses: the thin strokes and the 받침 go first.
const RC = new Map();
function raster(text, rows, weight) {
  const key = text + '|' + rows + '|' + weight;
  if (RC.has(key)) return RC.get(key);
  const m = document.createElement('canvas');
  const mg = m.getContext('2d', { willReadFrequently: true });
  m.width = 8; m.height = 8;
  mg.font = `${weight} ${rows}px "Noto Sans KR", sans-serif`;
  const w = Math.max(2, Math.ceil(mg.measureText(text).width) + 2);
  const h = rows + 5;
  m.width = w; m.height = h;
  const g = m.getContext('2d', { willReadFrequently: true });
  g.font = `${weight} ${rows}px "Noto Sans KR", sans-serif`;
  g.textBaseline = 'alphabetic';
  g.fillStyle = '#fff';
  g.fillText(text, 1, rows + 1);
  const d = g.getImageData(0, 0, w, h).data;
  const bits = new Uint8Array(w * h);
  let top = h, bot = 0;
  for (let y = 0; y < h; y++) for (let x = 0; x < w; x++) {
    if (d[(y * w + x) * 4 + 3] > 108) { bits[y * w + x] = 1; if (y < top) top = y; if (y > bot) bot = y; }
  }
  const r = { w, h, bits, top: top > bot ? 0 : top, bot };
  RC.set(key, r);
  return r;
}

function stamp(r, col, row, val) {
  for (let y = 0; y < r.h; y++) {
    const gy = row + y;
    if (gy < 0 || gy >= ROWS) continue;
    for (let x = 0; x < r.w; x++) {
      if (!r.bits[y * r.w + x]) continue;
      const gx = col + x;
      if (gx < 0 || gx >= COLS) continue;
      const i = gy * COLS + gx;
      if (!dead.has(i)) grid[i] = val;
    }
  }
}

// ── sound ──────────────────────────────────────────────────────────────────
const sound = (() => {
  let ac = null, master = null, hum = null, on = true;
  function init() {
    if (ac) return;
    ac = new (window.AudioContext || window.webkitAudioContext)();
    master = ac.createGain();
    master.gain.value = 0.9;
    const comp = ac.createDynamicsCompressor();
    master.connect(comp); comp.connect(ac.destination);

    // the fluorescent tube overhead, and the room it is in
    hum = ac.createGain();
    hum.gain.value = 0.055;
    const lp = ac.createBiquadFilter();
    lp.type = 'lowpass'; lp.frequency.value = 420;
    hum.connect(lp); lp.connect(master);
    for (const [f, v] of [[100, .5], [120, .34], [240, .1]]) {
      const o = ac.createOscillator(), g = ac.createGain();
      o.type = 'sine'; o.frequency.value = f; g.gain.value = v;
      o.connect(g); g.connect(hum); o.start();
    }
    const n = ac.createBufferSource(), nb = ac.createBuffer(1, ac.sampleRate * 2, ac.sampleRate);
    const nd = nb.getChannelData(0);
    let last = 0;
    for (let i = 0; i < nd.length; i++) { last = (last + (Math.random() * 2 - 1) * 0.02) * 0.995; nd[i] = last * 3; }
    n.buffer = nb; n.loop = true;
    const ng = ac.createGain(); ng.gain.value = 0.5;
    n.connect(ng); ng.connect(hum); n.start();
  }
  function tone(f, v, d, type, at) {
    if (!ac || !on) return;
    const o = ac.createOscillator(), g = ac.createGain();
    o.type = type || 'sine'; o.frequency.value = f;
    const T = ac.currentTime + (at || 0);
    g.gain.setValueAtTime(0, T);
    g.gain.linearRampToValueAtTime(v, T + 0.012);
    g.gain.exponentialRampToValueAtTime(0.0001, T + d);
    o.connect(g); g.connect(master);
    o.start(T); o.stop(T + d + 0.05);
  }
  function noise(v, f, d, q) {
    if (!ac || !on) return;
    const len = Math.ceil(ac.sampleRate * d);
    const b = ac.createBuffer(1, len, ac.sampleRate), c = b.getChannelData(0);
    for (let i = 0; i < len; i++) c[i] = (Math.random() * 2 - 1) * Math.pow(1 - i / len, 1.4);
    const s = ac.createBufferSource(); s.buffer = b;
    const bp = ac.createBiquadFilter();
    bp.type = 'bandpass'; bp.frequency.value = f; bp.Q.value = q || 1;
    const g = ac.createGain(); g.gain.value = v;
    s.connect(bp); bp.connect(g); g.connect(master);
    s.start();
  }
  return {
    kick() { init(); if (ac.state === 'suspended') ac.resume(); },
    toggle() {
      on = !on;
      if (master) master.gain.setTargetAtTime(on ? 0.9 : 0, ac.currentTime, 0.05);
      return on;
    },
    live() { return !!ac && on; },
    // 띵동 — a falling third, the sound every 대기실 in the country makes
    ding() { tone(988, 0.1, 0.9, 'sine'); tone(784, 0.085, 1.5, 'sine', 0.22); },
    print() {
      if (!ac || !on) return;
      const o = ac.createOscillator(), g = ac.createGain(), lp = ac.createBiquadFilter();
      o.type = 'square'; o.frequency.value = 46;
      lp.type = 'lowpass'; lp.frequency.value = 900;
      const T = ac.currentTime;
      g.gain.setValueAtTime(0, T);
      g.gain.linearRampToValueAtTime(0.05, T + 0.03);
      g.gain.setValueAtTime(0.05, T + 0.44);
      g.gain.exponentialRampToValueAtTime(0.0001, T + 0.56);
      o.connect(lp); lp.connect(g); g.connect(master);
      o.start(T); o.stop(T + 0.6);
      noise(0.055, 2600, 0.5, 2.4);
    },
    tear() { noise(0.09, 3400, 0.16, 1.6); },
    tick() { noise(0.022, 2100, 0.035, 5); },
    lampOut() { noise(0.05, 5200, 0.05, 7); tone(1800, 0.02, 0.07, 'square'); },
    off() { tone(74, 0.1, 1.1, 'sine'); noise(0.04, 400, 0.5, 1); },
  };
})();

// ── the room ───────────────────────────────────────────────────────────────
let FLOOR = 0, BENCH = 0, PHGT = 60, DISP = null;
const SEATS = [.23, .32, .41, .50, .59];

function makePerson(seed) {
  const c = document.createElement('canvas');
  const s = Math.max(46, PHGT);
  c.width = s * 0.66 | 0; c.height = s | 0;
  const g = c.getContext('2d');
  const w = c.width, h = c.height;
  g.filter = `blur(${(s * 0.022).toFixed(2)}px)`;
  g.fillStyle = '#000';
  const lean = (seed % 5 - 2) * 0.03;      // nobody sits straight after the first hour
  const slump = (seed % 3) * 0.015;

  g.beginPath();                            // head
  g.ellipse(w * (0.46 + lean), h * (0.13 + slump), w * 0.17, h * 0.1, lean, 0, TAU);
  g.fill();
  g.beginPath();                            // neck into shoulders, then the back
  g.moveTo(w * (0.46 + lean), h * (0.2 + slump));
  g.quadraticCurveTo(w * (0.12 + lean), h * 0.3, w * 0.16, h * 0.62);
  g.lineTo(w * 0.7, h * 0.62);
  g.quadraticCurveTo(w * 0.76, h * 0.3, w * (0.46 + lean), h * (0.2 + slump));
  g.closePath();
  g.fill();
  g.beginPath();                            // the forearm resting on the thigh
  g.roundRect(w * 0.3, h * 0.42, w * 0.5, h * 0.11, h * 0.05);
  g.fill();
  g.beginPath();                            // thigh forward
  g.roundRect(w * 0.16, h * 0.56, w * 0.72, h * 0.13, h * 0.055);
  g.fill();
  g.beginPath();                            // shin down to the floor
  g.roundRect(w * 0.6, h * 0.63, w * 0.17, h * 0.33, h * 0.03);
  g.fill();
  g.beginPath();
  g.roundRect(w * 0.38, h * 0.64, w * 0.16, h * 0.32, h * 0.03);
  g.fill();
  g.beginPath();                            // shoes
  g.roundRect(w * 0.34, h * 0.93, w * 0.46, h * 0.06, h * 0.025);
  g.fill();
  return c;
}

function drawCounter() {
  const g = ctx;
  const x0 = W * 0.79, x1 = W * 0.975, top = H * 0.5, deskY = H * 0.72;
  const open = phase >= 2 ? Math.max(0, 1 - closeT * 0.5) : 1;
  g.fillStyle = '#101214';
  g.fillRect(x0, top, x1 - x0, deskY - top);
  for (let i = 0; i < 2; i++) {
    const wx = x0 + (x1 - x0) * (0.08 + i * 0.48), ww = (x1 - x0) * 0.42;
    const wy = top + (deskY - top) * 0.16, wh = (deskY - top) * 0.52;
    const o = i === 0 ? open : Math.max(0, open * 1.6 - 0.6);
    const ig = g.createLinearGradient(0, wy, 0, wy + wh);
    ig.addColorStop(0, `rgba(244,222,172,${0.05 + o * 0.16})`);
    ig.addColorStop(1, `rgba(190,150,96,${0.02 + o * 0.05})`);
    g.fillStyle = ig;
    g.fillRect(wx, wy, ww, wh);
    g.fillStyle = `rgba(20,20,22,${1 - o})`;      // the shutter coming down
    g.fillRect(wx, wy, ww, wh * (1 - o) + 0.5);
    g.strokeStyle = 'rgba(200,186,160,.12)';
    g.lineWidth = 1;
    g.strokeRect(wx + .5, wy + .5, ww - 1, wh - 1);
    g.font = `400 ${Math.max(9, S * 0.013) | 0}px "Nanum Myeongjo", serif`;
    g.textAlign = 'center'; g.textBaseline = 'alphabetic';
    g.fillStyle = `rgba(214,200,172,${0.2 + o * 0.22})`;
    g.fillText('창구 ' + (i + 2), wx + ww / 2, wy - (deskY - top) * 0.05);
  }
  g.fillStyle = '#16181a';
  g.fillRect(x0 - W * 0.01, deskY, x1 - x0 + W * 0.01, H * 0.02);
  g.fillStyle = 'rgba(255,200,140,.05)';
  g.fillRect(x0 - W * 0.01, deskY, x1 - x0 + W * 0.01, H * 0.003);
  g.fillStyle = '#0e1011';
  g.fillRect(x0, deskY + H * 0.02, x1 - x0, FLOOR - deskY - H * 0.02);
}

function seedPeople() {
  people.length = 0;
  for (let i = 0; i < SEATS.length; i++) {
    people.push({ x: SEATS[i], img: makePerson(i * 7 + 3), a: 1, go: -1, lift: 0 });
  }
}

function drawRoom() {
  const g = ctx;
  // wall
  const wg = g.createLinearGradient(0, 0, 0, H);
  wg.addColorStop(0, '#15171a');
  wg.addColorStop(.52, '#1b1d20');
  wg.addColorStop(.78, '#131416');
  wg.addColorStop(1, '#0d0e10');
  g.fillStyle = wg;
  g.fillRect(0, 0, W, H);

  // the board throwing light back onto the wall
  const lit = phase === 3 ? 0.08 : 1;
  const bw = COLS * P, bh = ROWS * P;
  const rg = g.createRadialGradient(BX + bw / 2, BY + bh / 2, bh * 0.2, BX + bw / 2, BY + bh / 2, bh * 2.1);
  rg.addColorStop(0, `rgba(255,150,50,${0.07 * lit})`);
  rg.addColorStop(1, 'rgba(255,150,50,0)');
  g.fillStyle = rg;
  g.fillRect(0, 0, W, H);

  const dado = H * 0.6;
  g.fillStyle = 'rgba(255,230,200,.028)';
  g.fillRect(0, dado, W, 2);
  g.fillStyle = 'rgba(0,0,0,.2)';
  g.fillRect(0, dado + 2, W, H * 0.006);
  g.fillStyle = 'rgba(0,0,0,.12)';
  g.fillRect(0, dado + 2, W, FLOOR - dado);

  g.fillStyle = '#0a0b0c';
  g.fillRect(0, FLOOR, W, H - FLOOR);
  g.fillStyle = 'rgba(255,170,70,.03)';
  g.fillRect(0, FLOOR, W, H - FLOOR);
  g.strokeStyle = 'rgba(255,200,140,.07)';
  g.lineWidth = 1;
  g.beginPath(); g.moveTo(0, FLOOR); g.lineTo(W, FLOOR); g.stroke();

  // bench
  const bx0 = W * 0.17, bx1 = W * 0.72, bt = BENCH;
  g.fillStyle = '#17181a';
  g.fillRect(bx0, bt, bx1 - bx0, S * 0.022);
  g.fillStyle = 'rgba(255,190,110,.05)';
  g.fillRect(bx0, bt, bx1 - bx0, S * 0.004);
  g.fillStyle = '#101113';
  for (const fx of [bx0 + S * 0.03, bx1 - S * 0.045]) g.fillRect(fx, bt + S * 0.022, S * 0.015, FLOOR - bt - S * 0.022);

  // the people still on it
  for (const p of people) {
    if (p.a <= 0.01) continue;
    const im = p.img;
    const px = W * p.x - im.width / 2;
    const py = bt - im.height * 0.62 - p.lift;
    g.globalAlpha = p.a * 0.86;
    g.drawImage(im, px, py);
    g.globalAlpha = 1;
  }

  drawCounter();
  drawDispenser();
  drawClock();
}

function drawDispenser() {
  const g = ctx, d = DISP;
  g.fillStyle = '#131416';
  g.fillRect(d.x, d.y, d.w, FLOOR - d.y);
  g.fillStyle = '#191b1d';
  g.fillRect(d.x, d.y, d.w, d.w * 0.14);
  g.strokeStyle = 'rgba(255,200,140,.08)';
  g.lineWidth = 1;
  g.strokeRect(d.x + .5, d.y + .5, d.w - 1, FLOOR - d.y - 1);

  // 번호표, printed on the machine in the same 명조 every one of them uses
  g.save();
  g.translate(d.x + d.w / 2, d.y + d.w * 0.46);
  g.font = `700 ${d.w * 0.2 | 0}px "Nanum Myeongjo", serif`;
  g.textAlign = 'center'; g.textBaseline = 'middle';
  g.fillStyle = 'rgba(214,200,172,.52)';
  g.fillText('번호표', 0, 0);
  g.restore();

  // the slot
  g.fillStyle = '#07080a';
  g.fillRect(d.x + d.w * 0.16, d.y + d.w * 0.72, d.w * 0.68, d.w * 0.07);

  // the button
  const bx = d.x + d.w / 2, by = d.y + d.w * 1.08, br = d.w * 0.17;
  const glow = (overBtn ? 0.5 : 0.26) + Math.sin(t * 2.2) * 0.07 + btnT * 0.6;
  g.fillStyle = '#0d0e10';
  g.beginPath(); g.arc(bx, by, br * 1.5, 0, TAU); g.fill();
  const bg = g.createRadialGradient(bx, by - br * 0.3, 0, bx, by, br);
  bg.addColorStop(0, `rgba(255,190,110,${clamp(glow + .25, 0, 1)})`);
  bg.addColorStop(1, `rgba(190,90,30,${clamp(glow, 0, 1)})`);
  g.fillStyle = bg;
  g.beginPath(); g.arc(bx, by, br * (1 - btnT * 0.1), 0, TAU); g.fill();
  d.bx = bx; d.by = by; d.br = br;
}

function drawClock() {
  const g = ctx, r = S * 0.034, cx = W * 0.9, cy = H * 0.19;
  g.strokeStyle = 'rgba(210,195,168,.18)';
  g.lineWidth = Math.max(1, r * 0.07);
  g.beginPath(); g.arc(cx, cy, r, 0, TAU); g.stroke();
  g.fillStyle = 'rgba(16,17,19,.8)';
  g.beginPath(); g.arc(cx, cy, r, 0, TAU); g.fill();
  for (let i = 0; i < 12; i++) {
    const a = i / 12 * TAU;
    g.strokeStyle = `rgba(210,195,168,${i % 3 === 0 ? .3 : .14})`;
    g.lineWidth = Math.max(1, r * (i % 3 === 0 ? .08 : .05));
    g.beginPath();
    g.moveTo(cx + Math.cos(a) * r * .82, cy + Math.sin(a) * r * .82);
    g.lineTo(cx + Math.cos(a) * r * .94, cy + Math.sin(a) * r * .94);
    g.stroke();
  }
  const mins = 14 + t / 60;
  const hand = (frac, len, wd, al) => {
    const a = frac * TAU - Math.PI / 2;
    g.strokeStyle = `rgba(226,214,190,${al})`;
    g.lineWidth = Math.max(1, r * wd);
    g.lineCap = 'round';
    g.beginPath(); g.moveTo(cx, cy); g.lineTo(cx + Math.cos(a) * r * len, cy + Math.sin(a) * r * len); g.stroke();
  };
  hand((3 + mins / 60) / 12, .48, .1, .4);
  hand(mins / 60, .72, .07, .46);
  hand(Math.floor(t) / 60, .82, .035, .5);
  g.lineCap = 'butt';
}

// ── the ticket ─────────────────────────────────────────────────────────────
function drawTicket(x, y, rot, sc, n, waitN, a) {
  const g = ctx;
  const w = S * 0.145 * sc, h = S * 0.195 * sc;
  g.save();
  g.translate(x, y);
  g.rotate(rot);
  g.globalAlpha = a;
  g.shadowColor = 'rgba(0,0,0,.5)'; g.shadowBlur = w * 0.18; g.shadowOffsetY = w * 0.05;
  g.fillStyle = '#ded8ca';
  g.fillRect(-w / 2, -h / 2, w, h);
  g.shadowColor = 'transparent'; g.shadowBlur = 0; g.shadowOffsetY = 0;
  // the perforation it was torn from
  g.fillStyle = 'rgba(0,0,0,.1)';
  for (let i = 0; i < 16; i++) g.fillRect(-w / 2 + w * (i + .35) / 16, -h / 2, w * .035, h * .012);

  g.textAlign = 'center';
  g.fillStyle = 'rgba(60,58,54,.55)';
  g.font = `400 ${w * 0.11 | 0}px "Nanum Myeongjo", serif`;
  g.fillText('번호표', 0, -h * 0.3);
  g.strokeStyle = 'rgba(70,66,60,.25)';
  g.lineWidth = Math.max(1, w * 0.008);
  g.beginPath(); g.moveTo(-w * .36, -h * .24); g.lineTo(w * .36, -h * .24); g.stroke();

  g.fillStyle = 'rgba(42,40,38,.88)';
  g.font = `700 ${w * 0.4 | 0}px "Space Mono", monospace`;
  g.fillText(pad3(n), 0, h * 0.09);

  g.fillStyle = 'rgba(66,62,58,.6)';
  g.font = `400 ${w * 0.085 | 0}px "Nanum Myeongjo", serif`;
  g.fillText(waitN > 0 ? `앞에 ${waitN}명` : '대기 중', 0, h * 0.26);
  g.font = `400 ${w * 0.07 | 0}px "Space Mono", monospace`;
  g.fillStyle = 'rgba(80,76,70,.45)';
  g.fillText('3-14  15:' + String(14 + Math.floor(n / 9) % 45).padStart(2, '0'), 0, h * 0.4);
  g.restore();
  g.globalAlpha = 1;
}

function drawTickets() {
  for (const k of tickets) {
    drawTicket(k.x, k.y, k.rot, k.held ? 0.98 : 0.55, k.n, k.wait, k.a);
  }
}


// ── the lamps ──────────────────────────────────────────────────────────────
let litS = null, dimS = null, SP = 0;
function bakeDots() {
  const w = Math.ceil(COLS * P), h = Math.ceil(ROWS * P);
  offDots = document.createElement('canvas');
  offDots.width = Math.ceil(w * DPR); offDots.height = Math.ceil(h * DPR);
  const g = offDots.getContext('2d');
  g.scale(DPR, DPR);
  g.fillStyle = '#07070a';
  g.fillRect(0, 0, w, h);
  g.fillStyle = 'rgba(78,36,14,.5)';
  for (let r = 0; r < ROWS; r++) for (let c = 0; c < COLS; c++) {
    g.beginPath();
    g.arc((c + .5) * P, (r + .5) * P, P * 0.17, 0, TAU);
    g.fill();
  }
  SP = Math.ceil(P * 3.2);
  const mk = (core, halo) => {
    const c = document.createElement('canvas');
    c.width = c.height = Math.ceil(SP * DPR);
    const q = c.getContext('2d');
    q.scale(DPR, DPR);
    const m = SP / 2;
    const rg = q.createRadialGradient(m, m, 0, m, m, m);
    rg.addColorStop(0, halo);
    rg.addColorStop(.42, halo.replace(/[\d.]+\)$/, '.1)'));
    rg.addColorStop(1, 'rgba(255,150,50,0)');
    q.fillStyle = rg;
    q.fillRect(0, 0, SP, SP);
    q.fillStyle = core;
    q.beginPath(); q.arc(m, m, P * 0.3, 0, TAU); q.fill();
    return c;
  };
  litS = mk('rgba(255,190,96,.97)', 'rgba(255,150,50,.34)');
  dimS = mk('rgba(206,120,44,.6)', 'rgba(255,150,50,.12)');
}

function boardContent() {
  grid.fill(0);
  if (phase === 3) { grid[(NUMROW + 7) * COLS + 55] = 2; return; }

  const lab = raster('번호', NUMH, 700);
  stamp(lab, 6, NUMROW - lab.top, 2);

  const flashing = flashT >= 0;
  const show = flashing ? (Math.floor(flashT * 1.7) % 2 === 0) : true;
  if (show) {
    const num = pad3(flashing ? mine : served);
    const g8 = raster('8', NUMH, 900);
    const pitch = g8.w + 3;
    let col = COLS - 7 - pitch * num.length;
    for (const ch of num) {
      const r = raster(ch, NUMH, 900);
      stamp(r, col + ((pitch - r.w) >> 1), NUMROW - r.top, 1);
      col += pitch;
    }
  }

  const r = raster(msg, MSGH, 700);
  const span = r.w + 20;
  const base = COLS - (scroll % span);
  for (let k = -1; k <= Math.ceil(COLS / span) + 1; k++) {
    stamp(r, Math.round(base - k * span), MSGROW - r.top, 1);
  }
}

function drawBoard() {
  const g = ctx;
  const w = COLS * P, h = ROWS * P, b = P * 1.5;
  g.fillStyle = '#0c0d0f';
  g.fillRect(BX - b, BY - b, w + b * 2, h + b * 2);
  g.strokeStyle = 'rgba(190,180,160,.11)';
  g.lineWidth = 1;
  g.strokeRect(BX - b + .5, BY - b + .5, w + b * 2 - 1, h + b * 2 - 1);
  g.fillStyle = 'rgba(255,200,150,.04)';
  g.fillRect(BX - b, BY - b, w + b * 2, 1.5);

  g.drawImage(offDots, BX, BY, w, h);

  const flick = stall > 22 || phase >= 2;
  for (let r = 0; r < ROWS; r++) {
    for (let c = 0; c < COLS; c++) {
      const v = grid[r * COLS + c];
      if (!v) continue;
      if (flick && Math.random() < 0.0016) continue;
      g.drawImage(v === 1 ? litS : dimS, BX + (c + .5) * P - SP / 2, BY + (r + .5) * P - SP / 2, SP, SP);
    }
  }
}

// ── what happens, and when ─────────────────────────────────────────────────
function callNext() {
  served++;
  stall = 0;
  sound.ding();
  const p = people.find(q => q.go < 0 && q.a > 0.5);
  if (p) p.go = 0;
}

function killLamps(n) {
  for (let i = 0; i < n; i++) {
    const c = 60 + ((Math.random() * 44) | 0);
    const r = NUMROW + ((Math.random() * NUMH) | 0);
    dead.add(r * COLS + c);
  }
  sound.lampOut();
}

function closeUp() {
  phase = 2; closeT = 0; flashT = -1;
  msg = '오늘 업무가 종료되었습니다';
  for (const p of people) if (p.go < 0) p.go = 0;
}

function pull() {
  sound.kick();
  if (phase >= 2) { sound.tear(); return; }
  sound.print();
  btnT = 1;
  const held = tickets.find(k => k.held);
  if (held) {
    held.held = false;
    held.fx = 0.30 + tickets.length * 0.05;
    held.fy = 0.685;
    held.rot = rnd(-0.5, 0.5);
  }
  mine = 81 + GAPS[Math.min(pulls, GAPS.length - 1)];
  pulls++;
  tickets.push({ n: mine, wait: Math.max(0, mine - served - 1), held: true, fx: .87, fy: .87, rot: -0.06, a: 1, t: 0 });
  if (pulls === 1) { phase = 1; qT = 0; callQ = [3.2, 9.4, 16.2, 23.5]; }
  else if (pulls >= 4) closeUp();
  hintOff();
}

let lastSec = 0;
function step(dt) {
  if (PREVIEW) return;
  t += dt;
  btnT = Math.max(0, btnT - dt * 3);
  scroll += dt * 10;

  const sec = Math.floor(t);
  if (sec !== lastSec) { lastSec = sec; sound.tick(); }

  if (phase === 1) {
    qT += dt;
    if (callQ.length && qT >= callQ[0]) { callQ.shift(); callNext(); }
    else stall += dt;
    if (!callQ.length) {
      for (const [th, m] of MSGS) if (stall >= th) msg = m;
      if (stall > 20 && dead.size === 0) killLamps(5);
      if (stall > 33 && dead.size === 5) killLamps(7);
      if (stall > 52) closeUp();
    } else {
      msg = stall > 5 ? MSGS[1][1] : MSGS[0][1];
    }
  } else if (phase === 2) {
    closeT += dt;
    if (closeT > 5.2 && flashT < 0) { flashT = 0; sound.ding(); }
    if (flashT >= 0) {
      const pre = flashT;
      flashT += dt;
      // the number finally comes up, three times, to an empty room
      for (const k of [1.2, 2.4]) if (pre < k && flashT >= k) sound.ding();
      if (pre < 3.6 && flashT >= 3.6) msg = '내일 다시 와 주십시오';
      if (flashT > 9.5) { phase = 3; flashT = -1; sound.off(); }
    }
  }

  for (const p of people) {
    if (p.go < 0) continue;
    p.go += dt;
    p.lift += dt * S * 0.05;
    p.a = Math.max(0, p.a - dt * 0.62);
  }

  for (const k of tickets) {
    k.t += dt;
    if (k.held) k.a = Math.min(1, k.t * 4);
  }
}

function layoutDraw() {
  for (const k of tickets) {
    k.x = W * k.fx;
    k.y = k.held ? H * k.fy : BENCH - S * 0.012;
    if (!k.held) k.x = W * k.fx;
  }
}

function frame(ts) {
  const dt = Math.min(0.05, (frame.p ? ts - frame.p : 16) / 1000);
  frame.p = ts;
  step(dt);
  boardContent();
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  drawRoom();
  if (!PREVIEW) layoutDraw();
  drawBoard();
  if (!PREVIEW) drawTickets();
  requestAnimationFrame(frame);
}

// ── wiring ─────────────────────────────────────────────────────────────────
function resize() {
  W = innerWidth; H = innerHeight;
  cv.width = Math.ceil(W * DPR); cv.height = Math.ceil(H * DPR);
  cv.style.width = W + 'px'; cv.style.height = H + 'px';
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  S = Math.min(W, H * 1.5);

  const bw = PREVIEW ? W * 0.95 : Math.min(W * 0.72, H * 1.5);
  P = bw / COLS;
  BX = (W - COLS * P) / 2;
  BY = PREVIEW ? H * 0.055 : H * 0.115;

  FLOOR = H * 0.87;
  BENCH = H * 0.785;
  PHGT = (FLOOR - BENCH) / 0.37;
  DISP = { x: W * 0.045, y: H * 0.42, w: Math.max(58, S * 0.1) };

  bakeDots();
  if (!people.length) seedPeople();
  else for (let i = 0; i < people.length; i++) people[i].img = makePerson(i * 7 + 3);
}

const hint = document.getElementById('hint');
let hintGone = false;
function hintOff() { if (!hintGone) { hintGone = true; hint.classList.add('off'); } }

function overButton(x, y) {
  if (!DISP || phase >= 2) return false;
  const dx = x - DISP.bx, dy = y - DISP.by;
  if (dx * dx + dy * dy < Math.pow(DISP.br * 2.4, 2)) return true;
  return x > DISP.x && x < DISP.x + DISP.w && y > DISP.y && y < FLOOR;
}

addEventListener('pointermove', e => {
  overBtn = overButton(e.clientX, e.clientY);
  document.body.classList.toggle('pick', overBtn);
});
addEventListener('pointerdown', e => {
  sound.kick();
  if (overButton(e.clientX, e.clientY)) pull();
});
document.getElementById('snd').addEventListener('click', e => {
  e.stopPropagation();
  sound.kick();
  e.target.textContent = 'SOUND: ' + (sound.toggle() ? 'ON' : 'OFF');
});
addEventListener('resize', resize);

(async () => {
  try {
    await Promise.all([
      document.fonts.load('900 40px "Noto Sans KR"'),
      document.fonts.load('700 40px "Noto Sans KR"'),
      document.fonts.load('700 40px "Nanum Myeongjo"'),
      document.fonts.load('700 40px "Space Mono"'),
    ]);
  } catch (e) { /* fall back to whatever is there */ }
  resize();
  if (PREVIEW) {
    served = 80; mine = 112; pulls = 1; phase = 1; stall = 30;
    msg = '조금만 더 기다려 주십시오';
    scroll = 14;
    killLamps(4);
  }
  requestAnimationFrame(frame);
})();

</script>
</body>
</html>
