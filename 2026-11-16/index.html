<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>낙엽 — BLOW</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Nanum+Myeongjo:wght@400;700;800&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 100%; height: 100%; overflow: hidden; background: #3b1708; }
  body { font-family: 'Space Mono', monospace; cursor: crosshair; user-select: none; }
  canvas { display: block; }

  .home-btn {
    position: fixed; left: 26px; top: 22px; z-index: 20;
    font: 700 11px/1 'Space Mono', monospace; letter-spacing: .22em;
    color: rgba(248,218,186,.72); text-decoration: none; padding: 9px 13px;
    border: 1px solid rgba(248,196,146,.22); background: rgba(52,20,8,.42);
    transition: color .3s, border-color .3s;
  }
  .home-btn:hover { color: #ffbc78; border-color: rgba(255,188,120,.5); }

  .tools {
    position: fixed; right: 26px; top: 22px; z-index: 20;
    display: flex; align-items: stretch; gap: 10px;
  }
  .mic, .reset {
    display: flex; align-items: center; gap: 9px;
    font: 700 11px/1 'Space Mono', monospace; letter-spacing: .18em;
    color: rgba(248,218,186,.72); padding: 9px 13px; cursor: pointer;
    border: 1px solid rgba(248,196,146,.22); background: rgba(52,20,8,.42);
    transition: color .3s, border-color .3s;
  }
  .mic:hover, .reset:hover { color: #ffbc78; border-color: rgba(255,188,120,.5); }
  .mic.on { color: #ffbc78; border-color: rgba(255,188,120,.45); }
  .mic .bar { width: 46px; height: 3px; background: rgba(248,196,146,.2); overflow: hidden; }
  .mic .bar i { display: block; width: 0; height: 100%; background: #ffbc78; }

  .hint {
    position: fixed; left: 50%; bottom: 24px; transform: translateX(-50%); z-index: 20;
    font: 400 10px/1 'Space Mono', monospace; letter-spacing: .2em;
    color: rgba(248,218,186,.7); white-space: nowrap; pointer-events: none;
    background: rgba(52,20,8,.4); padding: 8px 13px;
    transition: opacity .6s ease;
  }
  .hint.off { opacity: 0; }

  body.preview .home-btn, body.preview .tools, body.preview .hint { display: none; }
</style>
</head>
<body>
<canvas id="cv"></canvas>
<a class="home-btn" href="../index.html">← INDEX</a>
<div class="tools">
  <div class="mic" id="mic"><span id="micLabel">MIC: OFF</span><span class="bar"><i id="micBar"></i></span></div>
  <div class="reset" id="reset">&#8635; RESET</div>
</div>
<div class="hint" id="hint">CLICK &middot; ENTER TO PILE &nbsp;/&nbsp; BLOW INTO THE MIC</div>

<script>
const cv = document.getElementById('cv');
const ctx = cv.getContext('2d');
const PREVIEW = new URLSearchParams(location.search).has('preview');
if (PREVIEW) document.body.classList.add('preview');

const DPR = Math.min(window.devicePixelRatio || 1, 2);
const rnd = (a, b) => a + Math.random() * (b - a);
const pick = a => a[(Math.random() * a.length) | 0];
const clamp = (v, a, b) => v < a ? a : v > b ? b : v;

const NAMES = [
  'birch-small', 'cherry-red', 'cup-yellow', 'curl-dry', 'curl-orange',
  'curl-red', 'curl-yellow', 'fold-red', 'ginkgo-yellow', 'maple-orange',
  'maple-red', 'maple-yellow', 'oak-brown', 'oak-pale', 'plane-orange',
  'poplar-gold', 'roll-brown', 'twist-gold', 'willow-narrow', 'zelkova-brown',
];

let W = 0, H = 0, COLS = 0, CW = 8, ground = 0;
let texCv = null, pileCv = null, pileCtx = null;
let hmap = null;
let imgs = [];

const live = [];     // 떨어지거나 날아가는 잎
const rest = [];     // 바닥에 내려앉은 잎
let wind = 0, gust = 0, gustDir = 1, peelIn = 0;

// ── 캔버스 ─────────────────────────────────────────────────────────────────
function newCanvas() {
  const c = document.createElement('canvas');
  c.width = W * DPR; c.height = H * DPR;
  const g = c.getContext('2d');
  g.scale(DPR, DPR);
  return [c, g];
}

// 천천히 흐르는 단풍색 바탕 — 매 프레임 다시 칠한다
function paintSky(t) {
  const a = Math.sin(t * .000115), b = Math.sin(t * .00008 + 1.7);
  const g = ctx.createLinearGradient(W * .12, H * (-.1 + a * .07), W * .88, H * (1.06 + b * .05));
  g.addColorStop(0, '#4d1d0b');
  g.addColorStop(.33 + a * .07, '#9d4a15');
  g.addColorStop(.67 + b * .06, '#6b2a0d');
  g.addColorStop(1, '#2b1105');
  ctx.fillStyle = g;
  ctx.fillRect(0, 0, W, H);

  // 느리게 도는 따뜻한 빛
  const cx = W * (.5 + Math.sin(t * .000061) * .2);
  const cy = H * (.36 + Math.cos(t * .000047) * .14);
  const r = ctx.createRadialGradient(cx, cy, 0, cx, cy, Math.max(W, H) * .5);
  r.addColorStop(0, 'rgba(230,136,48,.26)');
  r.addColorStop(.46, 'rgba(168,74,22,.07)');
  r.addColorStop(1, 'rgba(0,0,0,0)');
  ctx.fillStyle = r;
  ctx.fillRect(0, 0, W, H);
}

// 결·그늘·날짜는 한 번만 구워서 바탕 위에 덮는다
function paintTex() {
  const [c, g] = newCanvas();

  g.globalAlpha = .05;
  for (let i = 0; i < 11000; i++) {
    g.fillStyle = Math.random() < .5 ? '#2a1004' : '#ffd9a8';
    g.fillRect(Math.random() * W, Math.random() * H, 1.2, 1.2);
  }
  g.globalAlpha = .035;
  for (let i = 0; i < 2400; i++) {
    g.fillStyle = '#ffe6c4';
    g.fillRect(Math.random() * W, Math.random() * H, rnd(2, 9), 1);
  }
  g.globalAlpha = 1;

  const vig = g.createRadialGradient(W / 2, H * .44, Math.min(W, H) * .2, W / 2, H * .5, Math.max(W, H) * .74);
  vig.addColorStop(0, 'rgba(0,0,0,0)');
  vig.addColorStop(1, 'rgba(28,10,2,.52)');
  g.fillStyle = vig;
  g.fillRect(0, 0, W, H);

  texCv = c;
}

function resize() {
  W = window.innerWidth; H = window.innerHeight;
  cv.width = W * DPR; cv.height = H * DPR;
  cv.style.width = W + 'px'; cv.style.height = H + 'px';
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);

  COLS = Math.ceil(W / CW) + 1;
  ground = H - 2;
  hmap = new Float32Array(COLS).fill(ground);

  paintTex();
  const [pc, pg] = newCanvas();
  pileCv = pc; pileCtx = pg;

  // 쌓여 있던 잎을 새 크기에 맞춰 다시 깔아 준다
  const keep = rest.splice(0);
  for (const l of keep) { l.x = clamp(l.x, 20, W - 20); }
  rest.length = 0;
  for (const l of keep) settle(l, true);
}

// ── 잎 ─────────────────────────────────────────────────────────────────────
function makeLeaf(x, y) {
  const img = pick(imgs);
  const size = rnd(52, 96);
  const k = size / Math.max(img.width, img.height);
  return {
    img, x, y,
    w: img.width * k, h: img.height * k,
    vx: rnd(-.5, .5), vy: rnd(.3, 1.1),
    rot: rnd(0, Math.PI * 2), vrot: rnd(-.03, .03),
    sway: rnd(0, Math.PI * 2), swaySp: rnd(.012, .03), swayAmp: rnd(.5, 1.6),
    flip: Math.random() < .5 ? -1 : 1,
    drift: rnd(-.4, .4), land: 0, tx: 0, ty: 0,
  };
}

function spanOf(l) {
  const r = Math.max(l.w, l.h) * .32;
  return [clamp(((l.x - r) / CW) | 0, 0, COLS - 1), clamp(((l.x + r) / CW) | 0, 0, COLS - 1)];
}

function surfaceAt(l) {
  const [a, b] = spanOf(l);
  let s = ground;
  for (let c = a; c <= b; c++) if (hmap[c] < s) s = hmap[c];
  return s;
}

function probe(x) {
  const c = clamp((x / CW) | 0, 0, COLS - 1);
  return hmap[c];
}

// 비탈에 걸리면 낮은 쪽으로 흘러내린 자리를 미리 구한다
function slideSpot(l) {
  const sx = l.x;
  const d = Math.max(l.w, l.h) * .42;
  for (let i = 0; i < 10; i++) {
    const hl = probe(l.x - d), hr = probe(l.x + d);
    if (Math.abs(hl - hr) < l.h * .17) break;
    l.x = clamp(l.x + (hl < hr ? 1 : -1) * d * .7, 18, W - 18);
  }
  const tx = l.x, ty = surfaceAt(l) - l.h * .34;
  l.x = sx;
  return [tx, ty];
}

function settle(l, quiet) {
  if (!quiet) {
    const [tx, ty] = slideSpot(l);
    l.x = tx; l.y = ty;
  }
  const [a, b] = spanOf(l);
  const mid = (a + b) / 2, half = Math.max(1, (b - a) / 2);
  const rise = l.h * rnd(.15, .23);
  for (let c = a; c <= b; c++) {
    const t = 1 - Math.abs(c - mid) / half;        // 가운데가 더 높게 쌓인다
    const top = l.y + l.h * .34 - rise * (.45 + t * .55);
    if (top < hmap[c]) hmap[c] = top;
  }
  pileCtx.save();
  pileCtx.translate(l.x, l.y);
  pileCtx.rotate(l.rot);
  pileCtx.scale(l.flip, 1);
  pileCtx.drawImage(l.img, -l.w / 2, -l.h / 2, l.w, l.h);
  pileCtx.restore();
  rest.push(l);
}

function repaintPile() {
  pileCtx.clearRect(0, 0, W, H);
  hmap.fill(ground);
  for (const l of rest) {
    const [a, b] = spanOf(l);
    const mid = (a + b) / 2, half = Math.max(1, (b - a) / 2);
    for (let c = a; c <= b; c++) {
      const t = 1 - Math.abs(c - mid) / half;
      const top = l.y + l.h * .34 - l.h * .19 * (.45 + t * .55);
      if (top < hmap[c]) hmap[c] = top;
    }
    pileCtx.save();
    pileCtx.translate(l.x, l.y);
    pileCtx.rotate(l.rot);
    pileCtx.scale(l.flip, 1);
    pileCtx.drawImage(l.img, -l.w / 2, -l.h / 2, l.w, l.h);
    pileCtx.restore();
  }
}

function drop(x, n) {
  for (let i = 0; i < n; i++) {
    const l = makeLeaf(clamp(x + rnd(-150, 150), 24, W - 24), rnd(-200, -40));
    live.push(l);
  }
  hideHint();
}

function blow(power) {
  if (gust < .12) gustDir = Math.random() < .5 ? -1 : 1;
  gust = Math.max(gust, clamp(power, .4, 1.8));
  hideHint();
}

// 바람이 닿는 쪽 · 위에 놓인 잎부터 몇 장씩 뜬다
function peel(g) {
  if (!rest.length) return;
  const n = Math.min(rest.length, 1 + Math.round(rnd(0, 3.2) * g));
  for (let k = 0; k < n; k++) {
    let best = 0, score = -Infinity;
    for (let t = 0; t < 5; t++) {
      const i = rest.length - 1 - ((Math.random() ** 1.7) * rest.length | 0);
      const sc = -gustDir * (rest[i].x / W) + (i / rest.length) * .7;
      if (sc > score) { score = sc; best = i; }
    }
    const l = rest.splice(best, 1)[0];
    const dir = Math.random() < .84 ? gustDir : -gustDir;
    l.vx = dir * rnd(.5, 3.2) * g + rnd(-.7, .7);
    l.vy = -rnd(.8, 4.2) * g;
    l.vrot = rnd(-.17, .17);
    l.drift = dir * rnd(.45, 1.6);
    l.land = 0;
    l.swayAmp = rnd(.7, 2);
    l.swaySp = rnd(.014, .036);
    live.push(l);
  }
  repaintPile();
}

// ── 루프 ───────────────────────────────────────────────────────────────────
function tick(t = 0) {
  if (gust > .02) {
    wind = Math.max(wind, gust);
    if (--peelIn <= 0) { peelIn = 2 + (Math.random() * 4 | 0); peel(gust); }
    gust -= .007;
  } else gust = 0;
  if (wind > 0) wind = Math.max(0, wind - .012);

  for (let i = live.length - 1; i >= 0; i--) {
    const l = live[i];

    // 바닥에 닿은 잎은 제자리로 미끄러져 들어간다
    if (l.land) {
      l.x += (l.tx - l.x) * .17;
      l.y += (l.ty - l.y) * .17;
      l.rot += l.vrot;
      l.vrot *= .8;
      if (Math.abs(l.tx - l.x) < .7 && Math.abs(l.ty - l.y) < .7) {
        l.x = l.tx; l.y = l.ty; l.land = 0; l.vrot = 0;
        live.splice(i, 1);
        settle(l, true);
      }
      continue;
    }

    l.sway += l.swaySp;
    const s = Math.sin(l.sway);

    l.vy += .052;
    l.vx += s * .035 * l.swayAmp;
    if (wind > .02) {
      l.vx += l.drift * wind * .5;
      l.vy -= wind * .1 * (.4 + Math.abs(l.drift));
    }
    l.vx *= .985; l.vy *= .988;
    l.vy = clamp(l.vy, -9, 3.1);

    l.x += l.vx;
    l.y += l.vy;
    l.rot += l.vrot + s * .006;

    if (l.x < -220 || l.x > W + 220 || l.y < -600 || l.y > H + 320) {
      live.splice(i, 1);
      continue;
    }
    if (l.vy > 0 && l.y + l.h * .34 >= surfaceAt(l)) {
      if (wind > .02 && Math.abs(l.vx) > .9) {
        l.y = surfaceAt(l) - l.h * .34;       // 바닥을 긁으며 굴러간다
        l.vy = -rnd(.3, 1.6) * wind;
        l.vrot += l.vx * .004;
        l.vx *= .9;
      } else {
        const [tx, ty] = slideSpot(l);
        l.tx = tx; l.ty = ty; l.land = 1;
        l.vx = 0; l.vy = 0;
        l.vrot *= .5;
      }
    }
  }

  paintSky(t);
  ctx.drawImage(texCv, 0, 0, W, H);
  ctx.drawImage(pileCv, 0, 0, W, H);
  for (const l of live) {
    ctx.save();
    ctx.translate(l.x, l.y);
    ctx.rotate(l.rot);
    ctx.scale(l.flip, 1);
    ctx.drawImage(l.img, -l.w / 2, -l.h / 2, l.w, l.h);
    ctx.restore();
  }
  requestAnimationFrame(tick);
}

// ── 입력 ───────────────────────────────────────────────────────────────────
let hinted = false;
function hideHint() {
  if (hinted) return;
  hinted = true;
  setTimeout(() => document.getElementById('hint').classList.add('off'), 1600);
}

addEventListener('pointerdown', e => {
  if (e.target.closest('.home-btn, .mic')) return;
  drop(e.clientX, 10);
});

addEventListener('keydown', e => {
  if (e.key === 'Enter') { e.preventDefault(); drop(rnd(W * .18, W * .82), 10); }
});

addEventListener('resize', () => { resize(); });

// ── 마이크 ─────────────────────────────────────────────────────────────────
const micBtn = document.getElementById('mic');
const micLabel = document.getElementById('micLabel');
const micBar = document.getElementById('micBar');
let micOn = false, analyser = null, freq = null, base = 18;

micBtn.addEventListener('click', async () => {
  if (micOn) return;
  try {
    const stream = await navigator.mediaDevices.getUserMedia({
      audio: { echoCancellation: false, noiseSuppression: false, autoGainControl: false },
    });
    const ac = new (window.AudioContext || window.webkitAudioContext)();
    const src = ac.createMediaStreamSource(stream);
    analyser = ac.createAnalyser();
    analyser.fftSize = 1024;
    analyser.smoothingTimeConstant = .5;
    src.connect(analyser);
    freq = new Uint8Array(analyser.frequencyBinCount);
    micOn = true;
    micBtn.classList.add('on');
    micLabel.textContent = 'MIC: ON';
    listen();
  } catch (err) {
    micLabel.textContent = 'MIC: DENIED';
  }
});

function scatterStart(n) {
  for (let i = 0; i < n; i++) settle(makeLeaf(rnd(20, W - 20), 0));
}

document.getElementById('reset').addEventListener('click', () => {
  live.length = 0;
  rest.length = 0;
  pileCtx.clearRect(0, 0, W, H);
  hmap.fill(ground);
  wind = 0; gust = 0;
  scatterStart(26);
});

function listen() {
  analyser.getByteFrequencyData(freq);
  let low = 0;
  for (let i = 1; i <= 12; i++) low += freq[i];
  low /= 12;

  const hot = low > base + 26 && low > 52;
  if (!hot) base = base * .97 + low * .03;
  micBar.style.width = clamp(low / 110, 0, 1) * 46 + 'px';

  if (hot) {
    const power = clamp((low - base) / 60, .55, 1.7);
    blow(power);
  }
  requestAnimationFrame(listen);
}

// ── 시작 ───────────────────────────────────────────────────────────────────
Promise.all(NAMES.map(n => new Promise(res => {
  const im = new Image();
  im.onload = () => res(im);
  im.onerror = () => res(null);
  im.src = `leaves/${n}.webp`;
}))).then(list => {
  imgs = list.filter(Boolean);
  resize();
  scatterStart(26);
  tick();
});
</script>
</body>
</html>
