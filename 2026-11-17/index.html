<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>번역 불가 — Lost in Return</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Nanum+Myeongjo:wght@400;700&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 100%; height: 100%; overflow: hidden; background: #15171a; }
  body { cursor: pointer; }

  .home-btn, .snd {
    position: fixed; top: 20px; z-index: 20;
    padding: 7px 13px;
    background: rgba(28,31,35,.6);
    border: 1px solid rgba(150,146,136,.26);
    color: #8d8a80;
    font: 700 10px/1 'Space Mono', monospace;
    letter-spacing: .14em; text-decoration: none;
    user-select: none;
    transition: color .2s, border-color .2s;
  }
  .home-btn { left: 20px; }
  .snd { right: 20px; }
  .home-btn:hover, .snd:hover { color: #e3dcce; border-color: rgba(227,220,206,.5); }

  /* 위에 걸어두는 원문 */
  .src {
    position: fixed; left: 0; right: 0; top: 0; z-index: 12;
    padding: 62px 7vw 18px;
    background: linear-gradient(to bottom, #15171a 58%, rgba(21,23,26,0));
    text-align: center;
  }
  .src .tag {
    display: block; margin-bottom: 9px;
    color: rgba(150,146,136,.55);
    font: 700 9px/1 'Space Mono', monospace; letter-spacing: .22em;
  }
  .src .txt {
    color: rgba(222,215,200,.62);
    font: 400 15px/1.75 'Nanum Myeongjo', serif;
    letter-spacing: .01em;
  }

  /* 흘러가는 번역 */
  .stage {
    position: absolute; inset: 0;
    -webkit-mask-image: linear-gradient(to bottom, transparent 13%, #000 27%, #000 88%, transparent 98%);
            mask-image: linear-gradient(to bottom, transparent 13%, #000 27%, #000 88%, transparent 98%);
  }
  .flow {
    position: absolute; left: 50%; top: 52%;
    transform: translate(-50%, -50%);
    width: min(780px, 84vw);
  }
  .ln {
    display: flex; align-items: baseline; gap: 16px;
    max-height: 220px; padding: 9px 0;
    overflow: hidden;
    transition: opacity .7s, max-height .7s cubic-bezier(.4,0,.2,1), padding .7s;
  }
  .ln.gone { max-height: 0; padding: 0; opacity: 0 !important; }
  .ln .lg {
    flex: 0 0 26px; padding-top: 3px;
    color: rgba(150,146,136,.5);
    font: 700 9px/1 'Space Mono', monospace; letter-spacing: .12em;
  }
  .ln .tx {
    flex: 1;
    color: #7d7a72;
    font: 400 15px/1.7 'Nanum Myeongjo', serif;
  }
  .ln.ko .tx {
    color: #ded7c8;
    font-size: 20px; line-height: 1.8;
  }
  .ln.ko .lg { color: rgba(222,215,200,.7); }
  .ln .tx em { font-style: normal; color: #cf7042; }
  .ln.ko .tx em { color: #e3833f; }
  .cur {
    display: inline-block; width: 7px; height: 1em;
    margin-left: 2px; vertical-align: -2px;
    background: rgba(222,215,200,.55);
  }

  /* 아래 진행 표시 */
  .bar {
    position: fixed; left: 0; right: 0; bottom: 0; z-index: 12;
    padding: 20px 0 26px;
    background: linear-gradient(to top, #15171a 54%, rgba(21,23,26,0));
    text-align: center;
  }
  .route {
    color: rgba(150,146,136,.62);
    font: 700 10px/1 'Space Mono', monospace; letter-spacing: .2em;
  }
  .route b { color: #e3833f; font-weight: 700; }
  .route i { font-style: normal; color: rgba(150,146,136,.3); }
  .hint {
    margin-top: 11px;
    color: rgba(190,184,170,.36);
    font: 400 11px/1 'Nanum Myeongjo', serif; letter-spacing: .2em;
    transition: opacity .6s;
  }
  .hint.off { opacity: 0; }

  body.preview .home-btn, body.preview .snd, body.preview .hint { display: none; }
</style>
</head>
<body>

<div class="stage"><div class="flow" id="flow"></div></div>

<div class="src">

</div>

<div class="bar">
  <div class="route" id="route"></div>
  <div class="hint" id="hint">클릭하면 다음 문장</div>
</div>

<a class="home-btn" href="../index.html">← INDEX</a>
<div class="snd" id="snd">SOUND: ON</div>

// ── 소리 ───────────────────────────────────────────────────────────────────
const sound = (() => {
  let ac = null, master = null, on = true, hum = null, noise = null;

  function boot() {
    if (ac) return;
    ac = new (window.AudioContext || window.webkitAudioContext)();
    master = ac.createGain();
    master.gain.value = on ? 0.9 : 0;
    const comp = ac.createDynamicsCompressor();
    comp.threshold.value = -16; comp.ratio.value = 7;
    master.connect(comp); comp.connect(ac.destination);

    // 기계가 켜져 있는 소리
    const o = ac.createOscillator();
    o.type = 'square'; o.frequency.value = 59;
    const lp = ac.createBiquadFilter();
    lp.type = 'lowpass'; lp.frequency.value = 190;
    const g = ac.createGain(); g.gain.value = 0.022;
    o.connect(lp); lp.connect(g); g.connect(master); o.start();
    hum = g;

    // 테이프 잡음
    const len = ac.sampleRate * 2;
    const buf = ac.createBuffer(1, len, ac.sampleRate);
    const d = buf.getChannelData(0);
    for (let i = 0; i < len; i++) d[i] = (Math.random() * 2 - 1) * 0.4;
    const src = ac.createBufferSource();
    src.buffer = buf; src.loop = true;
    const hp = ac.createBiquadFilter();
    hp.type = 'highpass'; hp.frequency.value = 2600;
    const ng = ac.createGain(); ng.gain.value = 0.012;
    src.connect(hp); hp.connect(ng); ng.connect(master); src.start();
    noise = ng;
  }

  const env = (g, a, p, d, v) => {
    g.gain.setValueAtTime(0.0001, a);
    g.gain.exponentialRampToValueAtTime(v, a + p);
    g.gain.exponentialRampToValueAtTime(0.0001, a + p + d);
  };

  function burst(dur, f, q, v, type) {
    const n = Math.max(1, Math.floor(ac.sampleRate * dur));
    const buf = ac.createBuffer(1, n, ac.sampleRate);
    const d = buf.getChannelData(0);
    for (let i = 0; i < n; i++) d[i] = (Math.random() * 2 - 1);
    const src = ac.createBufferSource(); src.buffer = buf;
    const bp = ac.createBiquadFilter();
    bp.type = type || 'bandpass'; bp.frequency.value = f; bp.Q.value = q;
    const g = ac.createGain();
    src.connect(bp); bp.connect(g); g.connect(master);
    env(g, ac.currentTime, 0.004, dur, v);
    src.start();
    src.stop(ac.currentTime + dur + 0.02);
  }

  return {
    kick() { boot(); if (ac.state === 'suspended') ac.resume(); },
    live() { return !!ac && ac.state === 'running'; },
    toggle() { on = !on; if (master) master.gain.value = on ? 0.9 : 0; return on; },

    // 활자 하나
    key() {
      if (!ac) return;
      burst(0.016, rnd(1900, 3400), 2.2, 0.16, 'bandpass');
    },

    // 모터가 답을 찾는다
    motor(ms) {
      if (!ac) return;
      const n = ac.currentTime, dur = ms / 1000;
      const o = ac.createOscillator();
      o.type = 'sawtooth';
      o.frequency.setValueAtTime(74, n);
      o.frequency.linearRampToValueAtTime(96, n + dur * 0.6);
      o.frequency.linearRampToValueAtTime(68, n + dur);
      const lp = ac.createBiquadFilter();
      lp.type = 'lowpass'; lp.frequency.value = 430; lp.Q.value = 3;
      const g = ac.createGain();
      o.connect(lp); lp.connect(g); g.connect(master);
      env(g, n, 0.06, dur, 0.1);
      o.start(); o.stop(n + dur + 0.1);
    },

    // 줄을 긋는다
    strike() {
      if (!ac) return;
      const n = ac.currentTime;
      const o = ac.createOscillator();
      o.type = 'triangle';
      o.frequency.setValueAtTime(174, n);
      o.frequency.exponentialRampToValueAtTime(82, n + 0.17);
      const g = ac.createGain();
      o.connect(g); g.connect(master);
      env(g, n, 0.006, 0.19, 0.2);
      o.start(); o.stop(n + 0.26);
      burst(0.09, 1250, 1.1, 0.1, 'bandpass');
    },

    // 기계가 포기한다
    give() {
      if (!ac) return;
      const n = ac.currentTime;
      [104, 52].forEach((f, i) => {
        const o = ac.createOscillator();
        o.type = i ? 'sine' : 'triangle';
        o.frequency.value = f;
        const g = ac.createGain();
        o.connect(g); g.connect(master);
        env(g, n + i * 0.04, 0.05, 1.5, i ? 0.17 : 0.1);
        o.start(); o.stop(n + 1.9);
      });
      burst(0.5, 520, 0.8, 0.045, 'lowpass');
    },
  };
})();

// ── 화면 ───────────────────────────────────────────────────────────────────
const flow = document.getElementById('flow');
const srcTxt = document.getElementById('srcTxt');
const routeEl = document.getElementById('route');
const hint = document.getElementById('hint');
const sndBtn = document.getElementById('snd');

let si = 0;        // 지금 문장
let step = 1;      // 지금 단계
let timer = null;
let running = false;
let lines = [];

const esc = s => s.replace(/&/g, '&amp;').replace(/</g, '&lt;');
const bare = s => s.replace(/[.,·…"'’“”「」。、]/g, '');

function same(a, b) {
  if (a === b) return true;
  if (a.length < 2 || b.length < 2) return false;
  return a.slice(0, 2) === b.slice(0, 2);
}

// 원문에 없던 말에만 불을 켠다
function mark(text, src) {
  const sw = bare(src).split(/\s+/).filter(Boolean);
  return text.split(/(\s+)/).map(tk => {
    if (!tk.trim()) return tk;
    const w = bare(tk);
    return sw.some(s => same(s, w)) ? esc(tk) : '<em>' + esc(tk) + '</em>';
  }).join('');
}

function fade() {
  const last = lines[lines.length - 1];
  lines.forEach(el => {
    el.style.opacity = el === last ? 1 : el.classList.contains('ko') ? 0.5 : 0.26;
  });
}

// 한국어로 돌아오면 그 바퀴에 거쳐 온 말들은 접어서 치운다
function foldForeign() {
  lines.forEach(el => {
    if (!el.classList.contains('ko')) el.classList.add('gone');
  });
}

function addLine(code, isKo) {
  const el = document.createElement('div');
  el.className = 'ln' + (isKo ? ' ko' : '');
  el.innerHTML = '<div class="lg">' + code + '</div><div class="tx" dir="auto"></div>';
  flow.appendChild(el);
  lines.push(el);
  fade();
  return el.querySelector('.tx');
}

function drawRoute() {
  routeEl.innerHTML = CHAIN[si].map((s, i) =>
    i < step ? '<span>' + s[0] + '</span>'
    : i === step ? '<b>' + s[0] + '</b>'
    : '<i>' + s[0] + '</i>'
  ).join(' <i>·</i> ');
}

function type(node, text, isKo, done) {
  const sp = Math.max(10, Math.min(44, 1600 / text.length)) * (isKo ? 1.6 : 1);
  const cur = document.createElement('span');
  cur.className = 'cur';
  let i = 0;
  (function tick() {
    node.textContent = text.slice(0, i);
    node.appendChild(cur);
    if (i % 2 === 0) sound.key();
    i++;
    if (i <= text.length) timer = setTimeout(tick, sp);
    else { cur.remove(); done(); }
  })();
}

function next() {
  const ch = CHAIN[si];
  if (step >= ch.length) { finish(); return; }
  const [code, text] = ch[step];
  const isKo = code === 'KO';
  drawRoute();
  sound.motor(isKo ? 620 : 300);
  const node = addLine(code, isKo);
  type(node, text, isKo, () => {
    if (isKo) {
      node.innerHTML = mark(text, ch[0][1]);
      sound.strike();
      setTimeout(foldForeign, 520);
    }
    step++;
    drawRoute();
    timer = setTimeout(next, isKo ? 1250 : 420);
  });
}

function finish() {
  running = false;
  drawRoute();
  hint.classList.remove('off');
  sound.give();
}

function start(i) {
  clearTimeout(timer);
  si = i % CHAIN.length;
  step = 1;
  lines = [];
  flow.innerHTML = '';
  srcTxt.textContent = CHAIN[si][0][1];
  hint.classList.add('off');
  running = true;
  drawRoute();
  timer = setTimeout(next, 800);
}

// 진행 중에 누르면 남은 번역을 한 번에 펼친다
function skip() {
  clearTimeout(timer);
  const ch = CHAIN[si];
  const half = lines[lines.length - 1];      // 타이핑하다 만 줄은 버린다
  if (half) { half.remove(); lines.pop(); }
  for (; step < ch.length; step++) {
    const [code, text] = ch[step];
    const isKo = code === 'KO';
    const node = addLine(code, isKo);
    if (isKo) { node.innerHTML = mark(text, ch[0][1]); foldForeign(); }
    else node.textContent = text;
  }
  fade();
  finish();
}

document.body.addEventListener('click', () => {
  sound.kick();
  if (running) skip();
  else start(si + 1);
});

sndBtn.addEventListener('click', e => {
  e.stopPropagation();
  sound.kick();
  sndBtn.textContent = 'SOUND: ' + (sound.toggle() ? 'ON' : 'OFF');
});
document.querySelector('.home-btn').addEventListener('click', e => e.stopPropagation());

start(0);
</script>
