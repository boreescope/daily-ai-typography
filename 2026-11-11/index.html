<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>빈 칸 — HALF LIT</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Black+Han+Sans&family=Gothic+A1:wght@400;700&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 100%; height: 100%; overflow: hidden; background: #05070a; }
  body { font-family: 'Space Mono', monospace; cursor: default; }
  body.hit { cursor: pointer; }
  canvas { display: block; }

  .home-btn, .snd {
    position: fixed; top: 22px; z-index: 20;
    font: 700 11px/1 'Space Mono', monospace; letter-spacing: .22em;
    color: #7e8692; text-decoration: none; padding: 9px 13px;
    border: 1px solid rgba(126,134,146,.3); background: rgba(5,7,10,.72);
    transition: color .3s, border-color .3s;
  }
  .home-btn { left: 26px; }
  .snd { right: 26px; cursor: pointer; letter-spacing: .18em; }
  .home-btn:hover, .snd:hover { color: #dfe6ef; border-color: rgba(223,230,239,.5); }

  .cnt {
    position: fixed; left: 50%; top: 22px; transform: translateX(-50%); z-index: 20;
    font: 700 11px/1 'Space Mono', monospace; letter-spacing: .2em;
    color: rgba(190,200,214,.75); padding: 9px 13px;
    background: rgba(5,7,10,.72); border: 1px solid rgba(126,134,146,.22);
    pointer-events: none; white-space: nowrap;
  }

  .hint {
    position: fixed; left: 50%; bottom: 24px; transform: translateX(-50%); z-index: 20;
    font: 400 10px/1 'Space Mono', monospace; letter-spacing: .2em;
    color: rgba(126,134,146,.74); white-space: nowrap; pointer-events: none;
    background: rgba(5,7,10,.72); padding: 8px 13px;
    transition: opacity 1.2s ease;
  }
  .hint.off { opacity: 0; }

  body.preview .home-btn, body.preview .snd,
  body.preview .hint, body.preview .cnt { display: none; }
</style>
</head>
<body>
<canvas id="cv"></canvas>
<a class="home-btn" href="../index.html">← INDEX</a>
<div class="snd" id="snd">SOUND: ON</div>
<div class="cnt" id="cnt">— / —</div>
<div class="hint" id="hint">CLICK A SIGN · 간판을 치면 나간 글자가 잠깐 들어온다</div>

<script>
const cv = document.getElementById('cv');
const ctx = cv.getContext('2d');
const PREVIEW = new URLSearchParams(location.search).has('preview');
if (PREVIEW) document.body.classList.add('preview');

const DPR = Math.min(window.devicePixelRatio || 1, 2);
const clamp = (v, a, b) => v < a ? a : v > b ? b : v;
const rnd = (a, b) => a + Math.random() * (b - a);
const pick = a => a[Math.floor(Math.random() * a.length)];

let W = 0, H = 0;

// ── 상호 ───────────────────────────────────────────────────────────────────
// 앞줄에 서는 큰 간판. order 는 전구가 나가는 순서다.
// 글자가 하나씩 빠질 때마다 남은 글자가 다른 가게 이름으로 읽힌다.
const HERO = [
  { text: '커피한약방', order: [0, 1, 4, 3, 2] },          // 피한약방 · 한약방 · 한약 · 한
  { text: '학사당구장', order: [3, 4, 0, 1, 2] },          // 학사당장 · 학사당 · 사당 · 당
  { text: '태조대림감자국', order: [0, 1, 2, 3, 4, 5, 6] }, // 대림감자국 · 감자국 · 자국 · 국
  { text: '옛날할머니분식', order: [0, 1, 2, 3, 4, 6, 5] }, // 할머니분식 · 머니분식 · 분식 · 분
  { text: '무교동북어국집', order: [0, 1, 2, 6, 4, 3, 5] }, // 북어국집 · 북어국 · 북국 · 국
  { text: '청평매운탕', order: [1, 2, 0, 3, 4] },          // 청매운탕 · 청운탕 · 운탕 · 탕
  { text: '민정식당', order: [0, 2, 1, 3] },               // 정식당 · 정당 · 당
  { text: '성우이용원', order: [1, 2, 3, 0, 4] },          // 성이용원 · 성용원 · 성원 · 원
  { text: '럭키컴퓨터세탁', order: [2, 3, 4, 1, 0, 6, 5] }, // 럭키세탁 · 럭세탁 · 세탁 · 세
  { text: '수진의상실', order: [1, 2, 0, 3, 4] },          // 수의상실 · 수상실 · 상실 · 실
  { text: '소문난국숫집', order: [3, 4, 1, 2, 0, 5] },      // 소문난집 · 소난집 · 소집 · 집
  { text: '고려삼계탕', order: [1, 3, 4, 0, 2] },          // 고삼계탕 · 고삼탕 · 고삼 · 삼
  { text: '오장동함흥냉면', order: [0, 1, 2, 6, 5, 4, 3] }, // 함흥냉면 · 함흥냉 · 함흥 · 함
  { text: '삼거리먼지막순대국', order: [3, 4, 5, 0, 1, 2, 8, 7, 6] }, // 삼거리순대국 · 순대국 · 순대
  { text: '이문설농탕', order: [0, 1, 4, 3, 2] },          // 문설농탕 · 설농탕 · 설농 · 설
  { text: '마포진짜원조최대포', order: [0, 1, 2, 3, 4, 5, 8, 7, 6] }, // 원조최대포 · 최대포 · 최대
];

// 뒷줄을 메우는 이름들. 모두 실제로 있거나 있었던 가게다.
const NAMES = [
  '우래옥', '을지면옥', '은주정', '평래옥', '통일집', '안동장', '사랑방칼국수', '경상도식당',
  '이남장', '삼수갑산', '장수보쌈', '보건옥', '순흥옥', '강산옥', '문화옥', '오구반점',
  '동경우동', '조선옥', '을지오뎅', '우일집', '전주옥', '호반집', '다전식당', '고향집',
  '양미옥', '진아춘', '용금옥', '은호식당', '잼배옥', '청진옥', '한일관', '유진식당',
  '대성관', '부여집', '마포옥', '연남서식당', '열차집', '미진', '대도식당', '부민옥',
  '하동관', '유림면', '초가집', '황해', '서북면옥', '통술집', '산골막국수', '역전회관',
  '진주회관', '창성옥', '대문점', '선천집', '청일집', '중림장', '림스치킨', '원대구탕',
  '동흥관', '쌍다리식당', '기와집능이백숙', '송림식당', '장군갈비', '영화장', '행운돈까스',
  '혜성칼국수', '홍능갈비집', '성수아구찜', '성수족발', '은성보쌈', '망우찜쌈밥', '굴다리식당',
  '원조조박집', '일등식당', '만포면옥', '목노집', '서부감자국', '장가구', '코스모스분식',
  '석교식당', '청송본관함흥냉면', '평택고여사집냉면', '반도이발관', '우정떡집', '칠성조선소',
  '행화탕', '대림창고', '보안여관', '보령당', '설화철물', '서우제과', '통문관', '황해이발관',
  '대성표구사', '맨투맨양복점', '그날이오면', '태극당', '학림다방', '가원공방', '거안',
];

const PAL = [
  [255, 72, 58, 255, 150, 96],      // 적
  [255, 186, 46, 255, 214, 120],    // 황
  [86, 196, 255, 150, 222, 255],    // 청
  [235, 240, 248, 255, 248, 228],   // 백
  [120, 232, 150, 186, 255, 196],   // 녹
  [255, 104, 150, 255, 170, 198],   // 분홍
  [255, 132, 46, 255, 186, 120],    // 주황
  [178, 136, 255, 214, 192, 255],   // 보라
];


// ── 상태 ───────────────────────────────────────────────────────────────────
let signs = [];      // {x,y,w,h,vert,fs,z,tone,warm,text,cells:[idx]}
let cells = [];      // {s,ch,x,y,fs,pad,tone,warm,z, state,lum,fp,fon,ft,rt,revives, bx,by,bs}
let baseOff = null, baseLit = null;
let t = 0, night = 0, nextOut = 0, hover = -1, dark = 0, resetAt = -1;
let litCount = 0, totalCount = 0;

function usedName(set, maxLen, x, y) {
  const fresh = NAMES.filter(n => n.length <= maxLen && !set.has(n));
  if (fresh.length) { const n = pick(fresh); set.add(n); return n; }
  // 이름이 떨어지면 다시 쓰되, 같은 이름이 가까이 두 번 걸리지는 않게 한다.
  const any = NAMES.filter(n => n.length <= maxLen);
  const far = any.filter(n => !signs.some(o =>
    o.text === n && Math.abs(o.x - x) < W * 0.24 && Math.abs(o.y - y) < H * 0.34));
  return pick(far.length ? far : (any.length ? any : NAMES));
}

// ── 거리 세우기 ────────────────────────────────────────────────────────────
// 세로 기둥을 겹쳐 세 겹으로 깐다. 뒤 겹은 작고 어둡고, 앞 겹은 크고 선명하다.
function build() {
  signs = []; cells = [];
  const names = new Set();
  const heroes = HERO.slice().sort(() => Math.random() - 0.5);

  const LAYERS = PREVIEW
    ? [{ z: 0, fs: [8, 11], n: 20 }, { z: 1, fs: [11, 16], n: 13 }, { z: 2, fs: [17, 26], n: 7 }]
    : [{ z: 0, fs: [13, 20], n: 80 }, { z: 1, fs: [20, 33], n: 52 }, { z: 2, fs: [34, 62], n: 24 }];

  // 화면이 넓어지면 간판도 그만큼 늘린다.
  const dens = PREVIEW ? 1 : Math.max(0.78, Math.min(1.5, Math.sqrt(W * H / (1440 * 900))));

  for (const L of LAYERS) {
    // 칸을 먼저 화면 끝까지 깔아 두고, 그 위에 간판을 고르게 나눈다.
    const cols = [];
    const cwMin = L.z === 2 ? 0.2 : 0.08, cwMax = L.z === 2 ? 0.3 : 0.17;
    for (let cx = rnd(-W * 0.06, -W * 0.01); cx < W;) {
      const cw = rnd(W * cwMin, W * cwMax);
      cols.push({ x: cx, w: cw });
      cx += cw - rnd(0, L.z === 2 ? 10 : 24);
    }
    const want = Math.round(L.n * dens);
    const per = Math.ceil(want / cols.length);
    let left = want;

    for (const col of cols) {
      if (left <= 0) break;
      const rows = Math.min(per, left);
      const step = H * 1.1 / rows;
      const x = col.x, colW = col.w;

      for (let r = 0; r < rows; r++) {
        const y = -H * 0.05 + r * step + rnd(0, step * 0.45);
        const fs = rnd(L.fs[0], L.fs[1]) * (L.z === 2 ? 1 : 1);
        const vert = Math.random() < (L.z === 2 ? 0.22 : 0.34);

        // 앞줄 큰 간판은 칸을 넘어 옆으로 길게 걸려도 둔다.
        const span = colW * 1.9;
        const fitLen = (room) => Math.max(2, Math.floor((room - fs * 0.68) / (fs * 1.04)));
        const maxLen = vert ? 5 : fitLen(span);
        let text, order = null, hp = -1;
        if (L.z === 2 && !vert && Math.random() < 0.8) {
          const heroMax = Math.min(fitLen(colW * 3.6), fitLen(W * 0.62));
          for (let k = 0; k < heroes.length; k++) {
            if (heroes[k].text.length <= heroMax) { hp = k; break; }
          }
        }
        if (hp >= 0) {
          text = heroes[hp].text; order = heroes[hp].order;
          heroes.splice(hp, 1);
        } else {
          text = usedName(names, maxLen, x, y);
        }

        const n = text.length;
        const pad = fs * 0.34;
        const bw = vert ? fs * 1.46 : fs * n * 1.04 + pad * 2;
        const bh = vert ? fs * n * 1.06 + pad * 2 : fs * 1.46;
        if (!order && bw > span) continue;

        let sx = x + rnd(-6, Math.max(2, colW - bw + 6));
        if (order) sx = Math.max(4, Math.min(sx, W - bw - 4));
        // 앞줄 큰 간판끼리는 포개지 않는다. 겹치면 글자를 못 읽는다.
        if (L.z === 2 && signs.some(o => o.z === 2 &&
          sx < o.x + o.w + 12 && sx + bw + 12 > o.x &&
          y < o.y + o.h + 10 && y + bh + 10 > o.y)) continue;
        const c = PAL[Math.floor(Math.random() * PAL.length)];
        const sg = {
          x: sx, y, w: bw, h: bh, vert, fs, z: L.z, text, order,
          tone: [c[0], c[1], c[2]], warm: [c[3], c[4], c[5]],
          cells: [], shake: 0,
        };

        for (let i = 0; i < n; i++) {
          const ccx = vert ? sx + bw / 2 : sx + pad + fs * (i + 0.5) * 1.04;
          const ccy = vert ? y + pad + fs * (i + 0.5) * 1.06 : y + bh / 2;
          sg.cells.push(cells.length);
          cells.push({
            s: signs.length, i, ch: text[i], x: ccx, y: ccy, fs,
            tone: sg.tone, warm: sg.warm, z: L.z,
            state: 'on', lum: 1, fp: 0, fon: true, ft: 0, rt: 0, revives: 0,
            seed: Math.random() * 100,
          });
        }
        signs.push(sg);
        left--;
      }
    }
  }

  totalCount = cells.length;
  litCount = totalCount;
}

// ── 굽기 ───────────────────────────────────────────────────────────────────
// 간판 몸통과 나간 글자는 움직이지 않으니 한 장에 구워 둔다.
// 켜진 글자만 따로 한 장 더 구워, 매 프레임 필요한 칸만 오려 붙인다.
function nc() {
  const c = document.createElement('canvas');
  c.width = Math.ceil(W * DPR); c.height = Math.ceil(H * DPR);
  const g = c.getContext('2d');
  g.setTransform(DPR, 0, 0, DPR, 0, 0);
  return [c, g];
}

function drawBody(g, s) {
  const r = Math.min(5, s.h * 0.1);
  g.save();
  g.shadowColor = 'rgba(0,0,0,.8)';
  g.shadowBlur = s.fs * 0.5; g.shadowOffsetY = s.fs * 0.22;
  g.fillStyle = '#0a0d12';
  g.beginPath(); g.roundRect(s.x, s.y, s.w, s.h, r); g.fill();
  g.restore();

  const fr = g.createLinearGradient(0, s.y, 0, s.y + s.h);
  fr.addColorStop(0, 'rgba(142,153,171,.75)');
  fr.addColorStop(0.45, 'rgba(44,51,63,.75)');
  fr.addColorStop(1, 'rgba(68,77,93,.7)');
  g.strokeStyle = fr; g.lineWidth = Math.max(1, s.fs * 0.055);
  g.beginPath(); g.roundRect(s.x, s.y, s.w, s.h, r); g.stroke();

  const ac = g.createLinearGradient(0, s.y, 0, s.y + s.h);
  ac.addColorStop(0, '#161a22');
  ac.addColorStop(1, '#0b0e14');
  g.fillStyle = ac;
  g.beginPath(); g.roundRect(s.x + 1, s.y + 1, s.w - 2, s.h - 2, Math.max(1, r - 1)); g.fill();

  // 글자 칸을 가르는 이음선. 나간 글자가 어느 칸에 있었는지 남는다
  if (s.fs > 22) {
    g.strokeStyle = 'rgba(150,162,182,.07)'; g.lineWidth = 1;
    const n = s.text.length;
    for (let i = 1; i < n; i++) {
      if (s.vert) {
        const ly = Math.round(s.y + (s.h / n) * i) + 0.5;
        g.beginPath(); g.moveTo(s.x + 3, ly); g.lineTo(s.x + s.w - 3, ly); g.stroke();
      } else {
        const lx = Math.round(s.x + (s.w / n) * i) + 0.5;
        g.beginPath(); g.moveTo(lx, s.y + 3); g.lineTo(lx, s.y + s.h - 3); g.stroke();
      }
    }
  }
}

function bake() {
  const [bo, go] = nc();
  const [bl, gl] = nc();

  // 밤. 위가 조금 덜 어둡다
  const sky = go.createLinearGradient(0, 0, 0, H);
  sky.addColorStop(0, '#0d1219');
  sky.addColorStop(0.5, '#090c12');
  sky.addColorStop(1, '#05070a');
  go.fillStyle = sky; go.fillRect(0, 0, W, H);

  for (let z = 0; z < 3; z++) {
    const [to, gto] = nc();
    const [tl, gtl] = nc();
    gto.textAlign = 'center'; gto.textBaseline = 'middle';
    gtl.textAlign = 'center'; gtl.textBaseline = 'middle';

    for (const s of signs) {
      if (s.z !== z) continue;
      drawBody(gto, s);
      for (const ci of s.cells) {
        const c = cells[ci];
        const f = `${c.fs}px 'Black Han Sans', sans-serif`;
        // 나간 글자 — 때 탄 회색 아크릴로 칸에 남는다
        gto.font = f;
        gto.fillStyle = 'rgba(31,35,43,.97)';
        gto.fillText(c.ch, c.x, c.y);
        gto.fillStyle = 'rgba(122,132,150,.17)';
        gto.fillText(c.ch, c.x, c.y - Math.max(0.5, c.fs * 0.022));

        // 켜진 글자 — 번짐 두 겹에 흰 심
        gtl.font = f;
        gtl.filter = `blur(${c.fs * 0.17}px)`;
        gtl.fillStyle = `rgba(${c.tone[0]},${c.tone[1]},${c.tone[2]},.95)`;
        gtl.fillText(c.ch, c.x, c.y);
        gtl.filter = `blur(${c.fs * 0.45}px)`;
        gtl.fillStyle = `rgba(${c.warm[0]},${c.warm[1]},${c.warm[2]},.45)`;
        gtl.fillText(c.ch, c.x, c.y);
        gtl.filter = 'none';
        gtl.fillStyle = `rgb(${c.tone[0]},${c.tone[1]},${c.tone[2]})`;
        gtl.fillText(c.ch, c.x, c.y);
        gtl.save();
        gtl.globalCompositeOperation = 'source-atop';
        const core = gtl.createRadialGradient(c.x, c.y - c.fs * 0.1, 0, c.x, c.y, c.fs * 0.6);
        core.addColorStop(0, 'rgba(255,255,255,.96)');
        core.addColorStop(0.42, `rgba(${c.warm[0]},${c.warm[1]},${c.warm[2]},.7)`);
        core.addColorStop(1, 'rgba(255,255,255,0)');
        gtl.fillStyle = core;
        gtl.fillRect(c.x - c.fs, c.y - c.fs, c.fs * 2, c.fs * 2);
        gtl.restore();
      }
    }

    const blur = z === 0 ? 1.5 : z === 1 ? 0.6 : 0;
    const dim = z === 0 ? 0.62 : z === 1 ? 0.82 : 1;
    [[go, to], [gl, tl]].forEach(([g, src]) => {
      g.save();
      if (blur) g.filter = `blur(${blur}px)`;
      g.globalAlpha = dim;
      g.drawImage(src, 0, 0, W, H);
      g.restore();
    });
  }

  baseOff = bo; baseLit = bl;

  // 칸마다 오려 낼 자리
  for (const c of cells) {
    const p = c.fs * 1.05;
    c.bx = c.x - p; c.by = c.y - p; c.bs = p * 2;
  }
}

// ── 그리기 ─────────────────────────────────────────────────────────────────
let ambCv = null;
function bakeAmbient() {
  const c = document.createElement('canvas');
  c.width = Math.max(2, Math.ceil(W / 9)); c.height = Math.max(2, Math.ceil(H / 9));
  const g = c.getContext('2d');
  g.drawImage(baseLit, 0, 0, c.width, c.height);
  ambCv = c;
}

function draw() {
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  ctx.clearRect(0, 0, W, H);
  if (!baseOff) return;
  ctx.drawImage(baseOff, 0, 0, W, H);

  const ratio = totalCount ? litCount / totalCount : 0;

  // 거리에 뜬 빛. 간판이 꺼질수록 같이 빠진다
  if (ambCv) {
    ctx.save();
    ctx.globalCompositeOperation = 'lighter';
    ctx.globalAlpha = 0.3 * ratio;
    ctx.drawImage(ambCv, 0, 0, W, H);
    ctx.restore();
  }

  for (const c of cells) {
    if (c.lum < 0.012) continue;
    ctx.globalAlpha = Math.min(1, c.lum);
    ctx.drawImage(baseLit,
      c.bx * DPR, c.by * DPR, c.bs * DPR, c.bs * DPR,
      c.bx, c.by, c.bs, c.bs);
  }
  ctx.globalAlpha = 1;

  const vg = ctx.createRadialGradient(W / 2, H * 0.48, Math.min(W, H) * 0.25,
    W / 2, H * 0.48, Math.max(W, H) * 0.8);
  vg.addColorStop(0, 'rgba(0,0,0,0)');
  vg.addColorStop(1, 'rgba(0,0,0,.66)');
  ctx.fillStyle = vg; ctx.fillRect(0, 0, W, H);

  if (dark > 0.002) {
    ctx.fillStyle = `rgba(3,4,6,${clamp(dark, 0, 1) * 0.95})`;
    ctx.fillRect(0, 0, W, H);
  }
}

// ── 시간 ───────────────────────────────────────────────────────────────────
const cntEl = document.getElementById('cnt');
let cntT = 0;

function dyingTime(c) { return c.z === 2 ? 2.1 : c.z === 1 ? 1.4 : 0.9; }

function killOne() {
  const alive = [];
  for (const c of cells) if (c.state === 'on') alive.push(c);
  if (!alive.length) return;
  let c = alive[Math.floor(Math.random() * alive.length)];
  const s = signs[c.s];
  // 이름이 다른 말로 읽히도록 순서를 정해 둔 간판은 그 순서를 지킨다
  if (s.order) {
    for (const oi of s.order) {
      const cc = cells[s.cells[oi]];
      if (cc && cc.state === 'on') { c = cc; break; }
    }
  }
  c.state = 'flick'; c.ft = dyingTime(c); c.fp = 0; c.fon = true;
}

function step(dt) {
  t += dt;

  for (const s of signs) if (s.shake > 0) s.shake = Math.max(0, s.shake - dt * 2.6);

  for (const c of cells) {
    if (c.wake > 0) {
      c.wake -= dt;
      if (c.wake > 0) { c.lum = 0; continue; }
      if (c.z === 2 && Math.random() < 0.25) sound.tick();
    }
    if (c.state === 'on') {
      const hum = 0.955 + 0.045 * Math.sin(t * 31 + c.seed) * Math.sin(t * 6.1 + c.seed * 3);
      c.blink = Math.max(0, (c.blink || 0) - dt);
      const tgt = c.blink > 0 ? 0.2 : hum;
      c.lum += (tgt - c.lum) * Math.min(1, dt * 18);
    } else if (c.state === 'flick') {
      c.ft -= dt; c.fp -= dt;
      if (c.fp <= 0) {
        c.fon = !c.fon;
        c.fp = c.fon ? rnd(0.04, 0.26) : rnd(0.03, 0.15);
        if (c.fon && c.z === 2 && Math.random() < 0.5) sound.tick();
      }
      const k = 1 - c.ft / dyingTime(c);
      c.lum = c.fon ? rnd(0.5, 1) * (1 - k * 0.5) : rnd(0, 0.06);
      if (c.ft <= 0) {
        c.state = 'off'; c.lum = 0; litCount--;
        if (c.z === 2) sound.die(1);
        else if (c.z === 1 && Math.random() < 0.5) sound.die(0.45);
      }
    } else if (c.state === 'rev') {
      c.rt -= dt; c.fp -= dt;
      if (c.fp <= 0) { c.fon = Math.random() > 0.2; c.fp = rnd(0.03, 0.17); }
      c.lum = c.fon ? rnd(0.35, 0.95) : rnd(0, 0.09);
      if (c.rt <= 0) { c.state = 'off'; c.lum = 0; if (c.z === 2) sound.die(0.4); }
    } else {
      c.lum += (0 - c.lum) * Math.min(1, dt * 20);
    }
  }

  const ratio = totalCount ? litCount / totalCount : 0;

  if (resetAt < 0 && t > 2.4 && t > nextOut) {
    killOne();
    nextOut = t + 0.1 + 0.95 * Math.pow(1 - ratio, 1.4);
  }

  if (resetAt < 0 && ratio < 0.1) resetAt = t;
  if (resetAt > 0) {
    dark += ((t - resetAt > 1.6 ? 1 : 0) - dark) * Math.min(1, dt * 1.8);
    if (t - resetAt > 4 && dark > 0.9) relight();
  } else {
    dark += (0 - dark) * Math.min(1, dt * 2.4);
  }

  cntT -= dt;
  if (cntT <= 0 && !PREVIEW) {
    cntT = 0.2;
    cntEl.textContent = `LIT ${String(litCount).padStart(3, ' ')} / ${totalCount}   ·   빈 칸 ${totalCount - litCount}`;
  }
}

function relight() {
  build(); bake(); bakeAmbient();
  cells.forEach(c => { c.lum = 0; c.state = 'on'; c.wake = rnd(0.3, 3.4); });
  resetAt = -1; nextOut = t + 4.5;
  sound.wake();
}

// ── 소리 ───────────────────────────────────────────────────────────────────
// 간판이 많을수록 거리가 웅웅거린다. 안정기 소리는 켜진 글자 수를 따라간다.
const sound = {
  ac: null, master: null, humG: null, nb: null, on: true, last: 0,
  init() {
    const AC = window.AudioContext || window.webkitAudioContext;
    if (!AC) return;
    const ac = this.ac = new AC();
    const m = this.master = ac.createGain();
    m.gain.value = 0.85; m.connect(ac.destination);

    const len = ac.sampleRate * 2;
    const buf = ac.createBuffer(1, len, ac.sampleRate);
    const d = buf.getChannelData(0);
    for (let i = 0; i < len; i++) d[i] = Math.random() * 2 - 1;
    this.nb = buf;

    const hg = this.humG = ac.createGain();
    hg.gain.value = 0;
    const lp = ac.createBiquadFilter();
    lp.type = 'lowpass'; lp.frequency.value = 620; lp.Q.value = 2;
    hg.connect(lp); lp.connect(m);
    [120, 180, 60, 240].forEach((f, i) => {
      const o = ac.createOscillator();
      o.type = i === 2 ? 'sine' : 'sawtooth';
      o.frequency.value = f;
      const g = ac.createGain();
      g.gain.value = [0.46, 0.13, 0.4, 0.07][i];
      o.connect(g); g.connect(hg); o.start();
    });
    const hiss = ac.createBufferSource();
    hiss.buffer = buf; hiss.loop = true;
    const hf = ac.createBiquadFilter();
    hf.type = 'bandpass'; hf.frequency.value = 3200; hf.Q.value = 0.7;
    const hgn = ac.createGain(); hgn.gain.value = 0.05;
    hiss.connect(hf); hf.connect(hgn); hgn.connect(hg); hiss.start();
  },
  live() { return !!this.ac && this.ac.state === 'running'; },
  kick() {
    if (!this.ac) this.init();
    if (this.ac && this.ac.state !== 'running') this.ac.resume();
  },
  hum(r) {
    if (!this.humG || !this.ac) return;
    const v = this.on ? 0.01 + 0.055 * r : 0;
    this.humG.gain.setTargetAtTime(v, this.ac.currentTime, 0.25);
  },
  busy() {   // 한꺼번에 소리가 몰리면 잡음이 된다
    const n = this.ac ? this.ac.currentTime : 0;
    if (n - this.last < 0.045) return true;
    this.last = n; return false;
  },
  noise(dur, freq, q, vol, type) {
    if (!this.ac || !this.on) return;
    const ac = this.ac, s = ac.createBufferSource();
    s.buffer = this.nb; s.loop = true;
    const f = ac.createBiquadFilter();
    f.type = type || 'bandpass'; f.frequency.value = freq; f.Q.value = q;
    const g = ac.createGain();
    g.gain.setValueAtTime(vol, ac.currentTime);
    g.gain.exponentialRampToValueAtTime(0.0001, ac.currentTime + dur);
    s.connect(f); f.connect(g); g.connect(this.master);
    s.start(); s.stop(ac.currentTime + dur + 0.02);
  },
  tone(f0, f1, dur, vol, type) {
    if (!this.ac || !this.on) return;
    const ac = this.ac, o = ac.createOscillator(), g = ac.createGain();
    o.type = type || 'sine';
    o.frequency.setValueAtTime(f0, ac.currentTime);
    o.frequency.exponentialRampToValueAtTime(Math.max(20, f1), ac.currentTime + dur);
    g.gain.setValueAtTime(vol, ac.currentTime);
    g.gain.exponentialRampToValueAtTime(0.0001, ac.currentTime + dur);
    o.connect(g); g.connect(this.master);
    o.start(); o.stop(ac.currentTime + dur + 0.02);
  },
  tick() { if (!this.busy()) this.noise(0.04, rnd(2200, 3400), 1.2, 0.05); },
  die(k) { this.noise(0.09, 1400, 0.9, 0.07 * k); this.tone(520, 68, 0.3, 0.05 * k, 'sine'); },
  zap() { for (let i = 0; i < 5; i++) setTimeout(() => this.noise(0.04, rnd(1800, 4200), 1.4, 0.065), i * rnd(20, 70)); },
  tap() { this.tone(180, 46, 0.19, 0.085, 'triangle'); this.noise(0.06, 880, 0.7, 0.055); },
  wake() { this.tone(62, 126, 0.4, 0.06, 'sine'); },
};

// ── 손 ─────────────────────────────────────────────────────────────────────
function signAt(mx, my) {
  for (let i = signs.length - 1; i >= 0; i--) {
    const s = signs[i];
    if (mx >= s.x && mx <= s.x + s.w && my >= s.y && my <= s.y + s.h) return i;
  }
  return -1;
}

function hitSign(i) {
  const s = signs[i];
  s.shake = 1;
  let dead = 0;
  for (const ci of s.cells) {
    const c = cells[ci];
    if (c.state === 'off') {
      c.state = 'rev';
      c.rt = rnd(0.5, 2.3) / (1 + c.revives * 0.7);
      c.revives++; c.fp = 0; c.fon = true; dead++;
    } else if (c.state === 'flick') {
      c.state = 'on'; c.ft = 0; c.lum = 1;
    } else if (c.state === 'rev') {
      c.rt += rnd(0.3, 0.8) / (1 + c.revives * 0.5);
    } else {
      c.blink = 0.16;
    }
  }
  if (dead) sound.zap(); else sound.tap();
}

const hintEl = document.getElementById('hint');
let hinted = false;

cv.addEventListener('pointermove', e => {
  hover = signAt(e.clientX, e.clientY);
  document.body.classList.toggle('hit', hover >= 0);
});
cv.addEventListener('pointerdown', e => {
  sound.kick();
  const i = signAt(e.clientX, e.clientY);
  if (i >= 0) hitSign(i);
  if (!hinted) { hinted = true; hintEl.classList.add('off'); }
});
document.getElementById('snd').addEventListener('click', () => {
  sound.on = !sound.on;
  document.getElementById('snd').textContent = 'SOUND: ' + (sound.on ? 'ON' : 'OFF');
  sound.kick();
});

// ── 부팅 ───────────────────────────────────────────────────────────────────
function sizeCanvas() {
  W = window.innerWidth; H = window.innerHeight;
  cv.width = Math.ceil(W * DPR); cv.height = Math.ceil(H * DPR);
  cv.style.width = W + 'px'; cv.style.height = H + 'px';
}

let rt = 0;
window.addEventListener('resize', () => {
  clearTimeout(rt);
  rt = setTimeout(() => {
    sizeCanvas(); build(); bake(); bakeAmbient();
    cells.forEach(c => { c.wake = 0; c.lum = 1; c.state = 'on'; });
    litCount = totalCount; resetAt = -1; nextOut = t + 3;
    if (PREVIEW) previewScene();
    draw();
  }, 220);
});

function previewScene() {
  cells.forEach(c => {
    c.wake = 0;
    if (Math.random() < 0.3) { c.state = 'off'; c.lum = 0; }
    else { c.state = 'on'; c.lum = 1; }
  });
  litCount = cells.filter(c => c.state === 'on').length;
}

let last = 0;
function loop(ms) {
  const dt = Math.min(0.05, (ms - last) / 1000 || 0);
  last = ms;
  step(dt);
  sound.hum(totalCount ? litCount / totalCount : 0);
  draw();
  requestAnimationFrame(loop);
}

async function boot() {
  try {
    await Promise.all([
      document.fonts.load("400 60px 'Black Han Sans'"),
      document.fonts.load("400 14px 'Gothic A1'"),
      document.fonts.load("700 11px 'Space Mono'"),
    ]);
  } catch (e) {}

  sizeCanvas();
  build(); bake(); bakeAmbient();

  if (PREVIEW) { previewScene(); draw(); return; }

  cells.forEach(c => { c.wake = rnd(0.1, 2.6); c.lum = 0; });
  nextOut = 3.4;
  sound.kick();
  setTimeout(() => sound.kick(), 400);
  setTimeout(() => { if (!hinted) hintEl.classList.add('off'); }, 15000);
  requestAnimationFrame(loop);
}
boot();

// 디버그 훅
window.__st = () => ({ signs: signs.length, cells: totalCount, lit: litCount,
  dark: +dark.toFixed(2), reset: +resetAt.toFixed(1), t: +t.toFixed(1) });
window.__signs = () => signs.map(s => ({ x: s.x, y: s.y, w: s.w, h: s.h, text: s.text, z: s.z, hero: !!s.order }));
window.__cells = () => cells;
window.__force = () => { cells.forEach(c => { if (c.state !== 'off') { c.state = 'off'; c.lum = 0; } }); litCount = 0; };
window.__sound = () => sound.live();
</script>
</body>
</html>
