// ── 상태 ───────────────────────────────────────────────────────────────────
let signs = [];      // {x,y,w,h,vert,fs,z,tone,warm,text,cells:[idx]}
let cells = [];      // {s,ch,x,y,fs,pad,tone,warm,z, state,lum,fp,fon,ft,rt,revives, bx,by,bs}
let baseOff = null, baseLit = null;

// 야경 사진. 간판은 이 위에 붙는다
const bgImg = new Image();
let bgReady = false;
function loadBg() {
  return new Promise(res => {
    bgImg.onload = () => { bgReady = true; res(); };
    bgImg.onerror = () => res();
    bgImg.src = 'night.jpg';
  });
}
let t = 0, night = 0, nextOut = 0, hover = -1, dark = 0, resetAt = -1;
let litCount = 0, totalCount = 0;

function usedName(set, maxLen, x, y) {
  const fresh = NAMES.filter(n => n.length <= maxLen && !set.has(n));
  if (fresh.length) { const n = pick(fresh); set.add(n); return n; }
  // 이름이 떨어지면 다시 쓰되, 같은 이름이 가까이 두 번 걸리지는 않게 한다.
  const any = NAMES.filter(n => n.length <= maxLen);
  const far = any.filter(n => !signs.some(o =>
    o.text === n && Math.abs(o.x - x) < W * 0.24 && Math.abs(o.y - y) < H * 0.34));
  return pick(far.length ? far : (any.length ? any : NAMES));
}

// ── 거리 세우기 ────────────────────────────────────────────────────────────
// 세로 기둥을 겹쳐 세 겹으로 깐다. 뒤 겹은 작고 어둡고, 앞 겹은 크고 선명하다.
function build() {
  signs = []; cells = [];
  const names = new Set();
  const heroes = HERO.slice().sort(() => Math.random() - 0.5);

  const LAYERS = PREVIEW
    ? [{ z: 0, fs: [8, 11], n: 20 }, { z: 1, fs: [11, 16], n: 13 }, { z: 2, fs: [17, 26], n: 7 }]
    : [{ z: 0, fs: [13, 20], n: 80 }, { z: 1, fs: [20, 33], n: 52 }, { z: 2, fs: [34, 62], n: 24 }];

  // 화면이 넓어지면 간판도 그만큼 늘린다.
  const dens = PREVIEW ? 1 : Math.max(0.78, Math.min(1.5, Math.sqrt(W * H / (1440 * 900))));

  for (const L of LAYERS) {
    // 칸을 먼저 화면 끝까지 깔아 두고, 그 위에 간판을 고르게 나눈다.
    const cols = [];
    const cwMin = L.z === 2 ? 0.2 : 0.08, cwMax = L.z === 2 ? 0.3 : 0.17;
    for (let cx = rnd(-W * 0.06, -W * 0.01); cx < W;) {
      const cw = rnd(W * cwMin, W * cwMax);
      cols.push({ x: cx, w: cw });
      cx += cw - rnd(0, L.z === 2 ? 10 : 24);
    }
    const want = Math.round(L.n * dens);
    const per = Math.ceil(want / cols.length);
    let left = want;

    for (const col of cols) {
      if (left <= 0) break;
      const rows = Math.min(per, left);
      const step = H * 1.1 / rows;
      const x = col.x, colW = col.w;

      for (let r = 0; r < rows; r++) {
        const y = -H * 0.05 + r * step + rnd(0, step * 0.45);
        const fs = rnd(L.fs[0], L.fs[1]) * (L.z === 2 ? 1 : 1);
        const vert = Math.random() < (L.z === 2 ? 0.22 : 0.34);

        // 앞줄 큰 간판은 칸을 넘어 옆으로 길게 걸려도 둔다.
        const span = colW * 1.9;
        const fitLen = (room) => Math.max(2, Math.floor((room - fs * 0.68) / (fs * 1.04)));
        const maxLen = vert ? 5 : fitLen(span);
        let text, order = null, hp = -1;
        if (L.z === 2 && !vert && Math.random() < 0.8) {
          const heroMax = Math.min(fitLen(colW * 3.6), fitLen(W * 0.62));
          for (let k = 0; k < heroes.length; k++) {
            if (heroes[k].text.length <= heroMax) { hp = k; break; }
          }
        }
        if (hp >= 0) {
          text = heroes[hp].text; order = heroes[hp].order;
          heroes.splice(hp, 1);
        } else {
          text = usedName(names, maxLen, x, y);
        }

        const n = text.length;
        const pad = fs * 0.34;
        const bw = vert ? fs * 1.46 : fs * n * 1.04 + pad * 2;
        const bh = vert ? fs * n * 1.06 + pad * 2 : fs * 1.46;
        if (!order && bw > span) continue;

        let sx = x + rnd(-6, Math.max(2, colW - bw + 6));
        if (order) sx = Math.max(4, Math.min(sx, W - bw - 4));
        // 앞줄 큰 간판끼리는 포개지 않는다. 겹치면 글자를 못 읽는다.
        if (L.z === 2 && signs.some(o => o.z === 2 &&
          sx < o.x + o.w + 12 && sx + bw + 12 > o.x &&
          y < o.y + o.h + 10 && y + bh + 10 > o.y)) continue;
        const st = pick(STW);
        const bg = st.bg || pick(BGC);
        const c = pick(!st.lit ? PAL
          : hexLum(bg[0]) > 112 ? PAL_ON_PALE : PAL_ON_DEEP);
        const ff = oldShop(text) && Math.random() < 0.78 ? pick(CLASSICF)
                 : pick(order || L.z === 2 ? BIGF : FONTS);
        const gf = `${ff.w} ${(fs * ff.s).toFixed(1)}px ${ff.f}, sans-serif`;
        const sg = {
          x: sx, y, w: bw, h: bh, vert, fs, z: L.z, text, order, gf, st, bg,
          tone: [c[0], c[1], c[2]], warm: [c[3], c[4], c[5]],
          cells: [], shake: 0, kind: signKind(),
        };

        for (let i = 0; i < n; i++) {
          const ccx = vert ? sx + bw / 2 : sx + pad + fs * (i + 0.5) * 1.04;
          const ccy = vert ? y + pad + fs * (i + 0.5) * 1.06 : y + bh / 2;
          sg.cells.push(cells.length);
          cells.push({
            s: signs.length, i, ch: text[i], x: ccx, y: ccy, fs, gf, st,
            tone: sg.tone, warm: sg.warm, z: L.z,
            state: 'on', lum: 1, fp: 0, fon: true, ft: 0, rt: 0, revives: 0,
            seed: Math.random() * 100,
          });
        }
        signs.push(sg);
        left--;
      }
    }
  }

  totalCount = cells.length;
  litCount = totalCount;
}

// ── 굽기 ───────────────────────────────────────────────────────────────────
// 간판 몸통과 나간 글자는 움직이지 않으니 한 장에 구워 둔다.
// 켜진 글자만 따로 한 장 더 구워, 매 프레임 필요한 칸만 오려 붙인다.
function nc() {
  const c = document.createElement('canvas');
  c.width = Math.ceil(W * DPR); c.height = Math.ceil(H * DPR);
  const g = c.getContext('2d');
  g.setTransform(DPR, 0, 0, DPR, 0, 0);
  return [c, g];
}

function drawBody(g, s) {
  const st = s.st;

  // 채널 간판은 바탕판이 없다. 글자만 벽에 떠 있고 받침대만 보인다
  if (st.bare) {
    g.save();
    g.strokeStyle = 'rgba(96,104,120,.3)';
    g.lineWidth = Math.max(1, s.fs * 0.04);
    g.beginPath();
    if (s.vert) { g.moveTo(s.x + s.w / 2, s.y); g.lineTo(s.x + s.w / 2, s.y + s.h); }
    else { g.moveTo(s.x, s.y + s.h * 0.92); g.lineTo(s.x + s.w, s.y + s.h * 0.92); }
    g.stroke();
    g.restore();
    return;
  }

  const r = Math.min(5, s.h * 0.1);
  g.save();
  g.shadowColor = 'rgba(0,0,0,.8)';
  g.shadowBlur = s.fs * 0.5; g.shadowOffsetY = s.fs * 0.22;
  g.fillStyle = '#0a0d12';
  g.beginPath(); g.roundRect(s.x, s.y, s.w, s.h, r); g.fill();
  g.restore();

  const fr = g.createLinearGradient(0, s.y, 0, s.y + s.h);
  fr.addColorStop(0, st.fr[0]);
  fr.addColorStop(0.45, st.fr[1]);
  fr.addColorStop(1, st.fr[2]);
  g.strokeStyle = fr; g.lineWidth = Math.max(1, s.fs * st.fw);
  g.beginPath(); g.roundRect(s.x, s.y, s.w, s.h, r); g.stroke();

  const ac = g.createLinearGradient(0, s.y, 0, s.y + s.h);
  ac.addColorStop(0, s.bg[0]);
  ac.addColorStop(1, s.bg[1]);
  g.fillStyle = ac;
  g.beginPath(); g.roundRect(s.x + 1, s.y + 1, s.w - 2, s.h - 2, Math.max(1, r - 1)); g.fill();

  g.save();
  g.beginPath(); g.roundRect(s.x + 1, s.y + 1, s.w - 2, s.h - 2, Math.max(1, r - 1)); g.clip();
  deco(g, s, st);
  g.restore();

  // 글자 칸을 가르는 이음선. 나간 글자가 어느 칸에 있었는지 남는다
  if (s.fs > 22) {
    g.strokeStyle = st.lit ? 'rgba(20,18,16,.1)' : 'rgba(150,162,182,.07)';
    g.lineWidth = 1;
    const n = s.text.length;
    for (let i = 1; i < n; i++) {
      if (s.vert) {
        const ly = Math.round(s.y + (s.h / n) * i) + 0.5;
        g.beginPath(); g.moveTo(s.x + 3, ly); g.lineTo(s.x + s.w - 3, ly); g.stroke();
      } else {
        const lx = Math.round(s.x + (s.w / n) * i) + 0.5;
        g.beginPath(); g.moveTo(lx, s.y + 3); g.lineTo(lx, s.y + s.h - 3); g.stroke();
      }
    }
  }
}

// 간판 바탕에 올라가는 것들 — 나뭇결, 볼트, 전구 알, 천막 줄무늬, 전광판 점
function deco(g, s, st) {
  const d = st.deco;
  if (!d) return;

  if (d === 'grain') {
    g.strokeStyle = 'rgba(16,9,4,.3)'; g.lineWidth = 1;
    for (let gy = s.y + 3; gy < s.y + s.h; gy += Math.max(3, s.fs * 0.17)) {
      g.beginPath(); g.moveTo(s.x, gy + 0.5); g.lineTo(s.x + s.w, gy + 0.5); g.stroke();
    }
    return;
  }

  if (d === 'bolts') {
    const m = Math.max(3, s.fs * 0.22);
    g.fillStyle = 'rgba(158,154,138,.45)';
    for (const bx of [s.x + m, s.x + s.w - m]) {
      for (const by of [s.y + m, s.y + s.h - m]) {
        g.beginPath(); g.arc(bx, by, Math.max(1, s.fs * 0.055), 0, 7); g.fill();
      }
    }
    return;
  }

  if (d === 'bulbs') {
    const gap = Math.max(5, s.fs * 0.42);
    const rr = Math.max(1, s.fs * 0.075);
    const dot = (bx, by) => {
      g.fillStyle = 'rgba(255,226,170,.5)';
      g.beginPath(); g.arc(bx, by, rr, 0, 7); g.fill();
      g.fillStyle = 'rgba(255,246,222,.85)';
      g.beginPath(); g.arc(bx, by, rr * 0.45, 0, 7); g.fill();
    };
    for (let bx = s.x + gap * 0.6; bx < s.x + s.w - gap * 0.3; bx += gap) {
      dot(bx, s.y + gap * 0.5); dot(bx, s.y + s.h - gap * 0.5);
    }
    for (let by = s.y + gap * 1.4; by < s.y + s.h - gap; by += gap) {
      dot(s.x + gap * 0.5, by); dot(s.x + s.w - gap * 0.5, by);
    }
    return;
  }

  if (d === 'stripe') {
    const sw = Math.max(5, s.fs * 0.46);
    g.fillStyle = '#b8ae95'; g.fillRect(s.x, s.y, s.w, s.h);
    g.globalAlpha = 0.4; g.fillStyle = s.bg[1];
    for (let bx = s.x - s.h; bx < s.x + s.w; bx += sw * 2) {
      g.beginPath();
      g.moveTo(bx, s.y + s.h); g.lineTo(bx + s.h * 0.5, s.y);
      g.lineTo(bx + s.h * 0.5 + sw, s.y); g.lineTo(bx + sw, s.y + s.h);
      g.closePath(); g.fill();
    }
    g.globalAlpha = 1;
    g.fillStyle = 'rgba(0,0,0,.26)';
    g.fillRect(s.x, s.y + s.h * 0.84, s.w, s.h * 0.16);
    return;
  }

  if (d === 'dots') {
    const gap = Math.max(2, s.fs * 0.11);
    g.fillStyle = 'rgba(255,255,255,.035)';
    for (let bx = s.x + gap; bx < s.x + s.w; bx += gap) {
      for (let by = s.y + gap; by < s.y + s.h; by += gap) {
        g.fillRect(bx, by, 1, 1);
      }
    }
  }
}

// ── 사진에 붙는 간판 ───────────────────────────────────────────────────────
// 사진 속 빈 간판 자리를 네 귀퉁이로 받아 적어 뒀다. 좌우 변은 수직이고,
// 위아래 변은 소실점 쪽으로 기울어 있다. u 는 사진 가로 비율, t/b 는 세로 비율이다.
const PANELS = [
  { u1: .025, u2: .195, t1: .204, b1: .378, t2: .300, b2: .448 },
  { u1: .197, u2: .263, t1: .310, b1: .460, t2: .380, b2: .540 },
  { u1: .145, u2: .200, t1: -.02, b1: .168, t2: .005, b2: .176, vert: 1 },
  { u1: .334, u2: .366, t1: .400, b1: .672, t2: .408, b2: .676, vert: 1 },
  { u1: .585, u2: .610, t1: .462, b1: .660, t2: .464, b2: .662, vert: 1 },
  { u1: .645, u2: .680, t1: .258, b1: .420, t2: .260, b2: .424, vert: 1 },
  { u1: .695, u2: .740, t1: .080, b1: .290, t2: .082, b2: .292, vert: 1 },
  { u1: .695, u2: .750, t1: .480, b1: .600, t2: .498, b2: .618 },
  { u1: .780, u2: .840, t1: .020, b1: .310, t2: .015, b2: .305, vert: 1 },
  { u1: .832, u2: 1.00, t1: .302, b1: .478, t2: .152, b2: .332 },
];

// 간판 한 장을 따로 그려 둔다. 바탕은 꺼진 아크릴, 글자는 어둡다.
function panelArt(text, vert, wpx, hpx) {
  const S = 2;
  const c = document.createElement('canvas');
  c.width = Math.max(8, Math.round(wpx * S));
  c.height = Math.max(8, Math.round(hpx * S));
  const g = c.getContext('2d');
  g.scale(S, S);

  const pale = Math.random() < 0.78;
  const bg = g.createLinearGradient(0, 0, 0, hpx);
  if (pale) { bg.addColorStop(0, '#7c848c'); bg.addColorStop(1, '#565e66'); }
  else { bg.addColorStop(0, '#242a31'); bg.addColorStop(1, '#141820'); }
  g.fillStyle = bg; g.fillRect(0, 0, wpx, hpx);

  const lw = Math.max(1, Math.min(wpx, hpx) * 0.05);
  g.strokeStyle = pale ? 'rgba(28,32,38,.7)' : 'rgba(150,158,168,.45)';
  g.lineWidth = lw;
  g.strokeRect(lw / 2, lw / 2, wpx - lw, hpx - lw);

  const n = text.length;
  const inset = lw * 1.8;
  const fs = vert
    ? Math.min((wpx - inset * 2) * 0.80, (hpx - inset * 2) / n * 0.88)
    : Math.min((hpx - inset * 2) * 0.62, (wpx - inset * 2) / n * 0.90);
  const ff = oldShop(text) ? pick(CLASSICF) : pick(BIGF);
  g.font = `${ff.w} ${(fs * ff.s).toFixed(1)}px ${ff.f}, sans-serif`;
  g.textAlign = 'center'; g.textBaseline = 'middle';
  g.fillStyle = pale ? 'rgba(20,24,29,.88)' : 'rgba(158,167,177,.75)';
  if (vert) {
    const step = (hpx - inset * 2) / n;
    for (let i = 0; i < n; i++) g.fillText(text[i], wpx / 2, inset + step * (i + 0.5));
  } else {
    g.fillText(text, wpx / 2, hpx * 0.52);
  }
  return c;
}

// 네 귀퉁이에 맞춰 세로로 잘게 썰어 붙인다. 멀어지는 쪽이 좁아지도록 보정한다.
function drawQuad(g, img, x1, x2, t1, b1, t2, b2) {
  const h1 = b1 - t1, h2 = b2 - t2, r = h2 / h1;
  const N = Math.max(24, Math.min(420, Math.round(Math.abs(x2 - x1) * 1.4)));
  for (let i = 0; i < N; i++) {
    const s0 = i / N, s1 = (i + 1) / N;
    const u0 = s0 / (r + s0 * (1 - r)), u1 = s1 / (r + s1 * (1 - r));
    const sx = u0 * img.width, sw = Math.max(1, (u1 - u0) * img.width);
    const dx = x1 + s0 * (x2 - x1), dw = (s1 - s0) * (x2 - x1) + 0.8;
    const ty = t1 + s0 * (t2 - t1), by = b1 + s0 * (b2 - b1);
    g.drawImage(img, sx, 0, sw, img.height, dx, ty, dw, by - ty);
  }
}

function drawPanels(g, ox, oy, dw, dh) {
  const pool = DAYNAMES.slice().sort(() => Math.random() - 0.5);
  PANELS.forEach((q, k) => {
    const x1 = ox + q.u1 * dw, x2 = ox + q.u2 * dw;
    const t1 = oy + q.t1 * dh, b1 = oy + q.b1 * dh;
    const t2 = oy + q.t2 * dh, b2 = oy + q.b2 * dh;
    if (x2 - x1 < 14 || b1 - t1 < 10) return;

    const wpx = x2 - x1, hpx = ((b1 - t1) + (b2 - t2)) / 2;
    const vert = hpx > wpx * 1.25;
    // 글자가 깨알같이 작아지지 않게, 칸 크기에 맞는 길이만 고른다
    const maxLen = Math.max(2, Math.floor((vert ? hpx / wpx : wpx / hpx) * 1.9));
    const fits = pool.filter(n => n.length <= maxLen);
    const text = fits.length ? fits[Math.floor(Math.random() * fits.length)]
                             : pool[k % pool.length];
    const idx = pool.indexOf(text);
    if (idx >= 0) pool.splice(idx, 1);

    const art = panelArt(text, vert, wpx, hpx);

    // 사진에 있던 밝은 판을 먼저 눌러 둔다
    g.save();
    g.globalAlpha = 0.9;
    drawQuad(g, art, x1, x2, t1, b1, t2, b2);
    g.globalAlpha = 0.3;
    g.globalCompositeOperation = 'multiply';
    g.fillStyle = '#1a2130';
    g.beginPath();
    g.moveTo(x1, t1); g.lineTo(x2, t2); g.lineTo(x2, b2); g.lineTo(x1, b1);
    g.closePath(); g.fill();
    g.restore();
  });
}

function bake() {
  const [bo, go] = nc();
  const [bl, gl] = nc();

  // 밤. 위가 조금 덜 어둡다
  const sky = go.createLinearGradient(0, 0, 0, H);
  sky.addColorStop(0, '#0d1219');
  sky.addColorStop(0.5, '#090c12');
  sky.addColorStop(1, '#05070a');
  go.fillStyle = sky; go.fillRect(0, 0, W, H);

  // 야경 사진을 화면에 꽉 채워 깔고, 간판이 떠 보이지 않게 어둡게 눌러둔다
  if (bgReady) {
    const sc = Math.max(W / bgImg.naturalWidth, H / bgImg.naturalHeight);
    const dw = bgImg.naturalWidth * sc, dh = bgImg.naturalHeight * sc;
    go.drawImage(bgImg, (W - dw) / 2, (H - dh) / 2, dw, dh);

    const veil = go.createLinearGradient(0, 0, 0, H);
    veil.addColorStop(0, 'rgba(7,10,17,.40)');
    veil.addColorStop(0.42, 'rgba(6,9,14,.24)');
    veil.addColorStop(1, 'rgba(4,6,10,.44)');
    go.fillStyle = veil; go.fillRect(0, 0, W, H);

    // 가장자리는 더 떨어뜨린다
    const vig = go.createRadialGradient(W / 2, H * 0.46, Math.min(W, H) * 0.24,
                                        W / 2, H * 0.46, Math.max(W, H) * 0.72);
    vig.addColorStop(0, 'rgba(0,0,0,0)');
    vig.addColorStop(1, 'rgba(0,0,0,.38)');
    go.fillStyle = vig; go.fillRect(0, 0, W, H);

    drawPanels(go, (W - dw) / 2, (H - dh) / 2, dw, dh);
  }

  for (let z = 0; z < 3; z++) {
    const [to, gto] = nc();
    const [tl, gtl] = nc();
    gto.textAlign = 'center'; gto.textBaseline = 'middle';
    gtl.textAlign = 'center'; gtl.textBaseline = 'middle';

    for (const s of signs) {
      if (s.z !== z) continue;
      drawBody(gto, s);
      for (const ci of s.cells) {
        const c = cells[ci];
        const f = c.gf;
        // 나간 글자 — 때 탄 회색 아크릴로 칸에 남는다
        gto.font = f;
        gto.globalAlpha = 0.34;
        gto.fillStyle = c.st.ink;
        gto.fillText(c.ch, c.x, c.y);
        gto.globalAlpha = 0.5;
        gto.fillStyle = c.st.hl;
        gto.fillText(c.ch, c.x, c.y - Math.max(0.5, c.fs * 0.022));
        gto.globalAlpha = 1;

        // 켜진 글자 — 번짐 두 겹에 흰 심.
        // 바탕에 불이 들어온 간판은 번짐을 줄이고 글자를 또렷하게 둔다
        const li = c.st.lit;
        gtl.font = f;
        gtl.filter = `blur(${c.fs * (li ? 0.09 : 0.17)}px)`;
        gtl.fillStyle = `rgba(${c.tone[0]},${c.tone[1]},${c.tone[2]},${li ? .55 : .95})`;
        gtl.fillText(c.ch, c.x, c.y);
        gtl.filter = `blur(${c.fs * (li ? 0.28 : 0.45)}px)`;
        gtl.fillStyle = `rgba(${c.warm[0]},${c.warm[1]},${c.warm[2]},${li ? .16 : .45})`;
        gtl.fillText(c.ch, c.x, c.y);
        gtl.filter = 'none';
        if (li) {
          gtl.lineWidth = Math.max(1, c.fs * 0.07);
          gtl.strokeStyle = 'rgba(8,8,10,.4)';
          gtl.strokeText(c.ch, c.x, c.y);
        }
        gtl.fillStyle = `rgb(${c.tone[0]},${c.tone[1]},${c.tone[2]})`;
        gtl.fillText(c.ch, c.x, c.y);
        gtl.save();
        gtl.globalCompositeOperation = 'source-atop';
        const core = gtl.createRadialGradient(c.x, c.y - c.fs * 0.1, 0, c.x, c.y, c.fs * (li ? 0.4 : 0.5));
        core.addColorStop(0, `rgba(255,255,255,${li ? .34 : .9})`);
        core.addColorStop(0.36, `rgba(${c.warm[0]},${c.warm[1]},${c.warm[2]},${li ? .4 : .7})`);
        core.addColorStop(1, 'rgba(255,255,255,0)');
        gtl.fillStyle = core;
        gtl.fillRect(c.x - c.fs, c.y - c.fs, c.fs * 2, c.fs * 2);
        gtl.restore();
      }
    }

    const blur = z === 0 ? 1.5 : z === 1 ? 0.6 : 0;
    const dim = z === 0 ? 0.62 : z === 1 ? 0.82 : 1;
    [[go, to], [gl, tl]].forEach(([g, src]) => {
      g.save();
      if (blur) g.filter = `blur(${blur}px)`;
      g.globalAlpha = dim;
      g.drawImage(src, 0, 0, W, H);
      g.restore();
    });
  }

  baseOff = bo; baseLit = bl;

  // 칸마다 오려 낼 자리
  for (const c of cells) {
    const p = c.fs * 1.05;
    c.bx = c.x - p; c.by = c.y - p; c.bs = p * 2;
  }
}

// ── 그리기 ─────────────────────────────────────────────────────────────────
let ambCv = null;
function bakeAmbient() {
  const c = document.createElement('canvas');
  c.width = Math.max(2, Math.ceil(W / 9)); c.height = Math.max(2, Math.ceil(H / 9));
  const g = c.getContext('2d');
  g.drawImage(baseLit, 0, 0, c.width, c.height);
  const k = 1 / 9;
  g.globalCompositeOperation = 'lighter';
  for (const sg of signs) {
    if (!sg.st.glow) continue;
    g.globalAlpha = sg.z === 0 ? 0.2 : sg.z === 1 ? 0.3 : 0.4;
    g.fillStyle = sg.bg[0];
    g.fillRect(sg.x * k, sg.y * k, sg.w * k, sg.h * k);
  }
  ambCv = c;
}

function draw() {
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  ctx.clearRect(0, 0, W, H);
  if (!baseOff) return;
  ctx.drawImage(baseOff, 0, 0, W, H);

  const ratio = totalCount ? litCount / totalCount : 0;

  // 거리에 뜬 빛. 간판이 꺼질수록 같이 빠진다
  if (ambCv) {
    ctx.save();
    ctx.globalCompositeOperation = 'lighter';
    ctx.globalAlpha = 0.3 * ratio;
    ctx.drawImage(ambCv, 0, 0, W, H);
    ctx.restore();
  }

  // 글자가 빠진 간판은 잠깐 떨린다. 어디가 비었는지 눈이 따라가게
  const jit = signs.map(s => s.shake > 0 ? Math.sin(t * 44 + s.x) * s.shake * 1.7 : 0);

  for (const c of cells) {
    if (c.lum < 0.012) continue;
    ctx.globalAlpha = Math.min(1, c.lum);
    ctx.drawImage(baseLit,
      c.bx * DPR, c.by * DPR, c.bs * DPR, c.bs * DPR,
      c.bx + jit[c.s], c.by, c.bs, c.bs);
  }
  ctx.globalAlpha = 1;

  const vg = ctx.createRadialGradient(W / 2, H * 0.48, Math.min(W, H) * 0.25,
    W / 2, H * 0.48, Math.max(W, H) * 0.8);
  vg.addColorStop(0, 'rgba(0,0,0,0)');
  vg.addColorStop(1, 'rgba(0,0,0,.66)');
  ctx.fillStyle = vg; ctx.fillRect(0, 0, W, H);

  if (dark > 0.002) {
    ctx.fillStyle = `rgba(3,4,6,${clamp(dark, 0, 1) * 0.95})`;
    ctx.fillRect(0, 0, W, H);
  }
}

// ── 시간 ───────────────────────────────────────────────────────────────────
const cntEl = document.getElementById('cnt');
let cntT = 0;

function dyingTime(c) { return c.z === 2 ? 2.1 : c.z === 1 ? 1.4 : 0.9; }

// 한 간판을 붙잡고 글자를 떨군다. 여기저기 한 칸씩 빠지면 뭐가 빠졌는지 안 보인다.
let focus = -1, focusLeft = 0;

function nextLetter(s) {
  // 이름이 다른 말로 읽히도록 순서를 정해 둔 간판은 그 순서를 지킨다
  if (s.order) {
    for (const oi of s.order) {
      const c = cells[s.cells[oi]];
      if (c && c.state === 'on') return c;
    }
  }
  const alive = s.cells.map(i => cells[i]).filter(c => c.state === 'on');
  return alive.length ? alive[Math.floor(Math.random() * alive.length)] : null;
}

function pickSign() {
  const open = [];
  for (let i = 0; i < signs.length; i++) {
    const s = signs[i];
    if (!s.cells.some(ci => cells[ci].state === 'on')) continue;
    // 앞줄 큰 간판과 이름이 바뀌는 간판을 먼저 비운다. 글자가 커야 빈 칸이 보인다
    const w = (s.order ? 8 : 1) + s.z * s.z * 3;
    for (let k = 0; k < w; k++) open.push(i);
  }
  return open.length ? open[Math.floor(Math.random() * open.length)] : -1;
}

function killOne() {
  if (focus < 0 || focusLeft <= 0 || !signs[focus] ||
      !signs[focus].cells.some(ci => cells[ci].state === 'on')) {
    focus = pickSign();
    if (focus < 0) return;
    const k = signs[focus].kind;
    focusLeft = k === 'fast' ? 3 + Math.floor(Math.random() * 3)
              : k === 'bad' ? 2
              : 1 + Math.floor(Math.random() * 2);
  }
  const s = signs[focus];
  const c = nextLetter(s);
  if (!c) { focusLeft = 0; return; }
  focusLeft--;
  s.shake = 0.8;

  // 고장난 간판은 글자가 아주 꺼지지 않고 한참 깜빡인다
  if (s.kind === 'bad' && Math.random() < 0.6) {
    c.state = 'bad'; c.lum = 0; c.fp = 0; c.fon = false;
    litCount--;
    return;
  }
  c.state = 'flick'; c.ft = dyingTime(c); c.fp = 0; c.fon = true;
}

function step(dt) {
  t += dt;

  for (const s of signs) if (s.shake > 0) s.shake = Math.max(0, s.shake - dt * 2.6);

  for (const c of cells) {
    if (c.wake > 0) {
      c.wake -= dt;
      if (c.wake > 0) { c.lum = 0; continue; }
    }
    if (c.state === 'on') {
      const hum = 0.955 + 0.045 * Math.sin(t * 31 + c.seed) * Math.sin(t * 6.1 + c.seed * 3);
      c.blink = Math.max(0, (c.blink || 0) - dt);
      const tgt = c.blink > 0 ? 0.2 : hum;
      c.lum += (tgt - c.lum) * Math.min(1, dt * 18);
    } else if (c.state === 'flick') {
      c.ft -= dt; c.fp -= dt;
      if (c.fp <= 0) {
        c.fon = !c.fon;
        c.fp = c.fon ? rnd(0.04, 0.26) : rnd(0.03, 0.15);
      }
      const k = 1 - c.ft / dyingTime(c);
      c.lum = c.fon ? rnd(0.5, 1) * (1 - k * 0.5) : rnd(0, 0.06);
      if (c.ft <= 0) {
        c.state = 'off'; c.lum = 0; litCount--;
      }
    } else if (c.state === 'bad') {
      c.fp -= dt;
      if (c.fp <= 0) {
        c.fon = !c.fon;
        c.fp = c.fon ? rnd(0.03, 0.12) : rnd(0.3, 2.6);
      }
      c.lum = c.fon ? rnd(0.3, 0.8) : rnd(0, 0.03);
    } else if (c.state === 'rev') {
      c.rt -= dt; c.fp -= dt;
      if (c.fp <= 0) { c.fon = Math.random() > 0.2; c.fp = rnd(0.03, 0.17); }
      c.lum = c.fon ? rnd(0.35, 0.95) : rnd(0, 0.09);
      if (c.rt <= 0) { c.state = 'off'; c.lum = 0; }
    } else {
      c.lum += (0 - c.lum) * Math.min(1, dt * 20);
    }
  }

  const ratio = totalCount ? litCount / totalCount : 0;

  if (resetAt < 0 && t > 2.4 && t > nextOut) {
    killOne();
    const rush = focusLeft > 0 && signs[focus] && signs[focus].kind === 'fast';
    nextOut = t + (rush ? rnd(0.16, 0.4)
                        : 0.14 + 1.15 * Math.pow(1 - ratio, 1.4));
  }

  if (resetAt < 0 && ratio < 0.1) resetAt = t;
  if (resetAt > 0) {
    dark += ((t - resetAt > 1.6 ? 1 : 0) - dark) * Math.min(1, dt * 1.8);
    if (t - resetAt > 4 && dark > 0.9) relight();
  } else {
    dark += (0 - dark) * Math.min(1, dt * 2.4);
  }

  cntT -= dt;
  if (cntT <= 0 && !PREVIEW) {
    cntT = 0.2;
    cntEl.textContent = `LIT ${String(litCount).padStart(3, ' ')} / ${totalCount}   ·   빈 칸 ${totalCount - litCount}`;
  }
}

function relight() {
  build(); bake(); bakeAmbient();
  cells.forEach(c => { c.lum = 0; c.state = 'on'; c.wake = rnd(0.3, 3.4); });
  resetAt = -1; nextOut = t + 4.5; focus = -1; focusLeft = 0;
}

// ── 손 ─────────────────────────────────────────────────────────────────────
function signAt(mx, my) {
  for (let i = signs.length - 1; i >= 0; i--) {
    const s = signs[i];
    if (mx >= s.x && mx <= s.x + s.w && my >= s.y && my <= s.y + s.h) return i;
  }
  return -1;
}

function hitSign(i) {
  const s = signs[i];
  s.shake = 1;
  let dead = 0;
  for (const ci of s.cells) {
    const c = cells[ci];
    if (c.state === 'off') {
      c.state = 'rev';
      c.rt = rnd(0.5, 2.3) / (1 + c.revives * 0.7);
      c.revives++; c.fp = 0; c.fon = true; dead++;
    } else if (c.state === 'flick') {
      c.state = 'on'; c.ft = 0; c.lum = 1;
    } else if (c.state === 'bad') {
      c.state = 'on'; c.lum = 1; litCount++;
    } else if (c.state === 'rev') {
      c.rt += rnd(0.3, 0.8) / (1 + c.revives * 0.5);
    } else {
      c.blink = 0.16;
    }
  }
}

const hintEl = document.getElementById('hint');
let hinted = false;

cv.addEventListener('pointermove', e => {
  hover = signAt(e.clientX, e.clientY);
  document.body.classList.toggle('hit', hover >= 0);
});
cv.addEventListener('pointerdown', e => {
  const i = signAt(e.clientX, e.clientY);
  if (i >= 0) hitSign(i);
  if (!hinted) { hinted = true; hintEl.classList.add('off'); }
});
// ── 부팅 ───────────────────────────────────────────────────────────────────
function sizeCanvas() {
  W = window.innerWidth; H = window.innerHeight;
  cv.width = Math.ceil(W * DPR); cv.height = Math.ceil(H * DPR);
  cv.style.width = W + 'px'; cv.style.height = H + 'px';
}

let rt = 0;
window.addEventListener('resize', () => {
  clearTimeout(rt);
  rt = setTimeout(() => {
    sizeCanvas(); build(); bake(); bakeAmbient();
    cells.forEach(c => { c.wake = 0; c.lum = 1; c.state = 'on'; });
    litCount = totalCount; resetAt = -1; nextOut = t + 3; focus = -1; focusLeft = 0;
    if (PREVIEW) previewScene();
    draw();
  }, 220);
});

function previewScene() {
  cells.forEach(c => {
    c.wake = 0;
    if (Math.random() < 0.3) { c.state = 'off'; c.lum = 0; }
    else { c.state = 'on'; c.lum = 1; }
  });
  litCount = cells.filter(c => c.state === 'on').length;
}

let last = 0;
function loop(ms) {
  const dt = Math.min(0.05, (ms - last) / 1000 || 0);
  last = ms;
  step(dt);
  draw();
  requestAnimationFrame(loop);
}

// 간판에 실제로 걸린 글자만 골라 글자체를 받는다. 한글 전체를 받으면 너무 느리다.
async function loadFonts() {
  const txt = [...new Set(cells.map(c => c.ch).concat(DAYNAMES.join('').split('')))].join('');
  const jobs = FONTS.map(f => document.fonts.load(`${f.w} 80px ${f.f}`, txt));
  jobs.push(document.fonts.load("400 14px 'Gothic A1'"));
  jobs.push(document.fonts.load("700 11px 'Space Mono'"));
  const wait = Promise.all(jobs).catch(() => {});
  await Promise.race([wait, new Promise(r => setTimeout(r, 14000))]);
}

async function boot() {
  sizeCanvas();
  build();
  await Promise.all([loadFonts(), loadBg()]);
  bake(); bakeAmbient();

  if (PREVIEW) { previewScene(); draw(); return; }

  cells.forEach(c => { c.wake = rnd(0.1, 2.6); c.lum = 0; });
  nextOut = 3.4;
  setTimeout(() => { if (!hinted) hintEl.classList.add('off'); }, 15000);
  requestAnimationFrame(loop);
}
boot();

// 디버그 훅
window.__st = () => ({ signs: signs.length, cells: totalCount, lit: litCount,
  dark: +dark.toFixed(2), reset: +resetAt.toFixed(1), t: +t.toFixed(1) });
window.__signs = () => signs.map(s => ({ x: s.x, y: s.y, w: s.w, h: s.h, text: s.text, z: s.z, hero: !!s.order, kind: s.kind, n: s.cells.length }));
window.__cells = () => cells;
window.__force = () => { cells.forEach(c => { if (c.state !== 'off') { c.state = 'off'; c.lum = 0; } }); litCount = 0; };
</script>
</body>
</html>
